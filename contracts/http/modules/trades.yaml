# Module `trades` — V1-S21 (completed trades: captured by the plugin or entered manually; list, summary, detail).
# Owner: Compasso (Software Architect). Notes: docs/architecture/contracts/s21-trades.md.
# Bundled into ../openapi.bundled.yaml by contracts/scripts/check_openapi.py (see ../README.md).
paths:
  /api/v1/trades:
    get:
      tags: [trades]
      operationId: listTrades
      summary: The caller's completed trades, filtered and sorted, with a cursor
      description: |
        Filters combine with AND, values in one array with OR (repeat the parameter). `from` / `to` filter
        on the **exit time** (Q53); both are instants and optional (absent = unbounded);
        `from` after `to` gets 400 (pointer `/query/from`). `origin` selects routed / master / manual /
        platform trades; `source_id` selects routed trades of those sources. Trades of archived accounts
        are kept for the life of the user account (S10 AC-3; Q79 a). From 5.4.0 they are HIDDEN unless
        `include_archived=true` (the "Arquivadas" filter); when shown, they carry `account_deleted`. The
        filter is applied by the Core, so paging, `getTradesSummary` and S22 totals always match the list.
        `next_cursor` is opaque, authenticated by the Core (MAC) and bound to the filters and the sort
        (tamper or mismatch → 400, pointer `/query/cursor`). Ties are broken by `trade_id`.
        `getTradesSummary` with the same filters gives the count and total P&L of the whole set.
      parameters:
        - $ref: '#/components/parameters/TradeFrom'
        - $ref: '#/components/parameters/TradeTo'
        - $ref: '#/components/parameters/TradeAccountIds'
        - $ref: '#/components/parameters/TradeSourceIds'
        - $ref: '#/components/parameters/TradeOrigins'
        - $ref: '#/components/parameters/TradeSignalTypes'
        - $ref: '#/components/parameters/TradeRecordedBefore'
        - $ref: '#/components/parameters/TradeIncludeArchived'
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [exit_time, pnl, duration], default: exit_time }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [desc, asc], default: desc }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradePage' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }
    post:
      tags: [trades]
      operationId: createManualTrade
      summary: Record a trade the platform did not capture (origin `manual`, S21 AC-3)
      description: |
        Idempotent by `Idempotency-Key` (same rules as `createAccount`: same key and body within 24 h →
        200 with the trade created first; different body or after 24 h → 409
        `trades.idempotency_key_reused`; never a second trade). Duration, gross P&L, commission and net
        P&L are computed by the Core (net is the main value; the commission is the typed one, else the
        account floor); MAE / MFE are optional (Q55). The
        account may be active, paused or disabled, not archived. Audited as `trades.manual_created`.
      parameters:
        - { $ref: 'accounts.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualTradeRequest' }
            examples:
              buy:
                value:
                  account_id: 0b9f4c1e-7d2a-4e7b-9a52-3c1d8e6f2a10
                  instrument_id: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                  direction: long
                  quantity: 2
                  entry_time: '2026-10-23T13:30:05Z'
                  entry_price: '21234.50'
                  exit_time: '2026-10-23T13:42:35Z'
                  exit_price: '21240.25'
      responses:
        '200':
          description: Replay of a create already done with this key; the trade, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '201':
          description: Created and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/ForbiddenOrigin' }
        '409':
          description: '`trades.idempotency_key_reused` — nothing created.'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ManualTradeRejected' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/trades/summary:
    get:
      tags: [trades]
      operationId: getTradesSummary
      summary: Count and total P&L of the whole filtered set (the same figures S22 uses)
      parameters:
        - $ref: '#/components/parameters/TradeFrom'
        - $ref: '#/components/parameters/TradeTo'
        - $ref: '#/components/parameters/TradeAccountIds'
        - $ref: '#/components/parameters/TradeSourceIds'
        - $ref: '#/components/parameters/TradeOrigins'
        - $ref: '#/components/parameters/TradeSignalTypes'
        - $ref: '#/components/parameters/TradeIncludeArchived'
        - $ref: '#/components/parameters/TradeRecordedBefore'
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradesSummary' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/trades/{trade_id}:
    get:
      tags: [trades]
      operationId: getTrade
      summary: One trade (detail panel)
      parameters:
        - { $ref: '#/components/parameters/TradeId' }
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }
    put:
      tags: [trades]
      operationId: updateManualTrade
      summary: Correct a manual trade (Q56); captured trades are never editable
      description: |
        Full replacement of the manual fields, with `row_version` (stale → 409 `common.version_conflict`).
        A captured trade (`origin` ≠ `manual`) gets 409 `trades.not_editable`. Audited as
        `trades.manual_changed` with previous and new values. Check order after authentication, Origin and
        schema: 404 → 409 → 422.
      parameters:
        - { $ref: '#/components/parameters/TradeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualTradeUpdateRequest' }
      responses:
        '200':
          description: Saved and audited (no change → 200, not audited).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409':
          description: '`trades.not_editable` or `common.version_conflict`; nothing saved.'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ManualTradeRejected' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }
    delete:
      tags: [trades]
      operationId: deleteManualTrade
      summary: Delete a manual trade (Q56)
      description: |
        The trade leaves the list and the metrics; the audit entry `trades.manual_deleted` keeps its
        values. `row_version` is required (stale → 409 `common.version_conflict`); a captured trade gets
        409 `trades.not_editable`.
      parameters:
        - { $ref: '#/components/parameters/TradeId' }
        - name: row_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Deleted and audited. }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409':
          description: '`trades.not_editable` or `common.version_conflict`; nothing deleted.'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/trade-preview:
    get:
      tags: [trades]
      operationId: previewManualTrade
      summary: Duration, commission and net / gross P&L of a manual trade before saving (stateless, Core arithmetic)
      description: |
        Stores nothing, audits nothing. Same validation and same 422 codes as `createManualTrade`.
        Without `commission`, it returns the commission the Core would compute (Q71: floor × quantity × 2,
        `configured`; no floor → 0, `none`), so the form shows the value and the user can override it.
        With `commission`, it returns that value (`manual`).
      parameters:
        - { name: account_id, in: query, required: true, schema: { $ref: '../openapi.yaml#/components/schemas/Uuid' } }
        - { name: instrument_id, in: query, required: true, schema: { $ref: '../openapi.yaml#/components/schemas/Uuid' } }
        - { name: direction, in: query, required: true, schema: { $ref: '#/components/schemas/TradeDirection' } }
        - { name: quantity, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 10000 } }
        - { name: entry_time, in: query, required: true, schema: { $ref: '../openapi.yaml#/components/schemas/Timestamp' } }
        - { name: entry_price, in: query, required: true, schema: { $ref: 'audit.yaml#/components/schemas/Price' } }
        - { name: exit_time, in: query, required: true, schema: { $ref: '../openapi.yaml#/components/schemas/Timestamp' } }
        - { name: exit_price, in: query, required: true, schema: { $ref: 'audit.yaml#/components/schemas/Price' } }
        - { name: commission, in: query, required: false, schema: { $ref: '#/components/schemas/ExcursionInput' } }
      responses:
        '200':
          description: The computed values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualTradePreview' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ManualTradeRejected' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

components:
  parameters:
    TradeId:
      name: trade_id
      in: path
      required: true
      schema: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    TradeFrom:
      name: from
      in: query
      required: false
      description: Exit time at or after this instant (Q53).
      schema: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
    TradeIncludeArchived:
      name: include_archived
      in: query
      required: false
      description: 'Q79 (a), 5.4.0: include the trades of archived accounts (filter "Arquivadas"). Default false = hidden. With false, an archived id in `account_id` matches nothing. Part of the cursor binding.'
      schema: { type: boolean, default: false }
      x-breaking: 'Since 6.0.0, a call without this parameter no longer returns archived accounts'' trades (rows and totals). Send include_archived=true to keep the earlier behaviour.'
    TradeTo:
      name: to
      in: query
      required: false
      description: 'Exit time strictly before this instant (exclusive: `exit_time < to`). With `from`, the interval is half-open [from, to). For a custom period ending on day D in the profile''s time zone, send D + 1 at 00:00 in that zone, converted to UTC.'
      schema: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
    TradeAccountIds:
      name: account_id
      in: query
      required: false
      explode: true
      schema: { type: array, maxItems: 50, items: { $ref: '../openapi.yaml#/components/schemas/Uuid' } }
    TradeSourceIds:
      name: source_id
      in: query
      required: false
      explode: true
      schema: { type: array, maxItems: 50, items: { $ref: '../openapi.yaml#/components/schemas/Uuid' } }
    TradeOrigins:
      name: origin
      in: query
      required: false
      explode: true
      schema: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/TradeOrigin' } }
    TradeRecordedBefore:
      name: recorded_before
      in: query
      required: false
      description: Only trades recorded (captured or entered) at or before this instant — pass `getPerformance.as_of` to see exactly the set S22 measured (S22 AC-2).
      schema: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
    TradeSignalTypes:
      name: signal_type
      in: query
      required: false
      explode: true
      schema: { type: array, maxItems: 4, items: { $ref: 'audit.yaml#/components/schemas/AuditSignalType' } }

  responses:
    ManualTradeRejected:
      description: |
        Valid shape, refused by a rule; nothing saved. Codes and pointers:
        - `trades.exit_before_entry` — `/exit_time` (exit not after entry);
        - `trades.in_future` — `/entry_time` or `/exit_time`;
        - `trades.not_tick_multiple` — `/entry_price` or `/exit_price` (prices must be whole ticks of the
          instrument; unlike profile distances they are never rounded);
        - `trades.account_unknown` — `/account_id` (unknown, archived or another user's; identical);
        - `trades.instrument_unknown` — `/instrument_id` (not enabled).
        On the preview the pointers are `/query/<name>`.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
          examples:
            exit_before_entry:
              value: { error: { code: trades.exit_before_entry, pointer: /exit_time } }

  schemas:
    CommissionSource:
      type: string
      enum: [platform, configured, mixed, manual, none]
      description: |
        Where the commission came from; per fill the same rule as adapter protocol 1.3 `fill.commission`
        and ADR-0004 §7 (not reported ≠ reported 0). Effective commission of a fill = max(platform-
        reported, the account's `commission_per_contract_side` × quantity) (U20 a). `platform` when the
        reported value is ≥ floor × quantity (it won); `configured` when the floor won (reported lower,
        zero, or absent with a floor); `none` when absent and no floor (net = gross; the UI shows
        "comissões não informadas"). For a trade: `mixed` when its fills differ; `manual` = typed in a
        manual trade.
    TradeDirection:
      type: string
      enum: [long, short]
      description: Direction of the position (UI `Compra` = long, `Venda` = short).
    TradeOrigin:
      type: string
      enum: [routed, master, manual, platform]
      description: |
        `routed` = created by a routed instruction (source + signal type); `master` = master replication
        (S19, V1.1); `manual` = entered by the user (S21 AC-3); `platform` = placed by the user directly in
        the platform and captured (UI "Plataforma (sem sinal)", PO).
    Trade:
      type: object
      additionalProperties: false
      required: [trade_id, account_id, account_name, account_deleted, instrument_id, instrument_symbol, direction, quantity, entry_time, entry_price, exit_time, exit_price, duration_seconds, pnl, pnl_basis, gross_pnl, commission, commission_source, origin, editable, created_at]
      description: |
        One completed trade (Q57: one trade per entry with FIFO exits in individual mode;
        flat-to-flat in shared mode). Captured trades carry the numbers the plugin computed and sent
        (S21 AC-2; adapter protocol 1.3 `trade_completed`; no raw price data is stored); the Core
        reconciles them with the fills it knows and audits a difference as `trades.reconcile_mismatch`,
        never correcting silently. Manual ones carry the Core's computation. Manual trades do not feed
        daily loss, drawdown, profit target, consistency or blocks (S13/S15), and never unblock an
        account; they feed only this list and the metrics (S21/S22) (PO rule: S13 AC-2 + S21 AC-3, PO clarification, slice-plan rev. 7;
        QA Security I1). Money and prices are decimal strings (X-3).
      properties:
        trade_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        account_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        account_name: { type: string, maxLength: 80, description: Snapshot. }
        account_deleted: { type: boolean }
        instrument_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        instrument_symbol: { type: string, pattern: '^[A-Z0-9]{1,10}$' }
        contract_month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        direction: { $ref: '#/components/schemas/TradeDirection' }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        entry_time: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        entry_price: { $ref: 'audit.yaml#/components/schemas/Price' }
        exit_time: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        exit_price: { $ref: 'audit.yaml#/components/schemas/Price' }
        duration_seconds: { type: integer, minimum: 0, description: exit − entry (PO). }
        pnl:
          description: The main P&L, in the basis of `pnl_basis` (net from 3.5.0).
          $ref: 'audit.yaml#/components/schemas/Money'
        pnl_basis:
          type: string
          enum: [gross, net]
          description: |
            The basis of `pnl`. From 3.5.0 always `net` (after commissions; user decision 2026-10-23,
            S21 AC-1); `gross` is kept in the enum only for compatibility with 3.4 readers.
        gross_pnl:
          description: P&L before commissions (shown alongside).
          $ref: 'audit.yaml#/components/schemas/Money'
        commission:
          description: |
            Effective commission allocated to this trade (floor applied). A fill shared by several trades (a flip, or a FIFO partial close in individual mode) is allocated pro rata by the quantity each trade takes from it: share = round(fill effective commission × quantity / fill quantity, 4 decimals, half away from zero), and the trade allocated last from that fill gets the remainder, so the shares always sum to the fill's effective commission. gross_pnl and pnl use the same quantities; pnl = gross_pnl − commission.
            ≥ 0. The same rule as adapter protocol 1.3 `trade_completed.commission` (Esquadro).
          $ref: 'profiles.yaml#/components/schemas/MoneyString'
        commission_source: { $ref: '#/components/schemas/CommissionSource' }
        mae:
          description: Maximum adverse excursion in USD, ≥ 0 (Q52). Absent when not provided (manual, Q55) or when the plugin did not observe the whole interval (never a partial value).
          $ref: 'profiles.yaml#/components/schemas/MoneyString'
        mfe:
          description: Maximum favourable excursion in USD, ≥ 0 (as `mae`).
          $ref: 'profiles.yaml#/components/schemas/MoneyString'
        reconcile_mismatch:
          type: boolean
          description: Captured trades — true when the plugin's numbers differ from the fills the Core knows (kept as sent; see the audit entry).
        recovered:
          type: boolean
          description: |
            5.4.0 (S21 AC-13, Q80 a; ADR-0004 r5 §5 catch-up). True when the trade was built from executions
            that the plugin recovered from the platform's history at startup or on reconnect: they happened
            while All Win was not observing, so MAE/MFE are absent. The UI shows the "Recuperado" badge. The
            Core derives it; it is never typed by the user. Absent means false.
        origin: { $ref: '#/components/schemas/TradeOrigin' }
        source_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        source_name: { type: string, maxLength: 60 }
        signal_type: { $ref: 'audit.yaml#/components/schemas/AuditSignalType' }
        instruction_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        command_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        master_account_id:
          description: With `master` (S19).
          $ref: '../openapi.yaml#/components/schemas/Uuid'
        master_account_name: { type: string, maxLength: 80 }
        editable: { type: boolean, description: 'True only for manual trades (Q56).' }
        row_version: { type: integer, minimum: 1, description: Manual trades only. }
        captured_at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        created_at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
      allOf:
        - if: { properties: { origin: { const: routed } } }
          then: { required: [source_id, source_name, signal_type, instruction_id] }
        - if: { properties: { origin: { const: master } } }
          then: { required: [master_account_id, master_account_name] }
        - if: { properties: { origin: { const: manual } } }
          then:
            required: [row_version]
            properties: { editable: { const: true } }
            not: { anyOf: [{ required: [captured_at] }, { required: [command_id] }] }
          else:
            required: [captured_at]
            properties: { editable: { const: false } }
            not: { required: [row_version] }
    TradePage:
      type: object
      additionalProperties: false
      required: [trades]
      properties:
        trades: { type: array, items: { $ref: '#/components/schemas/Trade' } }
        next_cursor: { type: string, description: Absent on the last page. }
    TradesSummary:
      type: object
      additionalProperties: false
      required: [count, total_pnl, pnl_basis, total_gross_pnl, total_commission, as_of]
      properties:
        as_of:
          description: The instant the summary was taken (or `recorded_before` when given).
          $ref: '../openapi.yaml#/components/schemas/Timestamp'
        count: { type: integer, minimum: 0 }
        total_pnl:
          description: Net (`pnl_basis`).
          $ref: 'audit.yaml#/components/schemas/Money'
        pnl_basis:
          type: string
          enum: [gross, net]
          description: |
            The basis of `pnl`. From 3.5.0 always `net` (after commissions; user decision 2026-10-23,
            S21 AC-1); `gross` is kept in the enum only for compatibility with 3.4 readers.
        total_gross_pnl: { $ref: 'audit.yaml#/components/schemas/Money' }
        total_commission: { $ref: 'profiles.yaml#/components/schemas/MoneyString' }
        uncommissioned_count:
          type: integer
          minimum: 0
          description: Trades with `commission_source` `none` (the UI warns that their net equals gross).
    ManualTradeFields:
      type: object
      required: [account_id, instrument_id, direction, quantity, entry_time, entry_price, exit_time, exit_price]
      properties:
        account_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        instrument_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        direction: { $ref: '#/components/schemas/TradeDirection' }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        entry_time: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        entry_price: { $ref: 'audit.yaml#/components/schemas/Price' }
        exit_time: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        exit_price: { $ref: 'audit.yaml#/components/schemas/Price' }
        mae: { $ref: '#/components/schemas/ExcursionInput' }
        mfe: { $ref: '#/components/schemas/ExcursionInput' }
        commission:
          description: |
            Optional total commission of the trade, USD ≥ 0 (Q71, decided). Sent → used as typed
            (`commission_source: manual`). Absent → computed by the Core, never by the browser, with the
            per-fill rule of ADR-0004 §7 applied to both sides of the trade: commission =
            `commission_per_contract_side` × quantity (entry side) + `commission_per_contract_side` ×
            quantity (exit side) = floor × quantity × 2 (`commission_source: configured`); with no floor →
            0 (`commission_source: none`, labelled "comissões não informadas"). The floor used is the
            EFFECTIVE floor when the trade is saved (create or update), as derived by the risk module (data
            model 15.1); a lowered floor still pending for the next trading day is not used early. The value
            is stored; a later change of the floor
            never recomputes it. The UI shows the Core's value from `previewManualTrade` and the user may
            override it by typing a commission.
          $ref: '#/components/schemas/ExcursionInput'
    ExcursionInput:
      type: string
      pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'
      description: USD, ≥ 0, at most 2 decimals (Q52).
    ManualTradeRequest:
      allOf:
        - $ref: '#/components/schemas/ManualTradeFields'
      unevaluatedProperties: false
    ManualTradeUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ManualTradeFields'
        - type: object
          required: [row_version]
          properties:
            row_version: { type: integer, minimum: 1 }
      unevaluatedProperties: false
    ManualTradePreview:
      type: object
      additionalProperties: false
      required: [duration_seconds, pnl, pnl_basis, gross_pnl, commission, commission_source]
      properties:
        duration_seconds: { type: integer, minimum: 0 }
        pnl: { $ref: 'audit.yaml#/components/schemas/Money' }
        pnl_basis: { type: string, enum: [gross, net], description: '`net` from 3.5.0.' }
        gross_pnl: { $ref: 'audit.yaml#/components/schemas/Money' }
        commission: { $ref: 'profiles.yaml#/components/schemas/MoneyString' }
        commission_source: { $ref: '#/components/schemas/CommissionSource' }
    TradeCapturedEvent:
      type: object
      additionalProperties: false
      required: [type, at, trade_id, account_id]
      description: A trade was captured or entered (drives the "n new trades" banner); the client refetches.
      properties:
        type: { const: trade.captured }
        at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        trade_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        account_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        origin: { $ref: '#/components/schemas/TradeOrigin' }
