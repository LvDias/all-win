# Module `accounts` — V1-S5 (account registration, lifecycle, per-account opt-ins).
# Owner: Compasso (Software Architect). Notes: docs/architecture/contracts/s5-accounts.md.
# Bundled into ../openapi.bundled.yaml by contracts/scripts/check_openapi.py (see ../README.md).
paths:
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List the signed-in user's accounts (archived accounts excluded)
      description: |
        One call for the whole list screen (no pagination in V1; a user has tens of accounts). Sorted by
        `display_name` (case-insensitive). Filtering is client-side. Only the caller's accounts.
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Register a prop or real account, with its first opt-in choices, in one save
      description: |
        Idempotent by the `Idempotency-Key` header (a UUID the client generates once per form
        submission). A key is never released: a retry with the same key and the same body (`step_up`
        ignored) within 24 h returns 200 with the account created by the first request, as it is now
        (with `archived_at` if it was archived since), and changes nothing; the same key with a different
        body, or after 24 h, gets 409 `accounts.idempotency_key_reused`. A key never creates a second
        account. Only a successful create consumes a key, so the retry after a step-up reuses it.
        Account ids are generated by the Core.
        Real accounts copy the default profile of the nearest standard size (S6). When the size is
        exactly between two standard sizes the user picks one: `profile_size` is then required (422
        `accounts.profile_size_required`) and must be one of the candidates of `getNearestProfileSize`
        (422 `accounts.profile_size_invalid`). Provisional (Q60): if the user later decides "smaller" or
        "larger", the candidates list just has one entry and nothing else changes.
        Prop accounts take either a preset version (`preset_version_id`, S16) or the manual fields
        (`firm_name`, `plan_name`, `phase`, `size_amount`; before S16 and for plans without a preset).
        `opt_ins` must hold every kind whose choice is required (`OptInChoices`); before S16 the
        automation stance of a prop account is `unknown`, so its choice is required against the generic
        rule version (provisional, Q40). Real accounts never take `opt_ins`.
        Step-up: when any `opt_ins.*.choice` is `accepted` the body must carry `step_up` for action
        `account_create_opt_in_accept` (no target; StepUpProof). Check order after authentication,
        Origin and schema: idempotent replay → step-up → 409 → 422. Nothing is saved on any error. Audited as `accounts.created` and, per kind chosen,
        `accounts.opt_in_chosen`, in the same transaction.
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreateRequest' }
            examples:
              real:
                value:
                  kind: real
                  display_name: Conta real
                  size_amount: '25000.00'
                  max_position_qty: 3
                  multiplier: 1
                  binding: { connection_id: 5a2b8c3d-1e4f-4a6b-8c7d-9e0f1a2b3c4d, platform_account: Sim101 }
              prop_manual:
                value:
                  kind: prop
                  display_name: Apex 50K 1
                  firm_name: Apex Trader Funding
                  plan_name: 50K Rithmic
                  phase: Evaluation
                  size_amount: '50000.00'
                  max_position_qty: 2
                  opt_ins:
                    automation: { choice: declined, rule_version_id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b }
      responses:
        '200':
          description: Replay of a create already done with this `Idempotency-Key`; the account it created, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '201':
          description: Created and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/StepUpFailed' }
        '409': { $ref: '#/components/responses/AccountWriteConflict' }
        '422': { $ref: '#/components/responses/AccountWriteRejected' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/accounts/{account_id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: One account (detail screen)
      parameters:
        - { $ref: '../openapi.yaml#/components/parameters/AccountId' }
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }
    put:
      tags: [accounts]
      operationId: updateAccount
      summary: Edit an account (full replacement of the editable fields; optimistic concurrency by `row_version`)
      description: |
        The body is the whole editable state (the edit form sends every field): an absent `binding`
        unbinds, an absent `multiplier` resets it to 1; `kind` cannot change. Changing the
        preset version, the firm platform or the manual prop fields may select a different rule version:
        the request must then carry `opt_ins` for each kind whose choice becomes required, or the Core
        answers 422 `accounts.opt_in_required` (D16). Applying a newer preset version to the account
        (S16 AC-3) is this operation with the new `preset_version_id`.
        Changing or removing the binding while the account has an open position is refused with 409
        `accounts.binding_open_position` (provisional, Q38). Lowering `max_position_qty` below an open
        position is allowed; open positions are not changed.
        Step-up: when an `opt_ins.*.choice` is `accepted` and changes the stored state, the body must
        carry `step_up` for action `account_opt_in_accept` with target = this account. Check order after
        authentication, Origin and schema: 404 → step-up → 409 → 422. Audited as
        `accounts.updated` (changed fields with old and new values) and `accounts.opt_in_chosen`.
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted that changes the stored state
      parameters:
        - { $ref: '../openapi.yaml#/components/parameters/AccountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdateRequest' }
      responses:
        '200':
          description: Saved and audited (a request that changes nothing returns the account and is not audited).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/StepUpFailed' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AccountWriteConflict' }
        '422': { $ref: '#/components/responses/AccountWriteRejected' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }
    delete:
      tags: [accounts]
      operationId: archiveAccount
      summary: Delete (archive) an account
      description: |
        Refused with 409 `accounts.delete_open_position` while the account has an open position (S5 AC-6;
        last known state when the connection is down). Otherwise the account is archived: it leaves every
        list, receives no instruction, and its name becomes free again. Provisional (Q39): its routes and
        master/follower relations are removed in the same transaction (listed beforehand by
        `getAccountArchiveImpact`), its binding is released, and the audit and history keep the id and a
        name snapshot. Audited as `accounts.archived` with what was removed. An archived or unknown id
        gets 404.
      parameters:
        - { $ref: '../openapi.yaml#/components/parameters/AccountId' }
      responses:
        '204': { description: Archived and audited. }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409':
          description: '`accounts.delete_open_position` — nothing changed.'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/accounts/{account_id}/archive-impact:
    get:
      tags: [accounts]
      operationId: getAccountArchiveImpact
      summary: What deleting the account would remove (for the confirmation dialog)
      description: |
        Read-only. The confirmation lists these items; `archiveAccount` removes whatever exists when it
        runs (each item is audited), so a route added in between is removed too.
      parameters:
        - { $ref: '../openapi.yaml#/components/parameters/AccountId' }
      responses:
        '200':
          description: The impact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveImpact' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/accounts/{account_id}/lifecycle:
    put:
      tags: [accounts]
      operationId: setAccountLifecycle
      summary: Pause, resume, disable or enable an account (S5 AC-4)
      description: |
        Sets the target state. Allowed transitions: `active` → `paused` (pause); `paused` → `active`
        (resume); `active` or `paused` → `disabled` (disable); `disabled` → `active` (enable). Any other
        transition gets 409 `accounts.lifecycle_transition_invalid`. Setting the current state is a
        no-op (200, not audited). A paused or disabled account receives no instruction at all, exits
        included (S7 AC-8); open positions and orders are not touched. Audited as
        `accounts.lifecycle_changed` (previous and new state, whether a position was open).
      parameters:
        - { $ref: '../openapi.yaml#/components/parameters/AccountId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200':
          description: The account in its new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409':
          description: '`common.version_conflict` (stale `row_version`) or `accounts.lifecycle_transition_invalid`; nothing changed.'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

  /api/v1/accounts/{account_id}/opt-ins/{kind}:
    put:
      tags: [accounts]
      operationId: setAccountOptIn
      summary: Record or change an explicit per-account opt-in (automation or copy) after the account exists
      description: |
        Decisions 2026-10-23: option A (explicit per-account opt-in), Q24 (separate `copy` opt-in for
        followers of master replication), Q25 (the choice is required when the firm's stance for that kind
        is forbidden, conditional, unknown or not confirmed), Q26 (a new preset version that changes the
        stance moves the state to `pending_review` and suspends that kind until the user chooses again).
        **Provisional (awaiting the user, Q42):** a change of the official rule text that the publisher of
        the preset version flags as material also triggers `pending_review`; unflagged edits never do.
        - `automation` covers automated sources (TradingView webhook, future signal engine).
        - `copy` covers receiving master-account replication as a follower.
        The first choice is made **atomically with account creation** (`opt_ins` of `createAccount` /
        `updateAccount`, schema `OptInChoices`). The `copy` choice is made atomically with adding the
        account as a follower (S7/S19); for an account that is not a follower `copy` is `not_required`
        and this operation answers 422 `accounts.opt_in_not_applicable`. This operation is for later
        changes and for resolving `pending_review`. `rule_version_id` must be the rule version whose text
        the user saw; if it is stale the Core answers 409 `accounts.rule_version_changed` and saves
        nothing. Every change is audited (date, user, kind, choice, rule version, previous value).
      x-step-up: conditional
      x-step-up-when: choice == accepted
      parameters:
        - { $ref: '../openapi.yaml#/components/parameters/AccountId' }
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OptInKind' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choice, rule_version_id]
              properties:
                choice: { type: string, enum: [accepted, declined] }
                rule_version_id:
                  description: Rule version whose text was displayed (`RuleVersion.id`).
                  $ref: '../openapi.yaml#/components/schemas/Uuid'
                step_up:
                  description: Required when `choice` is `accepted` (step-up action `account_opt_in_accept`, target = this account).
                  $ref: '../openapi.yaml#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptInState' }
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../openapi.yaml#/components/responses/StepUpFailed' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409':
          description: '`accounts.rule_version_changed` — `error.current_rule_version_id` carries the current version; nothing saved.'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '422':
          description: '`accounts.opt_in_not_applicable` (state is `not_required`: real account, the firm allows that kind, or `copy` on an account that is not a follower).'
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
        '500': { $ref: '../openapi.yaml#/components/responses/InternalError' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated by the client once per create submission; reused on retries (not a secret).
      schema: { $ref: '../openapi.yaml#/components/schemas/Uuid' }

  responses:
    AccountWriteConflict:
      description: |
        Nothing saved. Codes (pointer where shown):
        - `accounts.idempotency_key_reused` (create only; same key with a different body, or reuse after 24 h; never a second account);
        - `common.version_conflict` (update; stale `row_version`, reload);
        - `accounts.name_taken` — `/display_name` (case-insensitive, among the caller's live accounts);
        - `accounts.platform_account_taken` — `/binding` (already bound to another of the caller's
          accounts; a platform account of another user is never reported as taken, see 422);
        - `accounts.binding_open_position` — `/binding` (update; provisional, Q38);
        - `accounts.rule_version_changed` — `error.current_rule_version_id` (an `opt_ins` choice names a
          rule version that is no longer the one in force for the selection).
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
          examples:
            name_taken:
              value: { error: { code: accounts.name_taken, pointer: /display_name } }
            rule_version_changed:
              value: { error: { code: accounts.rule_version_changed, current_rule_version_id: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d } }
    AccountWriteRejected:
      description: |
        Valid shape, refused by a rule; nothing saved. Codes and pointers:
        - `accounts.opt_in_required` — `/opt_ins/automation` or `/opt_ins/copy`;
        - `accounts.opt_in_not_applicable` — `/opt_ins/<kind>` (real account, or the kind is
          `not_required` for the selection); the client refetches and drops the section;
        - `accounts.max_position_exceeds_preset` — `/max_position_qty` (above the preset maximum);
        - `accounts.preset_version_unknown` — `/preset_version_id` (unknown, withdrawn, or a superseded
          version on create);
        - `accounts.firm_platform_required` / `accounts.firm_platform_unknown` — `/firm_platform`;
        - `accounts.platform_account_unknown` — `/binding` (no such platform account on a connection of
          the caller, or the connection is unpaired; identical for another user's connection);
        - `accounts.platform_account_kind_not_allowed` — `/binding` (`live` or `unknown` kind outside
          production; ADR-0004 §8);
        - `accounts.profile_size_required` / `accounts.profile_size_invalid` — `/profile_size` (create of
          a real account whose size is a tie between two standard sizes; provisional, Q60).
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
          examples:
            opt_in_required:
              value: { error: { code: accounts.opt_in_required, pointer: /opt_ins/automation } }

  schemas:
    AccountName:
      type: string
      minLength: 1
      maxLength: 80
      description: Trimmed by the Core (NFC); must not be blank. Unique per user among live accounts, case-insensitive.
    AccountKind:
      type: string
      enum: [prop, real]
    LifecycleState:
      type: string
      enum: [active, paused, disabled]
    SizeAmount:
      type: string
      description: 'Account size in `currency` (decimal string, at most 2 decimals). Must be > 0: zero gets 400 `common.invalid_request`.'
      pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'
    MaxPositionQty:
      type: integer
      minimum: 1
      maximum: 10000
      description: Maximum position in contracts, one number per account in V1 (Q-A1). Mandatory (S5 AC-3).
    Multiplier:
      type: integer
      minimum: 1
      maximum: 1000
      description: Whole number ≥ 1 (S5 AC-5); a fraction or zero gets 400 `common.invalid_request` with the pointer.
    FirmPlatform:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
      description: Code of the firm-side platform when the preset has platform-specific rules (e.g. `rithmic`, `tradovate`); the options come from the preset version (S16). Not the execution platform.
    ManualText:
      type: string
      minLength: 1
      maxLength: 80
      description: Free text (trimmed by the Core) for prop accounts without a preset.
    PlatformAccountRef:
      type: object
      additionalProperties: false
      required: [connection_id, platform_account]
      description: A platform account reported by one of the caller's connections (`Connection.visible_accounts`).
      properties:
        connection_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        platform_account: { type: string, minLength: 1, maxLength: 128 }
    AccountBinding:
      type: object
      additionalProperties: false
      required: [connection_id, connection_name, connection_status, platform_account, kind, oco_location]
      description: The bound platform account, as last reported by the plugin. `oco_location` `unknown` is treated as `local` (S9 AC-4).
      properties:
        connection_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        connection_name: { $ref: '../openapi.yaml#/components/schemas/DisplayName' }
        connection_status:
          type: string
          enum: [awaiting_pairing, connected, disconnected, outdated, unpaired]
        platform_account: { type: string, maxLength: 128 }
        kind: { type: string, enum: [simulation, playback, live, unknown] }
        oco_location: { type: string, enum: [local, server, unknown] }
        bound_at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
    AccountOptIns:
      type: object
      additionalProperties: false
      required: [automation, copy]
      properties:
        automation: { $ref: '#/components/schemas/OptInState' }
        copy: { $ref: '#/components/schemas/OptInState' }
    Account:
      type: object
      additionalProperties: false
      required: [id, kind, display_name, size_amount, currency, multiplier, max_position_qty, lifecycle_state, opt_ins, has_open_position, row_version, created_at, updated_at]
      properties:
        id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/AccountKind' }
        display_name: { $ref: '#/components/schemas/AccountName' }
        firm_name:
          type: string
          description: Prop only. From the preset when `preset_version_id` is set, else the manual text.
        plan_name: { type: string, description: Prop only (as `firm_name`). }
        phase: { type: string, description: Prop only (as `firm_name`). }
        firm_id:
          description: Prop with a preset only (S16 catalog).
          $ref: '../openapi.yaml#/components/schemas/Uuid'
        preset_version_id:
          description: Prop with a preset only. The version applied to this account; a newer one is applied only by the user (S16 AC-3).
          $ref: '../openapi.yaml#/components/schemas/Uuid'
        firm_platform: { $ref: '#/components/schemas/FirmPlatform' }
        size_amount: { $ref: '#/components/schemas/SizeAmount' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217; 'USD' in V1." }
        multiplier: { $ref: '#/components/schemas/Multiplier' }
        max_position_qty: { $ref: '#/components/schemas/MaxPositionQty' }
        lifecycle_state: { $ref: '#/components/schemas/LifecycleState' }
        binding:
          description: Absent when the account is not bound; an unbound account is never routed (provisional, Q37).
          $ref: '#/components/schemas/AccountBinding'
        opt_ins: { $ref: '#/components/schemas/AccountOptIns' }
        has_open_position:
          type: boolean
          description: Last known from the platform (gateway); false when unbound. Used for the lifecycle and delete messages.
        row_version: { type: integer, minimum: 1 }
        created_at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        archived_at:
          description: Only in the idempotent replay of a create whose account was archived since; every other read of an archived account is 404.
          $ref: '../openapi.yaml#/components/schemas/Timestamp'
      allOf:
        - if: { properties: { kind: { const: prop } } }
          then: { required: [firm_name, plan_name, phase] }
          else: { not: { anyOf: [{ required: [firm_name] }, { required: [plan_name] }, { required: [phase] }, { required: [firm_id] }, { required: [preset_version_id] }, { required: [firm_platform] }] } }
    AccountList:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, display_name, max_position_qty]
      description: |
        `kind: real` → `size_amount` required; no prop fields; no `opt_ins`.
        `kind: prop` → either `preset_version_id` (+ `firm_platform` when the preset requires it; firm,
        plan, phase and size then come from the preset and must be absent) or all of `firm_name`,
        `plan_name`, `phase`, `size_amount` (manual).
      properties:
        kind: { $ref: '#/components/schemas/AccountKind' }
        display_name: { $ref: '#/components/schemas/AccountName' }
        preset_version_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        firm_platform: { $ref: '#/components/schemas/FirmPlatform' }
        firm_name: { $ref: '#/components/schemas/ManualText' }
        plan_name: { $ref: '#/components/schemas/ManualText' }
        phase: { $ref: '#/components/schemas/ManualText' }
        size_amount: { $ref: '#/components/schemas/SizeAmount' }
        multiplier:
          description: Defaults to 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty: { $ref: '#/components/schemas/MaxPositionQty' }
        binding: { $ref: '#/components/schemas/PlatformAccountRef' }
        profile_size:
          description: Real accounts only. The standard size whose default profile is copied, when `size_amount` is a tie (`getNearestProfileSize` returns two candidates). Ignored otherwise.
          $ref: '#/components/schemas/SizeAmount'
        opt_ins: { $ref: '#/components/schemas/OptInChoices' }
        step_up:
          description: Required when an `opt_ins` choice is `accepted` (action `account_create_opt_in_accept`, no target).
          $ref: '../openapi.yaml#/components/schemas/StepUpProof'
      allOf:
        - if: { properties: { kind: { const: real } } }
          then:
            required: [size_amount]
            not: { anyOf: [{ required: [preset_version_id] }, { required: [firm_platform] }, { required: [firm_name] }, { required: [plan_name] }, { required: [phase] }, { required: [opt_ins] }] }
          else: { not: { required: [profile_size] } }
        - if: { properties: { kind: { const: prop } }, required: [preset_version_id] }
          then: { not: { anyOf: [{ required: [firm_name] }, { required: [plan_name] }, { required: [phase] }, { required: [size_amount] }] } }
        - if:
            properties: { kind: { const: prop } }
            not: { required: [preset_version_id] }
          then:
            required: [firm_name, plan_name, phase, size_amount]
            not: { required: [firm_platform] }
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [row_version, display_name, max_position_qty]
      description: |
        Full replacement of the editable fields (`kind` is fixed at creation). The same prop/real rules as
        `AccountCreateRequest`, keyed on the stored `kind`: real → `size_amount`, no prop fields, no
        `opt_ins`; prop → `preset_version_id` (+ `firm_platform`) or the four manual fields. A body that
        does not fit the stored kind gets 400 `common.invalid_request` with the pointer of the first
        offending field. Switching a prop account from a preset to manual fields (or back) is allowed.
      properties:
        row_version: { type: integer, minimum: 1 }
        display_name: { $ref: '#/components/schemas/AccountName' }
        preset_version_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
        firm_platform: { $ref: '#/components/schemas/FirmPlatform' }
        firm_name: { $ref: '#/components/schemas/ManualText' }
        plan_name: { $ref: '#/components/schemas/ManualText' }
        phase: { $ref: '#/components/schemas/ManualText' }
        size_amount: { $ref: '#/components/schemas/SizeAmount' }
        multiplier:
          description: Absent means 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty: { $ref: '#/components/schemas/MaxPositionQty' }
        binding:
          description: The platform account to bind; absent means unbound.
          $ref: '#/components/schemas/PlatformAccountRef'
        opt_ins: { $ref: '#/components/schemas/OptInChoices' }
        step_up:
          description: Required when an `opt_ins` choice is `accepted` and changes the stored state (action `account_opt_in_accept`, target = this account).
          $ref: '../openapi.yaml#/components/schemas/StepUpProof'
      allOf:
        - if: { required: [preset_version_id] }
          then: { not: { anyOf: [{ required: [firm_name] }, { required: [plan_name] }, { required: [phase] }] } }
        - if: { required: [firm_name] }
          then: { required: [plan_name, phase, size_amount] }
        - if: { not: { required: [preset_version_id] } }
          then: { not: { required: [firm_platform] } }
    LifecycleRequest:
      type: object
      additionalProperties: false
      required: [state, row_version]
      properties:
        state: { $ref: '#/components/schemas/LifecycleState' }
        row_version: { type: integer, minimum: 1 }
    ArchiveImpact:
      type: object
      additionalProperties: false
      required: [has_open_position, routes, follower_links]
      properties:
        has_open_position:
          type: boolean
          description: When true `archiveAccount` is refused (the dialog shows the explanation instead of a confirmation).
        routes:
          type: array
          description: Routing subscriptions of this account (S7) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required: [source_id, source_name]
            properties:
              source_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
              source_name: { $ref: '../openapi.yaml#/components/schemas/DisplayName' }
        follower_links:
          type: array
          description: Master/follower relations (S19, V1.1; always empty before it) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required: [account_id, display_name, role]
            properties:
              account_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
              display_name: { $ref: '#/components/schemas/AccountName' }
              role:
                type: string
                enum: [master, follower]
                description: The role of the OTHER account in the relation.
    OptInKind:
      type: string
      enum: [automation, copy]
    FirmStance:
      type: string
      enum: [allowed, forbidden, conditional, unknown, not_confirmed]
      description: Stance of the rule version for the opt-in kind. A missing stance in the preset, and every prop account without a preset (generic rule, provisional Q40), is `unknown`.
    OptInChoiceRequest:
      type: object
      additionalProperties: false
      required: [choice, rule_version_id]
      properties:
        choice: { type: string, enum: [accepted, declined] }
        rule_version_id:
          description: Rule version whose text was displayed (`RuleVersion.id`).
          $ref: '../openapi.yaml#/components/schemas/Uuid'
    OptInChoices:
      description: |
        The `opt_ins` property of `createAccount` / `updateAccount` (atomic create-with-choice). Must
        contain every kind whose choice is required for the account's rule version and is not already
        `chosen` for that version; otherwise 422 `accounts.opt_in_required` with `pointer`
        `/opt_ins/automation` or `/opt_ins/copy`, and nothing is saved. `copy` is required only when the
        account is a follower (S19), so it is normally absent here. A stale `rule_version_id` gives 409
        `accounts.rule_version_changed`. The step-up (when a choice is `accepted` and changes the stored
        state) happens before the single save, so cancelling it saves nothing.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        automation: { $ref: '#/components/schemas/OptInChoiceRequest' }
        copy: { $ref: '#/components/schemas/OptInChoiceRequest' }
    OptInState:
      type: object
      additionalProperties: false
      required: [kind, state]
      properties:
        kind: { $ref: '#/components/schemas/OptInKind' }
        firm_stance:
          description: Absent only for real accounts.
          $ref: '#/components/schemas/FirmStance'
        state:
          type: string
          enum: [not_required, chosen, pending_review]
          description: |
            not_required = no choice is asked now: real account, the stance is `allowed`, or (`copy`) the
            account is not a follower (Q-S5-8; no card in the UI); chosen = an explicit choice exists for
            the current rule version; pending_review = see `pending_reason`; that kind is suspended until
            the user chooses again (Q26). Routing treats `pending_review` and `declined` as not accepted
            (`routing.automation_not_accepted` / `routing.copy_not_accepted`). There is no "saved without
            a choice" state: first choices are atomic with creation.
        pending_reason:
          type: string
          enum: [stance_changed, text_changed, preset_attached]
          description: |
            With `pending_review` only. `stance_changed` (Q26); `text_changed` = the new rule version is
            flagged as a material text change (provisional, Q42; `RuleVersion.change` has the reason
            text); `preset_attached` = a preset was attached to an account that had none (provisional, Q41).
        choice:
          type: string
          enum: [accepted, declined]
          description: |
            With `chosen`: the choice in force. With `pending_review`: the **previous** choice (no longer in
            force), present only if one was ever made, so the review dialog can show it; it is never
            preselected. Absent with `not_required`.
        chosen_at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        rule_version_id:
          description: Rule version the `choice` was made against.
          $ref: '../openapi.yaml#/components/schemas/Uuid'
        current_rule_version_id:
          description: The rule version in force for this account and kind (fetch its text with `getRuleVersion`). Absent only for real accounts.
          $ref: '../openapi.yaml#/components/schemas/Uuid'
      allOf:
        - if: { properties: { state: { const: chosen } } }
          then: { required: [firm_stance, choice, chosen_at, rule_version_id, current_rule_version_id] }
        - if: { properties: { state: { const: pending_review } } }
          then:
            required: [firm_stance, pending_reason, current_rule_version_id]
            dependentRequired: { choice: [chosen_at, rule_version_id] }
          else: { not: { required: [pending_reason] } }
        - if: { properties: { state: { const: not_required } } }
          then: { not: { anyOf: [{ required: [choice] }, { required: [chosen_at] }, { required: [rule_version_id] }] } }
    AccountChangedEvent:
      type: object
      additionalProperties: false
      required: [type, at, account_id]
      description: Any change to an account the caller sees (fields, lifecycle, opt-in state, binding, open position). The client refetches the account (`getAccount`).
      properties:
        type: { const: account.changed }
        at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        account_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    AccountArchivedEvent:
      type: object
      additionalProperties: false
      required: [type, at, account_id]
      properties:
        type: { const: account.archived }
        at: { $ref: '../openapi.yaml#/components/schemas/Timestamp' }
        account_id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
