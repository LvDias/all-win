  /api/v1/me/devices/{device_id}/forget:
    post:
      tags:
      - me
      operationId: forgetDevice
      summary: Forget a device — revokes it and ends its sessions (no step-up)
      description: 'Ends the sessions bound to that device (`session.ended` reason `device_revoked`). Its cookie then counts

        as none: the next sign-in from that browser is a new device (auth policy §5.2). Idempotent. Audited.

        '
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/channel-changes:
    post:
      tags:
      - me
      operationId: startChannelChange
      summary: Start changing the e-mail or adding/changing WhatsApp (codes to the current and the new value; S3 AC-11)
      description: "Sends one code to the **current** value of that channel (for a first WhatsApp: to the e-mail) and one\n\
        to the **new** value, under one flow (auth policy §7). After S3b, when the user has another confirmed\nchannel, a\
        \ third code goes to it ([Proposed] §7). The change applies only when every code is confirmed\nwithin 10 minutes;\
        \ until then the current value stays in force.\n- If the new value belongs to another account nothing reveals it:\
        \ its code is not sent, its delivery\n  reads `sent`, and its verification fails with `auth.code_invalid` (§3).\n\
        - 409 `me.channel_change_too_soon`: a change completed less than 24 h ago.\n- 409 `me.channel_change_pending`: another\
        \ change is open or on hold.\n- 422 `me.channel_unchanged`: the new value equals the current one.\n- 422 `auth.channel_unavailable`:\
        \ WhatsApp is not offered yet (S3b).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - channel
              - new_value
              properties:
                channel:
                  $ref: '#/components/schemas/CodeChannel'
                new_value:
                  type: string
                  maxLength: 254
                  description: An e-mail address for `email`; an E.164 number (`+5511…`) for `whatsapp`.
      responses:
        '202':
          description: Codes sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelChange'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          description: '`me.channel_change_too_soon` or `me.channel_change_pending`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`me.channel_unchanged`, `auth.channel_unavailable`, or `me.invalid_channel_value` (pointer `/new_value`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/channel-changes/{change_id}/verify:
    post:
      tags:
      - me
      operationId: verifyChannelChangeCode
      summary: Confirm one code of a channel change
      description: 'When the last code is confirmed the change either completes (`completed`: the value is replaced, other

        sessions end with reason `channel_changed`, the current session is rotated, notices go to the old value

        and the other channel) or goes `on_hold` until `hold_until` (auth policy §9 hold, and §7 M2 if adopted),

        cancellable with `cancelChannelChange`.

        '
      parameters:
      - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - challenge_id
              - code
              properties:
                challenge_id:
                  $ref: '#/components/schemas/ChallengeId'
                code:
                  $ref: '#/components/schemas/OneTimeCode'
      responses:
        '200':
          description: Updated state of the change.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelChange'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CodeInvalidOrOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`me.channel_change_closed` (expired, cancelled or completed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/channel-changes/{change_id}/cancel:
    post:
      tags:
      - me
      operationId: cancelChannelChange
      summary: Cancelar troca — cancel an open or on-hold channel change from any session of the user
      description: 'Explicit action; signing in does not cancel. Audited, with notices to every channel. A new change

        requested after a cancellation raises an admin alert (auth policy §9). Idempotent on a cancelled change.

        '
      parameters:
      - $ref: '#/components/parameters/ChangeId'
      responses:
        '204':
          description: Cancelled.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`me.channel_change_closed` (already completed or expired).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/invitations:
    get:
