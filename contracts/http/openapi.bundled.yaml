        render it as text, never as HTML or Markdown (QA Security I2).
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
        language:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
          description: BCP 47, e.g. 'en'.
        page_title:
          type: string
          maxLength: 300
        section:
          type: string
          maxLength: 300
          description: Heading of the quoted part of the page, if any.
        url:
