      - connections
      operationId: renameConnection
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  $ref: '#/components/schemas/DisplayName'
      responses:
        '200':
