                send_email:
                  type: boolean
                  default: true
                step_up:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '201':
          description: Created. `invite_url` (fragment form) is returned only here.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - invitation
                - invite_url
                - email_sent
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
                  invite_url:
