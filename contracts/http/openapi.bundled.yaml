          type: object
          additionalProperties: false
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            pointer:
              type: string
              maxLength: 256
    Me:
      type: object
      additionalProperties: false
      required:
      - id
      - email
