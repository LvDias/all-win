          - active
          - revoked
        key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
        masked_url:
          type: string
          description: '''https://<host>/ingress/v1/tradingview/awk_<key_id>_…'' — never the secret.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        rotated_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
        last_received_at:
          $ref: '#/components/schemas/Timestamp'
    SourceWithUrl:
