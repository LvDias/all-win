        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/step-up:
    post:
      tags:
      - auth
      operationId: requestStepUp
      summary: Request a step-up code for one sensitive action (auth policy §6)
      description: "Sends a `step_up` code bound to this session, the `action` and the `target_id`. The action request then\n\
        carries `step_up: { challenge_id, code }` in its body (schema `StepUpProof`); the code authorizes that\none action\
