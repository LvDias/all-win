        (S9 AC-4).
      properties:
        connection_id:
          $ref: '#/components/schemas/Uuid'
        connection_name:
          $ref: '#/components/schemas/DisplayName'
        connection_status:
          type: string
          enum:
          - awaiting_pairing
          - connected
          - disconnected
          - outdated
          - unpaired
        platform_account:
          type: string
          maxLength: 128
        kind:
          type: string
          enum:
          - simulation
          - playback
          - live
          - unknown
        oco_location:
          type: string
          enum:
          - local
          - server
          - unknown
        bound_at:
          $ref: '#/components/schemas/Timestamp'
    AccountOptIns:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      properties:
        automation:
          $ref: '#/components/schemas/OptInState'
        copy:
          $ref: '#/components/schemas/OptInState'
    Account:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - display_name
      - size_amount
      - currency
      - multiplier
      - max_position_qty
      - lifecycle_state
      - opt_ins
      - has_open_position
      - row_version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
