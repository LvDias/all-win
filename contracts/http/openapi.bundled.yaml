          - plan_name
          - phase
        else:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - firm_id
            - required:
              - preset_version_id
            - required:
              - firm_platform
    AccountList:
      type: object
      additionalProperties: false
      required:
      - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - display_name
      - max_position_qty
      description: '`kind: real` → `size_amount` required; no prop fields; no `opt_ins`.

        `kind: prop` → either `preset_version_id` (+ `firm_platform` when the preset requires it; firm,

        plan, phase and size then come from the preset and must be absent) or all of `firm_name`,

        `plan_name`, `phase`, `size_amount` (manual).

        '
      properties:
        kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          $ref: '#/components/schemas/AccountName'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        firm_name:
          $ref: '#/components/schemas/ManualText'
        plan_name:
          $ref: '#/components/schemas/ManualText'
        phase:
          $ref: '#/components/schemas/ManualText'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        multiplier:
          description: Defaults to 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        commission_per_contract_side:
          description: 'USD per contract and side, ≥ 0 (U20 a): the floor of each fill''s commission (effective = max(platform,

            this × quantity)). The UI prefills it from the preset (`commission_per_contract_side` rule);

            absent = no floor. Any change bumps the account''s limits version (net P&L feeds risk).

            '
          $ref: '#/components/schemas/MoneyAmount'
        evaluation_start:
          type: string
          format: date
          description: Prop accounts in an evaluation phase (Q46, S13b; Q69 a) — the day the evaluation count starts; default
            the registration date. Later changes only through `restartEvaluation`.
        evaluation_earned_before:
          description: Net profit already made in this evaluation before `evaluation_start` (optional; counts toward the target).
          $ref: '#/components/schemas/MoneyAmount'
        binding:
          $ref: '#/components/schemas/PlatformAccountRef'
        rule_values:
          description: Prop with a preset only. The account's own rule values where they differ from the preset or resolve
            a not-confirmed field (S16 AC-2, AC-6).
          $ref: '#/components/schemas/PresetRuleValues'
        profile_size:
          description: Real accounts only. The standard size whose default profile is copied, when `size_amount` is a tie
            (`getNearestProfileSize` returns two candidates). Ignored otherwise.
          $ref: '#/components/schemas/SizeAmount'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` (action `account_create_opt_in_accept`, no target).
          $ref: '#/components/schemas/StepUpProof'
      allOf:
      - if:
          properties:
            kind:
              const: real
        then:
          required:
          - size_amount
          not:
            anyOf:
            - required:
              - preset_version_id
            - required:
              - firm_platform
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - opt_ins
            - required:
              - rule_values
        else:
          not:
            required:
            - profile_size
      - if:
          properties:
            kind:
              const: prop
          required:
          - preset_version_id
        then:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - size_amount
      - if:
          properties:
            kind:
              const: prop
          not:
            required:
            - preset_version_id
        then:
          required:
          - firm_name
          - plan_name
          - phase
          - size_amount
          not:
            anyOf:
            - required:
              - firm_platform
            - required:
              - rule_values
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - row_version
      - display_name
      - max_position_qty
      description: 'Full replacement of the editable fields (`kind` is fixed at creation). The same prop/real rules as

        `AccountCreateRequest`, keyed on the stored `kind`: real → `size_amount`, no prop fields, no

        `opt_ins`; prop → `preset_version_id` (+ `firm_platform`) or the four manual fields. A body that

        does not fit the stored kind gets 400 `common.invalid_request` with the pointer of the first

        offending field. Switching a prop account from a preset to manual fields (or back) is allowed.

        '
      properties:
        row_version:
          type: integer
          minimum: 1
        display_name:
          $ref: '#/components/schemas/AccountName'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        firm_name:
          $ref: '#/components/schemas/ManualText'
        plan_name:
          $ref: '#/components/schemas/ManualText'
        phase:
          $ref: '#/components/schemas/ManualText'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        multiplier:
          description: Absent means 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        commission_per_contract_side:
          description: 'USD per contract and side, ≥ 0 (U20 a): the floor of each fill''s commission (effective = max(platform,

            this × quantity)). The UI prefills it from the preset (`commission_per_contract_side` rule);

            absent = no floor (full replacement). Any change bumps the account''s limits version (net P&L feeds risk).

            '
          $ref: '#/components/schemas/MoneyAmount'
        binding:
          description: The platform account to bind; absent means unbound.
          $ref: '#/components/schemas/PlatformAccountRef'
        rule_values:
          description: 'Only when the preset selection changes (another `preset_version_id` or `firm_platform`): the

            account''s own values for the new preset (edited or resolving not-confirmed fields; absent fields

            take the new preset''s value). With an unchanged selection it must be absent (422

            `accounts.rule_values_without_selection_change`) and the stored rule values are kept; they are

            edited with `putAccountRiskRules` (S13) and restored with `restorePresetValue`.

            '
          $ref: '#/components/schemas/PresetRuleValues'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` and changes the stored state (action `account_opt_in_accept`),
            or when the binding of an account that receives automation changes (action `account_binding_change`); target =
            this account.
          $ref: '#/components/schemas/StepUpProof'
      allOf:
      - if:
          required:
          - preset_version_id
        then:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - size_amount
        else:
          required:
          - size_amount
          not:
            anyOf:
            - required:
              - firm_platform
            - required:
              - rule_values
      - if:
          anyOf:
          - required:
            - firm_name
          - required:
            - plan_name
          - required:
            - phase
        then:
          required:
          - firm_name
          - plan_name
          - phase
          - size_amount
    LifecycleRequest:
      type: object
      additionalProperties: false
      required:
      - state
      - row_version
      properties:
        state:
          $ref: '#/components/schemas/LifecycleState'
        row_version:
          type: integer
          minimum: 1
    ArchiveImpact:
      type: object
      additionalProperties: false
      required:
      - has_open_position
      - routes
      - follower_links
      properties:
        has_open_position:
          type: boolean
          description: When true `archiveAccount` is refused (the dialog shows the explanation instead of a confirmation).
        routes:
          type: array
          description: Routing subscriptions of this account (S7) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required:
            - source_id
            - source_name
            properties:
              source_id:
                $ref: '#/components/schemas/Uuid'
              source_name:
                $ref: '#/components/schemas/DisplayName'
        follower_links:
          type: array
          description: Master/follower relations (S19, V1.1; always empty before it) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - display_name
            - role
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              display_name:
                $ref: '#/components/schemas/AccountName'
              role:
                type: string
                enum:
                - master
                - follower
                description: The role of the OTHER account in the relation.
    OptInKind:
      type: string
      enum:
      - automation
      - copy
    FirmStance:
      type: string
      enum:
      - allowed
      - forbidden
      - conditional
      - unknown
      - not_confirmed
      description: Stance of the rule version for the opt-in kind. A missing stance in the preset, and every prop account
        without a preset (generic rule, Q40), is `unknown`.
    OptInChoiceRequest:
      type: object
      additionalProperties: false
      required:
      - choice
      - rule_version_id
      properties:
        choice:
          type: string
          enum:
          - accepted
          - declined
        rule_version_id:
          description: Rule version whose text was displayed (`RuleVersion.id`).
          $ref: '#/components/schemas/Uuid'
    OptInChoices:
      description: 'The `opt_ins` property of `createAccount` / `updateAccount` / `applyPresetVersion` (atomic with the

        save). Required kinds: on create, `automation` when its rule version needs a choice; on update and

        apply, only `automation`, and only when that request changes the automation rule version and the

        new version needs a choice. Otherwise 422 `accounts.opt_in_required` with `pointer`

        `/opt_ins/automation`, and nothing is saved. `copy` is never required by these operations (it is

        chosen in the follower flow, S7/S19); it may be sent when the UI shows it. A stale `rule_version_id` gives 409

        `accounts.rule_version_changed`. The step-up (when a choice is `accepted` and changes the stored

        state) happens before the single save, so cancelling it saves nothing.

        '
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        automation:
          $ref: '#/components/schemas/OptInChoiceRequest'
        copy:
          $ref: '#/components/schemas/OptInChoiceRequest'
    OptInState:
      type: object
      additionalProperties: false
      required:
      - kind
      - state
      properties:
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_stance:
          description: Absent only for real accounts.
          $ref: '#/components/schemas/FirmStance'
        state:
          type: string
          enum:
          - not_required
          - chosen
          - pending_review
          description: 'not_required = no choice is asked now: real account, the stance is `allowed`, or (`copy`) the

            account is not a follower (Q-S5-8; no card in the UI); chosen = an explicit choice exists for

            the current rule version; pending_review = see `pending_reason`; that kind is suspended until

            the user chooses again (Q26). Routing treats `pending_review` and `declined` as not accepted

            (`routing.automation_not_accepted` / `routing.copy_not_accepted`). There is no "saved without

            a choice" state: first choices are atomic with creation.

            '
        pending_reason:
          type: string
          enum:
          - stance_changed
          - text_changed
          - preset_attached
          description: 'With `pending_review` only. `stance_changed` (Q26); `text_changed` = the new rule version is

            flagged as a material text change (Q42; `RuleVersion.change` has the reason

            text); `preset_attached` = reserved for Q41: only a data migration that attaches a

            preset to an account without a user request would produce it. No operation of this contract

            does (a user who selects a preset sends the new choice inline, D16).

            '
        choice:
          type: string
          enum:
          - accepted
          - declined
          description: 'With `chosen`: the choice in force. With `pending_review`: the **previous** choice (no longer in

            force), present only if one was ever made, so the review dialog can show it; it is never

            preselected. Absent with `not_required`.

            '
        chosen_at:
          $ref: '#/components/schemas/Timestamp'
        rule_version_id:
          description: Rule version the `choice` was made against.
          $ref: '#/components/schemas/Uuid'
        current_rule_version_id:
          description: The rule version in force for this account and kind (fetch its text with `getRuleVersion`). Absent
            only for real accounts.
          $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            state:
              const: chosen
        then:
          required:
          - firm_stance
          - choice
          - chosen_at
          - rule_version_id
          - current_rule_version_id
      - if:
          properties:
            state:
              const: pending_review
        then:
          required:
          - firm_stance
          - pending_reason
          - current_rule_version_id
          dependentRequired:
            choice:
            - chosen_at
            - rule_version_id
        else:
          not:
            required:
            - pending_reason
      - if:
          properties:
            state:
              const: not_required
        then:
          not:
            anyOf:
            - required:
              - choice
            - required:
              - chosen_at
            - required:
              - rule_version_id
    AccountChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      description: Any change to an account the caller sees (fields, lifecycle, opt-in state, binding, open position). The
        client refetches the account (`getAccount`).
      properties:
        type:
          const: account.changed
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
    AccountArchivedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      properties:
        type:
          const: account.archived
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
    AuditCategory:
      type: string
      enum:
      - ingress
      - routing
      - execution
      - risk
      - connection
      - security
      - config
    AuditOutcome:
      type: string
      enum:
      - received
      - routed
      - executed
      - partial
      - skipped
      - refused
      - rejected
      - expired
      - unknown
      - info
      description: "Final taxonomy (Q-S10-2), set by the Core on every entry, never derived by the client:\n- `received` —\
        \ instruction accepted at ingress;\n- `routed` — routing decision to send to an account (full quantity);\n- `executed`\
        \ — an order filled;\n- `partial` — quantity capped at the maximum position, or a partial fill;\n- `skipped` — not\
        \ sent by a configuration rule (duplicate, signal type not selected, opt-in not\n  accepted, account inactive, no\
        \ stop/target profile, limits not yet derived, maximum already\n  reached, nothing to close);\n- `refused` — not sent\
        \ by a protective gate (out of sync, risk block, position conflict);\n- `rejected` — refused by validation (ingress)\
        \ or by the platform;\n- `expired` — command TTL exceeded, not executed;\n- `unknown` — the order's state could not\
        \ be determined after a recovery (the account is\n  flagged out of sync);\n- `info` — everything else (configuration,\
        \ connection, security, order received/working/cancelled,\n  bracket calculation, command sent). No badge in the UI.\n"
    AuditSignalType:
      type: string
      enum:
      - trigger
      - trade_plan
      - nq_trigger
      - master_account
    AuditCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      maxLength: 96
      description: 'Stable code; clients translate it (ADR-0001 §9). The set is open: a code the client does not know

        is shown with the fallback text and the technical data. `KnownAuditCode` lists the codes defined

        by the contract so far (the i18n parity check uses it).

        '
    KnownAuditCode:
      type: string
      enum:
      - ingress.received
      - ingress.duplicate_ignored
      - ingress.rejected
      - ingress.rate_limited
      - routing.routed
      - routing.quantity_capped
      - routing.max_position_reached
      - routing.signal_type_not_selected
      - routing.automation_not_accepted
      - routing.copy_not_accepted
      - routing.account_inactive
      - routing.no_bracket_profile
      - routing.limits_pending
      - routing.out_of_sync
      - routing.risk_blocked
      - routing.position_conflict
      - routing.nothing_to_close
      - routing.nothing_to_reduce
      - routing.no_correlated_order
      - routing.expired
      - execution.command_sent
      - execution.bracket_calculated
      - execution.order_received
      - execution.order_working
      - execution.partially_filled
      - execution.filled
      - execution.cancelled
      - execution.rejected
      - execution.expired
      - execution.state_unknown
      - execution.fill_corrected
      - connection.status_changed
      - sources.created
      - sources.renamed
      - sources.rotated
      - sources.revoked
      - connections.created
      - connections.renamed
      - connections.pairing_code_issued
      - connections.paired
      - connections.repaired
      - connections.unpaired
      - security.signed_in
      - security.sign_in_failed
      - security.code_rate_limited
      - security.code_delivery_failed
      - security.new_device_notice_sent
      - security.step_up_succeeded
      - security.step_up_failed
      - security.channel_change_requested
      - security.channel_change_on_hold
      - security.channel_change_completed
      - security.channel_change_cancelled
      - security.channel_change_not_completed
      - security.device_forgotten
      - security.signed_out_everywhere
      - accounts.created
      - accounts.updated
      - accounts.archived
      - accounts.lifecycle_changed
      - accounts.opt_in_chosen
      - accounts.opt_in_suspended
      - routing.subscription_changed
      - profiles.default_changed
      - profiles.account_changed
      - presets.version_applied
      - presets.value_restored
      - risk.rules_changed
      - risk.warning
      - risk.limit_reached
      - risk.target_reached
      - risk.consistency_warning
      - risk.evaluation_target_reached
      - accounts.evaluation_restarted
      - trades.captured
      - trades.manual_created
      - trades.manual_changed
      - trades.manual_deleted
      - trades.reconcile_mismatch
      description: 'Codes with a `details` schema in `AuditDetailsByCode`. `security.*` codes come from S3 AC-16 and

        auth policy rev. 2 (Esquadro). Families defined by other slices are added with their contracts:

        `sync.*` (S11), `risk.flatten` / `risk.blocked` (S15), `notifications.*` (S18).

        '
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - occurred_at
      - recorded_at
      - category
      - code
      - outcome
      - details
      - safe_to_display
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        category:
          $ref: '#/components/schemas/AuditCategory'
        code:
          $ref: '#/components/schemas/AuditCode'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        is_exit:
          type: boolean
          description: With routing and execution entries of an exit action (`close`, reduce, protective modify/cancel), so
            the text can say "saída".
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        message_id:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot at the time of the entry.
        account_deleted:
          type: boolean
          description: True when the account has been archived since (UI `(excluída)`).
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          minLength: 1
          maxLength: 60
        source_key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
          description: The only part of a source token that may be shown.
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        command_id:
          $ref: '#/components/schemas/Uuid'
        actor:
          type: string
          enum:
          - user
          - system
          - platform_admin
          description: Who caused the entry. `platform_admin` is reserved for admin actions on the user's data (Q28 recovery);
            absent on old entries.
        details:
          type: object
          description: 'Typed per code: the schema is `AuditDetailsByCode[code]` (an empty object for codes without

            one). Money, prices and distances are decimal strings. Never holds a secret, whatever

            `safe_to_display` says: the Core redacts before writing (free-text fields such as pointers and

            device labels are truncated and redacted) and storage refuses token-shaped strings.

            '
        safe_to_display:
          type: boolean
          description: Presentation only — true when the raw `details` JSON may be shown in "technical data". The rendered
            fields of the catalog are always shown. It is not a secrecy flag (see `details`).
      allOf:
      - if:
          required:
          - account_id
        then:
          required:
          - account_name
          - account_deleted
      - if:
          required:
          - source_id
        then:
          required:
          - source_name
    ActivityPage:
      type: object
      additionalProperties: false
      required:
      - entries
      - retention_months
      - horizon
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
          description: Absent on the last page.
        retention_months:
          type: integer
          minimum: 1
          description: Rolling retention of the activity record (24 in V1, configurable by the admin; Q13, Q45).
        horizon:
          description: The oldest instant still kept; a `from` before it gets the "only the last n months" line.
          $ref: '#/components/schemas/Timestamp'
    ActivityFilterOptions:
      type: object
      additionalProperties: false
      required:
      - accounts
      - sources
      - signal_types
      properties:
        accounts:
          type: array
          description: Every account that appears in the caller's activity, archived ones included.
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - account_name
            - account_deleted
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              account_name:
                type: string
                maxLength: 80
              account_deleted:
                type: boolean
        sources:
          type: array
          description: Every source, revoked ones included.
          items:
            type: object
            additionalProperties: false
            required:
            - source_id
            - source_name
            - revoked
            properties:
              source_id:
                $ref: '#/components/schemas/Uuid'
              source_name:
                type: string
                minLength: 1
                maxLength: 60
              revoked:
                type: boolean
        signal_types:
          type: array
          description: Signal types present in the caller's retained activity (`master_account` only once S19 produces it;
            Q-S10-7).
          items:
            $ref: '#/components/schemas/AuditSignalType'
    InstructionSummary:
      type: object
      additionalProperties: false
      required:
      - instruction_id
      - message_id
      - source_id
      - source_name
      - signal_type
      - action
      - instrument_symbol
      - sent_at
      - received_at
      properties:
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        message_id:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          minLength: 1
          maxLength: 60
        source_key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        action:
          type: string
          enum:
          - buy
          - sell
          - close
          - reverse
          - modify
          - cancel
        instrument_symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
        contract_month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
          description: Absent for `close` (ignored).
        sent_at:
          $ref: '#/components/schemas/Timestamp'
        received_at:
          $ref: '#/components/schemas/Timestamp'
    TimelineAccount:
      type: object
      additionalProperties: false
      required:
      - account_id
      - account_name
      - account_deleted
      - outcome
      - final
      - steps
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
        account_deleted:
          type: boolean
        outcome:
          description: The account's result so far (the last decisive step).
          $ref: '#/components/schemas/AuditOutcome'
        final:
          type: boolean
          description: False while commands for this account are still open; the UI announces the outcome once it becomes
            final.
        quantity:
          description: How the quantity was decided (absent when the account was skipped before sizing).
          $ref: '#/components/schemas/DetailsSizing'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    InstructionTimeline:
      type: object
      additionalProperties: false
      required:
      - instruction
      - status
      - intake
      - accounts
      properties:
        instruction:
          $ref: '#/components/schemas/InstructionSummary'
        status:
          type: string
          enum:
          - in_progress
          - completed
          description: '`completed` when every account block is final.'
        intake:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/TimelineAccount'
    AuditEntryRecordedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - entry_id
      - occurred_at
      - category
      - code
      - outcome
      description: A new entry was recorded for the caller. Carries the filter keys (so the "n new entries" banner counts
