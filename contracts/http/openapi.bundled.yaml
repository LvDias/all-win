  /api/v1/accounts/{account_id}/preset-diff:
    get:
      tags:
      - presets
      operationId: getAccountPresetDiff
      summary: What applying a newer version of the account's preset would change (comparison dialog)
      description: 'Only fields that differ between the account, its current preset version and the target version.

        `requires_choice` marks rows the apply request must answer (an edited field, or a field that is

        not confirmed in the target). The target must be a newer version of the same preset (422

        `presets.version_not_newer`).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: target_preset_version_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetDiff'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`presets.version_not_newer` (pointer `/query/target_preset_version_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/preset-version:
    post:
      tags:
      - presets
      operationId: applyPresetVersion
      summary: Apply a newer version of the account's preset, with a choice for every field that needs one (S16 AC-3)
      description: 'One save, audited as `presets.version_applied` (old and new version, every changed field). Never

        touches open positions or working orders. For every `requires_choice` row of the diff the body has

        either `choices.<field>` (`keep_mine` / `use_preset`, for edited fields; nothing preselected,

        Q-S16-4) or `rule_values.<field>` (the user''s value, for not-confirmed fields), else 422

        `presets.choice_required` (pointer `/choices/<field>`). A required not-confirmed field left

        unresolved gets 422 `presets.required_field_unresolved` (pointer `/rule_values/<field>`; the

        maximum position is always resolved, because `max_position_qty` is required). When the

        target changes the opt-in rule version, `opt_ins` must carry the new choices (S5 D16); step-up when

        an `accepted` choice changes the stored state (action `account_opt_in_accept`, target = account).

        Choices made in `opt_ins` are audited as `accounts.opt_in_chosen` as well. A not-confirmed

        maximum position is resolved by the top-level `max_position_qty` (any value up to the highest

        published value; the Core records whether it equals a published one).

        Check order after authentication, Origin and schema: 404 → step-up → 409 → 422.

        '
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted that changes the stored state
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPresetVersionRequest'
      responses:
        '200':
          description: Applied and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPresetState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Nothing saved. `common.version_conflict` (stale `row_version`); `presets.version_superseded`

            (a newer version than the target was published meanwhile; reload the diff);

            `accounts.rule_version_changed` (an `opt_ins` choice names a stale rule version).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Nothing saved. `presets.version_not_newer` (`/target_preset_version_id`);

            `presets.choice_required` (`/choices/<field>`); `presets.required_field_unresolved`

            (`/rule_values/<field>`); `accounts.max_position_exceeds_preset` (`/max_position_qty`; the new

            cap is lower than the account''s value and the body did not lower it);

            `accounts.opt_in_required` (`/opt_ins/<kind>`); `accounts.firm_platform_required` /

            `accounts.firm_platform_unknown` (`/firm_platform`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/preset-values/{field}/restore:
    post:
      tags:
      - presets
      operationId: restorePresetValue
      summary: Replace an edited rule value of the account with the value of its preset version (S16-04)
      description: 'Audited as an account edit (`presets.value_restored`, old and new value). The preset is never

        modified. A field whose preset value is not confirmed cannot be restored (422

        `presets.value_not_confirmed`); a field that is not edited is a no-op (200, not audited).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: field
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RuleField'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - row_version
              properties:
                row_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPresetState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`presets.value_not_confirmed` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/risk:
    get:
      tags:
      - risk
      operationId: getAccountRisk
      summary: The account's current risk state for today's trading day (used vs limit per rule)
      description: 'Every figure, percent and state is computed by the Core from execution results and plugin-reported

        P&L (S13 AC-2); manual trades (S21, origin `manual`) do not enter daily loss, drawdown, profit

        target, consistency or blocks, and never unblock an account (PO rule: S13 AC-2 + S21 AC-3, PO clarification, slice-plan
        rev. 7); the UI renders it and does no arithmetic (X-3). `stale` is true when the data is

        not fresh (connection down or no recent report): the UI then never shows the values as current.

        Refetch after `risk.state_changed`.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The risk state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRisk'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/risk-summaries:
    get:
      tags:
      - risk
      operationId: listRiskSummaries
      summary: The worst risk state of each of the caller's accounts (account list column)
      responses:
        '200':
          description: One summary per live account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskSummaryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/risk-rules:
    get:
      tags:
      - risk
      operationId: getAccountRiskRules
      summary: The account's risk rules for the edit form, with provenance for prop accounts with a preset
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRiskRules'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - risk
      operationId: putAccountRiskRules
      summary: Set the account's risk rules (full replacement; optimistic concurrency by the limits `version`)
      description: 'An absent optional rule means "not set" (no warning, no refusal for it). Q48:

        a stricter value applies at once, a looser one from the next trading day (`AccountRisk.pending_changes`).

        A change of the reset time, and a change of drawdown type, always apply from the next trading

        day (`pending_reset_change`, `pending_changes[].change: drawdown_type_changed`).

        Looser means a higher limit or target, and also: removing a rule (absent = no limit), changing

        `profit_target_on_reach` from `flatten_and_block` to `notify`, and changing `daily_loss_limit.kind`

        from `hard` to `soft_pause` or `none` (QA Security L1); each is audited and listed in

        `pending_changes` until it applies. The latest save of a rule wins over an earlier pending value

        (ADR-0006 §3.7). Any write of the account''s limits (this operation, `applyPresetVersion`,

        `restorePresetValue`, a preset re-selection in `updateAccount`) bumps the version, so a form

        opened before it gets 409 `common.version_conflict`.

        When the new rules would already be reached today, the body must carry `acknowledge_reached: true`

        (the dialog of the edit form; `previewAccountRiskRules` tells beforehand), else 409

        `risk.reached_not_acknowledged` and nothing is saved. The rule values belong to the account

        (`accounts` module): each save bumps the account''s limits version and emits

        `account.limits_changed`; the risk module derives the limits from it (ADR-0006) and only then

        sends `limits` to the plugin. Until the derivation is done, `getAccountRisk.limits_pending` is

        true and new entries are skipped with `routing.limits_pending` (exits continue). Audited as

        `risk.rules_changed`. No step-up in V1 (Q35).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRulesRequest'
            examples:
              prop:
                value:
                  version: 4
                  rules:
                    drawdown:
                      type: trailing_eod
                      amount: '2500.00'
                    daily_loss_limit:
                      kind: hard
                      amount: '1000.00'
                    daily_profit_target:
                      amount: '600.00'
                    profit_target_on_reach: notify
                    consistency_threshold_pct: '30'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRiskRules'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` or `risk.reached_not_acknowledged`; nothing saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/RiskRulesRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/risk-rules/preview:
    post:
      tags:
      - risk
      operationId: previewAccountRiskRules
      summary: When each changed rule would take effect and whether it would already be reached (validate only)
      description: Stores nothing and audits nothing. Same validation as `putAccountRiskRules` (same 422 codes).
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRulesRequest'
      responses:
        '200':
          description: The effect of each changed rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRulesPreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/RiskRulesRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications:
    get:
      tags:
      - notifications
      operationId: listNotifications
      summary: The caller's notifications, critical unread first, then newest first, with a cursor
      description: 'One set of notifications per user, shared by the Web and the plugin (Q-S18-4): the same

        `notification_id` and `revision` on both channels. Order: unread `critical` items first, then by

        `updated_at` (last occurrence), newest first, ties by `notification_id`. `next_cursor` is opaque,

        authenticated by the Core (MAC) and bound to the filters (a tampered or mismatching cursor gets

        400, pointer `/query/cursor`). Retention equals the audit''s (24 months; Q-S18-6). Every response

        carries the current unread count, so the bell never counts.

        '
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - unread
          - read
          default: all
      - name: category
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AuditCategory'
      - name: account_id
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/unread-count:
    get:
      tags:
      - notifications
      operationId: getUnreadCount
      summary: Unread count and worst unread severity (bell and shell)
      description: The same pair the adapter protocol 1.3 snapshot carries; authoritative (the client never counts).
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      operationId: markNotificationRead
      summary: Mark one notification read (idempotent)
      description: 'Sets `read_at` and bumps `revision` (so the plugin''s upsert sees it); already read → 200 with the

        item unchanged. Reading never changes or hides the state it reports (a block, a risk level, an out-

        of-sync flag stays visible in banners and badges). A later occurrence of a grouped item makes it

        unread again only when its registry code has `reopen_on_occurrence: true` (Q68 b: the

        `danger` routing codes); otherwise only `count` and `updated_at` change. Emits `notification.read`.

        '
      parameters:
      - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The item and the new unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkReadResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/read:
    post:
      tags:
      - notifications
      operationId: markNotificationsRead
      summary: Mark several notifications read — a list of ids, or everything up to an instant (idempotent)
      description: 'Either `notification_ids` (≤ 200; unknown or foreign ids are ignored, never reported) or `up_to`

        (every unread item, optionally limited by `category` / `account_id`, whose `updated_at` is at or

        before `up_to`, so an item that arrives while the user clicks "mark all" stays unread). Returns the

        new unread count. Emits one `notification.read`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkManyRequest'
            examples:
              all:
                value:
                  up_to: '2026-10-23T14:31:05Z'
      responses:
        '200':
          description: The new unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trades:
    get:
      tags:
      - trades
      operationId: listTrades
      summary: The caller's completed trades, filtered and sorted, with a cursor
      description: 'Filters combine with AND, values in one array with OR (repeat the parameter). `from` / `to` filter

        on the **exit time** (Q53); both are instants and optional (absent = unbounded);

        `from` after `to` gets 400 (pointer `/query/from`). `origin` selects routed / master / manual /

        platform trades; `source_id` selects routed trades of those sources. Trades of archived accounts

        stay listed (`account_deleted`); trades are kept for the life of the user account (S10 AC-3).

        `next_cursor` is opaque, authenticated by the Core (MAC) and bound to the filters and the sort

        (tamper or mismatch → 400, pointer `/query/cursor`). Ties are broken by `trade_id`.

        `getTradesSummary` with the same filters gives the count and total P&L of the whole set.

        '
      parameters:
      - $ref: '#/components/parameters/TradeFrom'
      - $ref: '#/components/parameters/TradeTo'
      - $ref: '#/components/parameters/TradeAccountIds'
      - $ref: '#/components/parameters/TradeSourceIds'
      - $ref: '#/components/parameters/TradeOrigins'
      - $ref: '#/components/parameters/TradeSignalTypes'
      - $ref: '#/components/parameters/TradeRecordedBefore'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - exit_time
          - pnl
          - duration
          default: exit_time
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - trades
      operationId: createManualTrade
      summary: Record a trade the platform did not capture (origin `manual`, S21 AC-3)
      description: 'Idempotent by `Idempotency-Key` (same rules as `createAccount`: same key and body within 24 h →

        200 with the trade created first; different body or after 24 h → 409

        `trades.idempotency_key_reused`; never a second trade). Duration, gross P&L, commission and net

        P&L are computed by the Core (net is the main value; the commission is the typed one, else the

        account floor); MAE / MFE are optional (Q55). The

        account may be active, paused or disabled, not archived. Audited as `trades.manual_created`.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTradeRequest'
            examples:
              buy:
                value:
                  account_id: 0b9f4c1e-7d2a-4e7b-9a52-3c1d8e6f2a10
                  instrument_id: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                  direction: long
                  quantity: 2
                  entry_time: '2026-10-23T13:30:05Z'
                  entry_price: '21234.50'
                  exit_time: '2026-10-23T13:42:35Z'
                  exit_price: '21240.25'
      responses:
        '200':
          description: Replay of a create already done with this key; the trade, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '201':
          description: Created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          description: '`trades.idempotency_key_reused` — nothing created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ManualTradeRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trades/summary:
    get:
      tags:
      - trades
      operationId: getTradesSummary
      summary: Count and total P&L of the whole filtered set (the same figures S22 uses)
      parameters:
      - $ref: '#/components/parameters/TradeFrom'
      - $ref: '#/components/parameters/TradeTo'
      - $ref: '#/components/parameters/TradeAccountIds'
      - $ref: '#/components/parameters/TradeSourceIds'
      - $ref: '#/components/parameters/TradeOrigins'
      - $ref: '#/components/parameters/TradeSignalTypes'
      - $ref: '#/components/parameters/TradeRecordedBefore'
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trades/{trade_id}:
    get:
      tags:
      - trades
      operationId: getTrade
      summary: One trade (detail panel)
      parameters:
      - $ref: '#/components/parameters/TradeId'
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - trades
      operationId: updateManualTrade
      summary: Correct a manual trade (Q56); captured trades are never editable
      description: 'Full replacement of the manual fields, with `row_version` (stale → 409 `common.version_conflict`).

        A captured trade (`origin` ≠ `manual`) gets 409 `trades.not_editable`. Audited as

        `trades.manual_changed` with previous and new values. Check order after authentication, Origin and

        schema: 404 → 409 → 422.

        '
      parameters:
      - $ref: '#/components/parameters/TradeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTradeUpdateRequest'
      responses:
        '200':
          description: Saved and audited (no change → 200, not audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`trades.not_editable` or `common.version_conflict`; nothing saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ManualTradeRejected'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - trades
      operationId: deleteManualTrade
      summary: Delete a manual trade (Q56)
      description: 'The trade leaves the list and the metrics; the audit entry `trades.manual_deleted` keeps its

        values. `row_version` is required (stale → 409 `common.version_conflict`); a captured trade gets

        409 `trades.not_editable`.

        '
      parameters:
      - $ref: '#/components/parameters/TradeId'
      - name: row_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Deleted and audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`trades.not_editable` or `common.version_conflict`; nothing deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trade-preview:
    get:
      tags:
      - trades
      operationId: previewManualTrade
      summary: Duration, commission and net / gross P&L of a manual trade before saving (stateless, Core arithmetic)
      description: 'Stores nothing, audits nothing. Same validation and same 422 codes as `createManualTrade`.

        Without `commission`, it returns the commission the Core would compute (Q71: floor × quantity × 2,

        `configured`; no floor → 0, `none`), so the form shows the value and the user can override it.

        With `commission`, it returns that value (`manual`).

        '
      parameters:
      - name: account_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: instrument_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: direction
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TradeDirection'
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - name: entry_time
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: entry_price
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Price'
      - name: exit_time
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: exit_price
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Price'
      - name: commission
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExcursionInput'
      responses:
        '200':
          description: The computed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualTradePreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ManualTradeRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/performance:
    get:
      tags:
      - performance
      operationId: getPerformance
      summary: Totals and per-trade averages for a period and a set of accounts, split by source and signal type
      description: 'The trade set is exactly `listTrades` with the same `from` / `to` (exit time, Q53) and

        `account_id` filters, restricted to trades recorded at or before `as_of` (S22 AC-2). `as_of` is

        the instant of this computation; pass it as `recorded_before` to `listTrades` /

        `getTradesSummary` to show the same set (a manual edit or delete after `as_of` is the only way

        the two can differ, and it raises `trade.captured` / the audit). Every figure is computed by the

        Core with exact decimals (X-3); the browser does no arithmetic, bar lengths included.

        Rounding: half away from zero (a negative average −12.345 → −12.35, symmetric with positives):

        money averages to 2 decimals; `win_rate` to one decimal (Q-S22-2); `avg_duration_seconds` to whole

        seconds; `bar_ratio` to 4 decimals. Averages are

        absent (UI `—`) when no trade enters them. Totals exist only for P&L and the number of trades;

        time, MAE and MFE are averages only (Q-S22-3).

        Isolation (X-2): an unknown or another user''s `account_id` simply matches nothing, as in

        `listTrades` / `listActivity` (empty totals and groups; never a different status such as 404), so

        the response never reveals whether an account exists. Required test: two users, each filtering by

        the other''s account id, get `trade_count` 0 and no groups (QA Security, 3.4.0 info).

        '
      parameters:
      - $ref: '#/components/parameters/TradeFrom'
      - $ref: '#/components/parameters/TradeTo'
      - $ref: '#/components/parameters/TradeAccountIds'
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - source_signal
          - source
          - signal_type
          default: source_signal
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - total_pnl
          - trade_count
          - avg_pnl
          - win_rate
          default: total_pnl
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aw_session
      description: Server-side session (HttpOnly; Secure; SameSite=Lax; Path=/).
  headers:
    RetryAfter:
      description: Seconds to wait.
      schema:
        type: integer
        minimum: 1
    SessionCookie:
      description: '`__Host-aw_session=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/` (Max-Age only when remember_me).'
      schema:
        type: string
    SessionCookieClear:
      description: Expires the session cookie.
      schema:
        type: string
    SessionAndDeviceCookies:
      description: '`__Host-aw_session` (as SessionCookie) and, when the browser has no valid device cookie of this user,

        `__Host-aw_device=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=34560000` (400 days;

        auth policy §5.2). Only an unknown or revoked value is replaced. A value that is valid for **another**

        user of the same browser is kept, and this user gets their own device row with the same value, so a

        shared browser stays a known device for each of its users.

        '
      schema:
        type: string
    SessionAndDeviceCookiesClear:
      description: Expires the session and device cookies.
      schema:
        type: string
    NoStore:
      description: The response carries a one-time secret; no cache may store it.
      schema:
        type: string
        const: no-store
  parameters:
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChangeId:
      name: change_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated by the client once per create submission; reused on retries (not a secret).
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FirmId:
      name: firm_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PresetVersionId:
      name: preset_version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstrumentIdPath:
      name: instrument_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstrumentIdQuery:
      name: instrument_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TradeId:
      name: trade_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TradeFrom:
      name: from
      in: query
      required: false
      description: Exit time at or after this instant (Q53).
      schema:
        $ref: '#/components/schemas/Timestamp'
    TradeTo:
      name: to
      in: query
      required: false
      description: Exit time before this instant.
      schema:
        $ref: '#/components/schemas/Timestamp'
    TradeAccountIds:
      name: account_id
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/Uuid'
    TradeSourceIds:
      name: source_id
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/Uuid'
    TradeOrigins:
      name: origin
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 4
        items:
          $ref: '#/components/schemas/TradeOrigin'
    TradeRecordedBefore:
      name: recorded_before
      in: query
      required: false
      description: Only trades recorded (captured or entered) at or before this instant — pass `getPerformance.as_of` to see
        exactly the set S22 measured (S22 AC-2).
      schema:
        $ref: '#/components/schemas/Timestamp'
    TradeSignalTypes:
      name: signal_type
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 4
        items:
          $ref: '#/components/schemas/AuditSignalType'
  responses:
    Unauthenticated:
      description: '`auth.unauthenticated` (no session, or expired). Web redirects to sign-in with `?reason=session_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: '`auth.rate_limited`.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpFailed:
      description: '`auth.step_up_required` (the body has no `step_up` proof: call `requestStepUp`, then retry with

        `step_up: { challenge_id, code }`), `auth.code_invalid` (the proof is wrong, expired, used, bound to

        another session, action or target: one code for all), or `common.forbidden_origin`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error:
                  code: auth.step_up_required
            invalid:
              value:
                error:
                  code: auth.code_invalid
    CodeInvalid:
      description: '`auth.code_invalid` — wrong, expired, used, invalidated after 5 wrong attempts, unknown or forged challenge
        (one code for all; auth policy §3).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CodeInvalidOrOrigin:
      description: '`auth.code_invalid` (as CodeInvalid) or `common.forbidden_origin`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`auth.forbidden` (not a platform admin); or `common.forbidden_origin` on state-changing requests.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrStepUp:
      description: '`auth.forbidden` (not a platform admin; checked first, so a non-admin never gets a step-up prompt),

        `auth.step_up_required`, `auth.code_invalid` (as StepUpFailed), or `common.forbidden_origin`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrigin:
      description: '`common.forbidden_origin` — state-changing `/api/v1` request without a matching `Origin` header.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: '`common.invalid_request` — the request does not match its schema; `error.pointer` locates the first offending
        field.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            body:
              value:
                error:
                  code: common.invalid_request
                  pointer: /name
            path:
              value:
                error:
                  code: common.invalid_request
                  pointer: /path/source_id
    InternalError:
      description: '`common.internal` — unexpected failure; the body carries no detail.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`common.not_found` — also returned for resources of another user (never 403, so existence is not revealed).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvitationInvalid:
      description: '`auth.invitation_invalid` — one code for unknown, used, expired or revoked.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountWriteConflict:
      description: "Nothing saved. Codes (pointer where shown):\n- `accounts.idempotency_key_reused` (create only; same key\
        \ with a different body, or reuse after 24 h; never a second account);\n- `common.version_conflict` (update; stale\
        \ `row_version`, reload);\n- `accounts.name_taken` — `/display_name` (case-insensitive, among the caller's live accounts);\n\
        - `accounts.platform_account_taken` — `/binding` (already bound to another of the caller's\n  accounts; a platform\
        \ account of another user is never reported as taken, see 422);\n- `accounts.binding_open_position` — `/binding` (update;\
        \ Q38);\n- `accounts.rule_version_changed` — `error.current_rule_version_id` (an `opt_ins` choice names a\n  rule\
        \ version that is no longer the one in force for the selection).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            name_taken:
              value:
                error:
                  code: accounts.name_taken
                  pointer: /display_name
            rule_version_changed:
              value:
                error:
                  code: accounts.rule_version_changed
                  current_rule_version_id: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d
    AccountWriteRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers:\n- `accounts.opt_in_required` — `/opt_ins/automation`\
        \ or `/opt_ins/copy`;\n- `accounts.opt_in_not_applicable` — `/opt_ins/<kind>` (the kind is `not_required` for the\n\
        \  selection, or `opt_ins` on update of a real account; on create a real account with `opt_ins`\n  is a schema error,\
        \ 400); the client refetches and drops the section;\n- `accounts.max_position_exceeds_preset` — `/max_position_qty`\
        \ (above the preset maximum);\n- `accounts.preset_version_unknown` — `/preset_version_id` (unknown, withdrawn, or\
        \ a superseded\n  version on create);\n- `accounts.firm_platform_required` / `accounts.firm_platform_unknown` — `/firm_platform`;\n\
        - `accounts.platform_account_unknown` — `/binding` (no such platform account on a connection of\n  the caller, or\
        \ the connection is unpaired; identical for another user's connection);\n- `accounts.platform_account_kind_not_allowed`\
        \ — `/binding` (`live` or `unknown` kind outside\n  production; ADR-0004 §8);\n- `accounts.profile_size_required`\
        \ / `accounts.profile_size_invalid` — `/profile_size` (create of\n  an account whose size is a tie between two standard\
        \ sizes; real, or prop outside the standard\n  list, Q60 / Q73 b);\n- `accounts.evaluation_not_applicable` — `/evaluation_start`\
        \ or `/evaluation_earned_before`, the\n  first one sent (create of an account without an evaluation target);\n- `presets.required_field_unresolved`\
        \ — `/rule_values/<field>` or `/max_position_qty` (a required\n  rule field of the preset is not confirmed and the\
        \ body does not resolve it; S16 AC-6);\n- `presets.use_apply_version` — `/preset_version_id` (update to a newer version\
        \ of the same\n  preset; use `applyPresetVersion`);\n- `accounts.rule_values_without_selection_change` — `/rule_values`\
        \ (update with the same preset\n  selection; edit rules with `putAccountRiskRules`).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            opt_in_required:
              value:
                error:
                  code: accounts.opt_in_required
                  pointer: /opt_ins/automation
    DistanceRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers (`/query/...` on the preview):\n- `profiles.distance_below_one_tick`\
        \ — `/stop_distance` or `/target_distance` (zero, or less than\n  one tick after conversion);\n- `profiles.distance_too_large`\
        \ — `/stop_distance` or `/target_distance` (more than 10 000 ticks).\nA value whose shape does not fit its unit (fractional\
        \ ticks, dollars with more than 2 decimals)\nis a schema error: 400 `common.invalid_request` with the pointer.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            below_one_tick:
              value:
                error:
                  code: profiles.distance_below_one_tick
                  pointer: /stop_distance
    RiskRulesRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers (under `/rules/...`):\n- `risk.required_value_unresolved`\
        \ — the field (a required preset value is not confirmed and not resolved);\n- `risk.daily_loss_required` — `/rules/daily_loss_limit`\
        \ (prop account whose preset does not say\n  \"none\"; Q47);\n- `risk.flatten_requires_enforcement` — `/rules/profit_target_on_reach`\
        \ (`flatten_and_block` while\n  enforcement is off; Q49);\n- `risk.reset_not_editable` — `/rules/trading_day_reset`\
        \ (real accounts use the CME session close);\n- `risk.consistency_not_applicable` — `/rules/consistency_threshold_pct`\
        \ (real account, or the\n  preset has no consistency rule);\n- `risk.amount_invalid` — the field (zero where a positive\
        \ amount is required).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            flatten:
              value:
                error:
                  code: risk.flatten_requires_enforcement
                  pointer: /rules/profit_target_on_reach
    RouteRejected:
      description: "Valid shape, refused by a rule; nothing created. Codes and pointers:\n- `routing.source_unknown` — `/source_id`\
        \ (unknown or another user's; identical);\n- `routing.source_revoked` — `/source_id`;\n- `routing.account_unknown`\
        \ — `/account_id` (unknown, archived or another user's; identical);\n- `routing.account_manual_only` — `/account_id`\
        \ (S16 AC-7);\n- `routing.automation_not_accepted` — `/account_id` (automated source; the account's automation\n \
        \ opt-in is `declined` or `pending_review`);\n- `routing.platform_unbound` — `/account_id` (Q37).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_accepted:
              value:
                error:
                  code: routing.automation_not_accepted
                  pointer: /account_id
    ManualTradeRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers:\n- `trades.exit_before_entry` — `/exit_time`\
        \ (exit not after entry);\n- `trades.in_future` — `/entry_time` or `/exit_time`;\n- `trades.not_tick_multiple` — `/entry_price`\
        \ or `/exit_price` (prices must be whole ticks of the\n  instrument; unlike profile distances they are never rounded);\n\
        - `trades.account_unknown` — `/account_id` (unknown, archived or another user's; identical);\n- `trades.instrument_unknown`\
        \ — `/instrument_id` (not enabled).\nOn the preview the pointers are `/query/<name>`.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            exit_before_entry:
              value:
                error:
                  code: trades.exit_before_entry
                  pointer: /exit_time
  schemas:
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    Timestamp:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$
    Locale:
      type: string
      enum:
      - pt-BR
      - en
    TimeZone:
      type: string
      description: IANA time zone name, validated by the Core against its tz database.
      pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
      maxLength: 64
    DisplayName:
      type: string
      minLength: 1
      maxLength: 60
      description: 'A user-chosen name (sources, connections, and every other field that uses this schema).

        The Core trims leading and trailing white space before validating and storing, and checks the

        1–60 length on the TRIMMED value. The schema''s `minLength` / `maxLength` are the client-side

        form: clients send trimmed names (Crivo R2, the approved S3 implementation). A name that is blank after trimming,

        contains a control character (Unicode Cc) or contains a token-shaped part (`aw[kd]_…`, a source

        or device token, ADR-0003 §7) is refused with 400 `common.invalid_request` and the field''s

        pointer (e.g. `/name`). Nothing is stored (5.2.0, Crivo L1, Esquadro).

        '
    TokenBody:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          maxLength: 128
    ErrorCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            pointer:
              type: string
              maxLength: 256
              description: JSON pointer to the offending request field.
            retry_after_s:
              type: integer
              minimum: 1
            current_rule_version_id:
              $ref: '#/components/schemas/Uuid'
    IngressAccepted:
      type: object
      additionalProperties: false
      required:
      - status
      - instruction_id
      properties:
        status:
          type: string
          enum:
          - accepted
          - duplicate
        instruction_id:
          $ref: '#/components/schemas/Uuid'
    IngressRejected:
      type: object
      additionalProperties: false
      required:
      - status
      - error
      properties:
        status:
          type: string
          const: rejected
        error:
          type: object
          additionalProperties: false
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            pointer:
              type: string
              maxLength: 256
    Me:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - locale
      - time_zone
      - is_platform_admin
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        locale:
          $ref: '#/components/schemas/Locale'
        time_zone:
          $ref: '#/components/schemas/TimeZone'
        is_platform_admin:
          type: boolean
    LoginResult:
      type: object
      additionalProperties: false
      required:
      - user
      - new_device
      properties:
        user:
          $ref: '#/components/schemas/Me'
        new_device:
          type: boolean
          description: True when this sign-in registered a new device (the notice e-mail was sent; never on sign-up).
    CodeChannel:
      type: string
      enum:
      - email
      - whatsapp
      description: '`whatsapp` is accepted by the schema from 2.0.0 and becomes usable with S3b (U17).'
    ChallengeId:
      type: string
      description: Sealed challenge token (auth policy §3); opaque to clients. Never logged.
      pattern: ^[A-Za-z0-9_-]{16,256}$
    OneTimeCode:
      type: string
      description: 'The code as typed. The Core normalizes it per the code format (U16; format 1: trim, drop spaces and `-`,

        uppercase, O→0, I/L→1, then exactly 8 Crockford Base32 characters). Within 32 characters, non-ASCII or

        malformed input is a wrong attempt (`auth.code_invalid`); more than 32 characters is 400

        `common.invalid_request`, which counts no attempt and reveals nothing. Never logged.

        '
      minLength: 1
      maxLength: 32
    ChallengeIssued:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - expires_at
      - resend_after_s
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeId'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        resend_after_s:
          type: integer
          minimum: 0
          description: Seconds until `resendCode` is accepted (60 after a send).
    StepUpAction:
      type: string
      description: "Actions that need a step-up code (auth policy §6.2). The user's three actions are\n`account_opt_in_accept`\
        \ / `account_create_opt_in_accept`, `connection_unpair`, and the channel change\n(its own flow). **Included pending\
        \ Q35:** `source_create`, `source_rotate`, `connection_create`,\n`pairing_code_new`, `admin_invitation_create` (the\
        \ policy's security musts), `route_enable`,\n`account_binding_change` (QA Security M1/L1 on 2.4.0, same setting `step_up.q35_persistence_actions`,\n\
        default on, conditional). The enum is a superset so it never has to change: whether those\noperations **require**\
        \ the proof is a Core setting (`step_up.q35_persistence_actions`, default on),\nshown as `x-step-up: conditional`.\
        \ The setting is server configuration only (never an admin/UI/DB\ntoggle); missing or invalid means on (fail-closed).\
        \ If the user rejects them, the setting goes off and\nthe values stay valid but unused. Enforcement-off / max-position\
        \ values are added when Q35 decides.\n- `source_create`, `source_rotate` (target = source), `connection_create`, `pairing_code_new`\
        \ (target = connection),\n  `connection_unpair` (target = connection), `account_opt_in_accept` (target = account;\
        \ automation or copy,\n  setAccountOptIn, applyPresetVersion and the S5/S7 update operations), `account_create_opt_in_accept`\
        \ (no\n  target; S5 create with an accepted opt-in), `admin_invitation_create`.\n- `route_enable` (target = account;\
        \ createRoute/updateRoute switching any route on, Q35 / S3 AC-10).\n- `account_binding_change` (target = account;\
        \ updateAccount changing the platform binding of an account that\n  receives automation: opt-in accepted or an active\
        \ automated route).\n- `account_sync_clear` (target = account; `clearAccountSync`; user decision Q95, 2026-10-24;\
        \ in the Q35 set).\n- `trading_day_restart` (target = account; `restartTradingDayCount`, HTTP 5.4.0; user decision\
        \ Q96; in the Q35\n  set).\n"
      enum:
      - source_create
      - source_rotate
      - connection_create
      - pairing_code_new
      - connection_unpair
      - account_opt_in_accept
      - account_create_opt_in_accept
      - admin_invitation_create
      - route_enable
      - account_binding_change
      - account_sync_clear
      - trading_day_restart
    StepUpProof:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - code
      description: Step-up proof carried in the body of a step-up operation; consumed in the action's transaction.
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeId'
        code:
          $ref: '#/components/schemas/OneTimeCode'
    StepUpBody:
      type: object
      additionalProperties: false
      description: Body of a step-up operation that has no other input.
      properties:
        step_up:
          $ref: '#/components/schemas/StepUpProof'
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - first_seen_at
      - last_seen_at
      - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
          maxLength: 128
          description: Coarse browser and OS family from the User-Agent, e.g. "Chrome on Windows".
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: True for the device of this request.
    ChannelChange:
      type: object
      additionalProperties: false
      required:
      - id
      - channel
      - status
      - masked_new_value
      - codes
      - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        channel:
          $ref: '#/components/schemas/CodeChannel'
        status:
          type: string
          enum:
          - awaiting_codes
          - on_hold
          - completed
          - cancelled
          - expired
          description: '`on_hold` = every code confirmed, the change waits until `hold_until` (auth policy §9 hold; §7 M2
            if adopted) and can be cancelled.'
        masked_new_value:
          type: string
          maxLength: 64
        codes:
          type: array
          description: One entry per code of the flow.
          items:
            type: object
            additionalProperties: false
            required:
            - role
            - challenge_id
            - confirmed
            properties:
              role:
                type: string
                enum:
                - current_value
                - new_value
                - other_channel
              challenge_id:
                $ref: '#/components/schemas/ChallengeId'
              confirmed:
                type: boolean
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        hold_until:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            status:
              const: on_hold
        then:
          required:
          - hold_until
    SecurityState:
      type: object
      additionalProperties: false
      required:
      - email
      - session
      - channel_change_allowed_at
      properties:
        email:
          type: string
          format: email
        whatsapp:
          type: string
          description: Confirmed WhatsApp number (E.164), absent until added (S3b).
          pattern: ^\+[1-9][0-9]{7,14}$
        channel_change_allowed_at:
          description: When a new channel change is accepted (24 h after the last one; auth policy §7). In the past when allowed
            now.
          $ref: '#/components/schemas/Timestamp'
        pending_channel_change:
          $ref: '#/components/schemas/ChannelChange'
        session:
          type: object
          additionalProperties: false
          required:
          - persistent
          - idle_timeout_s
          - absolute_timeout_s
          - idle_expires_at
          - absolute_expires_at
          properties:
            persistent:
              type: boolean
            idle_timeout_s:
              type: integer
              description: 43200 (12 h) or 604800 (7 d) — Q21.
            absolute_timeout_s:
              type: integer
              description: 86400 (24 h) or 2592000 (30 d) — Q21.
            idle_expires_at:
              $ref: '#/components/schemas/Timestamp'
            absolute_expires_at:
              $ref: '#/components/schemas/Timestamp'
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - status
      - created_at
      - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - status
      - whatsapp_verified
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - active
          - closed
        whatsapp_verified:
          type: boolean
        is_platform_admin:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_sign_in_at:
          $ref: '#/components/schemas/Timestamp'
    Source:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - source_type
      - is_automated
      - status
      - key_id
      - masked_url
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/DisplayName'
        source_type:
          type: string
          enum:
          - tradingview
        is_automated:
          type: boolean
          description: 'Derived by the Core from `source_type` (never stored, never set by the client): true when

            instructions from this source are subject to the per-account `automation` opt-in (O1).

            `tradingview` is automated. Clients must use this flag, not their own list of types.

            '
        status:
          type: string
          enum:
          - active
          - revoked
        key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
        masked_url:
          type: string
          description: '''https://<host>/ingress/v1/tradingview/awk_<key_id>_…'' — never the secret.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        rotated_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
        last_received_at:
          $ref: '#/components/schemas/Timestamp'
    SourceWithUrl:
      type: object
      additionalProperties: false
      required:
      - source
      - webhook_url
      properties:
        source:
          $ref: '#/components/schemas/Source'
        webhook_url:
          type: string
          description: Full URL with the secret token. Returned only by create/rotate; never logged.
          pattern: ^https://[^/]+/ingress/v1/tradingview/awk_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$
    PairingCode:
      type: object
      additionalProperties: false
      required:
      - pairing_code
      - expires_at
      properties:
        pairing_code:
          type: string
          description: Display form, returned once per code.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    VisibleAccount:
      type: object
      additionalProperties: false
      required:
      - platform_account
      - kind
      - oco_location
      properties:
        platform_account:
          type: string
          maxLength: 128
        kind:
          type: string
          enum:
          - simulation
          - playback
          - live
          - unknown
        oco_location:
          type: string
          enum:
          - local
          - server
          - unknown
        account_id:
          description: The All Win account bound to it, if any (S5).
          $ref: '#/components/schemas/Uuid'
    Connection:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - status_changed_at
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/DisplayName'
        status:
          type: string
          enum:
          - awaiting_pairing
          - connected
          - disconnected
          - outdated
          - unpaired
        status_changed_at:
          description: When `status` last changed (equals `created_at` until the first change).
          $ref: '#/components/schemas/Timestamp'
        adapter_type:
          type: string
        adapter_version:
          type: string
        instance_id:
          description: Plugin instance id reported at pairing (D6). Absent until paired.
          $ref: '#/components/schemas/Uuid'
        instance_name:
          type: string
        paired_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        pairing_code_expires_at:
          description: Present while a code is active (the code itself is never re-shown).
          $ref: '#/components/schemas/Timestamp'
        repairing_pending:
          type: boolean
          description: True while a "move to another machine" code is active and the current instance still works.
        visible_accounts:
          type: array
          items:
            $ref: '#/components/schemas/VisibleAccount'
        open_position_accounts:
          type: array
          description: Platform accounts with an open position (for the unpair confirmation).
          items:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        unpaired_at:
          $ref: '#/components/schemas/Timestamp'
        disconnect_reason:
          type: string
          enum:
          - user
          - network
          - outdated
          - unpaired
          description: Why the connection is not connected (1.3 close 4100 = user). Present when status is disconnected, outdated
            or unpaired.
    Event:
      description: SSE payloads (field `data`). `type` equals the SSE `event` name; `at` is when the event happened (server
        clock).
      oneOf:
      - $ref: modules/accounts.yaml#/components/schemas/AccountChangedEvent
      - $ref: modules/accounts.yaml#/components/schemas/AccountArchivedEvent
      - $ref: modules/routing.yaml#/components/schemas/RouteChangedEvent
      - $ref: modules/audit.yaml#/components/schemas/AuditEntryRecordedEvent
      - $ref: modules/presets.yaml#/components/schemas/PresetVersionAvailableEvent
      - $ref: modules/risk.yaml#/components/schemas/RiskStateChangedEvent
      - $ref: modules/notifications.yaml#/components/schemas/NotificationCreatedEvent
      - $ref: modules/notifications.yaml#/components/schemas/NotificationUpdatedEvent
      - $ref: modules/notifications.yaml#/components/schemas/NotificationReadEvent
      - $ref: modules/trades.yaml#/components/schemas/TradeCapturedEvent
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - status
        properties:
          type:
            const: connection.status_changed
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          status:
            type: string
            enum:
            - awaiting_pairing
            - connected
            - disconnected
            - outdated
            - unpaired
          disconnect_reason:
            type: string
            enum:
            - user
            - network
            - outdated
            - unpaired
            description: Why the connection is not connected (1.3 close 4100 = user). Present when status is disconnected,
              outdated or unpaired.
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - instance_name
        - visible_accounts
        properties:
          type:
            const: connection.paired
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          instance_name:
            type: string
          visible_accounts:
            type: array
            items:
              $ref: '#/components/schemas/VisibleAccount'
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - reason
        properties:
          type:
            const: connection.pairing_code_invalidated
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          reason:
            type: string
            enum:
            - superseded
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - reason
        properties:
          type:
            const: session.ended
          at:
            $ref: '#/components/schemas/Timestamp'
          reason:
            type: string
            enum:
            - logout
            - expired
            - signed_out_everywhere
            - device_revoked
            - channel_changed
    AccountName:
      type: string
      minLength: 1
      maxLength: 80
      description: Trimmed by the Core (NFC); must not be blank. Unique per user among live accounts, case-insensitive.
    AccountKind:
      type: string
      enum:
      - prop
      - real
    LifecycleState:
      type: string
      enum:
      - active
      - paused
      - disabled
    SizeAmount:
      type: string
      description: 'Account size in `currency` (decimal string, at most 2 decimals, > 0). Zero fails the pattern: 400 `common.invalid_request`.'
      pattern: ^([1-9][0-9]{0,11}(\.[0-9]{1,2})?|0\.([1-9][0-9]?|0[1-9]))$
    MaxPositionQty:
      type: integer
      minimum: 1
      maximum: 10000
      description: Maximum position in contracts, one number per account in V1 (Q-A1). Mandatory (S5 AC-3).
    Multiplier:
      type: integer
      minimum: 1
      maximum: 1000
      description: Whole number ≥ 1 (S5 AC-5); a fraction or zero gets 400 `common.invalid_request` with the pointer.
    FirmPlatform:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,31}$
      description: Code of the firm-side platform when the preset has platform-specific rules (e.g. `rithmic`, `tradovate`);
        the options come from the preset version (S16). Not the execution platform.
    ManualText:
      type: string
      minLength: 1
      maxLength: 80
      description: Free text (trimmed by the Core) for prop accounts without a preset.
    PlatformAccountRef:
      type: object
      additionalProperties: false
      required:
      - connection_id
      - platform_account
      description: A platform account reported by one of the caller's connections (`Connection.visible_accounts`).
      properties:
        connection_id:
          $ref: '#/components/schemas/Uuid'
        platform_account:
          type: string
          minLength: 1
          maxLength: 128
    AccountBinding:
      type: object
      additionalProperties: false
      required:
      - connection_id
      - connection_name
      - connection_status
      - platform_account
      - kind
      - oco_location
      description: The bound platform account, as last reported by the plugin. `oco_location` `unknown` is treated as `local`
        (S9 AC-4).
      properties:
        connection_id:
          $ref: '#/components/schemas/Uuid'
        connection_name:
          $ref: '#/components/schemas/DisplayName'
        connection_status:
          type: string
          enum:
          - awaiting_pairing
          - connected
          - disconnected
          - outdated
          - unpaired
        platform_account:
          type: string
          maxLength: 128
        kind:
          type: string
          enum:
          - simulation
          - playback
          - live
          - unknown
        oco_location:
          type: string
          enum:
          - local
          - server
          - unknown
        bound_at:
          $ref: '#/components/schemas/Timestamp'
    AccountOptIns:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      properties:
        automation:
          $ref: '#/components/schemas/OptInState'
        copy:
          $ref: '#/components/schemas/OptInState'
    Account:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - display_name
      - size_amount
      - currency
      - multiplier
      - max_position_qty
      - lifecycle_state
      - opt_ins
      - has_open_position
      - sync
      - row_version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          $ref: '#/components/schemas/AccountName'
        firm_name:
          type: string
          maxLength: 120
          description: Prop only. From the preset when `preset_version_id` is set, else the manual text.
        plan_name:
          type: string
          maxLength: 120
          description: Prop only (as `firm_name`).
        phase:
          type: string
          maxLength: 80
          description: 'Prop only: the preset phase code (`evaluation`, `funded`, `live`) or the manual text.'
        preset_update_available:
          type: boolean
          description: Prop with a preset only — a newer version of the account's preset exists (list link "Preset novo";
            details in `getAccountPreset`).
        firm_id:
          description: Prop with a preset only (S16 catalog).
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          description: Prop with a preset only. The version applied to this account; a newer one is applied only by the user
            (S16 AC-3).
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217; 'USD' in V1.
        multiplier:
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        binding:
          description: Absent when the account is not bound; an unbound account is never routed (Q37).
          $ref: '#/components/schemas/AccountBinding'
        opt_ins:
          $ref: '#/components/schemas/AccountOptIns'
        commission_per_contract_side:
          description: The account's commission floor per contract and side (absent = none).
          $ref: '#/components/schemas/MoneyAmount'
        evaluation_start:
          type: string
          format: date
          description: Prop accounts in an evaluation phase (S13b).
        evaluation_earned_before:
          $ref: '#/components/schemas/MoneyAmount'
        has_open_position:
          type: boolean
          description: Last known from the platform (gateway); false when unbound. Used for the lifecycle and delete messages.
        sync:
          $ref: '#/components/schemas/AccountSync'
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          description: Only in the idempotent replay of a create whose account was archived since; every other read of an
            archived account is 404.
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            kind:
              const: prop
        then:
          required:
          - firm_name
          - plan_name
          - phase
        else:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - firm_id
            - required:
              - preset_version_id
            - required:
              - firm_platform
    AccountSync:
      type: object
      additionalProperties: false
      required:
      - state
      - version
      - observable
      - reasons
      - reasons_total
      description: 'S11 (ADR-0004 §6, Q14). The Core''s view of the account''s synchronization. `out_of_sync` is sticky

        until the user clears it (`clearAccountSync`); while out of sync, entries are refused

        (`routing.out_of_sync`) and exits still pass (P1, Q75). `in_sync` ⇔ `reasons` and

        `resolved_reasons` empty. `out_of_sync` always has at least one reason, active or resolved. An

        account can be `out_of_sync` with every reason resolved: the Core removed the cause, and the user

        still has to clear (ADR-0004 §6.1).

        **Overflow (Crivo R2):** the Core keeps every reason. The response lists at most 32 of each kind,

        the most severe first and, within a code, the newest first, and `reasons_total` /

        `resolved_total` give the full counts. The clear''s `expected_version` covers all of them, the

        hidden ones included. A reason added after the user''s view bumps `version`, so it is never cleared

        unseen. An unprotected-exposure reason (`flatten_failed_unprotected`, `bracket_double_fill`,

        `bracket_incomplete`) is never left out of the 32. Changes reach the client as

        `account.changed`. Not part of `row_version`: the Core changes it, the user never edits it.

        '
      properties:
        state:
          type: string
          enum:
          - in_sync
          - out_of_sync
        version:
          type: integer
          minimum: 1
          description: Bumps on every change of `state`, `reasons` or `resolved_reasons`; `clearAccountSync.expected_version`.
        flagged_at:
          description: When the account last became `out_of_sync`. Present only when out of sync.
          $ref: '#/components/schemas/Timestamp'
        observable:
          type: boolean
          description: 'The LIVE condition only (Crivo R1 on r5): false while the Core cannot observe the account right now:
            the adapter session is down, a snapshot reports the broker connection lost (`connected: false`), or the reconnect
            check has not finished. The mere presence of a reason such as `sync.bracket_integrity_unknown` never makes it
            false: once observation resumes, that reason stays active but no longer blocks a clear (from `welcome` until the
            Core has evaluated the reconnect snapshot and the replayed reports, ADR-0004 §4 step 3 / §6.1 r5; S11 AC-5 iv,
            "Integridade do bracket desconhecida"). False for an unbound account. A clear is refused while it is false (Q83
            a).'
        reasons:
          type: array
          maxItems: 32
          description: Active reasons, most severe first (`SyncReasonCode` order). At most one active reason per code and
            instrument (symbol + contract month) or command (the Core's dedupe key), so two rejected commands are two reasons.
          items:
            $ref: '#/components/schemas/SyncReason'
        reasons_total:
          type: integer
          minimum: 0
          description: All active reasons; greater than the length of `reasons` only on overflow.
        positions:
          type: array
          maxItems: 64
          description: Open positions from the last evaluated snapshot, with their live All Win protection, for the clear
            confirmation (Vigia L2). Empty when flat; absent when the account was never observed.
          items:
            type: object
            additionalProperties: false
            required:
            - instrument_symbol
            - contract_month
            - position
            - protection
            properties:
              instrument_symbol:
                type: string
                pattern: ^[A-Z0-9]{1,10}$
              contract_month:
                type: string
                pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
              position:
                type: integer
                minimum: -10000
                maximum: 10000
                not:
                  const: 0
                description: Signed contracts.
              protection:
                type: string
                enum:
                - full
                - partial
                - none
                - unknown
                description: 'Live All Win stop/target protection: `full` = every contract covered by a working stop; `partial`
                  = some; `none`; `unknown` = orders in an unknown state.'
              as_of:
                $ref: '#/components/schemas/Timestamp'
        resolved_total:
          type: integer
          minimum: 0
          description: All resolved reasons; greater than the length of `resolved_reasons` only on overflow.
        resolved_reasons:
          type: array
          maxItems: 32
          description: Reasons the Core removed while the account stays out of sync (shown as history in the alert). Only
            the Core resolves a reason. They survive a new flag and are emptied only by the user's clear.
          items:
            $ref: '#/components/schemas/SyncReason'
      allOf:
      - if:
          properties:
            state:
              const: in_sync
        then:
          properties:
            reasons:
              maxItems: 0
            resolved_reasons:
              maxItems: 0
            reasons_total:
              const: 0
            resolved_total:
              const: 0
          not:
            required:
            - flagged_at
        else:
          required:
          - flagged_at
          anyOf:
          - properties:
              reasons:
                minItems: 1
          - properties:
              resolved_reasons:
                minItems: 1
            required:
            - resolved_reasons
    SyncReasonCode:
      type: string
      enum:
      - sync.flatten_failed_unprotected
      - sync.bracket_double_fill
      - sync.bracket_incomplete
      - sync.bracket_integrity_unknown
      - sync.command_unknown
      - sync.position_changed
      - sync.snapshot_mismatch
      - sync.command_partially_filled
      - sync.command_rejected
      - sync.command_expired
      - sync.command_undelivered
      - sync.cancel_failed
      - sync.ambiguous_reference
      - sync.external_activity
      - sync.fill_corrected
      - sync.simulation_reset
      - sync.disconnected_in_trade
      - sync.disconnected_by_user
      - sync.connection_unpaired
      - sync.account_not_found_after_repair
      - sync.bracket_orphan_leg
      description: "Stable reason codes (ADR-0004 §6/§6.1; the same codes as the adapter protocol `sync_reasons`).\nThe enum\
        \ order is the display order, most severe first. Unprotected or unexpected exposure comes\nfirst, then unknown state,\
        \ then a lost or failed command, then a discontinuity or disconnect, and\nlast the informational orphan-leg cancel.\
        \ Clients render an unknown code with a generic text\n(same rule as the notification registry).\nCanon: ADR-0004 §6\
        \ \"sync reason\" column (r5) and the protocol's `reason-codes.md`; 21 codes. A new\ncode is a minor version here\
        \ and in the protocol. `flatten_failed_unprotected` (5.3.0, U19,\nEsmeril M1; the 21st code, confirmed by Esquadro;\
        \ producer: the gateway, from the flatten's rejected/unknown report and the protection legs it cancelled) is a flatten\
        \ of ANY origin that failed after\ncancelling protection while the position stays open with all or part of its protection\
        \ lost.\nThe origins are close or reverse (including Q75), the Q27 orphan-leg flatten, and local\nenforcement (S15).\
        \ It is the only sync reason besides `bracket_double_fill` that is critical. A\nfailed flatten with the protection\
        \ intact is `command_rejected` (danger). The codes added in r5:\n- `command_unknown`: a command whose status ended\
        \ `unknown`;\n- `command_rejected`: a command rejected, including a flatten or cancel whose cancel failed\n  (`order.cancel_failed`);\
        \ the adapter's code is in `adapter_reason_code`. A\n  `command.position_changed` gives the more specific `position_changed`,\
        \ and so does a\n  `command.nothing_to_reduce` against an expected position that is not flat (the position changed\n\
        \  under the reduce: the same fact as the U13 guard);\n- `command_expired`: expired at the adapter or in the Core\
        \ (`expired_by`);\n- `command_partially_filled`: partially filled without completion before the order's end of life;\n\
        - `snapshot_mismatch`: a reconnect or periodic snapshot differs (`snapshot_trigger`);\n- `external_activity`: master-replication\
        \ destinations only; TradingView-only destinations are\n  audited only (T3);\n- `fill_corrected`: an amend or remove\
        \ after which the expected state differs, including an amend\n  or remove of an add the Core does not know;\n- `connection_unpaired`\
        \ (Q18);\n- `ambiguous_reference` (`order.ambiguous_reference`);\n- `cancel_failed`: a cancel the adapter started\
        \ by itself (orphan-order protection), with no\n  command; a failed cancel inside a command is `command_rejected`;\n\
        - `disconnected_in_trade`: a disconnect with a position or a command in flight.\n"
    SyncReason:
      type: object
      additionalProperties: false
      required:
      - code
      - detected_at
      description: One reason, with the facts the Core holds. The platform's native text is never included (it may contain
        account data).
      properties:
        code:
          $ref: '#/components/schemas/SyncReasonCode'
        detected_at:
          $ref: '#/components/schemas/Timestamp'
        resolved_at:
          description: Only in `resolved_reasons`.
          $ref: '#/components/schemas/Timestamp'
        instrument_symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
          description: The instrument as the gateway knows it from the wire (protocol `symbol`), e.g. `MNQ` (5.3.0, Bigorna).
            Present whenever the reason concerns one instrument. The gateway has no catalog id, so `instrument_id` is present
            only when the Core resolved it.
        contract_month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: 'With `instrument_symbol`: the protocol `contract_month` (YYYY-MM).'
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        instruction_id:
          description: The instruction behind the missed, rejected, expired or partial command.
          $ref: '#/components/schemas/Uuid'
        command_id:
          $ref: '#/components/schemas/Uuid'
        expected_position:
          type: integer
          minimum: -10000
          maximum: 10000
          description: 'Signed contracts the Core expected (snapshot mismatch, disconnect: the last known).'
        reported_position:
          type: integer
          minimum: -10000
          maximum: 10000
          description: Signed contracts the platform reported.
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
          description: 'With `command_partially_filled`: the ordered quantity.'
        filled_qty:
          type: integer
          minimum: 0
          maximum: 10000
          description: 'With `command_partially_filled`: the filled quantity.'
        adapter_reason_code:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          description: 'With `command_rejected` / `command_expired` / `cancel_failed`: the adapter''s stable reason code (protocol
            `reason-codes.md`, e.g. `order.cancel_failed`). Rendered as a code, never as platform text.'
        snapshot_trigger:
          type: string
          enum:
          - reconnect
          - periodic
          description: With `snapshot_mismatch`.
        expired_by:
          type: string
          enum:
          - core
          - adapter
          description: With `command_expired`.
        core_action:
          $ref: '#/components/schemas/SyncCoreAction'
    SyncCoreAction:
      type: object
      additionalProperties: false
      required:
      - kind
      description: What All Win did automatically for this reason, exactly as done (S11 AC-5 i, iii; vision §8). Absent when
        it did nothing.
      properties:
        kind:
          type: string
          enum:
          - orphan_orders_cancelled
          - orphan_position_flattened
        cancelled_orders:
          type: array
          maxItems: 20
          description: With `orphan_orders_cancelled`.
          items:
            type: object
            additionalProperties: false
            required:
            - child_role
            properties:
              child_role:
                type: string
                enum:
                - stop
                - target
              price:
                $ref: '#/components/schemas/Price'
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
        flattened_qty:
          type: integer
          minimum: 1
          maximum: 10000
          description: With `orphan_position_flattened`.
        flattened_side:
          type: string
          enum:
          - long
          - short
          description: With `orphan_position_flattened`.
        fill_price:
          $ref: '#/components/schemas/Price'
      allOf:
      - if:
          properties:
            kind:
              const: orphan_orders_cancelled
        then:
          required:
          - cancelled_orders
          not:
            anyOf:
            - required:
              - flattened_qty
            - required:
              - flattened_side
            - required:
              - fill_price
        else:
          required:
          - flattened_qty
          - flattened_side
          not:
            required:
            - cancelled_orders
    AccountList:
      type: object
      additionalProperties: false
      required:
      - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - display_name
      - max_position_qty
      description: '`kind: real` → `size_amount` required; no prop fields; no `opt_ins`.

        `kind: prop` → either `preset_version_id` (+ `firm_platform` when the preset requires it; firm,

        plan, phase and size then come from the preset and must be absent) or all of `firm_name`,

        `plan_name`, `phase`, `size_amount` (manual).

        '
      properties:
        kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          $ref: '#/components/schemas/AccountName'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        firm_name:
          $ref: '#/components/schemas/ManualText'
        plan_name:
          $ref: '#/components/schemas/ManualText'
        phase:
          $ref: '#/components/schemas/ManualText'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        multiplier:
          description: Defaults to 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        commission_per_contract_side:
          description: 'USD per contract and side, ≥ 0 (U20 a): the floor of each fill''s commission (effective = max(platform,

            this × quantity)). The UI prefills it from the preset (`commission_per_contract_side` rule);

            absent = no floor. Any change bumps the account''s limits version (net P&L feeds risk). A higher floor applies
            at once; a lower one (or removing it) applies from the next trading day and is shown in `AccountRisk.pending_commission_change`
            (ADR-0006 §3.7).

            '
          $ref: '#/components/schemas/MoneyAmount'
        evaluation_start:
          type: string
          format: date
          description: Accounts with an evaluation target only (Q46, S13b; Q69 a) — the day the evaluation count starts; default
            the registration date in the user's time zone. Invariant — an account with an evaluation target always has an
            `evaluation_start`; when an existing account gains a target (selection or preset change, `applyPresetVersion`,
            a rule edit), the Core sets a missing start to the same default in that transaction; that is a rule-input change,
            so it bumps `account.limits_version` and emits `account.limits_changed` (ADR-0006 §3.1). Sent for an account without
            an evaluation target → 422 `accounts.evaluation_not_applicable`. Later changes only through `restartEvaluation`.
        evaluation_earned_before:
          description: Net profit already made in this evaluation before `evaluation_start` (optional; counts toward the target).
            Accounts with an evaluation target only (else 422 `accounts.evaluation_not_applicable`).
          $ref: '#/components/schemas/MoneyAmount'
        binding:
          $ref: '#/components/schemas/PlatformAccountRef'
        rule_values:
          description: Prop with a preset only. The account's own rule values where they differ from the preset or resolve
            a not-confirmed field (S16 AC-2, AC-6).
          $ref: '#/components/schemas/PresetRuleValues'
        profile_size:
          description: The standard size whose default profile is copied, when the account's size (real, or prop outside the
            standard list, Q73 b) is a tie (`getNearestProfileSize` returns two candidates). Ignored otherwise.
          $ref: '#/components/schemas/SizeAmount'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` (action `account_create_opt_in_accept`, no target).
          $ref: '#/components/schemas/StepUpProof'
      allOf:
      - if:
          properties:
            kind:
              const: real
        then:
          required:
          - size_amount
          not:
            anyOf:
            - required:
              - preset_version_id
            - required:
              - firm_platform
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - opt_ins
            - required:
              - rule_values
      - if:
          properties:
            kind:
              const: prop
          required:
          - preset_version_id
        then:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - size_amount
      - if:
          properties:
            kind:
              const: prop
          not:
            required:
            - preset_version_id
        then:
          required:
          - firm_name
          - plan_name
          - phase
          - size_amount
          not:
            anyOf:
            - required:
              - firm_platform
            - required:
              - rule_values
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - row_version
      - display_name
      - max_position_qty
      description: 'Full replacement of the editable fields (`kind` is fixed at creation). The same prop/real rules as

        `AccountCreateRequest`, keyed on the stored `kind`: real → `size_amount`, no prop fields, no

        `opt_ins`; prop → `preset_version_id` (+ `firm_platform`) or the four manual fields. A body that

        does not fit the stored kind gets 400 `common.invalid_request` with the pointer of the first

        offending field. Switching a prop account from a preset to manual fields (or back) is allowed.

        '
      properties:
        row_version:
          type: integer
          minimum: 1
        display_name:
          $ref: '#/components/schemas/AccountName'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        firm_name:
          $ref: '#/components/schemas/ManualText'
        plan_name:
          $ref: '#/components/schemas/ManualText'
        phase:
          $ref: '#/components/schemas/ManualText'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        multiplier:
          description: Absent means 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        commission_per_contract_side:
          description: 'USD per contract and side, ≥ 0 (U20 a): the floor of each fill''s commission. Exception to the

            full replacement (QA Security): **absent = unchanged**, so a client that forgets the field never

            removes the floor; `null` removes it explicitly. A higher floor applies at once; a lower one, or

            `null`, applies from the next trading day (`AccountRisk.pending_commission_change`; ADR-0006

            §3.7) and is audited (`accounts.updated`). Any change bumps the account''s limits version.

            '
          oneOf:
          - $ref: '#/components/schemas/MoneyAmount'
          - type: 'null'
        binding:
          description: The platform account to bind; absent means unbound.
          $ref: '#/components/schemas/PlatformAccountRef'
        rule_values:
          description: 'Only when the preset selection changes (another `preset_version_id` or `firm_platform`): the

            account''s own values for the new preset (edited or resolving not-confirmed fields; absent fields

            take the new preset''s value). With an unchanged selection it must be absent (422

            `accounts.rule_values_without_selection_change`) and the stored rule values are kept; they are

            edited with `putAccountRiskRules` (S13) and restored with `restorePresetValue`.

            '
          $ref: '#/components/schemas/PresetRuleValues'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` and changes the stored state (action `account_opt_in_accept`),
            or when the binding of an account that receives automation changes (action `account_binding_change`); target =
            this account.
          $ref: '#/components/schemas/StepUpProof'
      allOf:
      - if:
          required:
          - preset_version_id
        then:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - size_amount
        else:
          required:
          - size_amount
          not:
            anyOf:
            - required:
              - firm_platform
            - required:
              - rule_values
      - if:
          anyOf:
          - required:
            - firm_name
          - required:
            - plan_name
          - required:
            - phase
        then:
          required:
          - firm_name
          - plan_name
          - phase
          - size_amount
    LifecycleRequest:
      type: object
      additionalProperties: false
      required:
      - state
      - row_version
      properties:
        state:
          $ref: '#/components/schemas/LifecycleState'
        row_version:
          type: integer
          minimum: 1
    ArchiveImpact:
      type: object
      additionalProperties: false
      required:
      - has_open_position
      - routes
      - follower_links
      properties:
        has_open_position:
          type: boolean
          description: When true `archiveAccount` is refused (the dialog shows the explanation instead of a confirmation).
        routes:
          type: array
          description: Routing subscriptions of this account (S7) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required:
            - source_id
            - source_name
            properties:
              source_id:
                $ref: '#/components/schemas/Uuid'
              source_name:
                $ref: '#/components/schemas/DisplayName'
        follower_links:
          type: array
          description: Master/follower relations (S19, V1.1; always empty before it) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - display_name
            - role
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              display_name:
                $ref: '#/components/schemas/AccountName'
              role:
                type: string
                enum:
                - master
                - follower
                description: The role of the OTHER account in the relation.
    OptInKind:
      type: string
      enum:
      - automation
      - copy
    FirmStance:
      type: string
      enum:
      - allowed
      - forbidden
      - conditional
      - unknown
      - not_confirmed
      description: Stance of the rule version for the opt-in kind. A missing stance in the preset, and every prop account
        without a preset (generic rule, Q40), is `unknown`.
    OptInChoiceRequest:
      type: object
      additionalProperties: false
      required:
      - choice
      - rule_version_id
      properties:
        choice:
          type: string
          enum:
          - accepted
          - declined
        rule_version_id:
          description: Rule version whose text was displayed (`RuleVersion.id`).
          $ref: '#/components/schemas/Uuid'
    OptInChoices:
      description: 'The `opt_ins` property of `createAccount` / `updateAccount` / `applyPresetVersion` (atomic with the

        save). Required kinds: on create, `automation` when its rule version needs a choice; on update and

        apply, only `automation`, and only when that request changes the automation rule version and the

        new version needs a choice. Otherwise 422 `accounts.opt_in_required` with `pointer`

        `/opt_ins/automation`, and nothing is saved. `copy` is never required by these operations (it is

        chosen in the follower flow, S7/S19); it may be sent when the UI shows it. A stale `rule_version_id` gives 409

        `accounts.rule_version_changed`. The step-up (when a choice is `accepted` and changes the stored

        state) happens before the single save, so cancelling it saves nothing.

        '
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        automation:
          $ref: '#/components/schemas/OptInChoiceRequest'
        copy:
          $ref: '#/components/schemas/OptInChoiceRequest'
    OptInState:
      type: object
      additionalProperties: false
      required:
      - kind
      - state
      properties:
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_stance:
          description: Absent only for real accounts.
          $ref: '#/components/schemas/FirmStance'
        state:
          type: string
          enum:
          - not_required
          - chosen
          - pending_review
          description: 'not_required = no choice is asked now: real account, the stance is `allowed`, or (`copy`) the

            account is not a follower (Q-S5-8; no card in the UI); chosen = an explicit choice exists for

            the current rule version; pending_review = see `pending_reason`; that kind is suspended until

            the user chooses again (Q26). Routing treats `pending_review` and `declined` as not accepted

            (`routing.automation_not_accepted` / `routing.copy_not_accepted`). There is no "saved without

            a choice" state: first choices are atomic with creation.

            '
        pending_reason:
          type: string
          enum:
          - stance_changed
          - text_changed
          - preset_attached
          description: 'With `pending_review` only. `stance_changed` (Q26); `text_changed` = the new rule version is

            flagged as a material text change (Q42; `RuleVersion.change` has the reason

            text); `preset_attached` = reserved for Q41: only a data migration that attaches a

            preset to an account without a user request would produce it. No operation of this contract

            does (a user who selects a preset sends the new choice inline, D16).

            '
        choice:
          type: string
          enum:
          - accepted
          - declined
          description: 'With `chosen`: the choice in force. With `pending_review`: the **previous** choice (no longer in

            force), present only if one was ever made, so the review dialog can show it; it is never

            preselected. Absent with `not_required`.

            '
        chosen_at:
          $ref: '#/components/schemas/Timestamp'
        rule_version_id:
          description: Rule version the `choice` was made against.
          $ref: '#/components/schemas/Uuid'
        current_rule_version_id:
          description: The rule version in force for this account and kind (fetch its text with `getRuleVersion`). Absent
            only for real accounts.
          $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            state:
              const: chosen
        then:
          required:
          - firm_stance
          - choice
          - chosen_at
          - rule_version_id
          - current_rule_version_id
      - if:
          properties:
            state:
              const: pending_review
        then:
          required:
          - firm_stance
          - pending_reason
          - current_rule_version_id
          dependentRequired:
            choice:
            - chosen_at
            - rule_version_id
        else:
          not:
            required:
            - pending_reason
      - if:
          properties:
            state:
              const: not_required
        then:
          not:
            anyOf:
            - required:
              - choice
            - required:
              - chosen_at
            - required:
              - rule_version_id
    AccountChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      description: Any change to an account the caller sees (fields, lifecycle, opt-in state, binding, open position). The
        client refetches the account (`getAccount`).
      properties:
        type:
          const: account.changed
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
    AccountArchivedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      properties:
        type:
          const: account.archived
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
    AuditCategory:
      type: string
      enum:
      - ingress
      - routing
      - execution
      - risk
      - connection
      - security
      - config
    AuditOutcome:
      type: string
      enum:
      - received
      - routed
      - executed
      - partial
      - skipped
      - refused
      - rejected
      - expired
      - unknown
      - info
      description: "Final taxonomy (Q-S10-2), set by the Core on every entry, never derived by the client:\n- `received` —\
        \ instruction accepted at ingress;\n- `routed` — routing decision to send to an account (full quantity);\n- `executed`\
        \ — an order filled;\n- `partial` — quantity capped at the maximum position; a `reverse` that runs only its close\
        \ leg\n  because a gate skipped the open (Q74/Q75, the entry carries the gate code); or a partial fill;\n- `skipped`\
        \ — not sent by a configuration rule (duplicate, signal type not selected, opt-in not\n  accepted, account inactive,\
        \ no stop/target profile, limits not yet derived, maximum already\n  reached, nothing to close, nothing to reduce,\
        \ no active contract for the instrument);\n- `refused` — not sent by a protective gate (out of sync, risk block, position\
        \ conflict);\n- `rejected` — refused by validation (ingress) or by the platform;\n- `expired` — command TTL exceeded,\
        \ not executed;\n- `unknown` — the order's state could not be determined after a recovery (the account is\n  flagged\
        \ out of sync);\n- `info` — everything else (configuration, connection, security, order received/working/cancelled,\n\
        \  bracket calculation, command requested, command sent). No badge in the UI.\n"
    AuditSignalType:
      type: string
      enum:
      - trigger
      - trade_plan
      - nq_trigger
      - master_account
    AuditCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      maxLength: 96
      description: 'Stable code; clients translate it (ADR-0001 §9). The set is open: a code the client does not know

        is shown with the fallback text and the technical data. `KnownAuditCode` lists the codes defined

        by the contract so far (the i18n parity check uses it).

        '
    KnownAuditCode:
      type: string
      enum:
      - ingress.received
      - ingress.duplicate_ignored
      - ingress.rejected
      - ingress.rate_limited
      - routing.routed
      - routing.quantity_capped
      - routing.max_position_reached
      - routing.signal_type_not_selected
      - routing.automation_not_accepted
      - routing.copy_not_accepted
      - routing.account_inactive
      - routing.platform_unbound
      - routing.no_bracket_profile
      - routing.limits_pending
      - routing.out_of_sync
      - routing.risk_blocked
      - routing.position_conflict
      - routing.nothing_to_close
      - routing.nothing_to_reduce
      - routing.no_correlated_order
      - routing.instrument_unavailable
      - routing.adapter_protocol_outdated
      - routing.position_unknown
      - routing.expired
      - execution.command_requested
      - execution.command_sent
      - execution.bracket_calculated
      - execution.order_received
      - execution.order_working
      - execution.partially_filled
      - execution.filled
      - execution.cancelled
      - execution.rejected
      - execution.expired
      - execution.state_unknown
      - execution.fill_corrected
      - connection.status_changed
      - sources.created
      - sources.renamed
      - sources.rotated
      - sources.revoked
      - connections.created
      - connections.renamed
      - connections.pairing_code_issued
      - connections.paired
      - connections.repaired
      - connections.unpaired
      - security.signed_in
      - security.sign_in_failed
      - security.code_rate_limited
      - security.code_delivery_failed
      - security.new_device_notice_sent
      - security.step_up_succeeded
      - security.step_up_failed
      - security.channel_change_requested
      - security.channel_change_on_hold
      - security.channel_change_completed
      - security.channel_change_cancelled
      - security.channel_change_not_completed
      - security.device_forgotten
      - security.signed_out_everywhere
      - security.invitation_issued
      - security.invitation_revoked
      - security.account_created
      - accounts.created
      - accounts.updated
      - accounts.archived
      - accounts.lifecycle_changed
      - accounts.opt_in_chosen
      - accounts.opt_in_suspended
      - routing.subscription_changed
      - profiles.default_changed
      - profiles.account_changed
      - presets.version_applied
      - presets.value_restored
      - risk.rules_changed
      - risk.warning
      - risk.limit_reached
      - risk.target_reached
      - risk.consistency_warning
      - risk.evaluation_target_reached
      - accounts.evaluation_restarted
      - trades.captured
      - trades.manual_created
      - trades.manual_changed
      - trades.manual_deleted
      - trades.reconcile_mismatch
      - execution.unbound_activity
      - execution.undelivered
      - connection.account_kind_changed
      - sync.flagged
      - sync.reason_resolved
      - sync.cleared
      - sync.restored
      description: "Codes with a `details` schema in `AuditDetailsByCode`. `security.*` codes come from S3 AC-16 and\nauth\
        \ policy rev. 2 (Esquadro). Families defined by other slices are added with their contracts:\n`risk.flatten` / `risk.blocked`\
        \ (S15), `notifications.*` (S18).\nCategory by code family (the `category` of each entry): `ingress.*` → ingress;\
        \ `routing.*` →\nrouting, except `routing.subscription_changed` → config; `execution.*` and `trades.captured` →\n\
        execution; `risk.*` → risk, except `risk.rules_changed` → config; `connection.status_changed` →\nconnection (a plugin\
        \ restart is a `connection.status_changed` with `previous_status`);\n`security.*` → security; `sources.*`, `connections.*`,\
        \ `accounts.*`, `profiles.*`, `presets.*`\nand `trades.manual_*` → config; `trades.reconcile_mismatch` → execution;\
        \ `sync.*` (S11, 5.3.0) →\nconnection, for every `sync.*` code, including reasons that are not about the connection\
        \ (a\nrejection, external activity, a fill correction). This is accepted for V1 (Esquadro): a new\ncategory is also\
        \ a protocol 1.3 notification field, so it is a protocol minor. It is revisited\nin the next protocol minor that is\
        \ opened for another reason.\n`sync.*` (ADR-0004 §6, `DetailsSync`), each with its actor and outcome:\n- `sync.flagged`:\
        \ one per added reason (system, `info`);\n- `sync.reason_resolved`: the Core removed a reason, and the account stays\
        \ out of sync (system, `info`);\n- `sync.cleared`: the user cleared the flag (user, `info`), with `cleared_reasons`;\n\
        - `execution.unbound_activity` (category execution; system, `info`; Esquadro): activity on a platform\n  account that\
        \ is visible on a connection but bound to no All Win account. It is not a sync reason,\n  since there is no account\
        \ to flag (`DetailsUnboundActivity`). Occurrence (Crivo R1): one entry per\n  (connection, platform account, instrument)\
        \ when a snapshot first shows a position there, or the\n  position changes. Fills are not audited one by one; they\
        \ show through the next snapshot's\n  position. The notification is grouped per connection and trading day;\n- `execution.undelivered`\
        \ (category execution; system, outcome `unknown`; Bigorna, ADR-0004 §4,\n  Esquadro C-a): a command not acked within\
        \ the retransmission horizon. Its result is unknown: it\n  may have run on the platform, so the outcome is never `expired`.\
        \ It is never retransmitted. The account also gets\n  `sync.command_undelivered`, which is notified through `sync.flagged`,\
        \ so this entry is audit only\n  (`DetailsUndelivered`);\n- `connection.account_kind_changed` (category connection;\
        \ system, `info`; Bigorna, ADR-0005 N11): the\n  plugin reported another platform account kind for a bound account,\
        \ e.g. `simulation` → `live`\n  (`DetailsAccountKindChanged`). It is audit only; the binding's `kind` shows the current\
        \ value;\n- `sync.restored`: a disconnect while flat with nothing in flight, whose reconnect snapshot matched,\n \
        \ so the account was not flagged and is back to normal (system, `info`; ADR-0004 §6 row 3).\nThe automatic orphan\
        \ cancels and the orphan flatten stay execution entries (`execution.cancelled`\n+ `order.orphan_cancelled`, `execution.command_sent`\
        \ kind `flatten`); `sync.flagged` carries the\nsummary in `reason.core_action`.\n"
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - occurred_at
      - recorded_at
      - category
      - code
      - outcome
      - details
      - safe_to_display
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        category:
          $ref: '#/components/schemas/AuditCategory'
        code:
          $ref: '#/components/schemas/AuditCode'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        is_exit:
          type: boolean
          description: With routing and execution entries of an exit action (`close`, reduce, protective modify/cancel), so
            the text can say "saída".
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        message_id:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot at the time of the entry.
        account_deleted:
          type: boolean
          description: True when the account has been archived since (UI `(excluída)`).
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          minLength: 1
          maxLength: 60
        source_key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
          description: The only part of a source token that may be shown.
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        command_id:
          $ref: '#/components/schemas/Uuid'
        actor:
          type: string
          enum:
          - user
          - system
          - platform_admin
          description: Who caused the entry. `platform_admin` is reserved for admin actions on the user's data (Q28 recovery);
            absent on old entries.
        details:
          type: object
          description: 'Typed per code: the schema is `AuditDetailsByCode[code]` (an empty object for codes without

            one). Money, prices and distances are decimal strings. Never holds a secret, whatever

            `safe_to_display` says: the Core redacts before writing (free-text fields such as pointers and

            device labels are truncated and redacted) and storage refuses token-shaped strings.

            '
        safe_to_display:
          type: boolean
          description: Presentation only — true when the raw `details` JSON may be shown in "technical data". The rendered
            fields of the catalog are always shown. It is not a secrecy flag (see `details`).
      allOf:
      - if:
          required:
          - account_id
        then:
          required:
          - account_name
          - account_deleted
      - if:
          required:
          - source_id
        then:
          required:
          - source_name
    ActivityPage:
      type: object
      additionalProperties: false
      required:
