          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`connections.name_taken`, or `connections.unpaired` (an unpaired connection is kept read-only for
            history).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{connection_id}/pairing-code:
    post:
      tags:
      - connections
      operationId: newPairingCode
      summary: New pairing code (expired code, or "move to another machine"; step-up)
      description: 'Invalidates any previous active code. For a paired connection this is the re-pairing flow:

        the current instance keeps working until the new code is used; then its device token is revoked

        (WebSocket close 4002). Account bindings follow the connection by `platform_account` name

        (ADR-0004 §8 "Re-pairing"); accounts not reported by the new instance become out of sync with

        reason `sync.account_not_found_after_repair`.

        '
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpBody'
      responses:
        '201':
          description: New code.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`connections.unpaired` (an unpaired connection cannot get a code; create a new one).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{connection_id}/unpair:
    post:
      tags:
      - connections
      operationId: unpairConnection
      summary: Unpair (Q18) — revokes the device token; mapped accounts become out of sync; nothing is closed (step-up)
      x-step-up: true
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - acknowledge_open_positions
              properties:
                acknowledge_open_positions:
                  type: boolean
                  description: Must be true when any mapped account has an open position (design S3-10 checkbox).
                step_up:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '204':
          description: Unpaired; WebSocket closed with 4002; audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`connections.open_positions_not_acknowledged` (body lists nothing sensitive; the client re-reads the
            connection).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /adapter/v1/pairings:
    post:
      tags:
      - pairing
      operationId: pairAdapter
      summary: Exchange a pairing code for a device token (called by the plugin; ADR-0004 §8)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - pairing_code
              - instance_id
              - instance_name
              - adapter
              properties:
                pairing_code:
                  type: string
                  maxLength: 16
                  description: 8 Crockford Base32 characters; case, spaces and hyphens ignored; O→0, I/L→1.
                instance_id:
                  $ref: '#/components/schemas/Uuid'
                instance_name:
                  type: string
                  minLength: 1
                  maxLength: 64
                adapter:
                  type: object
                  additionalProperties: false
                  required:
                  - type
                  - version
                  - build
                  properties:
                    type:
                      type: string
                      pattern: ^[a-z][a-z0-9_]{0,31}$
                    version:
                      type: string
                      maxLength: 32
                    build:
                      type: string
                      enum:
                      - release
                      - development
      responses:
        '201':
          description: Paired. `device_token` is returned exactly once; the plugin stores it with DPAPI.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - connection_id
                - device_token
                properties:
                  connection_id:
                    $ref: '#/components/schemas/Uuid'
                  device_token:
                    type: string
                    pattern: ^awd_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$
        '400':
          description: '`pairing.invalid_code` — one code for unknown, expired, used or superseded (plugin shows one

            message); or `common.invalid_request` with `pointer` when the body does not match the schema.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: '`pairing.adapter_version_unsupported`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`pairing.rate_limited` (per-IP and per-prefix limits, ADR-0004 §8; there is no global lock, U11).
            Header `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events:
    get:
      tags:
      - events
      operationId: eventStream
      summary: Server-Sent Events stream for the signed-in user
      description: '`text/event-stream`. Each event has `event: <type>` and `data: <JSON>` matching

        `#/components/schemas/Event`. Does NOT extend the idle session timeout. On session end the

        server sends `session.ended` and closes the stream. Events carry no SSE `id` and are not

        replayed in V1: after every (re)connect the client refetches the state it displays (sources,

        connections) and then applies events whose `at` is newer than what it holds.

        '
      responses:
        '200':
          description: Stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts:
    get:
      tags:
      - accounts
      operationId: listAccounts
      summary: List the signed-in user's accounts (archived accounts excluded)
      description: 'One call for the whole list screen (no pagination in V1; a user has tens of accounts). Sorted by

        `display_name` (case-insensitive). Filtering is client-side. Only the caller''s accounts.

        '
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - accounts
      operationId: createAccount
      summary: Register a prop or real account, with its first opt-in choices, in one save
      description: 'Idempotent by the `Idempotency-Key` header (a UUID the client generates once per form

        submission). A key is never released: a retry with the same key and the same body (`step_up`

        ignored) within 24 h returns 200 with the account created by the first request, as it is now

        (with `archived_at` if it was archived since), and changes nothing; the same key with a different

        body, or after 24 h, gets 409 `accounts.idempotency_key_reused`. A key never creates a second

        account. Only a successful create consumes a key, so the retry after a step-up reuses it.

        Account ids are generated by the Core.

        An account whose size is not a standard size (any real account size; a prop size outside the

        standard list, Q73 b) copies the default profile of the nearest standard size (S6). The nearest

        size only picks the stop/target profile: balance, limits and every risk figure always use the

        account''s own `size_amount` (Q73). When the size is

        exactly between two standard sizes the user picks one: `profile_size` is then required (422

        `accounts.profile_size_required`) and must be one of the candidates of `getNearestProfileSize`

        (422 `accounts.profile_size_invalid`). Q60: if the user later decides "smaller" or

        "larger", the candidates list just has one entry and nothing else changes.

        Prop accounts take either a preset version (`preset_version_id`, S16) or the manual fields

        (`firm_name`, `plan_name`, `phase`, `size_amount`; before S16 and for plans without a preset).

        `opt_ins` must hold every kind whose choice is required (`OptInChoices`); before S16 the

        automation stance of a prop account is `unknown`, so its choice is required against the generic

        rule version (Q40). Real accounts never take `opt_ins`.

        Step-up: when any `opt_ins.*.choice` is `accepted` the body must carry `step_up` for action

        `account_create_opt_in_accept` (no target; StepUpProof). Check order after authentication,

        Origin and schema: idempotent replay → step-up → 409 → 422. Nothing is saved on any error. Audited as `accounts.created`
        and, per kind chosen,

        `accounts.opt_in_chosen`, in the same transaction.

        '
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
            examples:
              real:
                value:
                  kind: real
                  display_name: Conta real
                  size_amount: '25000.00'
                  max_position_qty: 3
                  multiplier: 1
                  binding:
                    connection_id: 5a2b8c3d-1e4f-4a6b-8c7d-9e0f1a2b3c4d
                    platform_account: Sim101
              prop_manual:
                value:
                  kind: prop
                  display_name: Apex 50K 1
                  firm_name: Apex Trader Funding
                  plan_name: 50K Rithmic
                  phase: Evaluation
                  size_amount: '50000.00'
                  max_position_qty: 2
                  opt_ins:
                    automation:
                      choice: declined
                      rule_version_id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
      responses:
        '200':
          description: Replay of a create already done with this `Idempotency-Key`; the account it created, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '201':
          description: Created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '409':
          $ref: '#/components/responses/AccountWriteConflict'
        '422':
          $ref: '#/components/responses/AccountWriteRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}:
    get:
      tags:
      - accounts
      operationId: getAccount
      summary: One account (detail screen)
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - accounts
      operationId: updateAccount
      summary: Edit an account (full replacement of the editable fields; optimistic concurrency by `row_version`)
      description: 'The body is the whole editable state (the edit form sends every field): an absent `binding`

        unbinds, an absent `multiplier` resets it to 1; `kind` cannot change. Changing the

        preset version, the firm platform or the manual prop fields may select a different rule version.

        `opt_ins.automation` is then required when this request changes the automation rule version and

        the new one needs a choice (422 `accounts.opt_in_required`, D16). Nothing else is required by an

        edit: a kind already `pending_review`, or whose rule version this request does not change, is

        resolved with `setAccountOptIn`; `copy` is never required here (it is not on the account form;

        a follower whose copy rule version changes goes to `pending_review`). Selecting another preset re-fills the rule values

        from it (the UI confirms first). Applying a newer version of the same preset (S16 AC-3) is

        `applyPresetVersion`, not this operation (422 `presets.use_apply_version`).

        Changing or removing the binding while the account has an open position is refused with 409

        `accounts.binding_open_position` (Q38). Lowering `max_position_qty` below an open

        position is allowed; open positions are not changed.

        Step-up: when an `opt_ins.*.choice` is `accepted` and changes the stored state, the body must

        carry `step_up` for action `account_opt_in_accept` with target = this account. Changing or

        removing the binding of an account that receives automation (automation `chosen` + `accepted`, or

        an enabled route from an automated source) needs `step_up` for action `account_binding_change`

        (target = this account; QA Security L1; Q35 decided 2026-10-23: setting

        `step_up.q35_persistence_actions` on, server configuration only, missing/invalid = on). One proof covers the request;
        when both apply, `account_opt_in_accept` is used. Check order after

        authentication, Origin and schema: 404 → step-up → 409 → 422. Audited as

        `accounts.updated` (changed fields with old and new values) and `accounts.opt_in_chosen`.

        '
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted that changes the stored state, or the binding of an account that receives
        automation changes (Q35 decided, setting on)
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Saved and audited (a request that changes nothing returns the account and is not audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountWriteConflict'
        '422':
          $ref: '#/components/responses/AccountWriteRejected'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - accounts
      operationId: archiveAccount
      summary: Delete (archive) an account
      description: 'Refused with 409 `accounts.delete_open_position` while the account has an open position (S5 AC-6;

        last known state when the connection is down). Otherwise the account is archived: it leaves every

        list, receives no instruction, and its name becomes free again. Q39: its routes and

        master/follower relations are removed in the same transaction (listed beforehand by

        `getAccountArchiveImpact`), its binding is released, and the audit and history keep the id and a

        name snapshot. Audited as `accounts.archived` with what was removed. An archived or unknown id

        gets 404.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Archived and audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`accounts.delete_open_position` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/archive-impact:
    get:
      tags:
      - accounts
      operationId: getAccountArchiveImpact
      summary: What deleting the account would remove (for the confirmation dialog)
      description: 'Read-only. The confirmation lists these items; `archiveAccount` removes whatever exists when it

        runs (each item is audited), so a route added in between is removed too.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveImpact'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/lifecycle:
    put:
      tags:
      - accounts
      operationId: setAccountLifecycle
      summary: Pause, resume, disable or enable an account (S5 AC-4)
      description: 'Sets the target state. Allowed transitions: `active` → `paused` (pause); `paused` → `active`

        (resume); `active` or `paused` → `disabled` (disable); `disabled` → `active` (enable). Any other

        transition gets 409 `accounts.lifecycle_transition_invalid`. Setting the current state is a

        no-op (200, not audited). A paused or disabled account receives no instruction at all, exits

        included (S7 AC-8); open positions and orders are not touched. Audited as

        `accounts.lifecycle_changed` (previous and new state, whether a position was open).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: The account in its new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` (stale `row_version`) or `accounts.lifecycle_transition_invalid`; nothing
            changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/evaluation/restart:
    post:
      tags:
      - accounts
      operationId: restartEvaluation
      summary: Restart the evaluation count of a prop account (S13b; Q69 a)
      description: 'Sets a new `evaluation_start` (and optionally `evaluation_earned_before`); the progress toward

        `evaluation_profit_target` restarts from there. A Sim / Playback reset is a discontinuity (S11

        AC-6) and never restarts the count by itself. `row_version` as in `updateAccount`. Bumps the

        account''s limits version. Audited as `accounts.evaluation_restarted` (old and new start and

        earned-before). An account without an evaluation target gets 422 `accounts.evaluation_not_applicable`.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - evaluation_start
              - row_version
              properties:
                evaluation_start:
                  type: string
                  format: date
                evaluation_earned_before:
                  $ref: '#/components/schemas/MoneyAmount'
                row_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Restarted and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`accounts.evaluation_not_applicable` (no evaluation target) or `accounts.evaluation_start_invalid`
            (`/evaluation_start` in the future); nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/sync/clear:
    post:
      tags:
      - accounts
      operationId: clearAccountSync
      summary: Clear the out-of-sync flag after the user resolved it (S11 AC-3)
      description: "The user confirms they checked the position and orders on the platform. The account returns to\n`in_sync`\
        \ and receives new entries again (Q14, S11 AC-4). Nothing is sent to the platform: no\nresync, no reopen, no cancel\
        \ (ADR-0004 §6).\n`expected_version` is the `sync.version` the user saw. If a reason was added or removed since,\n\
        409 `accounts.sync_state_changed` and nothing changes, so a reason the user has not seen is never\ncleared. A repeat\
        \ of the request whose clear already succeeded (same `expected_version`, the\naccount still in sync since that clear)\
        \ returns 200 with the current account and changes nothing\n(double submit). An account already in sync otherwise\
        \ gets 409 `accounts.not_out_of_sync`.\nThe clear empties `reasons` and `resolved_reasons` and bumps `version`. The\
        \ expected state's new\nbase is the account's last evaluated snapshot: position and All Win orders as reported (ADR-0004\n\
        r5). After a clear only the normal triggers flag again: a new difference against that base\n(`sync.snapshot_mismatch`),\
        \ or a new event with its own code. A condition the user accepted and\nthat stays the same does not flag again.\n\
        Allowed with an open position (Q84 a, user 2026-10-24): the user may keep it, and the UI asks\nfor confirmation. Refused\
        \ while the account is not observable (Q83 a): the session is down, a\nsnapshot reports the broker connection lost,\
        \ or the reconnect check has not finished\n(`observable: false`, the live condition). An active `sync.bracket_integrity_unknown`\
        \ alone does\nnot block the clear once observation resumed; otherwise that account could never be cleared\n(Crivo\
        \ R1 on r5). The\nanswer is 409 `accounts.sync_not_observable`, and the user waits until the plugin has reported.\n\
        An UNBOUND account is never observable (`sync.connection_unpaired`,\n`sync.account_not_found_after_repair`), so it\
        \ cannot be cleared until it is bound again and its\nreconnect snapshot is evaluated. It receives nothing anyway (gate\
        \ `platform_unbound`). The web\nsays \"vincule a conta (ou re-pareie) para verificar e liberar\", not just \"unavailable\"\
        . A rebind\nor re-pair keeps the account out of sync with the same reasons. Its first session goes through\n`connection_checking`.\
        \ When the reconnect snapshot is evaluated, `observable` becomes true and the\nuser may clear, with that snapshot\
        \ as the base. A difference found by that evaluation adds\n`sync.snapshot_mismatch`. Archiving the account (ADR-0008)\
        \ is the other way out. This is\nintended (Esquadro, Crivo Q1).\nStep-up (user decision Q95, 2026-10-24; in the Q35\
        \ set, setting `step_up.q35_persistence_actions`\non): the body must carry `step_up` for action `account_sync_clear`,\
        \ target = this account. Missing →\n403 `auth.step_up_required`; wrong → 403 `auth.code_invalid` (`StepUpFailed`).\
        \ Check order after\nauthentication, Origin and schema (Crivo R1):\n1. 404;\n2. the REPLAY check: the same `expected_version`\
        \ and the account in sync since that clear give 200\n   with the current account, WITHOUT checking or consuming a\
        \ step-up code, so a double submit\n   whose proof was already used by the first clear still gets 200;\n3. step-up;\n\
        4. 409.\n**Live protection (Vigia L2):** the confirmation lists each open position from the last evaluated\nsnapshot\
        \ with its live All Win protection (`AccountSync.positions`). The clear never hides an\nunprotected position: if one\
        \ is open without full protection at the time of the clear, the Core\nkeeps its `sync.bracket_incomplete`, or raises\
        \ it if absent. The account then stays `out_of_sync`\nwith that reason only, and the 200 response shows it. The plugin\
        \ has no clear (Q-P3).\nAudited as `sync.cleared` (actor user; the reasons that were active and resolved).\n"
      x-step-up: conditional
      x-step-up-when: always (Q95), with the Q35 setting on
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_version
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                step_up:
                  description: Action `account_sync_clear`, target = this account (Q95).
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Cleared and audited (or the replay of a clear that already succeeded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`accounts.sync_state_changed` (the sync state changed since `expected_version`; refetch), `accounts.not_out_of_sync`,
            or `accounts.sync_not_observable` (Q83 a: not observable yet, so wait for the plugin''s report); nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/opt-ins/{kind}:
    put:
      tags:
      - accounts
      operationId: setAccountOptIn
      summary: Record or change an explicit per-account opt-in (automation or copy) after the account exists
      description: 'Decisions 2026-10-23: option A (explicit per-account opt-in), Q24 (separate `copy` opt-in for

        followers of master replication), Q25 (the choice is required when the firm''s stance for that kind

        is forbidden, conditional, unknown or not confirmed), Q26 (a new preset version that changes the

        stance moves the state to `pending_review` and suspends that kind until the user chooses again).

        **Q42 (a):** a change of the official rule text that the publisher of

        the preset version flags as material also triggers `pending_review`; unflagged edits never do.

        - `automation` covers automated sources (TradingView webhook, future signal engine).

        - `copy` covers receiving master-account replication as a follower.

        The first choice is made **atomically with account creation** (`opt_ins` of `createAccount` /

        `updateAccount`, schema `OptInChoices`). The `copy` choice is made atomically with adding the

        account as a follower (S7/S19); for an account that is not a follower `copy` is `not_required`

        and this operation answers 422 `accounts.opt_in_not_applicable`. This operation is for later

        changes and for resolving `pending_review`. `rule_version_id` must be the rule version whose text

        the user saw; if it is stale the Core answers 409 `accounts.rule_version_changed` and saves

        nothing. Every change is audited (date, user, kind, choice, rule version, previous value).

        Idempotent: the same choice for the same rule version as the stored `chosen` state is a no-op

        (200, not audited, no step-up), so a retry after success never fails on a consumed code.

        '
      x-step-up: conditional
      x-step-up-when: choice == accepted and it changes the stored state
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OptInKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - choice
              - rule_version_id
              properties:
                choice:
                  type: string
                  enum:
                  - accepted
                  - declined
                rule_version_id:
                  description: Rule version whose text was displayed (`RuleVersion.id`).
                  $ref: '#/components/schemas/Uuid'
                step_up:
                  description: Required when `choice` is `accepted` (step-up action `account_opt_in_accept`, target = this
                    account).
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptInState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`accounts.rule_version_changed` — `error.current_rule_version_id` carries the current version; nothing
            saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`accounts.opt_in_not_applicable` (state is `not_required`: real account, the firm allows that kind,
            or `copy` on an account that is not a follower).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/opt-in-rules:
    get:
      tags:
      - presets
      operationId: getOptInRules
      summary: Rule versions in force for a prop selection, before or after the account exists
      description: 'The account form calls it on every selection change (firm, plan, phase, size, firm platform),

        because the rule version depends on the selection and there is no account id yet (spec §5.2).

        With `preset_version_id` → the rules of that preset version (and `firm_platform` when the preset

        has platform-specific rules). Without it → the **generic** rule versions used by prop accounts

        without a preset (stance `unknown`, no quotes; Q40); `firm_platform` without `preset_version_id`

        is an invalid combination: 400 `common.invalid_request`, pointer `/query/firm_platform` (as in

        `createAccount`). Global catalog data, the same

        for every user; any signed-in user may read it.

        '
      parameters:
      - name: preset_version_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: firm_platform
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FirmPlatform'
      responses:
        '200':
          description: One rule version per kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptInRules'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`accounts.firm_platform_required` or `accounts.firm_platform_unknown` (pointer `/query/firm_platform`;
            with `preset_version_id` only).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rule-versions/{rule_version_id}:
    get:
      tags:
      - presets
      operationId: getRuleVersion
      summary: One opt-in rule version (current text, or a previous one for comparison)
      description: 'Used for `OptInState.current_rule_version_id`, for the previous version shown in the review

        dialog (`RuleVersion.change.previous_rule_version_id`) and for the version a past choice was

        made against. Rule versions are immutable once published.

        '
      parameters:
      - name: rule_version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The rule version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/routes:
    get:
      tags:
      - routing
      operationId: listRoutes
      summary: The caller's routes, with the effective status computed by the Core
      description: 'Filter by `source_id` (routing page) or `account_id` (account `Rotas` tab); without filters, all

        routes. Routes of revoked sources are included (read-only, Q-S7-3); routes of archived accounts

        no longer exist (S5 `archiveAccount`). Account facts (name, firm, multiplier, max position,

        opt-ins) come from `listAccounts`; the client joins by `account_id` (two calls, no N+1). After

        `account.changed`, `connection.status_changed` or `route.changed` the client refetches.

        An unknown or foreign `source_id` / `account_id` filter returns an empty list.

        '
      parameters:
      - name: source_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: account_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The routes, sorted by account `display_name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - routing
      operationId: createRoute
      summary: Route a source to an account with the selected signal types
      description: 'Duplicate-protected by its natural key: one route per (source, account). A second create for the same

        pair gets 409 `routing.route_exists` (the client refetches and switches to edit). The account must

        be routable for that source (`listRouteCandidates`); a race is answered with the same code the

        picker showed. Audited as `routing.subscription_changed` (`created`).

        Copy routes of a follower (S19, V1.1) are not created here.

        Step-up (Q35 decided 2026-10-23, S3 AC-10; setting `step_up.q35_persistence_actions` on, server

        configuration only, missing/invalid = on): when the route is enabled by this request

        (`is_enabled` true), whatever the source and the account''s opt-in, the body must carry `step_up`

        for action `route_enable` (target = the account). The code is fresh, with no reuse window. Missing

        → 403 `auth.step_up_required`; wrong → 403 `auth.code_invalid` (`StepUpFailed`). (5.2.0: the

        earlier QA Security M1 narrowing, automated sources only and not after an opt-in accepted with a

        code, is removed; the user confirmed in Q87 (a), 2026-10-24, that every switch-on asks.)

        '
      x-step-up: conditional
      x-step-up-when: is_enabled is true (Q35 decided, setting on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreateRequest'
            examples:
              route:
                value:
                  source_id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                  account_id: 0b9f4c1e-7d2a-4e7b-9a52-3c1d8e6f2a10
                  signal_types:
                  - trigger
                  - trade_plan
                  is_enabled: true
      responses:
        '201':
          description: Created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '409':
          description: '`routing.route_exists` — nothing created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/RouteRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/routes/{route_id}:
    put:
      tags:
      - routing
      operationId: updateRoute
      summary: Change a route's signal types or switch it on/off (optimistic concurrency)
      description: 'Full replacement of `signal_types` and `is_enabled`. Switching off is always accepted. Switching

        on while the account is not eligible for the source is refused with 422 and the blocking reason

        code (same codes as `createRoute`, pointer `/is_enabled`; Q67 b, decided). When an account becomes

        ineligible (automation `declined` / `pending_review`, or unbound), the Core switches its routes

        from that source off and audits `routing.subscription_changed` (`disabled`, cause

        `account_ineligible`); when it becomes eligible again the route stays off (`route_disabled`) until

        the user switches it on. Routes of a revoked source are read-only. Check order after

        authentication, Origin and schema: 404 → 409 `routing.source_revoked` → 409

        `common.version_conflict` → 422. Audited as `routing.subscription_changed` (`updated`, `enabled`

        or `disabled`, with previous and new values).

        Step-up (Q35 decided 2026-10-23, S3 AC-10; setting `step_up.q35_persistence_actions` on, server

        configuration only, missing/invalid = on): when the route goes from off to on by this request,

        whatever the source and the account''s opt-in, the body must carry `step_up` for action

        `route_enable` (target = the account). The code is fresh, with no reuse window. Missing → 403

        `auth.step_up_required`; wrong → 403 `auth.code_invalid` (`StepUpFailed`). Other edits, and

        switching off, need none. (5.2.0: the M1 narrowing is removed; see `createRoute`.)

        '
      x-step-up: conditional
      x-step-up-when: is_enabled changes false → true (Q35 decided, setting on)
      parameters:
      - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdateRequest'
      responses:
        '200':
          description: Saved (a request that changes nothing is not audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`routing.source_revoked` or `common.version_conflict`; nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`routing.automation_not_accepted` / `routing.platform_unbound` (pointer `/is_enabled`) — switching
            on a route whose account is not eligible for the source (Q67 b).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - routing
      operationId: deleteRoute
      summary: Remove a route
      description: 'Open positions and orders are not changed. Routes of a revoked source cannot be removed (409

        `routing.source_revoked`, Q-S7-3). Audited as `routing.subscription_changed` (`removed`).

        '
      parameters:
      - $ref: '#/components/parameters/RouteId'
      responses:
        '204':
          description: Removed and audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`routing.source_revoked` — nothing removed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/route-candidates:
    get:
      tags:
      - routing
      operationId: listRouteCandidates
      summary: Accounts the user can route a source to, the unavailable ones with reasons, and manual-only accounts
      description: 'For the account picker of the route dialog. Accounts that already have a route for the source

        are not listed. Manual-only accounts (S16 AC-7) are never in `candidates`; they are listed in

        `manual_only` with the preset''s reason, for the "Can''t find an account?" explanation (S7 AC-7b).

        Before S16 `manual_only` is always empty. An unknown or foreign `source_id` gets 404.

        '
      parameters:
      - name: source_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCandidates'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/instruments:
    get:
      tags:
      - profiles
      operationId: listInstruments
      summary: Enabled instruments with their exact tick data (global catalog)
      description: Only MNQ in V1. Values are decimal strings; the UI never hard-codes them and does no arithmetic with them.
      responses:
        '200':
          description: The instruments, sorted by symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/default-profiles:
    get:
      tags:
      - profiles
      operationId: listDefaultProfiles
      summary: The caller's default profile for every standard size, for one instrument
      description: 'Always one entry per standard size (25k … 300k, `catalog.standard_account_size`), in size order;

        a size the user has not defined has no `profile` (UI `Não definido`; no invented values, Q-S6-2).

        '
      parameters:
      - $ref: '#/components/parameters/InstrumentIdQuery'
      responses:
        '200':
          description: The defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultProfileList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/default-profiles/{instrument_id}/{size_amount}:
    put:
      tags:
      - profiles
      operationId: putDefaultProfile
      summary: Define or replace the default profile of one standard size (upsert)
      description: 'Idempotent: the same body twice leaves one profile and one audit entry (an unchanged profile is

        not audited). Affects only accounts created afterwards; existing accounts keep their own copy

        (Q-S6-3). A size that is not a standard size gets 404. Audited as `profiles.default_changed`.

        '
      parameters:
      - $ref: '#/components/parameters/InstrumentIdPath'
      - name: size_amount
        in: path
        required: true
        description: A standard size as a decimal string without separators, e.g. `50000` or `50000.00`.
        schema:
          $ref: '#/components/schemas/SizeAmount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceProfile'
            examples:
              usd:
                value:
                  distance_unit: usd
                  stop_distance: '100.10'
                  target_distance: '200.00'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultProfileEntry'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/profiles:
    get:
      tags:
      - profiles
      operationId: listAccountProfiles
      summary: The account's own profiles, one entry per enabled instrument
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account's profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/profiles/{instrument_id}:
    put:
      tags:
      - profiles
      operationId: putAccountProfile
      summary: Customize the account's own profile (the default is not changed)
      description: 'Applies to the next entries only; open positions and working orders are not changed (Q-S6-5).

        `row_version` is required when the account already has a profile for the instrument (stale or

        missing → 409 `common.version_conflict`) and must be absent when it has none (an account created

        while its size had no default, Q43; a `row_version` sent then also gets 409). The same values as

        stored are a no-op (200, not audited, `row_version` unchanged). Audited as `profiles.account_changed` (`edited`).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/InstrumentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileRequest'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` — nothing saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/profiles/{instrument_id}/restore:
    post:
      tags:
      - profiles
      operationId: restoreAccountProfile
      summary: Replace the account's profile with the current default of its size (Q-S6-4)
      description: 'Copies the current default of the size the profile was copied from (`copied_from_size`, which

        keeps the user''s Q60 tie choice). For a profile without one (`set_by_user`) the Core uses the

        account''s size, or the nearest standard size when the size is not a standard one (real, or prop

        outside the standard list, Q73 b); on an exact tie (Q60,

        decided) the body must name `profile_size` (one of `getNearestProfileSize`''s candidates),

        else 422 `profiles.profile_size_required` / `profiles.profile_size_invalid`. An account with no

        profile gets its first copy this way (origin `size_default` / `nearest_size_default`). Optional

        `row_version` (stale → 409 `common.version_conflict`). No-op when the profile already equals that

        default and is not customized (200, not audited). Applies to the next

        entries only. Audited as `profiles.account_changed` (`restored`).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/InstrumentIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                profile_size:
                  description: Only for a `set_by_user` (or missing) profile of an account whose non-standard size is a tie
                    (real, or prop, Q73 b).
                  $ref: '#/components/schemas/SizeAmount'
                row_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`profiles.default_missing` (the size has no default profile yet), `profiles.profile_size_required`
            or `profiles.profile_size_invalid` (pointer `/profile_size`); nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile-sizes/nearest:
    get:
      tags:
      - profiles
      operationId: getNearestProfileSize
      summary: The standard size(s) whose default profile an account of this non-standard size starts from
      description: 'Distance = absolute difference between the account size and each standard size; below the

        smallest standard size the smallest is used, above the largest the largest (PO, Q60). An exact

        tie returns both sizes and the user chooses (`createAccount.profile_size`); Q60 (option c): the

        Core does not choose. If the user later decides "always the smaller" or "always the larger",

        `candidates` simply has one entry. Each candidate says whether the user has a default for it.

        '
      parameters:
      - name: size_amount
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SizeAmount'
      - $ref: '#/components/parameters/InstrumentIdQuery'
      responses:
        '200':
          description: One or two candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearestProfileSize'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile-preview:
    get:
      tags:
      - profiles
      operationId: previewProfile
      summary: Stateless conversion of a stop/target pair to whole ticks, points and dollars (Core arithmetic)
      description: 'Used by `DistanceFields` while the user types (debounced). Stores nothing, audits nothing. Uses

        the same conversion as execution (ADR-0004 §5): points and dollars become whole ticks with the

        instrument''s exact tick size and tick value; a value that is not a whole number of ticks is

        **rounded toward the entry** (down to the tighter distance), reported with `rounded: true`. A

        distance below one tick gets 422 `profiles.distance_below_one_tick`.

        '
      parameters:
      - $ref: '#/components/parameters/InstrumentIdQuery'
      - name: distance_unit
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DistanceUnit'
      - name: stop_distance
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DistanceValue'
      - name: target_distance
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DistanceValue'
      responses:
        '200':
          description: The equivalents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEquivalents'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity:
    get:
      tags:
      - audit
      operationId: listActivity
      summary: The caller's activity entries, newest first, filtered, with a cursor
      description: 'Filters combine with AND; the values inside one array filter combine with OR. Array filters

        repeat the parameter (`account_id=a&account_id=b`). `from` defaults to the retention horizon and

        `to` to now; both are instants (X-8); the UI sends `from` for its period chips (default 24 h), so a

        search or a deep link without `from` covers the whole retained history. `from` after `to` gets 400

        `common.invalid_request` (pointer `/query/from`). `q` is an exact instruction id or `message_id`:

        a UUID-shaped `q` is tried as both; it returns the entries of that instruction, including its

        duplicates (no free-text search). An ingress rejection creates no instruction, so `q` never finds

        `ingress.rejected` entries. An unknown or foreign id in a filter simply matches nothing.

        Paging: the first page resolves `from` / `to` (so `to` = the time of the first request) and the

        filters into `next_cursor`, an opaque token authenticated by the Core (MAC). Later pages send

        `cursor` (and optionally `limit`); filter parameters sent with a cursor must equal the captured

        ones. A tampered, foreign or mismatching cursor gets 400 (pointer `/query/cursor`). Paging is

        eventually consistent: an entry recorded late with an older `occurred_at` may be missed once

        paged past; the "n new entries" banner covers newer ones. Order: newest first by

        (`occurred_at`, event sequence, `id`); `id` breaks ties for old rows without a sequence. The

        cursor carries all three.

        '
      parameters:
      - name: from
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: account_id
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      - name: source_id
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      - name: signal_type
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/AuditSignalType'
      - name: outcome
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AuditOutcome'
      - name: category
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AuditCategory'
      - name: code
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AuditCode'
      - name: q
        in: query
        required: false
        description: Exact instruction id or `message_id`.
        schema:
          type: string
          minLength: 1
          maxLength: 128
