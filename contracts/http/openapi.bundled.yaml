  description: "Canonical, spec-first HTTP contract (ADR-0002 §4). Owner: Software Architect.\nCovers V1-S1 (TradingView webhook\
    \ ingress), V1-S3 (passwordless sign-in by one-time code, invitations,\nsessions, devices, channel changes, sources, NinjaTrader\
    \ connections and pairing) in this root, and in\n`modules/*.yaml` (Compasso): V1-S5 accounts and opt-ins (`accounts`),\
    \ the opt-in rule versions of the\nS16 catalog (`presets`), V1-S7 routing (`routing`), V1-S6 stop/target profiles (`profiles`)\
    \ and V1-S10\nactivity (`audit`). Security rules: auth-and-session-policy.md rev. 2.\nVersion 2.0.0 is breaking (password\
    \ and TOTP removed). Paths stay `/api/v1`: no version was ever deployed\nand there are no external clients, so the path\
    \ major moves only for breaking changes after the first\nproduction deploy (ADR-0002 §4).\nThe Core generates its own\
    \ spec from handlers (utoipa); CI fails on any drift from this file.\n\nConventions\n- Base paths: `/api/v1` (web, cookie\
    \ session), `/ingress/v1` (webhooks), `/adapter/v1` (plugin HTTP;\n  the WebSocket `/adapter/v1` is specified by ADR-0004\
    \ and contracts/adapter-protocol/v1).\n- Authentication: the root `security` requires a full `session` for every operation.\
    \ Public\n  operations declare `security: []`. There are no passwords: a session starts only from a one-time code\n  (`verifyLoginCode`,\
    \ `completeSignup`).\n  Every session operation answers 401 `auth.unauthenticated` without a valid session.\n- JSON only\
    \ (`application/json; charset=utf-8`), except the ingress which also accepts `text/plain`.\n- Decimals are strings; timestamps\
    \ are RFC 3339 UTC with `Z`; ids are lowercase UUIDs.\n- Errors: `{\"error\": {\"code\": \"<stable.code>\", ...}}`. Clients\
    \ translate codes; never rely on text.\n  - Any `/api/v1` or `/adapter/v1` request that does not match its schema (malformed\
    \ JSON, unknown or\n    missing property, pattern/length/enum violation, malformed path or query parameter) gets\n   \
    \ 400 `common.invalid_request` with `error.pointer` (JSON pointer to the first offending field;\n    `/path/<name>` or\
    \ `/query/<name>` for parameters). Framework default error bodies are never sent.\n  - Unexpected failures get 500 `common.internal`\
    \ with no detail (no path, query, stack or SQL).\n  - The ingress is the exception: its token and path-parameter violations\
    \ are always the empty 404\n    (S1 AC-2), and its body errors use the `ingress.*` codes.\n- CSRF: state-changing `/api/v1`\
    \ requests (POST, PUT, PATCH, DELETE), public ones included, require\n  `SameSite=Lax` cookies plus a strict `Origin`\
    \ check (must equal the app origin); a missing or\n  different `Origin` gets 403 `common.forbidden_origin`. The rule does\
    \ not apply to `/ingress/v1`\n  (TradingView sends no `Origin`) nor to `/adapter/v1` (the plugin is not a browser).\n\
    - Sensitive operations are marked `x-step-up: true`, or `x-step-up: conditional` with the condition\n  in `x-step-up-when`.\
    \ Every such operation is POST or PUT, and its JSON body has an optional `step_up`\n  property (`StepUpProof`: `challenge_id`\
    \ + `code`). The client first calls `requestStepUp` for that\n  action and target; one code authorizes one action (auth\
    \ policy §6). Missing proof → 403\n  `auth.step_up_required`; a wrong, expired, used or mismatched proof → 403 `auth.code_invalid`.\n\
    \  The proof travels in the body, never in a header, so access logs cannot record it.\n- One-time codes: every verification\
    \ failure is the single `auth.code_invalid` (401 when signing in or up,\n  403 on an authenticated operation); code requests\
    \ always answer 202 (auth policy §3).\n- Check precedence (first failure wins): 401 `auth.unauthenticated` → 403 `common.forbidden_origin`\n\
    \  → 403 `auth.forbidden` (admin operations, non-admin caller) → 400 `common.invalid_request` →\n  404 `common.not_found`\
    \ → 403 `auth.step_up_required` / `auth.code_invalid` → operation-specific 409/422.\n  A non-admin therefore never sees\
    \ `auth.step_up_required` on an admin operation.\n- Secrets (session and device cookies, ingress token, invitation tokens,\
    \ one-time codes, challenge\n  tokens, pairing codes, device tokens) are never logged; e-mail addresses and phone numbers\
    \ are masked (ADR-0001 §5, auth policy §3). One-time values are\n  returned exactly once.\n- Response headers (ADR-0001\
    \ §9): every Core response (`/api`, `/ingress`, `/adapter`) carries\n  `X-Content-Type-Options: nosniff` and `Cache-Control:\
    \ no-store`. Responses that carry a one-time\n  secret also declare `Cache-Control` explicitly. HSTS is set by Caddy;\
    \ page headers (CSP etc.) by Next.js.\n- Rate-limited responses are 429 with a `Retry-After` header (seconds).\n- Audit:\
    \ every automatic action and every security-relevant change is written to the affected\n  user's visible audit log with\
    \ its reason. Admin actions on a user are written to **that user's**\n  audit log, with the acting admin's id.\n"
