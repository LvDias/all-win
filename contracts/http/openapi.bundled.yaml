        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: 'The basis of `pnl`. From 3.5.0 always `net` (after commissions; user decision 2026-10-23,

            S21 AC-1); `gross` is kept in the enum only for compatibility with 3.4 readers.

            '
        total_gross_pnl:
          $ref: '#/components/schemas/Money'
        total_commission:
          $ref: '#/components/schemas/MoneyString'
        uncommissioned_count:
          type: integer
          minimum: 0
          description: Trades with `commission_source` `none` (the UI warns that their net equals gross).
    ManualTradeFields:
      type: object
      required:
      - account_id
      - instrument_id
      - direction
      - quantity
      - entry_time
      - entry_price
      - exit_time
      - exit_price
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        direction:
          $ref: '#/components/schemas/TradeDirection'
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        entry_time:
          $ref: '#/components/schemas/Timestamp'
        entry_price:
          $ref: '#/components/schemas/Price'
        exit_time:
          $ref: '#/components/schemas/Timestamp'
        exit_price:
          $ref: '#/components/schemas/Price'
        mae:
          $ref: '#/components/schemas/ExcursionInput'
        mfe:
          $ref: '#/components/schemas/ExcursionInput'
        commission:
          description: 'Optional total commission of the trade, USD ≥ 0. Absent → the account''s

            `commission_per_contract_side` × quantity × 2 sides (`commission_source: configured`), or 0

            when the account has none (`commission_source: none`, labelled "comissões não informadas").

            '
          $ref: '#/components/schemas/ExcursionInput'
    ExcursionInput:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,2})?$
      description: USD, ≥ 0, at most 2 decimals (Q52).
    ManualTradeRequest:
      allOf:
      - $ref: '#/components/schemas/ManualTradeFields'
      unevaluatedProperties: false
    ManualTradeUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/ManualTradeFields'
      - type: object
        required:
        - row_version
        properties:
          row_version:
            type: integer
            minimum: 1
      unevaluatedProperties: false
    ManualTradePreview:
      type: object
      additionalProperties: false
      required:
      - duration_seconds
      - pnl
      - pnl_basis
      - gross_pnl
      - commission
      - commission_source
      properties:
        duration_seconds:
          type: integer
          minimum: 0
        pnl:
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: '`net` from 3.5.0.'
        gross_pnl:
          $ref: '#/components/schemas/Money'
        commission:
          $ref: '#/components/schemas/MoneyString'
        commission_source:
          $ref: '#/components/schemas/CommissionSource'
    TradeCapturedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - trade_id
      - account_id
      description: A trade was captured or entered (drives the "n new trades" banner); the client refetches.
      properties:
        type:
          const: trade.captured
        at:
          $ref: '#/components/schemas/Timestamp'
        trade_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        origin:
          $ref: '#/components/schemas/TradeOrigin'
