      responses:
        '200':
          description: The preset version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetVersion'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/preset:
    get:
      tags:
      - presets
      operationId: getAccountPreset
      summary: The account's preset version, each rule value with its origin, and a newer version if any
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account's preset state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPresetState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: '`common.not_found` — unknown or foreign account, or an account without a preset.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/preset-diff:
    get:
      tags:
      - presets
      operationId: getAccountPresetDiff
      summary: What applying a newer version of the account's preset would change (comparison dialog)
      description: 'Only fields that differ between the account, its current preset version and the target version.

        `requires_choice` marks rows the apply request must answer (an edited field, or a field that is

        not confirmed in the target). The target must be a newer version of the same preset (422

        `presets.version_not_newer`).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: target_preset_version_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetDiff'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`presets.version_not_newer` (pointer `/query/target_preset_version_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/preset-version:
    post:
      tags:
      - presets
      operationId: applyPresetVersion
      summary: Apply a newer version of the account's preset, with a choice for every field that needs one (S16 AC-3)
      description: 'One save, audited as `presets.version_applied` (old and new version, every changed field). Never

        touches open positions or working orders. For every `requires_choice` row of the diff the body has

        either `choices.<field>` (`keep_mine` / `use_preset`, for edited fields; nothing preselected,

        Q-S16-4) or `rule_values.<field>` (the user''s value, for not-confirmed fields), else 422

        `presets.choice_required` (pointer `/choices/<field>`). A required not-confirmed field left

        unresolved gets 422 `presets.required_field_unresolved` (pointer `/rule_values/<field>`; the

        maximum position is always resolved, because `max_position_qty` is required). When the

        target changes the opt-in rule version, `opt_ins` must carry the new choices (S5 D16); step-up when

        an `accepted` choice changes the stored state (action `account_opt_in_accept`, target = account).

        Choices made in `opt_ins` are audited as `accounts.opt_in_chosen` as well. A not-confirmed

        maximum position is resolved by the top-level `max_position_qty` (any value up to the highest

        published value; the Core records whether it equals a published one).

        Check order after authentication, Origin and schema: 404 → step-up → 409 → 422.

        '
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted that changes the stored state
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPresetVersionRequest'
      responses:
        '200':
          description: Applied and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPresetState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Nothing saved. `common.version_conflict` (stale `row_version`); `presets.version_superseded`

            (a newer version than the target was published meanwhile; reload the diff);

            `accounts.rule_version_changed` (an `opt_ins` choice names a stale rule version).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Nothing saved. `presets.version_not_newer` (`/target_preset_version_id`);

            `presets.choice_required` (`/choices/<field>`); `presets.required_field_unresolved`

            (`/rule_values/<field>`); `accounts.max_position_exceeds_preset` (`/max_position_qty`; the new

            cap is lower than the account''s value and the body did not lower it);

            `accounts.opt_in_required` (`/opt_ins/<kind>`); `accounts.firm_platform_required` /

            `accounts.firm_platform_unknown` (`/firm_platform`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/preset-values/{field}/restore:
    post:
      tags:
      - presets
      operationId: restorePresetValue
      summary: Replace an edited rule value of the account with the value of its preset version (S16-04)
      description: 'Audited as an account edit (`presets.value_restored`, old and new value). The preset is never

        modified. A field whose preset value is not confirmed cannot be restored (422

        `presets.value_not_confirmed`); a field that is not edited is a no-op (200, not audited).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: field
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RuleField'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - row_version
              properties:
                row_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPresetState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`presets.value_not_confirmed` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/risk:
    get:
      tags:
      - risk
      operationId: getAccountRisk
      summary: The account's current risk state for today's trading day (used vs limit per rule)
      description: 'Every figure, percent and state is computed by the Core from execution results and plugin-reported

        P&L (S13 AC-2); manual trades (S21, origin `manual`) do not enter daily loss, drawdown, profit

        target, consistency or blocks, and never unblock an account (PO rule: S13 AC-2 + S21 AC-3, PO clarification, slice-plan
        rev. 7); the UI renders it and does no arithmetic (X-3). `stale` is true when the data is

        not fresh (connection down or no recent report): the UI then never shows the values as current.

        Refetch after `risk.state_changed`.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The risk state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRisk'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/risk-summaries:
    get:
      tags:
      - risk
      operationId: listRiskSummaries
      summary: The worst risk state of each of the caller's accounts (account list column)
      responses:
        '200':
          description: One summary per live account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskSummaryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/risk-rules:
    get:
      tags:
      - risk
      operationId: getAccountRiskRules
      summary: The account's risk rules for the edit form, with provenance for prop accounts with a preset
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRiskRules'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - risk
      operationId: putAccountRiskRules
      summary: Set the account's risk rules (full replacement; optimistic concurrency by the limits `version`)
      description: 'An absent optional rule means "not set" (no warning, no refusal for it). Q48:

        a stricter value applies at once, a looser one from the next trading day (`AccountRisk.pending_changes`).

        A change of the reset time, and a change of drawdown type, always apply from the next trading

        day (`pending_reset_change`, `pending_changes[].change: drawdown_type_changed`).

        Looser means a higher limit or target, and also: removing a rule (absent = no limit), changing

        `profit_target_on_reach` from `flatten_and_block` to `notify`, and changing `daily_loss_limit.kind`

        from `hard` to `soft_pause` or `none` (QA Security L1); each is audited and listed in

        `pending_changes` until it applies. The latest save of a rule wins over an earlier pending value

        (ADR-0006 §3.7). Any write of the account''s limits (this operation, `applyPresetVersion`,

        `restorePresetValue`, a preset re-selection in `updateAccount`) bumps the version, so a form

        opened before it gets 409 `common.version_conflict`.

        When the new rules would already be reached today, the body must carry `acknowledge_reached: true`

        (the dialog of the edit form; `previewAccountRiskRules` tells beforehand), else 409

        `risk.reached_not_acknowledged` and nothing is saved. The rule values belong to the account

        (`accounts` module): each save bumps the account''s limits version and emits

        `account.limits_changed`; the risk module derives the limits from it (ADR-0006) and only then

        sends `limits` to the plugin. Until the derivation is done, `getAccountRisk.limits_pending` is

        true and new entries are skipped with `routing.limits_pending` (exits continue). Audited as

        `risk.rules_changed`. No step-up in V1 (Q35).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRulesRequest'
            examples:
              prop:
                value:
                  version: 4
                  rules:
                    drawdown:
                      type: trailing_eod
                      amount: '2500.00'
                    daily_loss_limit:
                      kind: hard
                      amount: '1000.00'
                    daily_profit_target:
                      amount: '600.00'
                    profit_target_on_reach: notify
                    consistency_threshold_pct: '30'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRiskRules'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` or `risk.reached_not_acknowledged`; nothing saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/RiskRulesRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/risk-rules/preview:
    post:
      tags:
      - risk
      operationId: previewAccountRiskRules
      summary: When each changed rule would take effect and whether it would already be reached (validate only)
      description: Stores nothing and audits nothing. Same validation as `putAccountRiskRules` (same 422 codes).
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRulesRequest'
      responses:
        '200':
          description: The effect of each changed rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRulesPreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/RiskRulesRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications:
    get:
      tags:
      - notifications
      operationId: listNotifications
      summary: The caller's notifications, critical unread first, then newest first, with a cursor
      description: 'One set of notifications per user, shared by the Web and the plugin (Q-S18-4): the same

        `notification_id` and `revision` on both channels. Order: unread `critical` items first, then by

        `updated_at` (last occurrence), newest first, ties by `notification_id`. `next_cursor` is opaque,

        authenticated by the Core (MAC) and bound to the filters (a tampered or mismatching cursor gets

        400, pointer `/query/cursor`). Retention equals the audit''s (24 months; Q-S18-6). Every response

        carries the current unread count, so the bell never counts.

        '
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - unread
          - read
          default: all
      - name: category
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AuditCategory'
      - name: account_id
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/unread-count:
    get:
      tags:
      - notifications
      operationId: getUnreadCount
      summary: Unread count and worst unread severity (bell and shell)
      description: The same pair the adapter protocol 1.3 snapshot carries; authoritative (the client never counts).
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      operationId: markNotificationRead
      summary: Mark one notification read (idempotent)
      description: 'Sets `read_at` and bumps `revision` (so the plugin''s upsert sees it); already read → 200 with the

        item unchanged. Reading never changes or hides the state it reports (a block, a risk level, an out-

        of-sync flag stays visible in banners and badges). A later occurrence of a grouped item makes it

        unread again only when its registry code has `reopen_on_occurrence: true` (Q68 b: the

        `danger` routing codes); otherwise only `count` and `updated_at` change. Emits `notification.read`.

        '
      parameters:
      - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The item and the new unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkReadResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/read:
    post:
      tags:
      - notifications
      operationId: markNotificationsRead
      summary: Mark several notifications read — a list of ids, or everything up to an instant (idempotent)
      description: 'Either `notification_ids` (≤ 200; unknown or foreign ids are ignored, never reported) or `up_to`

        (every unread item, optionally limited by `category` / `account_id`, whose `updated_at` is at or

        before `up_to`, so an item that arrives while the user clicks "mark all" stays unread). Returns the

        new unread count. Emits one `notification.read`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkManyRequest'
            examples:
              all:
                value:
                  up_to: '2026-10-23T14:31:05Z'
      responses:
        '200':
          description: The new unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trades:
    get:
      tags:
      - trades
      operationId: listTrades
      summary: The caller's completed trades, filtered and sorted, with a cursor
      description: 'Filters combine with AND, values in one array with OR (repeat the parameter). `from` / `to` filter

        on the **exit time** (Q53); both are instants and optional (absent = unbounded);

        `from` after `to` gets 400 (pointer `/query/from`). `origin` selects routed / master / manual /

        platform trades; `source_id` selects routed trades of those sources. Trades of archived accounts

        stay listed (`account_deleted`); trades are kept for the life of the user account (S10 AC-3).

        `next_cursor` is opaque, authenticated by the Core (MAC) and bound to the filters and the sort

        (tamper or mismatch → 400, pointer `/query/cursor`). Ties are broken by `trade_id`.

        `getTradesSummary` with the same filters gives the count and total P&L of the whole set.

        '
      parameters:
      - $ref: '#/components/parameters/TradeFrom'
      - $ref: '#/components/parameters/TradeTo'
      - $ref: '#/components/parameters/TradeAccountIds'
      - $ref: '#/components/parameters/TradeSourceIds'
      - $ref: '#/components/parameters/TradeOrigins'
      - $ref: '#/components/parameters/TradeSignalTypes'
      - $ref: '#/components/parameters/TradeRecordedBefore'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - exit_time
          - pnl
          - duration
          default: exit_time
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - trades
      operationId: createManualTrade
      summary: Record a trade the platform did not capture (origin `manual`, S21 AC-3)
      description: 'Idempotent by `Idempotency-Key` (same rules as `createAccount`: same key and body within 24 h →

        200 with the trade created first; different body or after 24 h → 409

        `trades.idempotency_key_reused`; never a second trade). Duration, gross P&L, commission and net

        P&L are computed by the Core (net is the main value; the commission is the typed one, else the

        account floor); MAE / MFE are optional (Q55). The

        account may be active, paused or disabled, not archived. Audited as `trades.manual_created`.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTradeRequest'
            examples:
              buy:
                value:
                  account_id: 0b9f4c1e-7d2a-4e7b-9a52-3c1d8e6f2a10
                  instrument_id: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                  direction: long
                  quantity: 2
                  entry_time: '2026-10-23T13:30:05Z'
                  entry_price: '21234.50'
                  exit_time: '2026-10-23T13:42:35Z'
                  exit_price: '21240.25'
      responses:
        '200':
          description: Replay of a create already done with this key; the trade, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '201':
          description: Created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          description: '`trades.idempotency_key_reused` — nothing created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ManualTradeRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trades/summary:
    get:
      tags:
      - trades
      operationId: getTradesSummary
      summary: Count and total P&L of the whole filtered set (the same figures S22 uses)
      parameters:
      - $ref: '#/components/parameters/TradeFrom'
      - $ref: '#/components/parameters/TradeTo'
      - $ref: '#/components/parameters/TradeAccountIds'
      - $ref: '#/components/parameters/TradeSourceIds'
      - $ref: '#/components/parameters/TradeOrigins'
      - $ref: '#/components/parameters/TradeSignalTypes'
      - $ref: '#/components/parameters/TradeRecordedBefore'
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trades/{trade_id}:
    get:
      tags:
      - trades
      operationId: getTrade
      summary: One trade (detail panel)
      parameters:
      - $ref: '#/components/parameters/TradeId'
      responses:
        '200':
          description: The trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - trades
      operationId: updateManualTrade
      summary: Correct a manual trade (Q56); captured trades are never editable
      description: 'Full replacement of the manual fields, with `row_version` (stale → 409 `common.version_conflict`).

        A captured trade (`origin` ≠ `manual`) gets 409 `trades.not_editable`. Audited as

        `trades.manual_changed` with previous and new values. Check order after authentication, Origin and

        schema: 404 → 409 → 422.

        '
      parameters:
      - $ref: '#/components/parameters/TradeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTradeUpdateRequest'
      responses:
        '200':
          description: Saved and audited (no change → 200, not audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`trades.not_editable` or `common.version_conflict`; nothing saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ManualTradeRejected'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - trades
      operationId: deleteManualTrade
      summary: Delete a manual trade (Q56)
      description: 'The trade leaves the list and the metrics; the audit entry `trades.manual_deleted` keeps its

        values. `row_version` is required (stale → 409 `common.version_conflict`); a captured trade gets

        409 `trades.not_editable`.

        '
      parameters:
      - $ref: '#/components/parameters/TradeId'
      - name: row_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Deleted and audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`trades.not_editable` or `common.version_conflict`; nothing deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/trade-preview:
    get:
      tags:
      - trades
      operationId: previewManualTrade
      summary: Duration and P&L of a manual trade before saving (stateless, Core arithmetic)
      description: Stores nothing, audits nothing. Same validation and same 422 codes as `createManualTrade`.
      parameters:
      - name: account_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: instrument_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: direction
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TradeDirection'
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - name: entry_time
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: entry_price
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Price'
      - name: exit_time
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: exit_price
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Price'
      - name: commission
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExcursionInput'
      responses:
        '200':
          description: The computed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualTradePreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ManualTradeRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/performance:
    get:
      tags:
      - performance
      operationId: getPerformance
      summary: Totals and per-trade averages for a period and a set of accounts, split by source and signal type
      description: 'The trade set is exactly `listTrades` with the same `from` / `to` (exit time, Q53) and

        `account_id` filters, restricted to trades recorded at or before `as_of` (S22 AC-2). `as_of` is

        the instant of this computation; pass it as `recorded_before` to `listTrades` /

        `getTradesSummary` to show the same set (a manual edit or delete after `as_of` is the only way

        the two can differ, and it raises `trade.captured` / the audit). Every figure is computed by the

        Core with exact decimals (X-3); the browser does no arithmetic, bar lengths included.

        Rounding: half away from zero (a negative average −12.345 → −12.35, symmetric with positives):

        money averages to 2 decimals; `win_rate` to one decimal (Q-S22-2); `avg_duration_seconds` to whole

        seconds; `bar_ratio` to 4 decimals. Averages are

        absent (UI `—`) when no trade enters them. Totals exist only for P&L and the number of trades;

        time, MAE and MFE are averages only (Q-S22-3).

        Isolation (X-2): an unknown or another user''s `account_id` simply matches nothing, as in

        `listTrades` / `listActivity` (empty totals and groups; never a different status such as 404), so

        the response never reveals whether an account exists. Required test: two users, each filtering by

        the other''s account id, get `trade_count` 0 and no groups (QA Security, 3.4.0 info).

        '
      parameters:
      - $ref: '#/components/parameters/TradeFrom'
      - $ref: '#/components/parameters/TradeTo'
      - $ref: '#/components/parameters/TradeAccountIds'
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - source_signal
          - source
          - signal_type
          default: source_signal
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - total_pnl
          - trade_count
          - avg_pnl
          - win_rate
          default: total_pnl
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aw_session
      description: Server-side session (HttpOnly; Secure; SameSite=Lax; Path=/).
  headers:
    RetryAfter:
      description: Seconds to wait.
      schema:
        type: integer
        minimum: 1
    SessionCookie:
      description: '`__Host-aw_session=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/` (Max-Age only when remember_me).'
      schema:
        type: string
    SessionCookieClear:
      description: Expires the session cookie.
      schema:
        type: string
    SessionAndDeviceCookies:
      description: '`__Host-aw_session` (as SessionCookie) and, when the browser has no valid device cookie of this user,

        `__Host-aw_device=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=34560000` (400 days;

        auth policy §5.2). Only an unknown or revoked value is replaced. A value that is valid for **another**

        user of the same browser is kept, and this user gets their own device row with the same value, so a

        shared browser stays a known device for each of its users.

        '
      schema:
        type: string
    SessionAndDeviceCookiesClear:
      description: Expires the session and device cookies.
      schema:
        type: string
    NoStore:
      description: The response carries a one-time secret; no cache may store it.
      schema:
        type: string
        const: no-store
  parameters:
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChangeId:
      name: change_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated by the client once per create submission; reused on retries (not a secret).
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FirmId:
      name: firm_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PresetVersionId:
      name: preset_version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstrumentIdPath:
      name: instrument_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstrumentIdQuery:
      name: instrument_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TradeId:
      name: trade_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TradeFrom:
      name: from
      in: query
      required: false
      description: Exit time at or after this instant (Q53).
      schema:
        $ref: '#/components/schemas/Timestamp'
    TradeTo:
      name: to
      in: query
      required: false
      description: Exit time before this instant.
      schema:
        $ref: '#/components/schemas/Timestamp'
    TradeAccountIds:
      name: account_id
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/Uuid'
    TradeSourceIds:
      name: source_id
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/Uuid'
    TradeOrigins:
      name: origin
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 4
        items:
          $ref: '#/components/schemas/TradeOrigin'
    TradeRecordedBefore:
      name: recorded_before
      in: query
      required: false
      description: Only trades recorded (captured or entered) at or before this instant — pass `getPerformance.as_of` to see
        exactly the set S22 measured (S22 AC-2).
      schema:
        $ref: '#/components/schemas/Timestamp'
    TradeSignalTypes:
      name: signal_type
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 4
        items:
          $ref: '#/components/schemas/AuditSignalType'
  responses:
    Unauthenticated:
      description: '`auth.unauthenticated` (no session, or expired). Web redirects to sign-in with `?reason=session_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: '`auth.rate_limited`.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpFailed:
      description: '`auth.step_up_required` (the body has no `step_up` proof: call `requestStepUp`, then retry with

        `step_up: { challenge_id, code }`), `auth.code_invalid` (the proof is wrong, expired, used, bound to

        another session, action or target: one code for all), or `common.forbidden_origin`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error:
                  code: auth.step_up_required
            invalid:
              value:
                error:
                  code: auth.code_invalid
    CodeInvalid:
      description: '`auth.code_invalid` — wrong, expired, used, invalidated after 5 wrong attempts, unknown or forged challenge
        (one code for all; auth policy §3).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CodeInvalidOrOrigin:
      description: '`auth.code_invalid` (as CodeInvalid) or `common.forbidden_origin`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`auth.forbidden` (not a platform admin); or `common.forbidden_origin` on state-changing requests.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrStepUp:
      description: '`auth.forbidden` (not a platform admin; checked first, so a non-admin never gets a step-up prompt),

        `auth.step_up_required`, `auth.code_invalid` (as StepUpFailed), or `common.forbidden_origin`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrigin:
      description: '`common.forbidden_origin` — state-changing `/api/v1` request without a matching `Origin` header.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: '`common.invalid_request` — the request does not match its schema; `error.pointer` locates the first offending
        field.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            body:
              value:
                error:
                  code: common.invalid_request
                  pointer: /name
            path:
              value:
                error:
                  code: common.invalid_request
                  pointer: /path/source_id
    InternalError:
      description: '`common.internal` — unexpected failure; the body carries no detail.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`common.not_found` — also returned for resources of another user (never 403, so existence is not revealed).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvitationInvalid:
      description: '`auth.invitation_invalid` — one code for unknown, used, expired or revoked.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountWriteConflict:
      description: "Nothing saved. Codes (pointer where shown):\n- `accounts.idempotency_key_reused` (create only; same key\
        \ with a different body, or reuse after 24 h; never a second account);\n- `common.version_conflict` (update; stale\
        \ `row_version`, reload);\n- `accounts.name_taken` — `/display_name` (case-insensitive, among the caller's live accounts);\n\
        - `accounts.platform_account_taken` — `/binding` (already bound to another of the caller's\n  accounts; a platform\
        \ account of another user is never reported as taken, see 422);\n- `accounts.binding_open_position` — `/binding` (update;\
        \ Q38);\n- `accounts.rule_version_changed` — `error.current_rule_version_id` (an `opt_ins` choice names a\n  rule\
        \ version that is no longer the one in force for the selection).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            name_taken:
              value:
                error:
                  code: accounts.name_taken
                  pointer: /display_name
            rule_version_changed:
              value:
                error:
                  code: accounts.rule_version_changed
                  current_rule_version_id: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d
    AccountWriteRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers:\n- `accounts.opt_in_required` — `/opt_ins/automation`\
        \ or `/opt_ins/copy`;\n- `accounts.opt_in_not_applicable` — `/opt_ins/<kind>` (the kind is `not_required` for the\n\
        \  selection, or `opt_ins` on update of a real account; on create a real account with `opt_ins`\n  is a schema error,\
        \ 400); the client refetches and drops the section;\n- `accounts.max_position_exceeds_preset` — `/max_position_qty`\
        \ (above the preset maximum);\n- `accounts.preset_version_unknown` — `/preset_version_id` (unknown, withdrawn, or\
        \ a superseded\n  version on create);\n- `accounts.firm_platform_required` / `accounts.firm_platform_unknown` — `/firm_platform`;\n\
        - `accounts.platform_account_unknown` — `/binding` (no such platform account on a connection of\n  the caller, or\
        \ the connection is unpaired; identical for another user's connection);\n- `accounts.platform_account_kind_not_allowed`\
        \ — `/binding` (`live` or `unknown` kind outside\n  production; ADR-0004 §8);\n- `accounts.profile_size_required`\
        \ / `accounts.profile_size_invalid` — `/profile_size` (create of\n  a real account whose size is a tie between two\
        \ standard sizes; Q60);\n- `presets.required_field_unresolved` — `/rule_values/<field>` or `/max_position_qty` (a\
        \ required\n  rule field of the preset is not confirmed and the body does not resolve it; S16 AC-6);\n- `presets.use_apply_version`\
        \ — `/preset_version_id` (update to a newer version of the same\n  preset; use `applyPresetVersion`);\n- `accounts.rule_values_without_selection_change`\
        \ — `/rule_values` (update with the same preset\n  selection; edit rules with `putAccountRiskRules`).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            opt_in_required:
              value:
                error:
                  code: accounts.opt_in_required
                  pointer: /opt_ins/automation
    DistanceRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers (`/query/...` on the preview):\n- `profiles.distance_below_one_tick`\
        \ — `/stop_distance` or `/target_distance` (zero, or less than\n  one tick after conversion);\n- `profiles.distance_too_large`\
        \ — `/stop_distance` or `/target_distance` (more than 10 000 ticks).\nA value whose shape does not fit its unit (fractional\
        \ ticks, dollars with more than 2 decimals)\nis a schema error: 400 `common.invalid_request` with the pointer.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            below_one_tick:
              value:
                error:
                  code: profiles.distance_below_one_tick
                  pointer: /stop_distance
    RiskRulesRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers (under `/rules/...`):\n- `risk.required_value_unresolved`\
        \ — the field (a required preset value is not confirmed and not resolved);\n- `risk.daily_loss_required` — `/rules/daily_loss_limit`\
        \ (prop account whose preset does not say\n  \"none\"; Q47);\n- `risk.flatten_requires_enforcement` — `/rules/profit_target_on_reach`\
        \ (`flatten_and_block` while\n  enforcement is off; Q49);\n- `risk.reset_not_editable` — `/rules/trading_day_reset`\
        \ (real accounts use the CME session close);\n- `risk.consistency_not_applicable` — `/rules/consistency_threshold_pct`\
        \ (real account, or the\n  preset has no consistency rule);\n- `risk.amount_invalid` — the field (zero where a positive\
        \ amount is required).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            flatten:
              value:
                error:
                  code: risk.flatten_requires_enforcement
                  pointer: /rules/profit_target_on_reach
    RouteRejected:
      description: "Valid shape, refused by a rule; nothing created. Codes and pointers:\n- `routing.source_unknown` — `/source_id`\
        \ (unknown or another user's; identical);\n- `routing.source_revoked` — `/source_id`;\n- `routing.account_unknown`\
        \ — `/account_id` (unknown, archived or another user's; identical);\n- `routing.account_manual_only` — `/account_id`\
        \ (S16 AC-7);\n- `routing.automation_not_accepted` — `/account_id` (automated source; the account's automation\n \
        \ opt-in is `declined` or `pending_review`);\n- `routing.platform_unbound` — `/account_id` (Q37).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_accepted:
              value:
                error:
                  code: routing.automation_not_accepted
                  pointer: /account_id
    ManualTradeRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers:\n- `trades.exit_before_entry` — `/exit_time`\
        \ (exit not after entry);\n- `trades.in_future` — `/entry_time` or `/exit_time`;\n- `trades.not_tick_multiple` — `/entry_price`\
        \ or `/exit_price` (prices must be whole ticks of the\n  instrument; unlike profile distances they are never rounded);\n\
        - `trades.account_unknown` — `/account_id` (unknown, archived or another user's; identical);\n- `trades.instrument_unknown`\
        \ — `/instrument_id` (not enabled).\nOn the preview the pointers are `/query/<name>`.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            exit_before_entry:
              value:
                error:
                  code: trades.exit_before_entry
                  pointer: /exit_time
  schemas:
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    Timestamp:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$
    Locale:
      type: string
      enum:
      - pt-BR
      - en
    TimeZone:
      type: string
      description: IANA time zone name, validated by the Core against its tz database.
      pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
      maxLength: 64
    DisplayName:
      type: string
      minLength: 1
      maxLength: 60
    TokenBody:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          maxLength: 128
    ErrorCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            pointer:
              type: string
              maxLength: 256
              description: JSON pointer to the offending request field.
            retry_after_s:
              type: integer
              minimum: 1
            current_rule_version_id:
              $ref: '#/components/schemas/Uuid'
    IngressAccepted:
      type: object
      additionalProperties: false
      required:
      - status
      - instruction_id
      properties:
        status:
          type: string
          enum:
          - accepted
          - duplicate
        instruction_id:
          $ref: '#/components/schemas/Uuid'
    IngressRejected:
