              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  $ref: '#/components/schemas/DisplayName'
                step_up:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '201':
          description: Created, awaiting pairing.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - connection
                - pairing
                properties:
                  connection:
                    $ref: '#/components/schemas/Connection'
                  pairing:
                    $ref: '#/components/schemas/PairingCode'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '409':
          description: '`connections.name_taken` (case-insensitive, among the user''s connections that are not unpaired).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{connection_id}:
