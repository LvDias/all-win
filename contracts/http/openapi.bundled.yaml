    NotificationSeverity:
      type: string
      enum:
      - info
      - success
      - warning
      - danger
      - critical
      description: 'Set by the Core from the registry. Web behaviour (S18 §3/§5): `info` / `warning` update the bell

        silently; `success` uses the success colour; `danger` raises a destructive toast; `critical` is the

        top severity of the ADRs and shows the `CriticalBanner`, which stays until the item is read

        (Q51). The plugin may map `success` → `info` and `danger` → `warning` in its UI; the

        protocol carries the five values unchanged.

        '
    NotificationCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      maxLength: 96
      description: A code of the registry (`contracts/notifications/v1/registry.json`); `NotificationParamsByCode` lists them
        with their params. Unknown codes are shown with the fallback "Aviso {code}".
    NotificationTarget:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      description: Structured link; the client builds the URL (Web route; plugin `welcome.app_url` + route). Never a URL in
        the payload.
      properties:
        kind:
          type: string
          enum:
          - account
          - connection
          - instruction
          - route
          - activity_entry
        id:
          $ref: '#/components/schemas/Uuid'
    Notification:
      type: object
      additionalProperties: false
      required:
      - notification_id
      - revision
      - code
      - category
      - severity
      - params
      - count
      - created_at
      - updated_at
      properties:
        notification_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
          description: Monotonic per `notification_id`; every change (new occurrence, read) bumps it. Clients upsert only
            with a higher revision.
        code:
          $ref: '#/components/schemas/NotificationCode'
        category:
          $ref: '#/components/schemas/AuditCategory'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot (Web only; the plugin shows its platform account name).
        params:
          type: object
          description: Typed per code — `NotificationParamsByCode[code]` (the same schemas as `params.schema.json`). For grouped
            items, the params of the last occurrence.
        count:
          type: integer
          minimum: 1
          description: Occurrences grouped into this item (same code + account + trading day; registry `grouping`, and `reopen_on_occurrence`
            for whether a new occurrence marks it unread). The audit keeps one entry per occurrence.
        source_event_ids:
          type: array
          maxItems: 50
          description: event_ids of the adapter→Core messages aggregated (only for notifications caused by plugin events).
          items:
            $ref: '#/components/schemas/Uuid'
        audit_entry_id:
          description: The audit entry of the last occurrence (Web link "Ver no registro").
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          description: The last occurrence (equals `created_at` while `count` is 1) or the last change.
          $ref: '#/components/schemas/Timestamp'
        read_at:
          $ref: '#/components/schemas/Timestamp'
        target:
          $ref: '#/components/schemas/NotificationTarget'
    UnreadCount:
      type: object
      additionalProperties: false
      required:
      - unread_count
      properties:
        unread_count:
          type: integer
          minimum: 0
        worst_severity:
          description: The worst severity among unread items; absent when there are none.
          $ref: '#/components/schemas/NotificationSeverity'
    NotificationPage:
      type: object
      additionalProperties: false
      required:
      - notifications
      - unread
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type: string
          description: Absent on the last page.
        unread:
          $ref: '#/components/schemas/UnreadCount'
    MarkReadResult:
      type: object
      additionalProperties: false
      required:
      - notification
      - unread
      properties:
        notification:
          $ref: '#/components/schemas/Notification'
        unread:
          $ref: '#/components/schemas/UnreadCount'
    MarkManyRequest:
      type: object
      additionalProperties: false
      properties:
        notification_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        up_to:
          $ref: '#/components/schemas/Timestamp'
        category:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AuditCategory'
        account_id:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      oneOf:
      - required:
        - notification_ids
        not:
          anyOf:
          - required:
            - up_to
          - required:
            - category
          - required:
            - account_id
      - required:
        - up_to
        not:
          required:
          - notification_ids
    ParamsOptInSuspendedByFirm:
      type: object
      additionalProperties: false
      required:
      - kind
      - firm_id
      - firm_name
      - account_count
      - rule_version_id
      description: '`accounts.opt_in_suspended` grouped per firm and release (one notification, "{k} contas"); the audit keeps
        one entry per account.'
      properties:
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        account_count:
          type: integer
          minimum: 1
        rule_version_id:
          $ref: '#/components/schemas/Uuid'
        cause:
          type: string
          enum:
          - stance_changed
          - text_changed
          - preset_attached
    ParamsReverseCloseOnly:
      type: object
      additionalProperties: false
      required:
      - reason_code
      - closed_qty
      - closed_side
      description: 'Q74 (Vigia I1): a `reverse` that closed the position and skipped the open. The cause is one of the

        four Q74 bars, or one of two cases with the same outcome by existing rules: no room (M = 0, ADR-0003

        §4.2) or the open expired at routing (T1). Always notified, one per occurrence, whatever the gate

        (including `routing.limits_pending`, which is otherwise not notified). It replaces the gate''s own

        grouped notification for that occurrence. Audit entries behind it: at routing (gates, M = 0,

        `routing.expired`) the routing entry carries the gate code and

        `DetailsRoutingDecision.reverse_closed_qty`; in the gateway-queue exception (5.1.1) the decision

        entry stays `routing.routed`, the open leg''s entry is `execution.expired` and the closed quantity

        is in the flatten''s execution entries; under Q75 the routing entry is `routing.out_of_sync` with

        `expected_flat` and no `reverse_closed_qty`, and the closed quantity is in the flatten''s

        `execution.filled` entries. Q75 (5.2.0, decision 4b A): when the account is

        out of sync and the expected position was flat (`expected_flat`), nothing is notified at the

        decision. When the flatten is terminal: filled → this notification with `reason_code`

        `routing.out_of_sync` and `closed_qty` / `closed_side` from the flatten''s fills (when the real

        position was already the reverse side, `closed_side` is that side); `command.already_flat` → not

        this code but `routing.out_of_sync_flatten` (`ParamsOutOfSyncFlatten`), and the grouped

        `routing.out_of_sync` notification covers the skipped open.

        '
      properties:
        reason_code:
          type: string
          enum:
          - routing.out_of_sync
          - routing.risk_blocked
          - routing.limits_pending
          - routing.no_bracket_profile
          - routing.max_position_reached
          - routing.expired
          description: The gate that skipped the open leg; `routing.expired` when the routing decision saw the open's TTL
            exceeded (5.1.0), or when the open leg expired in the gateway queue under the ADR-0004 §5 reverse exception (5.1.1).
        closed_qty:
          type: integer
          minimum: 1
          maximum: 10000
          description: 'abs(position) read at the decision: the quantity the close leg is sent to flatten (as `DetailsRoutingDecision.reverse_closed_qty`).
            Q75 (`expected_flat`): the quantity filled by the flatten.'
        closed_side:
          type: string
          enum:
          - long
          - short
          description: 'The side of the position that was closed (Q75: from the flatten''s fills).'
    ParamsOutOfSyncFlatten:
      type: object
      additionalProperties: false
      required:
      - action
      - result
      description: 'Q75 (5.2.0, ADR-0003 r4): a flatten sent on an out-of-sync account whose expected position was

        flat (`DetailsRoutingDecision.expected_flat`) ended in a terminal success. Sent once per such

        flatten, except a `reverse` whose flatten filled, which is `routing.reverse_close_only`. As every

        flatten, it first cancelled every working order on the contract, manual and other All Win orders

        included, even when the position turned out flat; the text says so. The Core does not count the

        cancelled orders (the adapter does not correlate them with the flatten).

        '
      properties:
        action:
          type: string
          enum:
          - close
          - reverse
          description: The source instruction's action.
        result:
          type: string
          enum:
          - filled
          - already_flat
          description: '`filled`: the account held a position the Core did not expect, now closed; `already_flat`: `command.already_flat`.'
        closed_qty:
          type: integer
          minimum: 1
          maximum: 10000
          description: 'Only with `filled`: the quantity filled by the flatten.'
        closed_side:
          type: string
          enum:
          - long
          - short
          description: 'Only with `filled`: the side of the position that was closed.'
      if:
        properties:
          result:
            const: filled
      then:
        required:
        - closed_qty
        - closed_side
      else:
        not:
          anyOf:
          - required:
            - closed_qty
          - required:
            - closed_side
    ParamsPresetNewVersion:
      type: object
      additionalProperties: false
      required:
