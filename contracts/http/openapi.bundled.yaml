          $ref: '#/components/schemas/AccountKind'
        display_name:
          $ref: '#/components/schemas/AccountName'
        firm_name:
          type: string
          maxLength: 120
          description: Prop only. From the preset when `preset_version_id` is set, else the manual text.
        plan_name:
          type: string
          maxLength: 120
          description: Prop only (as `firm_name`).
        phase:
          type: string
          maxLength: 80
          description: 'Prop only: the preset phase code (`evaluation`, `funded`, `live`) or the manual text.'
        preset_update_available:
          type: boolean
          description: Prop with a preset only — a newer version of the account's preset exists (list link "Preset novo";
            details in `getAccountPreset`).
        firm_id:
          description: Prop with a preset only (S16 catalog).
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          description: Prop with a preset only. The version applied to this account; a newer one is applied only by the user
            (S16 AC-3).
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217; 'USD' in V1.
        multiplier:
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        binding:
          description: Absent when the account is not bound; an unbound account is never routed (Q37).
          $ref: '#/components/schemas/AccountBinding'
        opt_ins:
          $ref: '#/components/schemas/AccountOptIns'
        commission_per_contract_side:
          description: The account's commission floor per contract and side (absent = none).
