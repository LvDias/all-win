  /api/v1/connections/{connection_id}/pairing-code:
    post:
      tags:
      - connections
      operationId: newPairingCode
      summary: New pairing code (expired code, or "move to another machine"; step-up)
      description: 'Invalidates any previous active code. For a paired connection this is the re-pairing flow:

        the current instance keeps working until the new code is used; then its device token is revoked

        (WebSocket close 4002). Account bindings follow the connection by `platform_account` name

        (ADR-0004 §8 "Re-pairing"); accounts not reported by the new instance become out of sync with

        reason `sync.account_not_found_after_repair`.

        '
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpBody'
      responses:
        '201':
          description: New code.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`connections.unpaired` (an unpaired connection cannot get a code; create a new one).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/connections/{connection_id}/unpair:
    post:
      tags:
      - connections
      operationId: unpairConnection
      summary: Unpair (Q18) — revokes the device token; mapped accounts become out of sync; nothing is closed (step-up)
      x-step-up: true
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - acknowledge_open_positions
              properties:
                acknowledge_open_positions:
                  type: boolean
                  description: Must be true when any mapped account has an open position (design S3-10 checkbox).
                step_up:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '204':
          description: Unpaired; WebSocket closed with 4002; audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`connections.open_positions_not_acknowledged` (body lists nothing sensitive; the client re-reads the
            connection).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /adapter/v1/pairings:
    post:
      tags:
      - pairing
      operationId: pairAdapter
      summary: Exchange a pairing code for a device token (called by the plugin; ADR-0004 §8)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - pairing_code
              - instance_id
              - instance_name
              - adapter
              properties:
                pairing_code:
                  type: string
                  maxLength: 16
                  description: 8 Crockford Base32 characters; case, spaces and hyphens ignored; O→0, I/L→1.
                instance_id:
                  $ref: '#/components/schemas/Uuid'
                instance_name:
                  type: string
                  minLength: 1
                  maxLength: 64
                adapter:
                  type: object
                  additionalProperties: false
                  required:
                  - type
                  - version
                  - build
                  properties:
                    type:
                      type: string
                      pattern: ^[a-z][a-z0-9_]{0,31}$
                    version:
                      type: string
                      maxLength: 32
                    build:
                      type: string
                      enum:
                      - release
                      - development
      responses:
        '201':
          description: Paired. `device_token` is returned exactly once; the plugin stores it with DPAPI.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - connection_id
                - device_token
                properties:
                  connection_id:
                    $ref: '#/components/schemas/Uuid'
                  device_token:
                    type: string
                    pattern: ^awd_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$
        '400':
          description: '`pairing.invalid_code` — one code for unknown, expired, used or superseded (plugin shows one

            message); or `common.invalid_request` with `pointer` when the body does not match the schema.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: '`pairing.adapter_version_unsupported`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`pairing.rate_limited` (per-IP and per-prefix limits, ADR-0004 §8; there is no global lock, U11).
            Header `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events:
    get:
      tags:
      - events
      operationId: eventStream
      summary: Server-Sent Events stream for the signed-in user
      description: '`text/event-stream`. Each event has `event: <type>` and `data: <JSON>` matching

        `#/components/schemas/Event`. Does NOT extend the idle session timeout. On session end the

        server sends `session.ended` and closes the stream. Events carry no SSE `id` and are not

        replayed in V1: after every (re)connect the client refetches the state it displays (sources,

        connections) and then applies events whose `at` is newer than what it holds.

        '
      responses:
        '200':
          description: Stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts:
    get:
      tags:
      - accounts
      operationId: listAccounts
      summary: List the signed-in user's accounts (archived accounts excluded)
      description: 'One call for the whole list screen (no pagination in V1; a user has tens of accounts). Sorted by

        `display_name` (case-insensitive). Filtering is client-side. Only the caller''s accounts.

        '
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - accounts
      operationId: createAccount
      summary: Register a prop or real account, with its first opt-in choices, in one save
      description: 'Idempotent by the `Idempotency-Key` header (a UUID the client generates once per form

        submission). A key is never released: a retry with the same key and the same body (`step_up`

        ignored) within 24 h returns 200 with the account created by the first request, as it is now

        (with `archived_at` if it was archived since), and changes nothing; the same key with a different

        body, or after 24 h, gets 409 `accounts.idempotency_key_reused`. A key never creates a second

        account. Only a successful create consumes a key, so the retry after a step-up reuses it.

        Account ids are generated by the Core.

        Real accounts copy the default profile of the nearest standard size (S6). When the size is

        exactly between two standard sizes the user picks one: `profile_size` is then required (422

        `accounts.profile_size_required`) and must be one of the candidates of `getNearestProfileSize`

        (422 `accounts.profile_size_invalid`). Provisional (Q60): if the user later decides "smaller" or

        "larger", the candidates list just has one entry and nothing else changes.

        Prop accounts take either a preset version (`preset_version_id`, S16) or the manual fields

        (`firm_name`, `plan_name`, `phase`, `size_amount`; before S16 and for plans without a preset).

        `opt_ins` must hold every kind whose choice is required (`OptInChoices`); before S16 the

        automation stance of a prop account is `unknown`, so its choice is required against the generic

        rule version (provisional, Q40). Real accounts never take `opt_ins`.

        Step-up: when any `opt_ins.*.choice` is `accepted` the body must carry `step_up` for action

        `account_create_opt_in_accept` (no target; StepUpProof). Check order after authentication,

        Origin and schema: idempotent replay → step-up → 409 → 422. Nothing is saved on any error. Audited as `accounts.created`
        and, per kind chosen,

        `accounts.opt_in_chosen`, in the same transaction.

        '
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
            examples:
              real:
                value:
                  kind: real
                  display_name: Conta real
                  size_amount: '25000.00'
                  max_position_qty: 3
                  multiplier: 1
                  binding:
                    connection_id: 5a2b8c3d-1e4f-4a6b-8c7d-9e0f1a2b3c4d
                    platform_account: Sim101
              prop_manual:
                value:
                  kind: prop
                  display_name: Apex 50K 1
                  firm_name: Apex Trader Funding
                  plan_name: 50K Rithmic
                  phase: Evaluation
                  size_amount: '50000.00'
                  max_position_qty: 2
                  opt_ins:
                    automation:
                      choice: declined
                      rule_version_id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
      responses:
        '200':
          description: Replay of a create already done with this `Idempotency-Key`; the account it created, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '201':
          description: Created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '409':
          $ref: '#/components/responses/AccountWriteConflict'
        '422':
          $ref: '#/components/responses/AccountWriteRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}:
    get:
      tags:
      - accounts
      operationId: getAccount
      summary: One account (detail screen)
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - accounts
      operationId: updateAccount
      summary: Edit an account (full replacement of the editable fields; optimistic concurrency by `row_version`)
      description: 'The body is the whole editable state (the edit form sends every field): an absent `binding`

        unbinds, an absent `multiplier` resets it to 1; `kind` cannot change. Changing the

        preset version, the firm platform or the manual prop fields may select a different rule version:

        the request must then carry `opt_ins` for each kind whose choice becomes required, or the Core

        answers 422 `accounts.opt_in_required` (D16). Applying a newer preset version to the account

        (S16 AC-3) is this operation with the new `preset_version_id`.

        Changing or removing the binding while the account has an open position is refused with 409

        `accounts.binding_open_position` (provisional, Q38). Lowering `max_position_qty` below an open

        position is allowed; open positions are not changed.

        Step-up: when an `opt_ins.*.choice` is `accepted` and changes the stored state, the body must

        carry `step_up` for action `account_opt_in_accept` with target = this account. Check order after

        authentication, Origin and schema: 404 → step-up → 409 → 422. Audited as

        `accounts.updated` (changed fields with old and new values) and `accounts.opt_in_chosen`.

        '
      x-step-up: conditional
      x-step-up-when: any opt_ins.*.choice == accepted that changes the stored state
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Saved and audited (a request that changes nothing returns the account and is not audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountWriteConflict'
        '422':
          $ref: '#/components/responses/AccountWriteRejected'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - accounts
      operationId: archiveAccount
      summary: Delete (archive) an account
      description: 'Refused with 409 `accounts.delete_open_position` while the account has an open position (S5 AC-6;

        last known state when the connection is down). Otherwise the account is archived: it leaves every

        list, receives no instruction, and its name becomes free again. Provisional (Q39): its routes and

        master/follower relations are removed in the same transaction (listed beforehand by

        `getAccountArchiveImpact`), its binding is released, and the audit and history keep the id and a

        name snapshot. Audited as `accounts.archived` with what was removed. An archived or unknown id

        gets 404.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Archived and audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`accounts.delete_open_position` — nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/archive-impact:
    get:
      tags:
      - accounts
      operationId: getAccountArchiveImpact
      summary: What deleting the account would remove (for the confirmation dialog)
      description: 'Read-only. The confirmation lists these items; `archiveAccount` removes whatever exists when it

        runs (each item is audited), so a route added in between is removed too.

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveImpact'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/lifecycle:
    put:
      tags:
      - accounts
      operationId: setAccountLifecycle
      summary: Pause, resume, disable or enable an account (S5 AC-4)
      description: 'Sets the target state. Allowed transitions: `active` → `paused` (pause); `paused` → `active`

        (resume); `active` or `paused` → `disabled` (disable); `disabled` → `active` (enable). Any other

        transition gets 409 `accounts.lifecycle_transition_invalid`. Setting the current state is a

        no-op (200, not audited). A paused or disabled account receives no instruction at all, exits

        included (S7 AC-8); open positions and orders are not touched. Audited as

        `accounts.lifecycle_changed` (previous and new state, whether a position was open).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: The account in its new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` (stale `row_version`) or `accounts.lifecycle_transition_invalid`; nothing
            changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/opt-ins/{kind}:
    put:
      tags:
      - accounts
      operationId: setAccountOptIn
      summary: Record or change an explicit per-account opt-in (automation or copy) after the account exists
      description: 'Decisions 2026-10-23: option A (explicit per-account opt-in), Q24 (separate `copy` opt-in for

        followers of master replication), Q25 (the choice is required when the firm''s stance for that kind

        is forbidden, conditional, unknown or not confirmed), Q26 (a new preset version that changes the

        stance moves the state to `pending_review` and suspends that kind until the user chooses again).

        **Provisional (awaiting the user, Q42):** a change of the official rule text that the publisher of

        the preset version flags as material also triggers `pending_review`; unflagged edits never do.

        - `automation` covers automated sources (TradingView webhook, future signal engine).

        - `copy` covers receiving master-account replication as a follower.

        The first choice is made **atomically with account creation** (`opt_ins` of `createAccount` /

        `updateAccount`, schema `OptInChoices`). The `copy` choice is made atomically with adding the

        account as a follower (S7/S19); for an account that is not a follower `copy` is `not_required`

        and this operation answers 422 `accounts.opt_in_not_applicable`. This operation is for later

        changes and for resolving `pending_review`. `rule_version_id` must be the rule version whose text

        the user saw; if it is stale the Core answers 409 `accounts.rule_version_changed` and saves

        nothing. Every change is audited (date, user, kind, choice, rule version, previous value).

        '
      x-step-up: conditional
      x-step-up-when: choice == accepted
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OptInKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - choice
              - rule_version_id
              properties:
                choice:
                  type: string
                  enum:
                  - accepted
                  - declined
                rule_version_id:
                  description: Rule version whose text was displayed (`RuleVersion.id`).
                  $ref: '#/components/schemas/Uuid'
                step_up:
                  description: Required when `choice` is `accepted` (step-up action `account_opt_in_accept`, target = this
                    account).
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptInState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`accounts.rule_version_changed` — `error.current_rule_version_id` carries the current version; nothing
            saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`accounts.opt_in_not_applicable` (state is `not_required`: real account, the firm allows that kind,
            or `copy` on an account that is not a follower).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/opt-in-rules:
    get:
      tags:
      - presets
      operationId: getOptInRules
      summary: Rule versions in force for a prop selection, before or after the account exists
      description: 'The account form calls it on every selection change (firm, plan, phase, size, firm platform),

        because the rule version depends on the selection and there is no account id yet (spec §5.2).

        With `preset_version_id` → the rules of that preset version (and `firm_platform` when the preset

        has platform-specific rules). Without it → the **generic** rule versions used by prop accounts

        without a preset (stance `unknown`, no quotes; provisional, Q40). Global catalog data, the same

        for every user; any signed-in user may read it.

        '
      parameters:
      - name: preset_version_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: firm_platform
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FirmPlatform'
      responses:
        '200':
          description: One rule version per kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptInRules'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`accounts.firm_platform_required` or `accounts.firm_platform_unknown` (pointer `/query/firm_platform`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rule-versions/{rule_version_id}:
    get:
      tags:
      - presets
      operationId: getRuleVersion
      summary: One opt-in rule version (current text, or a previous one for comparison)
      description: 'Used for `OptInState.current_rule_version_id`, for the previous version shown in the review

        dialog (`RuleVersion.change.previous_rule_version_id`) and for the version a past choice was

        made against. Rule versions are immutable once published.

        '
      parameters:
      - name: rule_version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The rule version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/routes:
    get:
      tags:
      - routing
      operationId: listRoutes
      summary: The caller's routes, with the effective status computed by the Core
      description: 'Filter by `source_id` (routing page) or `account_id` (account `Rotas` tab); without filters, all

        routes. Routes of revoked sources are included (read-only, Q-S7-3); routes of archived accounts

        no longer exist (S5 `archiveAccount`). Account facts (name, firm, multiplier, max position,

        opt-ins) come from `listAccounts`; the client joins by `account_id` (two calls, no N+1). After

        `account.changed`, `connection.status_changed` or `route.changed` the client refetches.

        An unknown or foreign `source_id` / `account_id` filter returns an empty list.

        '
      parameters:
      - name: source_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: account_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The routes, sorted by account `display_name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - routing
      operationId: createRoute
      summary: Route a source to an account with the selected signal types
      description: 'Idempotent by its natural key: one route per (source, account). A second create for the same

        pair gets 409 `routing.route_exists` (the client refetches and switches to edit). The account must

        be routable for that source (`listRouteCandidates`); a race is answered with the same code the

        picker showed. Audited as `routing.subscription_changed` (`created`).

        Copy routes of a follower (S19, V1.1) are not created here.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreateRequest'
            examples:
              route:
                value:
                  source_id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                  account_id: 0b9f4c1e-7d2a-4e7b-9a52-3c1d8e6f2a10
                  signal_types:
                  - trigger
                  - trade_plan
                  is_enabled: true
      responses:
        '201':
          description: Created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          description: '`routing.route_exists` — nothing created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/RouteRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/routes/{route_id}:
    put:
      tags:
      - routing
      operationId: updateRoute
      summary: Change a route's signal types or switch it on/off (optimistic concurrency)
      description: 'Full replacement of `signal_types` and `is_enabled`. Switching a route on is allowed even when

        the account is currently not eligible: the route stays saved and its status shows the reason

        (Q-S7-2). Routes of a revoked source are read-only: 409 `routing.source_revoked`. Audited as

        `routing.subscription_changed` (`updated`, `enabled` or `disabled`, with previous and new values).

        '
      parameters:
      - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdateRequest'
      responses:
        '200':
          description: Saved (a request that changes nothing is not audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` or `routing.source_revoked`; nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - routing
      operationId: deleteRoute
      summary: Remove a route
      description: 'Open positions and orders are not changed. Routes of a revoked source cannot be removed (409

        `routing.source_revoked`, Q-S7-3). Audited as `routing.subscription_changed` (`removed`).

        '
      parameters:
      - $ref: '#/components/parameters/RouteId'
      responses:
        '204':
          description: Removed and audited.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`routing.source_revoked` — nothing removed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/route-candidates:
    get:
      tags:
      - routing
      operationId: listRouteCandidates
      summary: Accounts the user can route a source to, the unavailable ones with reasons, and manual-only accounts
      description: 'For the account picker of the route dialog. Accounts that already have a route for the source

        are not listed. Manual-only accounts (S16 AC-7) are never in `candidates`; they are listed in

        `manual_only` with the preset''s reason, for the "Can''t find an account?" explanation (S7 AC-7b).

        Before S16 `manual_only` is always empty. An unknown or foreign `source_id` gets 404.

        '
      parameters:
      - name: source_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCandidates'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/instruments:
    get:
      tags:
      - profiles
      operationId: listInstruments
      summary: Enabled instruments with their exact tick data (global catalog)
      description: Only MNQ in V1. Values are decimal strings; the UI never hard-codes them and does no arithmetic with them.
      responses:
        '200':
          description: The instruments, sorted by symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/default-profiles:
    get:
      tags:
      - profiles
      operationId: listDefaultProfiles
      summary: The caller's default profile for every standard size, for one instrument
      description: 'Always one entry per standard size (25k … 300k, `catalog.standard_account_size`), in size order;

        a size the user has not defined has no `profile` (UI `Não definido`; no invented values, Q-S6-2).

        '
      parameters:
      - $ref: '#/components/parameters/InstrumentIdQuery'
      responses:
        '200':
          description: The defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultProfileList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/default-profiles/{instrument_id}/{size_amount}:
    put:
      tags:
      - profiles
      operationId: putDefaultProfile
      summary: Define or replace the default profile of one standard size (upsert)
      description: 'Idempotent: the same body twice leaves one profile and one audit entry (an unchanged profile is

        not audited). Affects only accounts created afterwards; existing accounts keep their own copy

        (Q-S6-3). A size that is not a standard size gets 404. Audited as `profiles.default_changed`.

        '
      parameters:
      - $ref: '#/components/parameters/InstrumentIdPath'
      - name: size_amount
        in: path
        required: true
        description: A standard size as a decimal string without separators, e.g. `50000` or `50000.00`.
        schema:
          $ref: '#/components/schemas/SizeAmount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceProfile'
            examples:
              usd:
                value:
                  distance_unit: usd
                  stop_distance: '100.10'
                  target_distance: '200.00'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultProfileEntry'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/profiles:
    get:
      tags:
      - profiles
      operationId: listAccountProfiles
      summary: The account's own profiles, one entry per enabled instrument
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account's profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/profiles/{instrument_id}:
    put:
      tags:
      - profiles
      operationId: putAccountProfile
      summary: Customize the account's own profile (the default is not changed)
      description: 'Applies to the next entries only; open positions and working orders are not changed (Q-S6-5).

        `row_version` is required when the account already has a profile for the instrument (stale or

        missing → 409 `common.version_conflict`) and must be absent when it has none (an account created

        while its size had no default, Q43). Audited as `profiles.account_changed` (`edited`).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/InstrumentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileRequest'
      responses:
        '200':
          description: Saved and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`common.version_conflict` — nothing saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{account_id}/profiles/{instrument_id}/restore:
    post:
      tags:
      - profiles
      operationId: restoreAccountProfile
      summary: Replace the account's profile with the current default of its size (Q-S6-4)
      description: 'Copies the current default of the account''s size (the nearest standard size for a real account

        of another size, chosen by the Core). Idempotent in effect: restoring twice leaves the same

        profile (the second call is not audited). Applies to the next entries only. Audited as

        `profiles.account_changed` (`restored`).

        '
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/InstrumentIdPath'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`profiles.default_missing` — the size has no default profile yet; nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile-sizes/nearest:
    get:
      tags:
      - profiles
      operationId: getNearestProfileSize
      summary: The standard size(s) whose default profile a real account of this size starts from
      description: 'Distance = absolute difference between the account size and each standard size; below the

        smallest standard size the smallest is used, above the largest the largest (PO, Q60). An exact

        tie returns both sizes and the user chooses (`createAccount.profile_size`); provisional (Q60): the

        Core does not choose. If the user later decides "always the smaller" or "always the larger",

        `candidates` simply has one entry. Each candidate says whether the user has a default for it.

        '
      parameters:
      - name: size_amount
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SizeAmount'
      - $ref: '#/components/parameters/InstrumentIdQuery'
      responses:
        '200':
          description: One or two candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearestProfileSize'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile-preview:
    get:
      tags:
      - profiles
      operationId: previewProfile
      summary: Stateless conversion of a stop/target pair to whole ticks, points and dollars (Core arithmetic)
      description: 'Used by `DistanceFields` while the user types (debounced). Stores nothing, audits nothing. Uses

        the same conversion as execution (ADR-0004 §5): points and dollars become whole ticks with the

        instrument''s exact tick size and tick value; a value that is not a whole number of ticks is

        **rounded toward the entry** (down to the tighter distance), reported with `rounded: true`. A

        distance below one tick gets 422 `profiles.distance_below_one_tick`.

        '
      parameters:
      - $ref: '#/components/parameters/InstrumentIdQuery'
      - name: distance_unit
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DistanceUnit'
      - name: stop_distance
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DistanceValue'
      - name: target_distance
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DistanceValue'
      responses:
        '200':
          description: The equivalents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEquivalents'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity:
    get:
      tags:
      - audit
      operationId: listActivity
      summary: The caller's activity entries, newest first, filtered, with a cursor
      description: 'Filters combine with AND; the values inside one array filter combine with OR. Array filters

        repeat the parameter (`account_id=a&account_id=b`). `from` defaults to 24 h before `to`; `to`

        defaults to now; both are instants (X-8). `q` is an exact instruction id or `message_id`: it

        returns the entries of that instruction (no free-text search). An unknown or foreign id in a

        filter simply matches nothing. Entries older than the retention horizon no longer exist.

        `next_cursor` is opaque and bound to the same filters; a cursor used with other filters gets

        400 `common.invalid_request` (pointer `/query/cursor`).

        '
      parameters:
      - name: from
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: account_id
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      - name: source_id
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      - name: signal_type
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/AuditSignalType'
      - name: outcome
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AuditOutcome'
      - name: category
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AuditCategory'
      - name: code
        in: query
        required: false
        explode: true
        schema:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AuditCode'
      - name: q
        in: query
        required: false
        description: Exact instruction id or `message_id`.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity/filter-options:
    get:
      tags:
      - audit
      operationId: getActivityFilterOptions
      summary: Values for the activity filters, including archived accounts and revoked sources
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFilterOptions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity/{entry_id}:
    get:
      tags:
      - audit
      operationId: getActivityEntry
      summary: One activity entry (detail panel)
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/instructions/{instruction_id}/timeline:
    get:
      tags:
      - audit
      operationId: getInstructionTimeline
      summary: One instruction from receipt to every account's result (S10 AC-2), in one call
      description: '`intake` holds the receipt steps, including every `ingress.duplicate_ignored` of the same

        `message_id` (Q-S10-6). `accounts` holds one block per account the instruction was routed to or

        skipped for, sorted by account name, each with its steps in `occurred_at` order (ties by the

        Core''s sequence) and its final outcome. Unknown, foreign and purged-by-retention ids all get the

        same 404 `common.not_found`. While `status` is `in_progress` new steps arrive as

        `audit.entry_recorded` events; the client refetches.

        '
      parameters:
      - name: instruction_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionTimeline'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aw_session
      description: Server-side session (HttpOnly; Secure; SameSite=Lax; Path=/).
  headers:
    RetryAfter:
      description: Seconds to wait.
      schema:
        type: integer
        minimum: 1
    SessionCookie:
      description: '`__Host-aw_session=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/` (Max-Age only when remember_me).'
      schema:
        type: string
    SessionCookieClear:
      description: Expires the session cookie.
      schema:
        type: string
    SessionAndDeviceCookies:
      description: '`__Host-aw_session` (as SessionCookie) and, when the browser has no valid device cookie of this user,

        `__Host-aw_device=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=34560000` (400 days;

        auth policy §5.2). Only an unknown or revoked value is replaced. A value that is valid for **another**

        user of the same browser is kept, and this user gets their own device row with the same value, so a

        shared browser stays a known device for each of its users.

        '
      schema:
        type: string
    SessionAndDeviceCookiesClear:
      description: Expires the session and device cookies.
      schema:
        type: string
    NoStore:
      description: The response carries a one-time secret; no cache may store it.
      schema:
        type: string
        const: no-store
  parameters:
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChangeId:
      name: change_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated by the client once per create submission; reused on retries (not a secret).
      schema:
        $ref: '#/components/schemas/Uuid'
    InstrumentIdPath:
      name: instrument_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstrumentIdQuery:
      name: instrument_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    Unauthenticated:
      description: '`auth.unauthenticated` (no session, or expired). Web redirects to sign-in with `?reason=session_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: '`auth.rate_limited`.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpFailed:
      description: '`auth.step_up_required` (the body has no `step_up` proof: call `requestStepUp`, then retry with

        `step_up: { challenge_id, code }`), `auth.code_invalid` (the proof is wrong, expired, used, bound to

        another session, action or target: one code for all), or `common.forbidden_origin`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error:
                  code: auth.step_up_required
            invalid:
              value:
                error:
                  code: auth.code_invalid
    CodeInvalid:
      description: '`auth.code_invalid` — wrong, expired, used, invalidated after 5 wrong attempts, unknown or forged challenge
        (one code for all; auth policy §3).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CodeInvalidOrOrigin:
      description: '`auth.code_invalid` (as CodeInvalid) or `common.forbidden_origin`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`auth.forbidden` (not a platform admin); or `common.forbidden_origin` on state-changing requests.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrStepUp:
      description: '`auth.forbidden` (not a platform admin; checked first, so a non-admin never gets a step-up prompt),

        `auth.step_up_required`, `auth.code_invalid` (as StepUpFailed), or `common.forbidden_origin`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrigin:
      description: '`common.forbidden_origin` — state-changing `/api/v1` request without a matching `Origin` header.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: '`common.invalid_request` — the request does not match its schema; `error.pointer` locates the first offending
        field.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            body:
              value:
                error:
                  code: common.invalid_request
                  pointer: /name
            path:
              value:
                error:
                  code: common.invalid_request
                  pointer: /path/source_id
    InternalError:
      description: '`common.internal` — unexpected failure; the body carries no detail.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`common.not_found` — also returned for resources of another user (never 403, so existence is not revealed).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvitationInvalid:
      description: '`auth.invitation_invalid` — one code for unknown, used, expired or revoked.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountWriteConflict:
      description: "Nothing saved. Codes (pointer where shown):\n- `accounts.idempotency_key_reused` (create only; same key\
        \ with a different body, or reuse after 24 h; never a second account);\n- `common.version_conflict` (update; stale\
        \ `row_version`, reload);\n- `accounts.name_taken` — `/display_name` (case-insensitive, among the caller's live accounts);\n\
        - `accounts.platform_account_taken` — `/binding` (already bound to another of the caller's\n  accounts; a platform\
        \ account of another user is never reported as taken, see 422);\n- `accounts.binding_open_position` — `/binding` (update;\
        \ provisional, Q38);\n- `accounts.rule_version_changed` — `error.current_rule_version_id` (an `opt_ins` choice names\
        \ a\n  rule version that is no longer the one in force for the selection).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            name_taken:
              value:
                error:
                  code: accounts.name_taken
                  pointer: /display_name
            rule_version_changed:
              value:
                error:
                  code: accounts.rule_version_changed
                  current_rule_version_id: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d
    AccountWriteRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers:\n- `accounts.opt_in_required` — `/opt_ins/automation`\
        \ or `/opt_ins/copy`;\n- `accounts.opt_in_not_applicable` — `/opt_ins/<kind>` (real account, or the kind is\n  `not_required`\
        \ for the selection); the client refetches and drops the section;\n- `accounts.max_position_exceeds_preset` — `/max_position_qty`\
        \ (above the preset maximum);\n- `accounts.preset_version_unknown` — `/preset_version_id` (unknown, withdrawn, or\
        \ a superseded\n  version on create);\n- `accounts.firm_platform_required` / `accounts.firm_platform_unknown` — `/firm_platform`;\n\
        - `accounts.platform_account_unknown` — `/binding` (no such platform account on a connection of\n  the caller, or\
        \ the connection is unpaired; identical for another user's connection);\n- `accounts.platform_account_kind_not_allowed`\
        \ — `/binding` (`live` or `unknown` kind outside\n  production; ADR-0004 §8);\n- `accounts.profile_size_required`\
        \ / `accounts.profile_size_invalid` — `/profile_size` (create of\n  a real account whose size is a tie between two\
        \ standard sizes; provisional, Q60).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            opt_in_required:
              value:
                error:
                  code: accounts.opt_in_required
                  pointer: /opt_ins/automation
    DistanceRejected:
      description: "Valid shape, refused by a rule; nothing saved. Codes and pointers (`/query/...` on the preview):\n- `profiles.distance_below_one_tick`\
        \ — `/stop_distance` or `/target_distance` (zero, or less than\n  one tick after conversion);\n- `profiles.distance_too_large`\
        \ — `/stop_distance` or `/target_distance` (more than 10 000 ticks).\nA value whose shape does not fit its unit (fractional\
        \ ticks, dollars with more than 2 decimals)\nis a schema error: 400 `common.invalid_request` with the pointer.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            below_one_tick:
              value:
                error:
                  code: profiles.distance_below_one_tick
                  pointer: /stop_distance
    RouteRejected:
      description: "Valid shape, refused by a rule; nothing created. Codes and pointers:\n- `routing.source_unknown` — `/source_id`\
        \ (unknown or another user's; identical);\n- `routing.source_revoked` — `/source_id`;\n- `routing.account_unknown`\
        \ — `/account_id` (unknown, archived or another user's; identical);\n- `routing.account_manual_only` — `/account_id`\
        \ (S16 AC-7);\n- `routing.automation_not_accepted` — `/account_id` (automated source; the account's automation\n \
        \ opt-in is `declined` or `pending_review`);\n- `routing.platform_unbound` — `/account_id` (provisional, Q37).\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_accepted:
              value:
                error:
                  code: routing.automation_not_accepted
                  pointer: /account_id
  schemas:
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    Timestamp:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$
    Locale:
      type: string
      enum:
      - pt-BR
      - en
    TimeZone:
      type: string
      description: IANA time zone name, validated by the Core against its tz database.
      pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
      maxLength: 64
    DisplayName:
      type: string
      minLength: 1
      maxLength: 60
    TokenBody:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          maxLength: 128
    ErrorCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            pointer:
              type: string
              maxLength: 256
              description: JSON pointer to the offending request field.
            retry_after_s:
              type: integer
              minimum: 1
            current_rule_version_id:
              $ref: '#/components/schemas/Uuid'
    IngressAccepted:
      type: object
      additionalProperties: false
      required:
      - status
      - instruction_id
      properties:
        status:
          type: string
          enum:
          - accepted
          - duplicate
        instruction_id:
          $ref: '#/components/schemas/Uuid'
    IngressRejected:
      type: object
      additionalProperties: false
      required:
      - status
      - error
      properties:
        status:
          type: string
          const: rejected
        error:
          type: object
          additionalProperties: false
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            pointer:
              type: string
              maxLength: 256
    Me:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - locale
      - time_zone
      - is_platform_admin
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        locale:
          $ref: '#/components/schemas/Locale'
        time_zone:
          $ref: '#/components/schemas/TimeZone'
        is_platform_admin:
          type: boolean
    LoginResult:
      type: object
      additionalProperties: false
      required:
      - user
      - new_device
      properties:
        user:
          $ref: '#/components/schemas/Me'
        new_device:
          type: boolean
          description: True when this sign-in registered a new device (the notice e-mail was sent; never on sign-up).
    CodeChannel:
      type: string
      enum:
      - email
      - whatsapp
      description: '`whatsapp` is accepted by the schema from 2.0.0 and becomes usable with S3b (U17).'
    ChallengeId:
      type: string
      description: Sealed challenge token (auth policy §3); opaque to clients. Never logged.
      pattern: ^[A-Za-z0-9_-]{16,256}$
    OneTimeCode:
      type: string
      description: 'The code as typed. The Core normalizes it per the code format (U16; format 1: trim, drop spaces and `-`,

        uppercase, O→0, I/L→1, then exactly 8 Crockford Base32 characters). Within 32 characters, non-ASCII or

        malformed input is a wrong attempt (`auth.code_invalid`); more than 32 characters is 400

        `common.invalid_request`, which counts no attempt and reveals nothing. Never logged.

        '
      minLength: 1
      maxLength: 32
    ChallengeIssued:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - expires_at
      - resend_after_s
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeId'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        resend_after_s:
          type: integer
          minimum: 0
          description: Seconds until `resendCode` is accepted (60 after a send).
    StepUpAction:
      type: string
      description: "Actions that need a step-up code (auth policy §6.2). The user's three actions are\n`account_opt_in_accept`\
        \ / `account_create_opt_in_accept`, `connection_unpair`, and the channel change\n(its own flow). **Included pending\
        \ Q35:** `source_create`, `source_rotate`, `connection_create`,\n`pairing_code_new`, `admin_invitation_create` (the\
        \ policy's security musts). The enum is a superset so it never has to change: whether those\noperations **require**\
        \ the proof is a Core setting (`step_up.q35_persistence_actions`, default on),\nshown as `x-step-up: conditional`.\
        \ The setting is server configuration only (never an admin/UI/DB\ntoggle); missing or invalid means on (fail-closed).\
        \ If the user rejects them, the setting goes off and\nthe values stay valid but unused. Enforcement-off / max-position\
        \ values are added when Q35 decides.\n- `source_create`, `source_rotate` (target = source), `connection_create`, `pairing_code_new`\
        \ (target = connection),\n  `connection_unpair` (target = connection), `account_opt_in_accept` (target = account;\
        \ automation or copy,\n  setAccountOptIn and the S5/S7 update operations), `account_create_opt_in_accept` (no target;\
        \ S5 create\n  with an accepted opt-in), `admin_invitation_create`.\n"
      enum:
      - source_create
      - source_rotate
      - connection_create
      - pairing_code_new
      - connection_unpair
      - account_opt_in_accept
      - account_create_opt_in_accept
      - admin_invitation_create
    StepUpProof:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - code
      description: Step-up proof carried in the body of a step-up operation; consumed in the action's transaction.
      properties:
        challenge_id:
          $ref: '#/components/schemas/ChallengeId'
        code:
          $ref: '#/components/schemas/OneTimeCode'
    StepUpBody:
      type: object
      additionalProperties: false
      description: Body of a step-up operation that has no other input.
      properties:
        step_up:
          $ref: '#/components/schemas/StepUpProof'
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - first_seen_at
      - last_seen_at
      - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
          maxLength: 128
          description: Coarse browser and OS family from the User-Agent, e.g. "Chrome on Windows".
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: True for the device of this request.
    ChannelChange:
      type: object
      additionalProperties: false
      required:
      - id
      - channel
      - status
      - masked_new_value
      - codes
      - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        channel:
          $ref: '#/components/schemas/CodeChannel'
        status:
          type: string
          enum:
          - awaiting_codes
          - on_hold
          - completed
          - cancelled
          - expired
          description: '`on_hold` = every code confirmed, the change waits until `hold_until` (auth policy §9 hold; §7 M2
            if adopted) and can be cancelled.'
        masked_new_value:
          type: string
          maxLength: 64
        codes:
          type: array
          description: One entry per code of the flow.
          items:
            type: object
            additionalProperties: false
            required:
            - role
            - challenge_id
            - confirmed
            properties:
              role:
                type: string
                enum:
                - current_value
                - new_value
                - other_channel
              challenge_id:
                $ref: '#/components/schemas/ChallengeId'
              confirmed:
                type: boolean
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        hold_until:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            status:
              const: on_hold
        then:
          required:
          - hold_until
    SecurityState:
      type: object
      additionalProperties: false
      required:
      - email
      - session
      - channel_change_allowed_at
      properties:
        email:
          type: string
          format: email
        whatsapp:
          type: string
          description: Confirmed WhatsApp number (E.164), absent until added (S3b).
          pattern: ^\+[1-9][0-9]{7,14}$
        channel_change_allowed_at:
          description: When a new channel change is accepted (24 h after the last one; auth policy §7). In the past when allowed
            now.
          $ref: '#/components/schemas/Timestamp'
        pending_channel_change:
          $ref: '#/components/schemas/ChannelChange'
        session:
          type: object
          additionalProperties: false
          required:
          - persistent
          - idle_timeout_s
          - absolute_timeout_s
          - idle_expires_at
          - absolute_expires_at
          properties:
            persistent:
              type: boolean
            idle_timeout_s:
              type: integer
              description: 43200 (12 h) or 604800 (7 d) — Q21.
            absolute_timeout_s:
              type: integer
              description: 86400 (24 h) or 2592000 (30 d) — Q21.
            idle_expires_at:
              $ref: '#/components/schemas/Timestamp'
            absolute_expires_at:
              $ref: '#/components/schemas/Timestamp'
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - status
      - created_at
      - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - status
      - whatsapp_verified
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - active
          - closed
        whatsapp_verified:
          type: boolean
        is_platform_admin:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_sign_in_at:
          $ref: '#/components/schemas/Timestamp'
    Source:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - source_type
      - is_automated
      - status
      - key_id
      - masked_url
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/DisplayName'
        source_type:
          type: string
          enum:
          - tradingview
        is_automated:
          type: boolean
          description: 'Derived by the Core from `source_type` (never stored, never set by the client): true when

            instructions from this source are subject to the per-account `automation` opt-in (O1).

            `tradingview` is automated. Clients must use this flag, not their own list of types.

            '
        status:
          type: string
          enum:
          - active
          - revoked
        key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
        masked_url:
          type: string
          description: '''https://<host>/ingress/v1/tradingview/awk_<key_id>_…'' — never the secret.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        rotated_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          $ref: '#/components/schemas/Timestamp'
        last_received_at:
          $ref: '#/components/schemas/Timestamp'
    SourceWithUrl:
      type: object
      additionalProperties: false
      required:
      - source
      - webhook_url
      properties:
        source:
          $ref: '#/components/schemas/Source'
        webhook_url:
          type: string
          description: Full URL with the secret token. Returned only by create/rotate; never logged.
          pattern: ^https://[^/]+/ingress/v1/tradingview/awk_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$
    PairingCode:
      type: object
      additionalProperties: false
      required:
      - pairing_code
      - expires_at
      properties:
        pairing_code:
          type: string
          description: Display form, returned once per code.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    VisibleAccount:
      type: object
      additionalProperties: false
      required:
      - platform_account
      - kind
      - oco_location
      properties:
        platform_account:
          type: string
          maxLength: 128
        kind:
          type: string
          enum:
          - simulation
          - playback
          - live
          - unknown
        oco_location:
          type: string
          enum:
          - local
          - server
          - unknown
        account_id:
          description: The All Win account bound to it, if any (S5).
          $ref: '#/components/schemas/Uuid'
    Connection:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - status_changed_at
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/DisplayName'
        status:
          type: string
          enum:
          - awaiting_pairing
          - connected
          - disconnected
          - outdated
          - unpaired
        status_changed_at:
          description: When `status` last changed (equals `created_at` until the first change).
          $ref: '#/components/schemas/Timestamp'
        adapter_type:
          type: string
        adapter_version:
          type: string
        instance_id:
          description: Plugin instance id reported at pairing (D6). Absent until paired.
          $ref: '#/components/schemas/Uuid'
        instance_name:
          type: string
        paired_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        pairing_code_expires_at:
          description: Present while a code is active (the code itself is never re-shown).
          $ref: '#/components/schemas/Timestamp'
        repairing_pending:
          type: boolean
          description: True while a "move to another machine" code is active and the current instance still works.
        visible_accounts:
          type: array
          items:
            $ref: '#/components/schemas/VisibleAccount'
        open_position_accounts:
          type: array
          description: Platform accounts with an open position (for the unpair confirmation).
          items:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        unpaired_at:
          $ref: '#/components/schemas/Timestamp'
    Event:
      description: SSE payloads (field `data`). `type` equals the SSE `event` name; `at` is when the event happened (server
        clock).
      oneOf:
      - $ref: modules/accounts.yaml#/components/schemas/AccountChangedEvent
      - $ref: modules/accounts.yaml#/components/schemas/AccountArchivedEvent
      - $ref: modules/routing.yaml#/components/schemas/RouteChangedEvent
      - $ref: modules/audit.yaml#/components/schemas/AuditEntryRecordedEvent
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - status
        properties:
          type:
            const: connection.status_changed
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          status:
            type: string
            enum:
            - awaiting_pairing
            - connected
            - disconnected
            - outdated
            - unpaired
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - instance_name
        - visible_accounts
        properties:
          type:
            const: connection.paired
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          instance_name:
            type: string
          visible_accounts:
            type: array
            items:
              $ref: '#/components/schemas/VisibleAccount'
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - reason
        properties:
          type:
            const: connection.pairing_code_invalidated
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          reason:
            type: string
            enum:
            - superseded
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - reason
        properties:
          type:
            const: session.ended
          at:
            $ref: '#/components/schemas/Timestamp'
          reason:
            type: string
            enum:
            - logout
            - expired
            - signed_out_everywhere
            - device_revoked
            - channel_changed
    AccountName:
      type: string
      minLength: 1
      maxLength: 80
      description: Trimmed by the Core (NFC); must not be blank. Unique per user among live accounts, case-insensitive.
    AccountKind:
      type: string
      enum:
      - prop
      - real
    LifecycleState:
      type: string
      enum:
      - active
      - paused
      - disabled
    SizeAmount:
      type: string
      description: 'Account size in `currency` (decimal string, at most 2 decimals). Must be > 0: zero gets 400 `common.invalid_request`.'
      pattern: ^[0-9]{1,12}(\.[0-9]{1,2})?$
    MaxPositionQty:
      type: integer
      minimum: 1
      maximum: 10000
      description: Maximum position in contracts, one number per account in V1 (Q-A1). Mandatory (S5 AC-3).
    Multiplier:
      type: integer
      minimum: 1
      maximum: 1000
      description: Whole number ≥ 1 (S5 AC-5); a fraction or zero gets 400 `common.invalid_request` with the pointer.
    FirmPlatform:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,31}$
      description: Code of the firm-side platform when the preset has platform-specific rules (e.g. `rithmic`, `tradovate`);
        the options come from the preset version (S16). Not the execution platform.
    ManualText:
      type: string
      minLength: 1
      maxLength: 80
      description: Free text (trimmed by the Core) for prop accounts without a preset.
    PlatformAccountRef:
      type: object
      additionalProperties: false
      required:
      - connection_id
      - platform_account
      description: A platform account reported by one of the caller's connections (`Connection.visible_accounts`).
      properties:
        connection_id:
          $ref: '#/components/schemas/Uuid'
        platform_account:
          type: string
          minLength: 1
          maxLength: 128
    AccountBinding:
      type: object
      additionalProperties: false
      required:
      - connection_id
      - connection_name
      - connection_status
      - platform_account
      - kind
      - oco_location
      description: The bound platform account, as last reported by the plugin. `oco_location` `unknown` is treated as `local`
        (S9 AC-4).
      properties:
        connection_id:
          $ref: '#/components/schemas/Uuid'
        connection_name:
          $ref: '#/components/schemas/DisplayName'
        connection_status:
          type: string
          enum:
          - awaiting_pairing
          - connected
          - disconnected
          - outdated
          - unpaired
        platform_account:
          type: string
          maxLength: 128
        kind:
          type: string
          enum:
          - simulation
          - playback
          - live
          - unknown
        oco_location:
          type: string
          enum:
          - local
          - server
          - unknown
        bound_at:
          $ref: '#/components/schemas/Timestamp'
    AccountOptIns:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      properties:
        automation:
          $ref: '#/components/schemas/OptInState'
        copy:
          $ref: '#/components/schemas/OptInState'
    Account:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - display_name
      - size_amount
      - currency
      - multiplier
      - max_position_qty
      - lifecycle_state
      - opt_ins
      - has_open_position
      - row_version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          $ref: '#/components/schemas/AccountName'
        firm_name:
          type: string
          description: Prop only. From the preset when `preset_version_id` is set, else the manual text.
        plan_name:
          type: string
          description: Prop only (as `firm_name`).
        phase:
          type: string
          description: Prop only (as `firm_name`).
        firm_id:
          description: Prop with a preset only (S16 catalog).
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          description: Prop with a preset only. The version applied to this account; a newer one is applied only by the user
            (S16 AC-3).
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217; 'USD' in V1.
        multiplier:
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        binding:
          description: Absent when the account is not bound; an unbound account is never routed (provisional, Q37).
          $ref: '#/components/schemas/AccountBinding'
        opt_ins:
          $ref: '#/components/schemas/AccountOptIns'
        has_open_position:
          type: boolean
          description: Last known from the platform (gateway); false when unbound. Used for the lifecycle and delete messages.
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          description: Only in the idempotent replay of a create whose account was archived since; every other read of an
            archived account is 404.
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            kind:
              const: prop
        then:
          required:
          - firm_name
          - plan_name
          - phase
        else:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - firm_id
            - required:
              - preset_version_id
            - required:
              - firm_platform
    AccountList:
      type: object
      additionalProperties: false
      required:
      - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - display_name
      - max_position_qty
      description: '`kind: real` → `size_amount` required; no prop fields; no `opt_ins`.

        `kind: prop` → either `preset_version_id` (+ `firm_platform` when the preset requires it; firm,

        plan, phase and size then come from the preset and must be absent) or all of `firm_name`,

        `plan_name`, `phase`, `size_amount` (manual).

        '
      properties:
        kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          $ref: '#/components/schemas/AccountName'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        firm_name:
          $ref: '#/components/schemas/ManualText'
        plan_name:
          $ref: '#/components/schemas/ManualText'
        phase:
          $ref: '#/components/schemas/ManualText'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        multiplier:
          description: Defaults to 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        binding:
          $ref: '#/components/schemas/PlatformAccountRef'
        profile_size:
          description: Real accounts only. The standard size whose default profile is copied, when `size_amount` is a tie
            (`getNearestProfileSize` returns two candidates). Ignored otherwise.
          $ref: '#/components/schemas/SizeAmount'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` (action `account_create_opt_in_accept`, no target).
          $ref: '#/components/schemas/StepUpProof'
      allOf:
      - if:
          properties:
            kind:
              const: real
        then:
          required:
          - size_amount
          not:
            anyOf:
            - required:
              - preset_version_id
            - required:
              - firm_platform
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - opt_ins
        else:
          not:
            required:
            - profile_size
      - if:
          properties:
            kind:
              const: prop
          required:
          - preset_version_id
        then:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
            - required:
              - size_amount
      - if:
          properties:
            kind:
              const: prop
          not:
            required:
            - preset_version_id
        then:
          required:
          - firm_name
          - plan_name
          - phase
          - size_amount
          not:
            required:
            - firm_platform
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - row_version
      - display_name
      - max_position_qty
      description: 'Full replacement of the editable fields (`kind` is fixed at creation). The same prop/real rules as

        `AccountCreateRequest`, keyed on the stored `kind`: real → `size_amount`, no prop fields, no

        `opt_ins`; prop → `preset_version_id` (+ `firm_platform`) or the four manual fields. A body that

        does not fit the stored kind gets 400 `common.invalid_request` with the pointer of the first

        offending field. Switching a prop account from a preset to manual fields (or back) is allowed.

        '
      properties:
        row_version:
          type: integer
          minimum: 1
        display_name:
          $ref: '#/components/schemas/AccountName'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        firm_name:
          $ref: '#/components/schemas/ManualText'
        plan_name:
          $ref: '#/components/schemas/ManualText'
        phase:
          $ref: '#/components/schemas/ManualText'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        multiplier:
          description: Absent means 1.
          $ref: '#/components/schemas/Multiplier'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        binding:
          description: The platform account to bind; absent means unbound.
          $ref: '#/components/schemas/PlatformAccountRef'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` and changes the stored state (action `account_opt_in_accept`,
            target = this account).
          $ref: '#/components/schemas/StepUpProof'
      allOf:
      - if:
          required:
          - preset_version_id
        then:
          not:
            anyOf:
            - required:
              - firm_name
            - required:
              - plan_name
            - required:
              - phase
      - if:
          required:
          - firm_name
        then:
          required:
          - plan_name
          - phase
          - size_amount
      - if:
          not:
            required:
            - preset_version_id
        then:
          not:
            required:
            - firm_platform
    LifecycleRequest:
      type: object
      additionalProperties: false
      required:
      - state
      - row_version
      properties:
        state:
          $ref: '#/components/schemas/LifecycleState'
        row_version:
          type: integer
          minimum: 1
    ArchiveImpact:
      type: object
      additionalProperties: false
      required:
      - has_open_position
      - routes
      - follower_links
      properties:
        has_open_position:
          type: boolean
          description: When true `archiveAccount` is refused (the dialog shows the explanation instead of a confirmation).
        routes:
          type: array
          description: Routing subscriptions of this account (S7) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required:
            - source_id
            - source_name
            properties:
              source_id:
                $ref: '#/components/schemas/Uuid'
              source_name:
                $ref: '#/components/schemas/DisplayName'
        follower_links:
          type: array
          description: Master/follower relations (S19, V1.1; always empty before it) that archiving removes.
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - display_name
            - role
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              display_name:
                $ref: '#/components/schemas/AccountName'
              role:
                type: string
                enum:
                - master
                - follower
                description: The role of the OTHER account in the relation.
    OptInKind:
      type: string
      enum:
      - automation
      - copy
    FirmStance:
      type: string
      enum:
      - allowed
      - forbidden
      - conditional
      - unknown
      - not_confirmed
      description: Stance of the rule version for the opt-in kind. A missing stance in the preset, and every prop account
        without a preset (generic rule, provisional Q40), is `unknown`.
    OptInChoiceRequest:
      type: object
      additionalProperties: false
      required:
      - choice
      - rule_version_id
      properties:
        choice:
          type: string
          enum:
          - accepted
          - declined
        rule_version_id:
          description: Rule version whose text was displayed (`RuleVersion.id`).
          $ref: '#/components/schemas/Uuid'
    OptInChoices:
      description: 'The `opt_ins` property of `createAccount` / `updateAccount` (atomic create-with-choice). Must

        contain every kind whose choice is required for the account''s rule version and is not already

        `chosen` for that version; otherwise 422 `accounts.opt_in_required` with `pointer`

        `/opt_ins/automation` or `/opt_ins/copy`, and nothing is saved. `copy` is required only when the

        account is a follower (S19), so it is normally absent here. A stale `rule_version_id` gives 409

        `accounts.rule_version_changed`. The step-up (when a choice is `accepted` and changes the stored

        state) happens before the single save, so cancelling it saves nothing.

        '
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        automation:
          $ref: '#/components/schemas/OptInChoiceRequest'
        copy:
          $ref: '#/components/schemas/OptInChoiceRequest'
    OptInState:
      type: object
      additionalProperties: false
      required:
      - kind
      - state
      properties:
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_stance:
          description: Absent only for real accounts.
          $ref: '#/components/schemas/FirmStance'
        state:
          type: string
          enum:
          - not_required
          - chosen
          - pending_review
          description: 'not_required = no choice is asked now: real account, the stance is `allowed`, or (`copy`) the

            account is not a follower (Q-S5-8; no card in the UI); chosen = an explicit choice exists for

            the current rule version; pending_review = see `pending_reason`; that kind is suspended until

            the user chooses again (Q26). Routing treats `pending_review` and `declined` as not accepted

            (`routing.automation_not_accepted` / `routing.copy_not_accepted`). There is no "saved without

            a choice" state: first choices are atomic with creation.

            '
        pending_reason:
          type: string
          enum:
          - stance_changed
          - text_changed
          - preset_attached
          description: 'With `pending_review` only. `stance_changed` (Q26); `text_changed` = the new rule version is

            flagged as a material text change (provisional, Q42; `RuleVersion.change` has the reason

            text); `preset_attached` = a preset was attached to an account that had none (provisional, Q41).

            '
        choice:
          type: string
          enum:
          - accepted
          - declined
          description: 'With `chosen`: the choice in force. With `pending_review`: the **previous** choice (no longer in

            force), present only if one was ever made, so the review dialog can show it; it is never

            preselected. Absent with `not_required`.

            '
        chosen_at:
          $ref: '#/components/schemas/Timestamp'
        rule_version_id:
          description: Rule version the `choice` was made against.
          $ref: '#/components/schemas/Uuid'
        current_rule_version_id:
          description: The rule version in force for this account and kind (fetch its text with `getRuleVersion`). Absent
            only for real accounts.
          $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            state:
              const: chosen
        then:
          required:
          - firm_stance
          - choice
          - chosen_at
          - rule_version_id
          - current_rule_version_id
      - if:
          properties:
            state:
              const: pending_review
        then:
          required:
          - firm_stance
          - pending_reason
          - current_rule_version_id
          dependentRequired:
            choice:
            - chosen_at
            - rule_version_id
        else:
          not:
            required:
            - pending_reason
      - if:
          properties:
            state:
              const: not_required
        then:
          not:
            anyOf:
            - required:
              - choice
            - required:
              - chosen_at
            - required:
              - rule_version_id
    AccountChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      description: Any change to an account the caller sees (fields, lifecycle, opt-in state, binding, open position). The
        client refetches the account (`getAccount`).
      properties:
        type:
          const: account.changed
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
    AccountArchivedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      properties:
        type:
          const: account.archived
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
    AuditCategory:
      type: string
      enum:
      - ingress
      - routing
      - execution
      - risk
      - connection
      - security
      - config
    AuditOutcome:
      type: string
      enum:
      - received
      - routed
      - executed
      - partial
      - skipped
      - refused
      - rejected
      - expired
      - unknown
      - info
      description: "Final taxonomy (Q-S10-2), set by the Core on every entry, never derived by the client:\n- `received` —\
        \ instruction accepted at ingress;\n- `routed` — routing decision to send to an account (full quantity);\n- `executed`\
        \ — an order filled;\n- `partial` — quantity capped at the maximum position, or a partial fill;\n- `skipped` — not\
        \ sent by a configuration rule (duplicate, signal type not selected, opt-in not\n  accepted, account inactive, no\
        \ stop/target profile, maximum already reached, nothing to close);\n- `refused` — not sent by a protective gate (out\
        \ of sync, risk block, position conflict);\n- `rejected` — refused by validation (ingress) or by the platform;\n-\
        \ `expired` — command TTL exceeded, not executed;\n- `unknown` — the order's state could not be determined after a\
        \ recovery (the account is\n  flagged out of sync);\n- `info` — everything else (configuration, connection, security,\
        \ order received/working/cancelled,\n  bracket calculation, command sent). No badge in the UI.\n"
    AuditSignalType:
      type: string
      enum:
      - trigger
      - trade_plan
      - nq_trigger
      - master_account
    AuditCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      maxLength: 96
      description: 'Stable code; clients translate it (ADR-0001 §9). The set is open: a code the client does not know

        is shown with the fallback text and the technical data. `KnownAuditCode` lists the codes defined

        by the contract so far (the i18n parity check uses it).

        '
    KnownAuditCode:
      type: string
      enum:
      - ingress.received
      - ingress.duplicate_ignored
      - ingress.rejected
      - ingress.rate_limited
      - routing.routed
      - routing.quantity_capped
      - routing.max_position_reached
      - routing.signal_type_not_selected
      - routing.automation_not_accepted
      - routing.copy_not_accepted
      - routing.account_inactive
      - routing.no_bracket_profile
      - routing.out_of_sync
      - routing.risk_blocked
      - routing.position_conflict
      - routing.nothing_to_close
      - routing.nothing_to_reduce
      - routing.no_correlated_order
      - routing.expired
      - execution.command_sent
      - execution.bracket_calculated
      - execution.order_received
      - execution.order_working
      - execution.partially_filled
      - execution.filled
      - execution.cancelled
      - execution.rejected
      - execution.expired
      - execution.state_unknown
      - execution.fill_corrected
      - connection.status_changed
      - security.signed_in
      - security.sign_in_failed
      - security.code_rate_limited
      - security.code_delivery_failed
      - security.new_device_notice_sent
      - security.step_up_succeeded
      - security.step_up_failed
      - security.channel_change_requested
      - security.channel_change_on_hold
      - security.channel_change_completed
      - security.channel_change_cancelled
      - security.channel_change_not_completed
      - security.device_forgotten
      - security.signed_out_everywhere
      - accounts.created
      - accounts.updated
      - accounts.archived
      - accounts.lifecycle_changed
      - accounts.opt_in_chosen
      - accounts.opt_in_suspended
      - routing.subscription_changed
      - profiles.default_changed
      - profiles.account_changed
      description: 'Codes with a `details` schema in `AuditDetailsByCode`. `security.*` codes come from S3 AC-16 and

        auth policy rev. 2 (Esquadro). Families defined by other slices are added with their contracts:

        `sync.*` (S11), `risk.*` (S13–S15), `notifications.*` (S18).

        '
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - occurred_at
      - recorded_at
      - category
      - code
      - outcome
      - details
      - safe_to_display
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        category:
          $ref: '#/components/schemas/AuditCategory'
        code:
          $ref: '#/components/schemas/AuditCode'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        is_exit:
          type: boolean
          description: With routing and execution entries of an exit action (`close`, reduce, protective modify/cancel), so
            the text can say "saída".
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        message_id:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot at the time of the entry.
        account_deleted:
          type: boolean
          description: True when the account has been archived since (UI `(excluída)`).
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          minLength: 1
          maxLength: 60
        source_key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
          description: The only part of a source token that may be shown.
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        command_id:
          $ref: '#/components/schemas/Uuid'
        details:
          type: object
          description: 'Typed per code: the schema is `AuditDetailsByCode[code]` (an empty object for codes without

            one). Money, prices and distances are decimal strings. Never holds a secret: the Core redacts

            before writing and storage refuses token-shaped strings.

            '
        safe_to_display:
          type: boolean
          description: True when the raw `details` JSON may be shown in "technical data". The rendered fields of the catalog
            are always shown.
      allOf:
      - if:
          required:
          - account_id
        then:
          required:
          - account_name
          - account_deleted
      - if:
          required:
          - source_id
        then:
          required:
          - source_name
    ActivityPage:
      type: object
      additionalProperties: false
      required:
