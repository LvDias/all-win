      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/TradingDayResetValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/TradingDayResetValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    ConsistencyRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Consistency rule; optional (an unresolved one is shown as not tracked).
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/ConsistencyValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/ConsistencyValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    CommissionValue:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          description: USD per contract and per side (a round turn costs twice), ≥ 0.
          $ref: '#/components/schemas/MoneyAmount'
    EvaluationTargetValue:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          description: Net profit to reach since the evaluation start, > 0.
          $ref: '#/components/schemas/MoneyAmount'
    CommissionRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Commission per contract and side, as the firm publishes it.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/CommissionValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/CommissionValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    EvaluationTargetRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Evaluation profit target (Q46).
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/EvaluationTargetValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/EvaluationTargetValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    RuleField:
      type: string
      enum:
      - max_position_qty
      - drawdown
      - daily_loss_limit
      - daily_profit_target
      - trading_day_reset
      - consistency_rule
      - commission_per_contract_side
      - evaluation_profit_target
      description: Required to save an account (S16 AC-6) — `max_position_qty`, `drawdown`, `daily_loss_limit`, `trading_day_reset`.
    PresetRules:
      type: object
      additionalProperties: false
      required:
      - max_position_qty
      - drawdown
      - daily_loss_limit
      - trading_day_reset
      properties:
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionRule'
        drawdown:
          $ref: '#/components/schemas/DrawdownRule'
        daily_loss_limit:
          $ref: '#/components/schemas/DailyLossRule'
        daily_profit_target:
          $ref: '#/components/schemas/DailyProfitTargetRule'
        trading_day_reset:
          $ref: '#/components/schemas/TradingDayResetRule'
        consistency_rule:
          $ref: '#/components/schemas/ConsistencyRule'
        commission_per_contract_side:
          description: The firm's published commission per contract and side (U20 a; prefills the account floor, editable
            on the account).
          $ref: '#/components/schemas/CommissionRule'
        evaluation_profit_target:
          description: Evaluation phase only — the profit to reach to pass (Q46; S16 AC-10). Absent for funded / live phases.
          $ref: '#/components/schemas/EvaluationTargetRule'
    PresetRuleValues:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'The account''s own value for a rule field, sent when it differs from the preset value (edited, S16

        AC-2) or resolves a not-confirmed field (chosen among the published values or typed, S16 AC-6).

        `max_position_qty` is not here: it is the account''s top-level field (S5).

        '
      properties:
        drawdown:
          $ref: '#/components/schemas/DrawdownValue'
        daily_loss_limit:
          $ref: '#/components/schemas/DailyLossValue'
        daily_profit_target:
          $ref: '#/components/schemas/DailyProfitTargetValue'
        trading_day_reset:
          $ref: '#/components/schemas/TradingDayResetValue'
        consistency_rule:
          $ref: '#/components/schemas/ConsistencyValue'
        evaluation_profit_target:
          $ref: '#/components/schemas/EvaluationTargetValue'
    StanceInfo:
      type: object
      additionalProperties: false
      required:
      - value
      - quotes
      description: VPS/server and personal-device stances (S16 AC-8); verbatim quotes, never translated.
      properties:
        value:
          type: string
          enum:
          - allowed
          - forbidden
          - conditional
          - unknown
          - not_confirmed
          - required
          - not_required
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/RuleQuote'
        research:
          type: object
          additionalProperties: false
          required:
          - searched_on
          - sources
          properties:
            searched_on:
              type: string
              format: date
            sources:
              type: array
              items:
                $ref: '#/components/schemas/SourceRef'
    FirmStances:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      - vps
      - personal_device
      description: '`automation` / `copy` are the rule versions of the opt-ins: one entry without `firm_platform` when

        the stance is the same on every platform, otherwise one entry per firm platform. `vps` ∈ allowed /

        forbidden / conditional / unknown / not_confirmed; `personal_device` ∈ required / not_required /

        unknown (Q-S16-2).

        '
      properties:
        automation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RuleVersion'
        copy:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RuleVersion'
        vps:
          allOf:
          - $ref: '#/components/schemas/StanceInfo'
          - properties:
              value:
                enum:
                - allowed
                - forbidden
                - conditional
                - unknown
                - not_confirmed
        personal_device:
          allOf:
          - $ref: '#/components/schemas/StanceInfo'
          - properties:
              value:
                enum:
                - required
                - not_required
                - unknown
    ManualOnly:
      type: object
      additionalProperties: false
      required:
      - reason
      description: 'S16 AC-7: no V1 output reaches the firm''s platforms; risk tracking only, no routing (S7 AC-7b).'
      properties:
        reason:
          $ref: '#/components/schemas/RuleQuote'
    FirmSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - name
      - plan_names
      - stances
      - not_confirmed_count
      - release
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        name:
          type: string
          maxLength: 120
        manual_only:
          $ref: '#/components/schemas/ManualOnly'
        plan_names:
          type: array
          items:
            type: string
            maxLength: 120
        stances:
          type: object
          additionalProperties: false
          required:
          - automation
          - copy
          - vps
          - personal_device
          properties:
            automation:
              $ref: '#/components/schemas/StanceSummary'
            copy:
              $ref: '#/components/schemas/StanceSummary'
            vps:
              type: string
              enum:
              - allowed
              - forbidden
              - conditional
              - unknown
              - not_confirmed
            personal_device:
              type: string
              enum:
              - required
              - not_required
              - unknown
        not_confirmed_count:
          type: integer
          minimum: 0
        release:
          $ref: '#/components/schemas/FirmReleaseRef'
    StanceSummary:
      type: string
      enum:
      - allowed
      - forbidden
      - conditional
      - unknown
      - not_confirmed
      - varies_by_platform
      description: A `FirmStance`, or `varies_by_platform` when the firm's platforms have different stances (the firm detail
        lists them).
    FirmReleaseRef:
      type: object
      additionalProperties: false
      required:
      - version_number
      - published_at
      - verified_on
      properties:
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        verified_on:
          type: string
          format: date
    FirmList:
      type: object
      additionalProperties: false
      required:
      - firms
      properties:
        firms:
          type: array
          items:
            $ref: '#/components/schemas/FirmSummary'
    PresetOption:
      type: object
      additionalProperties: false
      required:
      - preset_id
      - preset_version_id
      - size_amount
      - platform_specific
      - not_confirmed_count
      description: One size of a plan/phase in the current release.
      properties:
        preset_id:
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        size_label:
          type: string
          maxLength: 32
          description: As published, e.g. "50K".
        platform_specific:
          type: boolean
          description: True → the account must choose `firm_platform`.
        not_confirmed_count:
          type: integer
          minimum: 0
    FirmDetail:
      type: object
      additionalProperties: false
      required:
      - summary
      - stances
      - platforms
      - plans
      - excluded_plans
      properties:
        summary:
          $ref: '#/components/schemas/FirmSummary'
        stances:
          $ref: '#/components/schemas/FirmStances'
        platforms:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - label
            properties:
              code:
                $ref: '#/components/schemas/FirmPlatform'
              label:
                type: string
                maxLength: 60
                description: Product name, e.g. "Rithmic" (not translated).
        plans:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - plan_id
            - name
            - phases
            properties:
              plan_id:
                $ref: '#/components/schemas/Uuid'
              name:
                type: string
                maxLength: 120
              phases:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - phase
                  - sizes
                  properties:
                    phase:
                      type: string
                      enum:
                      - evaluation
                      - funded
                      - live
                      description: Research format phases; the UI translates them.
                    sizes:
                      type: array
                      items:
                        $ref: '#/components/schemas/PresetOption'
        excluded_plans:
          type: array
          description: Plans not offered as presets (S16 AC-9); registered manually.
          items:
            type: string
            maxLength: 120
    ReleaseChange:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - stance_changed
          - stance_text_changed
          - rule_value_changed
          - preset_added
          - preset_removed
        stance:
          type: string
          enum:
          - automation
          - copy
          - vps
          - personal_device
        from:
          type: string
          maxLength: 32
        to:
          type: string
          maxLength: 32
        material:
          type: boolean
          description: 'With `stance_text_changed` — flagged by the publisher as a material change (Q42;

            `reason` is expected but optional while Q42 is open); only material automation/copy text

            changes suspend. Always consistent with the new `RuleVersion.change.cause`: material ⇔

            `text_changed`, not material ⇔ `not_material`.

            '
        reason:
          $ref: '#/components/schemas/LocalizedText'
        field:
          $ref: '#/components/schemas/RuleField'
        preset_id:
          $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            kind:
              enum:
              - stance_changed
              - stance_text_changed
        then:
          required:
          - stance
      - if:
          properties:
            kind:
              const: stance_changed
        then:
          required:
          - from
          - to
      - if:
          properties:
            kind:
              enum:
              - preset_added
              - preset_removed
        then:
          required:
          - preset_id
      - if:
          properties:
            kind:
              const: stance_text_changed
        then:
          required:
          - material
      - if:
          properties:
            kind:
              const: rule_value_changed
        then:
          required:
          - field
          - preset_id
    FirmRelease:
      type: object
      additionalProperties: false
      required:
      - version_number
      - published_at
      - verified_on
      - changes
      - rule_versions
      - vps
      - personal_device
      properties:
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        verified_on:
          type: string
          format: date
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseChange'
        rule_versions:
          type: array
          description: The opt-in rule versions of this release (texts viewable with `getRuleVersion`).
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - kind
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              kind:
                $ref: '#/components/schemas/OptInKind'
              firm_platform:
                $ref: '#/components/schemas/FirmPlatform'
        vps:
          $ref: '#/components/schemas/StanceInfo'
        personal_device:
          $ref: '#/components/schemas/StanceInfo'
    FirmReleaseList:
      type: object
      additionalProperties: false
      required:
      - firm_id
      - releases
      properties:
        firm_id:
          $ref: '#/components/schemas/Uuid'
        releases:
          type: array
          items:
            $ref: '#/components/schemas/FirmRelease'
    PresetVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - preset_id
      - firm_id
      - firm_name
      - plan_id
      - plan_name
      - phase
      - size_amount
      - release
      - rule_sets
      - not_confirmed_count
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        preset_id:
          $ref: '#/components/schemas/Uuid'
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        plan_id:
          $ref: '#/components/schemas/Uuid'
        plan_name:
          type: string
          maxLength: 120
        phase:
          type: string
          enum:
          - evaluation
          - funded
          - live
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        size_label:
          type: string
          maxLength: 32
        manual_only:
          $ref: '#/components/schemas/ManualOnly'
        release:
          $ref: '#/components/schemas/FirmReleaseRef'
        superseded_by:
          description: Present when a newer version of this preset exists.
          $ref: '#/components/schemas/Uuid'
        rule_sets:
          type: array
          minItems: 1
          description: One entry without `firm_platform`, or one entry per firm platform when the rules differ by platform.
          items:
            type: object
            additionalProperties: false
            required:
            - rules
            properties:
              firm_platform:
                $ref: '#/components/schemas/FirmPlatform'
              rules:
                $ref: '#/components/schemas/PresetRules'
        not_confirmed_count:
          type: integer
          minimum: 0
    AccountRuleField:
      type: object
      additionalProperties: false
      required:
      - field
      - origin
      properties:
        field:
          $ref: '#/components/schemas/RuleField'
        origin:
          type: string
          enum:
          - preset
          - edited
          - chosen_from_conflict
          - unresolved
          description: '`preset` = the preset''s verified value; `edited` = the user changed it (badge `Editado`);

            `chosen_from_conflict` = the user resolved a not-confirmed value (Q-S16-3: stored with the time

            and whether one of the published values or another value was chosen); `unresolved` = an optional

            not-confirmed field left open (not tracked).

            '
        chose:
          type: string
          enum:
          - published_value
          - other_value
          description: With `chosen_from_conflict`.
        chosen_at:
          $ref: '#/components/schemas/Timestamp'
        account_value:
          description: The account's value (typed by `field`, as in `PresetRuleValues`; for `max_position_qty` a `MaxPositionValue`).
            Absent with `unresolved`.
          type: object
        preset_value:
          description: The preset version's rule for this field (typed by `field`, as in `PresetRules`).
          type: object
      allOf:
      - if:
          properties:
            origin:
              const: chosen_from_conflict
        then:
          required:
          - chose
          - chosen_at
          - account_value
        else:
          not:
            anyOf:
            - required:
              - chose
            - required:
              - chosen_at
      - if:
          properties:
            origin:
              const: unresolved
        then:
          not:
            required:
            - account_value
        else:
          required:
          - account_value
    AccountPresetState:
      type: object
      additionalProperties: false
      required:
      - account_id
      - preset_version_id
      - release
      - fields
      - row_version
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        release:
          $ref: '#/components/schemas/FirmReleaseRef'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AccountRuleField'
        newer_version:
          type: object
          additionalProperties: false
          required:
          - preset_version_id
          - release
          - suspends
          properties:
            preset_version_id:
              $ref: '#/components/schemas/Uuid'
            release:
              $ref: '#/components/schemas/FirmReleaseRef'
            suspends:
              type: boolean
              description: True when it changed the automation or copy stance or its material text, so the opt-in is already
                `pending_review` (Q-S5-3).
        row_version:
          type: integer
          minimum: 1
          description: The account's `row_version`.
    PresetDiffRow:
      type: object
      additionalProperties: false
      required:
      - field
      - edited
      - requires_choice
      - cap_conflict
      properties:
        field:
          $ref: '#/components/schemas/RuleField'
        account_value:
          type: object
          description: Typed by `field`; absent when unresolved.
        current_preset_value:
          type: object
          description: The current version's rule (typed by `field`).
        new_preset_value:
          type: object
          description: The target version's rule (typed by `field`); absent when the field was removed.
        edited:
          type: boolean
          description: The user had edited this field ("Você editou este valor").
        requires_choice:
          type: boolean
        cap_conflict:
          type: boolean
          description: '`max_position_qty` only: the new cap is below the account''s value; apply is refused until the body
            lowers it.'
    PresetDiff:
      type: object
      additionalProperties: false
      required:
      - account_id
      - from_preset_version_id
      - to_preset_version_id
      - rows
      - opt_in_changes
      - firm_platform_required
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        from_preset_version_id:
          $ref: '#/components/schemas/Uuid'
        to_preset_version_id:
          $ref: '#/components/schemas/Uuid'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PresetDiffRow'
        firm_platform_required:
          type: boolean
          description: True when the target has platform-specific rules and the account must name (or confirm) its `firm_platform`
            in the apply request.
        firm_platforms:
          type: array
          description: The target's firm platforms (with `firm_platform_required`).
          items:
            $ref: '#/components/schemas/FirmPlatform'
        opt_in_changes:
          type: object
          additionalProperties: false
          required:
          - automation
          - copy
          description: The new rule version per kind when it differs from the account's current one; then the apply request
            needs `opt_ins` for that kind if a choice is required.
          properties:
            automation:
              oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
            copy:
              oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
    ApplyPresetVersionRequest:
      type: object
      additionalProperties: false
      required:
      - target_preset_version_id
      - row_version
      properties:
        target_preset_version_id:
          $ref: '#/components/schemas/Uuid'
        row_version:
          type: integer
          minimum: 1
        firm_platform:
          description: Required when the target has platform-specific rules and the account has no platform yet, or to change
            it (`PresetDiff.firm_platform_required`).
          $ref: '#/components/schemas/FirmPlatform'
        choices:
          type: object
          additionalProperties: false
          description: For each edited field of the diff, keep the user's value or take the new preset value.
          properties:
            max_position_qty:
              $ref: '#/components/schemas/ApplyChoice'
            drawdown:
              $ref: '#/components/schemas/ApplyChoice'
            daily_loss_limit:
              $ref: '#/components/schemas/ApplyChoice'
            daily_profit_target:
              $ref: '#/components/schemas/ApplyChoice'
            trading_day_reset:
              $ref: '#/components/schemas/ApplyChoice'
            consistency_rule:
              $ref: '#/components/schemas/ApplyChoice'
            commission_per_contract_side:
              $ref: '#/components/schemas/ApplyChoice'
            evaluation_profit_target:
              $ref: '#/components/schemas/ApplyChoice'
        rule_values:
          $ref: '#/components/schemas/PresetRuleValues'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` and changes the stored state (action `account_opt_in_accept`,
            target = this account).
          $ref: '#/components/schemas/StepUpProof'
      description: A field appears in `choices` or in `rule_values`, never in both (400 otherwise).
      allOf:
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - drawdown
            rule_values:
              required:
              - drawdown
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - daily_loss_limit
            rule_values:
              required:
              - daily_loss_limit
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - daily_profit_target
            rule_values:
              required:
              - daily_profit_target
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - trading_day_reset
            rule_values:
              required:
              - trading_day_reset
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - consistency_rule
            rule_values:
              required:
              - consistency_rule
    ApplyChoice:
      type: string
      enum:
      - keep_mine
      - use_preset
    PresetVersionAvailableEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - firm_id
      - account_ids
      description: A new release of a firm affects some of the caller's accounts (refresh the notice; S18 sends one notification
        per firm, Q-S16-5).
      properties:
        type:
          const: presets.version_available
        at:
          $ref: '#/components/schemas/Timestamp'
        firm_id:
          $ref: '#/components/schemas/Uuid'
        account_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
    DecimalString:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,10})?$
      description: Exact decimal as a string (no sign, no exponent, no separators).
    MoneyString:
      type: string
      pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
      description: Non-negative money as a decimal string (NUMERIC(18,4)).
    Instrument:
      type: object
      additionalProperties: false
      required:
      - id
      - symbol
      - name
      - exchange
      - currency
      - tick_size
      - tick_value
      - point_value
      - price_decimals
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
          description: Neutral root, e.g. 'MNQ'.
        name:
          type: string
          maxLength: 120
        exchange:
          type: string
          maxLength: 16
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        tick_size:
          $ref: '#/components/schemas/DecimalString'
        tick_value:
          description: Money per tick (tick_size × point_value, computed by the Core).
          $ref: '#/components/schemas/MoneyString'
        point_value:
          $ref: '#/components/schemas/MoneyString'
        price_decimals:
          type: integer
          minimum: 0
          maximum: 10
          description: Decimals to display prices and points with.
    InstrumentList:
      type: object
      additionalProperties: false
      required:
      - instruments
      properties:
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
    DistanceUnit:
      type: string
      enum:
      - points
      - ticks
      - usd
    DistanceValue:
      type: string
      pattern: ^[0-9]{1,8}(\.[0-9]{1,10})?$
      description: Decimal string; its allowed shape depends on the unit (see `DistanceProfile`).
    DistanceProfile:
      type: object
      additionalProperties: false
      required:
      - distance_unit
      - stop_distance
      - target_distance
      description: '`ticks` → whole numbers (`^[0-9]{1,5}$`); `usd` → at most 2 decimals (Q-S6-6); `points` → at most

        10 decimals. Each distance must be at least one tick after conversion (422 otherwise).

        '
      properties:
        distance_unit:
          $ref: '#/components/schemas/DistanceUnit'
        stop_distance:
          $ref: '#/components/schemas/DistanceValue'
        target_distance:
          $ref: '#/components/schemas/DistanceValue'
      allOf:
      - $ref: '#/components/schemas/DistanceProfileShape'
    DistanceEquivalent:
      type: object
      additionalProperties: false
      required:
      - ticks
      - points
      - usd
      - rounded
      description: What execution will use for one side. All values computed by the Core.
      properties:
        ticks:
          type: integer
          minimum: 1
          maximum: 10000
        points:
          $ref: '#/components/schemas/DecimalString'
        usd:
          $ref: '#/components/schemas/MoneyString'
        rounded:
          type: boolean
          description: True when the requested distance was not a whole number of ticks and was rounded toward the entry.
    ProfileEquivalents:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - stop
      - target
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        stop:
          $ref: '#/components/schemas/DistanceEquivalent'
        target:
          $ref: '#/components/schemas/DistanceEquivalent'
    NearestProfileSize:
      type: object
      additionalProperties: false
      required:
      - size_amount
      - candidates
      properties:
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        candidates:
          type: array
          minItems: 1
          maxItems: 2
          description: Ascending. Two entries only on an exact tie (the user chooses).
          items:
            type: object
            additionalProperties: false
            required:
            - size_amount
            - has_default
            properties:
              size_amount:
                $ref: '#/components/schemas/SizeAmount'
              has_default:
                type: boolean
                description: False → the account will start without a profile (Q43).
    DefaultProfileEntry:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - size_amount
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        profile:
          description: Absent when the user has not defined this size.
          $ref: '#/components/schemas/DistanceProfile'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      dependentRequired:
        profile:
        - updated_at
    DefaultProfileList:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - defaults
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        defaults:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DefaultProfileEntry'
    AccountProfileRequest:
      type: object
      additionalProperties: false
      required:
      - distance_unit
      - stop_distance
      - target_distance
      properties:
        distance_unit:
          $ref: '#/components/schemas/DistanceUnit'
        stop_distance:
          $ref: '#/components/schemas/DistanceValue'
        target_distance:
          $ref: '#/components/schemas/DistanceValue'
        row_version:
          type: integer
          minimum: 1
      allOf:
      - $ref: '#/components/schemas/DistanceProfileShape'
    DistanceProfileShape:
      description: The per-unit shape rules of `DistanceProfile`, reusable by request bodies that add fields.
      allOf:
      - if:
          properties:
            distance_unit:
              const: ticks
        then:
          properties:
            stop_distance:
              pattern: ^[0-9]{1,5}$
            target_distance:
              pattern: ^[0-9]{1,5}$
      - if:
          properties:
            distance_unit:
              const: usd
        then:
          properties:
            stop_distance:
              pattern: ^[0-9]{1,8}(\.[0-9]{1,2})?$
            target_distance:
              pattern: ^[0-9]{1,8}(\.[0-9]{1,2})?$
    AccountProfile:
      type: object
      additionalProperties: false
      required:
      - account_id
      - instrument_id
      - profile
      - equivalents
      - origin
      - customized
      - row_version
      - updated_at
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        profile:
          $ref: '#/components/schemas/DistanceProfile'
        equivalents:
          $ref: '#/components/schemas/ProfileEquivalents'
        origin:
          type: string
          enum:
          - size_default
          - nearest_size_default
          - set_by_user
          description: 'Where the values came from when last copied: the default of the account''s size, the default of

            the nearest standard size (an account of a non-standard size, real or prop, Q73 b; on an exact

            tie the size the user picked, Q60), or typed by the user on an account that had no profile.

            The nearest size only picks the profile: risk always uses the account''s own size (Q73).

            '
        copied_from_size:
          description: With `size_default` / `nearest_size_default`.
          $ref: '#/components/schemas/SizeAmount'
        copied_at:
          $ref: '#/components/schemas/Timestamp'
        customized:
          type: boolean
          description: True after the user edited the copy (badge `Personalizado`); false right after a copy or restore; always
            false with `set_by_user` (nothing to diverge from).
        default_now:
          description: The current default of `copied_from_size` (for the "default today" popover); absent if that size has
            none.
          $ref: '#/components/schemas/DistanceProfile'
        row_version:
          type: integer
          minimum: 1
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            origin:
              enum:
              - size_default
              - nearest_size_default
        then:
          required:
          - copied_from_size
          - copied_at
        else:
          properties:
            customized:
              const: false
          not:
            anyOf:
            - required:
              - copied_from_size
            - required:
              - copied_at
            - required:
              - default_now
    AccountProfileList:
      type: object
      additionalProperties: false
      required:
      - account_id
      - profiles
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        profiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - instrument_id
            properties:
              instrument_id:
                $ref: '#/components/schemas/Uuid'
              profile:
                description: Absent when the account has no profile for the instrument (its size had no default when it was
                  created; Q43).
                $ref: '#/components/schemas/AccountProfile'
    RiskRuleKind:
      type: string
      enum:
      - daily_loss
      - drawdown
      - daily_profit_target
      - consistency
    RiskState:
      type: string
      enum:
      - normal
      - warning
      - reached
      - target_reached
      description: 'Exactly three levels plus the target (F§7.1, D18): `normal` < 80 %, `warning` ≥ 80 %, `reached` at

        the limit, `target_reached` for the daily profit target. Consistency never goes beyond `warning`.

        '
    RiskRules:
      type: object
      additionalProperties: false
      required:
      - profit_target_on_reach
      description: The account's rules; an absent rule is not set (provenance per field for prop accounts is in `AccountRiskRules.preset_fields`).
      properties:
        drawdown:
          $ref: '#/components/schemas/DrawdownValue'
        daily_loss_limit:
          $ref: '#/components/schemas/DailyLossValue'
        daily_profit_target:
          $ref: '#/components/schemas/DailyProfitTargetValue'
        profit_target_on_reach:
          type: string
          enum:
          - notify
          - flatten_and_block
          description: Default `notify` (Q3). `flatten_and_block` only with enforcement on (Q49); it falls back to `notify`
            if enforcement is turned off later (Q63).
        consistency_threshold_pct:
          type: string
          pattern: ^(100(\.0)?|[0-9]{1,2}(\.[0-9])?)$
          description: Prop with a consistency rule only; the tracked threshold, 0–100 with at most one decimal (Q-S13-7).
            Never enforced (S13 AC-6).
        trading_day_reset:
          description: Prop only (the account's copy of the preset value; editable, marked `Editado`). Real accounts use the
            CME session close.
          $ref: '#/components/schemas/TradingDayResetValue'
        evaluation_profit_target:
          description: Prop accounts in an evaluation phase (S13b; Q46) — prefilled from the preset, editable. Notify only
            when reached (Q70); it never blocks or flattens.
          $ref: '#/components/schemas/EvaluationTargetValue'
    RiskRulesRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - rules
      properties:
        version:
          type: integer
          minimum: 1
          description: The account's limits version read with the rules (ADR-0006); stale → 409.
        rules:
          $ref: '#/components/schemas/RiskRules'
        acknowledge_reached:
          type: boolean
          description: Required (true) when the new rules would already be reached today.
    AccountRiskRules:
      type: object
      additionalProperties: false
      required:
      - account_id
      - rules
      - enforcement_enabled
      - version
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        rules:
          $ref: '#/components/schemas/RiskRules'
        enforcement_enabled:
          type: boolean
          description: Read-only here (S15 control; default off).
        preset_fields:
          type: array
          description: Prop with a preset only — provenance of each field (same shape as `getAccountPreset`).
          items:
            $ref: '#/components/schemas/AccountRuleField'
        version:
          type: integer
          minimum: 1
    RiskRulesPreview:
      type: object
      additionalProperties: false
      required:
      - changes
      - would_be_reached
      properties:
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - effective
            - effective_from
            properties:
              kind:
                $ref: '#/components/schemas/RiskRuleKind'
              effective:
                type: string
                enum:
                - now
                - next_trading_day
              effective_from:
                $ref: '#/components/schemas/Timestamp'
        would_be_reached:
          type: boolean
          description: True when a change effective now makes a limit already reached; the save then needs `acknowledge_reached`.
    RiskMeter:
      type: object
      additionalProperties: false
      required:
      - kind
      - state
      - limit
      - used
      - percent
      properties:
        kind:
          $ref: '#/components/schemas/RiskRuleKind'
        state:
          $ref: '#/components/schemas/RiskState'
        limit:
          description: The limit or target in force today — money (`Money` pattern), or for `consistency` the threshold as
            a percent string.
          type: string
          pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
        used:
          description: Today's value against the limit (loss used, drawdown used, profit made — money; for `consistency` the
            largest day's share of total profit, as a percent string).
          type: string
          pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
        percent:
          type: integer
          minimum: 0
          description: used / limit × 100, truncated (F§6.2), so 80 is never shown while the state is `normal`.
        drawdown_type:
          type: string
          enum:
          - trailing_intraday
          - trailing_eod
          - static
        floor:
          description: Trailing drawdown only — the account balance at which the drawdown is breached, as it stands now (Q-S13-5).
          $ref: '#/components/schemas/Money'
      allOf:
      - if:
          properties:
            kind:
              const: drawdown
        then:
          required:
          - drawdown_type
        else:
          not:
            anyOf:
            - required:
              - drawdown_type
            - required:
              - floor
    AccountRisk:
      type: object
      additionalProperties: false
      required:
      - account_id
      - as_of
      - stale
      - state
      - trading_day
      - meters
      - unset_rules
      - untracked_rules
      - enforcement_enabled
      - limits_pending
      - pending_changes
      - pnl_basis
      - commission_source
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        as_of:
          $ref: '#/components/schemas/Timestamp'
        stale:
          type: boolean
        stale_reason:
          type: string
          enum:
          - connection_down
          - no_recent_data
        state:
          description: The worst state over all meters.
          $ref: '#/components/schemas/RiskState'
        trading_day:
          type: object
          additionalProperties: false
          required:
          - start
          - end
          - next_reset
          - source
          properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
            next_reset:
              $ref: '#/components/schemas/Timestamp'
            source:
              type: string
              enum:
              - firm
              - cme_session_close
            firm_reset:
              $ref: '#/components/schemas/TradingDayResetValue'
            playback_clock:
              description: Playback accounts only — the simulated clock the day and P&L follow (S15 AC-7).
              $ref: '#/components/schemas/Timestamp'
        meters:
          type: array
          description: One meter per rule that is set and tracked, in the order daily loss, drawdown, daily profit target,
            consistency.
          items:
            $ref: '#/components/schemas/RiskMeter'
        unset_rules:
          type: array
          description: Rules not set (UI "sem limite definido").
          items:
            $ref: '#/components/schemas/RiskRuleKind'
        untracked_rules:
          type: array
          description: Rules set but not tracked (a not-confirmed preset value left unresolved, or a drawdown of type `other`).
          items:
            $ref: '#/components/schemas/RiskRuleKind'
        blocked:
          type: object
          additionalProperties: false
          required:
          - until
          - cause
          description: Present while the account is blocked until the reset (S15); no early unlock.
          properties:
            until:
              $ref: '#/components/schemas/Timestamp'
            cause:
              type: string
              enum:
              - daily_loss
              - drawdown
              - daily_profit_target
        enforcement_enabled:
          type: boolean
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: The basis of every meter (`net` from 3.5.0; S13 AC-2 — firms measure on net).
        commission_source:
          description: How today's commissions were obtained (`none` → the UI shows "comissão não informada; os limites podem
            estar folgados demais", a notice, not a block).
          $ref: '#/components/schemas/CommissionSource'
        commissions_today:
          $ref: '#/components/schemas/MoneyString'
        pending_commission_change:
          type: object
          additionalProperties: false
          required:
          - effective_from
          - new_commission_per_contract_side
          description: 'A LOWER commission floor saved on the account applies only from the next trading day (it would

            loosen the net limits; ADR-0006 §3.7, ADR-0004 §7). A higher floor applies at once. Absent

            when nothing is pending.

            '
          properties:
            effective_from:
              $ref: '#/components/schemas/Timestamp'
            new_commission_per_contract_side:
              description: The new floor; absent when the floor is being removed.
              $ref: '#/components/schemas/MoneyAmount'
            change:
              type: string
              enum:
              - commission_floor_lowered
              - commission_floor_removed
        evaluation:
          type: object
          additionalProperties: false
          required:
          - start
          - profit_target
          - earned_before
          - achieved
          - remaining
          - percent
          - state
          - as_of
          description: 'S13b (Q46) — present when the account has an `evaluation_profit_target`. `achieved` = net P&L

            from `start` to now (the Core''s sum of the account''s fills; manual trades never count);

            `remaining` = max(0, target − achieved); `percent` truncated. `target_reached` raises one

            notification (`risk.evaluation_target_reached`, Q70); nothing automatic happens.

            '
          properties:
            start:
              type: string
              format: date
              description: The account's `evaluation_start`.
            profit_target:
              $ref: '#/components/schemas/Money'
            earned_before:
              $ref: '#/components/schemas/Money'
            achieved:
              description: earned_before + net P&L from `start` to now.
              $ref: '#/components/schemas/Money'
            remaining:
              $ref: '#/components/schemas/MoneyString'
            percent:
              type: integer
              minimum: 0
            state:
              type: string
              enum:
              - in_progress
              - target_reached
            reached_at:
              $ref: '#/components/schemas/Timestamp'
            as_of:
              $ref: '#/components/schemas/Timestamp'
        limits_pending:
          type: boolean
          description: True while the risk module has not yet derived the account's latest limits version (ADR-0006); meters
            show the previous limits and new entries are skipped (`routing.limits_pending`).
        pending_changes:
          type: array
          description: Looser values saved today that apply from the next trading day (Q48).
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - effective_from
            properties:
              kind:
                $ref: '#/components/schemas/RiskRuleKind'
              effective_from:
                $ref: '#/components/schemas/Timestamp'
              new_limit:
                type: string
                pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
                description: The new limit (money as a decimal string; a percent for consistency). Absent when the change
                  removes the rule or changes only a kind or `profit_target_on_reach`.
              change:
                type: string
                enum:
                - limit_raised
                - rule_removed
                - profit_target_to_notify
                - daily_loss_softened
                - drawdown_type_changed
                - daily_loss_changed
                description: 'What is pending. `drawdown_type_changed` (a change of type is not comparable, so it waits

                  for the next trading day), `daily_loss_softened` and `daily_loss_changed` (a mixed change

                  that is stricter in one part and looser in another, e.g. `soft_pause` → `hard` with a

                  higher amount: treated as looser, so it waits) carry the new value in `new_drawdown` /

                  `new_daily_loss`.

                  '
              new_drawdown:
                $ref: '#/components/schemas/DrawdownValue'
              new_daily_loss:
                $ref: '#/components/schemas/DailyLossValue'
            allOf:
            - if:
                properties:
                  change:
                    const: drawdown_type_changed
                required:
                - change
              then:
                required:
                - new_drawdown
                properties:
                  kind:
                    const: drawdown
            - if:
                properties:
                  change:
                    enum:
                    - daily_loss_softened
                    - daily_loss_changed
                required:
                - change
              then:
                required:
                - new_daily_loss
                properties:
                  kind:
                    const: daily_loss
        pending_reset_change:
          type: object
          additionalProperties: false
          required:
          - effective_from
          - new_reset
          description: A saved change of the trading-day reset time (prop accounts), which always applies from the next trading
            day (ADR-0006 §3.7).
          properties:
            effective_from:
              $ref: '#/components/schemas/Timestamp'
            new_reset:
              $ref: '#/components/schemas/TradingDayResetValue'
    RiskSummaryList:
      type: object
      additionalProperties: false
      required:
      - summaries
      properties:
        summaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - has_rules
            - stale
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              has_rules:
                type: boolean
                description: False → the list shows `—`.
              stale:
                type: boolean
              state:
                $ref: '#/components/schemas/RiskState'
              worst:
                type: object
                additionalProperties: false
                required:
                - kind
                - percent
                description: The meter with the worst state (highest percent on ties); absent when all are normal.
                properties:
                  kind:
                    $ref: '#/components/schemas/RiskRuleKind'
                  percent:
                    type: integer
                    minimum: 0
              blocked_until:
                $ref: '#/components/schemas/Timestamp'
    RiskStateChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      - state
      - stale
      description: The risk state, staleness, block or trading day of an account changed (not on every tick); sent only to
        the account's owner, like every SSE event; the client refetches `getAccountRisk` / `listRiskSummaries`.
      properties:
        type:
          const: risk.state_changed
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/RiskState'
        stale:
          type: boolean
        reason:
          type: string
          enum:
          - state
          - stale
          - blocked
          - unblocked
          - trading_day_reset
          - rules_changed
          - evaluation_progress
    SignalType:
      type: string
      enum:
      - trigger
      - trade_plan
      - nq_trigger
      description: Selectable signal types of a TradingView route (ADR-0003). `master_account` belongs to follower routes
        (S19) and is not accepted here.
    SignalTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/components/schemas/SignalType'
      description: At least one (S7 AC-2, Q-S7-1); an empty list gets 400 `common.invalid_request` with pointer `/signal_types`.
    RouteReasonCode:
      type: string
      enum:
      - routing.account_inactive
      - routing.source_revoked
      - routing.platform_unbound
      - routing.automation_not_accepted
      - routing.copy_not_accepted
      - routing.connection_disconnected
      - routing.connection_checking
      - routing.binding_pending
      - routing.broker_disconnected
      - routing.out_of_sync
      - routing.risk_blocked
      - routing.no_bracket_profile
      - routing.limits_pending
      - routing.route_disabled
      description: "Why a route does not (fully) receive now. `effective.reasons[]` lists them **most severe first**,\nin\
        \ this order (F§7.2 extended with the route-level states): `source_revoked`, `route_disabled`,\n`platform_unbound`,\
        \ `out_of_sync`, `connection_disconnected`, `connection_checking`, `broker_disconnected`, `binding_pending`, `risk_blocked`,\
        \ `limits_pending`,\n`no_bracket_profile`, `automation_not_accepted`, `copy_not_accepted`, `account_inactive`.\nThis\
        \ is a display order only. The instruction gates and their order are ADR-0003 §4.1 (Esquadro's\nS7 delta, with ADR-0008):\
        \ `account_inactive` → `platform_unbound` → `automation_not_accepted` →\n`copy_not_accepted` → `signal_type_not_selected`\
        \ → `out_of_sync` → `risk_blocked` →\n`limits_pending` → `no_bracket_profile` → action rules → `expired` (entries\
        \ only). The audit code of a skipped\ninstruction is the first gate that fails. `out_of_sync`, `risk_blocked`, `limits_pending`\
        \ and\n`no_bracket_profile` block entries only. For a `reverse` the §4.2 position check runs before the\nentry gates\
        \ (Q74): position opposite → the close leg runs and the open is skipped with the gate\ncode; flat → skipped with the\
        \ gate code; already on the reverse side → `routing.position_conflict`\n(rejected, notified, never a flatten). `source_revoked`\
        \ and `route_disabled` are route status only (no instruction\nreaches the gates); `connection_disconnected` (every\
        \ connection status other than `connected`:\ndisconnected, outdated, awaiting pairing, unpaired) does not skip an\
        \ instruction either: an\nentry's command expires (`routing.expired`) if its TTL runs out; exits (close, reduce, cancel,\
        \ a\nprotective modify, the close leg of a reverse) carry no expiry, wait, and execute late, audited as\nlate (ADR-0003\
        \ §4.1, ADR-0004 T1). `connection_checking` (S11-03, 5.3.0) is route status only, like\n`connection_disconnected`.\
        \ It covers the connection being `connected` while the mandatory reconnect\ncheck of the account has not finished.\
        \ The window runs per mapped account, from `welcome` until the\nCore has evaluated the reconnect snapshot and the\
        \ replayed outbox reports (ADR-0004 §4 step 3,\n§6.1 r5), or until the session ends. Meanwhile the Core sends no command\
        \ to the account: entries\nkeep their TTL and expire if the window outlasts it, and exits wait. Nothing is skipped,\
        \ and\n`AccountSync.observable` is false. Bounds (Esquadro, Crivo Q2; ADR-0004 r5; provisional values,\ntuned by Ferro\
        \ and Pulso):\n- after 60 s without the evaluation there is an operational and user alert (\"verificação da\n  conexão\
        \ não concluída; ordens aguardando\"), and the route shows `connection_checking` with the\n  elapsed time;\n- after\
        \ 5 min the Core closes the session (4000, `snapshot_timeout`). The adapter reconnects and\n  sends the snapshot again.\
        \ It counts as a normal disconnect (ADR-0004 §6), so an account with a\n  position becomes out of sync.\n`broker_disconnected`\
        \ (5.3.0, ADR-0004 r5 §6.3, Crivo m2) is route status only and never skips. A\nsnapshot reports `connected: false`\
        \ (the platform lost its broker), so delivery to the account is\nHELD: entries keep their TTL and expire, and exits\
        \ wait. Sending would only produce\n`command.account_not_simulation` and lose an exit. It ends with the next snapshot\
        \ that reports\n`connected: true`, of any trigger, at reconnect or mid-session.\n`binding_pending` (5.3.0, Esquadro,\
        \ Crivo R3 on r5) is route status only and never skips. It is\nshown when the account was bound or rebound while its\
        \ connection's session is open: the binding\ntakes effect at the next handshake. Until then, entries expire by their\
        \ TTL and exits wait. The web\nsays \"reconecte o plugin para ativar o vínculo\".\nNew codes may be added in a minor\
        \ version; clients show a generic text for an unknown code.\n"
    RouteReason:
      type: object
      additionalProperties: false
      required:
      - code
      - blocks
      properties:
        code:
          $ref: '#/components/schemas/RouteReasonCode'
        blocks:
          type: string
          enum:
          - all_actions
          - entries_only
          description: '`entries_only` for `out_of_sync`, `risk_blocked`, `no_bracket_profile` and `limits_pending`

            (exits still go through, S7 AC-8 / P1); `all_actions` for every other code (a paused or

            disabled account receives no exit either). Fixed per code.

            '
        lifecycle_state:
          description: With `routing.account_inactive` (`paused` or `disabled`), so the text can name it.
          type: string
          enum:
          - paused
          - disabled
        opt_in_state:
          description: With `routing.automation_not_accepted` / `routing.copy_not_accepted`. `declined` = the state is `chosen`
            with choice `declined`; `pending_review` = the state is `pending_review`.
          type: string
          enum:
          - declined
          - pending_review
        instrument_ids:
          description: With `routing.no_bracket_profile` — the enabled instruments for which the account has no stop/target
            profile (profiles are per account × instrument); entries in other instruments still go through.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            code:
              enum:
              - routing.out_of_sync
              - routing.risk_blocked
              - routing.no_bracket_profile
              - routing.limits_pending
        then:
          properties:
            blocks:
              const: entries_only
        else:
          properties:
            blocks:
              const: all_actions
      - if:
          properties:
            code:
              const: routing.account_inactive
        then:
          required:
          - lifecycle_state
        else:
          not:
            required:
            - lifecycle_state
      - if:
          properties:
            code:
              enum:
              - routing.automation_not_accepted
              - routing.copy_not_accepted
        then:
          required:
          - opt_in_state
        else:
          not:
            required:
            - opt_in_state
      - if:
          properties:
            code:
              const: routing.no_bracket_profile
        then:
          required:
          - instrument_ids
        else:
          not:
            required:
            - instrument_ids
    RouteStatus:
      type: object
      additionalProperties: false
      required:
      - status
      - reasons
      - computed_at
      description: Computed by the Core from the account, source, connection, opt-in, sync and risk state; the UI renders
        it and never re-implements a gate.
      properties:
        status:
          type: string
          enum:
          - receiving
          - exits_only
          - not_receiving
          description: '`receiving` = no reason; `exits_only` = only `entries_only` reasons; `not_receiving` = at least

            one `all_actions` reason.

            '
        reasons:
          type: array
          description: Every reason that applies, most severe first (the Core's order follows the UI badge priority); empty
            with `receiving`.
          items:
            $ref: '#/components/schemas/RouteReason'
        computed_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            status:
              const: receiving
        then:
          properties:
            reasons:
              maxItems: 0
      - if:
          properties:
            status:
              const: exits_only
        then:
          properties:
            reasons:
              minItems: 1
              items:
                properties:
                  blocks:
                    const: entries_only
      - if:
          properties:
            status:
              const: not_receiving
        then:
          properties:
            reasons:
              contains:
                properties:
                  blocks:
                    const: all_actions
    Route:
      type: object
      additionalProperties: false
      required:
      - id
      - source_id
      - account_id
      - signal_types
      - is_enabled
      - effective
      - row_version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
        effective:
          $ref: '#/components/schemas/RouteStatus'
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    RouteList:
      type: object
      additionalProperties: false
      required:
      - routes
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    RouteCreateRequest:
      type: object
      additionalProperties: false
      required:
      - source_id
      - account_id
      - signal_types
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
          description: Defaults to true.
        step_up:
          description: See `createRoute` (action `route_enable`, target = the account).
          $ref: '#/components/schemas/StepUpProof'
    RouteUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - signal_types
      - is_enabled
      - row_version
      properties:
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
        row_version:
          type: integer
          minimum: 1
        step_up:
          description: See `updateRoute` (action `route_enable`, target = the account).
          $ref: '#/components/schemas/StepUpProof'
    RouteCandidate:
      type: object
      additionalProperties: false
      required:
      - account_id
      - blocking_reasons
      - status_if_routed
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        blocking_reasons:
          type: array
          description: 'Empty → selectable. Otherwise the option is shown disabled with these reasons, most severe

            first. Only `routing.automation_not_accepted` (automated source) and `routing.platform_unbound`

            (Q37) block creation; every other reason only affects `status_if_routed`.

            '
          items:
            $ref: '#/components/schemas/RouteReason'
        status_if_routed:
          description: The status a new enabled route would have now (e.g. `exits_only` for an out-of-sync account).
          $ref: '#/components/schemas/RouteStatus'
    RouteCandidates:
      type: object
      additionalProperties: false
      required:
      - source_id
      - candidates
      - manual_only
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        candidates:
          type: array
          description: Sorted by account `display_name`.
          items:
            $ref: '#/components/schemas/RouteCandidate'
        manual_only:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - reason
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              reason:
                description: The preset's own explanation, verbatim with source and date (S16 AC-7, Q-S16-6); the UI frames
                  it.
                $ref: '#/components/schemas/RuleQuote'
    RouteChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - route_id
      - source_id
      - account_id
      description: 'Sent when a route is created, changed or removed, AND whenever the effective status of a route

        changes for any cause (source revoked, account lifecycle or opt-in, binding, connection, out of

        sync, risk block, stop/target profile created or removed). One event per affected route; the

        client refetches `listRoutes` (and `listRouteCandidates` if the picker is open).

        '
      properties:
        type:
          const: route.changed
        cause:
          type: string
          enum:
          - configuration
          - status
        at:
          $ref: '#/components/schemas/Timestamp'
        route_id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
    CommissionSource:
      type: string
      enum:
      - platform
      - configured
      - mixed
      - manual
      - none
      description: 'Where the commission came from; per fill the same rule as adapter protocol 1.3 `fill.commission`

        and ADR-0004 §7 (not reported ≠ reported 0). Effective commission of a fill = max(platform-

        reported, the account''s `commission_per_contract_side` × quantity) (U20 a). `platform` when the

        reported value is ≥ floor × quantity (it won); `configured` when the floor won (reported lower,

        zero, or absent with a floor); `none` when absent and no floor (net = gross; the UI shows

        "comissões não informadas"). For a trade: `mixed` when its fills differ; `manual` = typed in a

        manual trade.

        '
    TradeDirection:
      type: string
      enum:
      - long
      - short
      description: Direction of the position (UI `Compra` = long, `Venda` = short).
    TradeOrigin:
      type: string
      enum:
      - routed
      - master
      - manual
      - platform
      description: '`routed` = created by a routed instruction (source + signal type); `master` = master replication

        (S19, V1.1); `manual` = entered by the user (S21 AC-3); `platform` = placed by the user directly in

        the platform and captured (UI "Plataforma (sem sinal)", PO).

        '
    Trade:
      type: object
      additionalProperties: false
      required:
      - trade_id
      - account_id
      - account_name
      - account_deleted
      - instrument_id
      - instrument_symbol
      - direction
      - quantity
      - entry_time
      - entry_price
      - exit_time
      - exit_price
      - duration_seconds
      - pnl
      - pnl_basis
      - gross_pnl
      - commission
      - commission_source
      - origin
      - editable
      - created_at
      description: 'One completed trade (Q57: one trade per entry with FIFO exits in individual mode;

        flat-to-flat in shared mode). Captured trades carry the numbers the plugin computed and sent

        (S21 AC-2; adapter protocol 1.3 `trade_completed`; no raw price data is stored); the Core

        reconciles them with the fills it knows and audits a difference as `trades.reconcile_mismatch`,

        never correcting silently. Manual ones carry the Core''s computation. Manual trades do not feed

        daily loss, drawdown, profit target, consistency or blocks (S13/S15), and never unblock an

        account; they feed only this list and the metrics (S21/S22) (PO rule: S13 AC-2 + S21 AC-3, PO clarification, slice-plan
        rev. 7;

        QA Security I1). Money and prices are decimal strings (X-3).

        '
      properties:
        trade_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot.
        account_deleted:
          type: boolean
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        instrument_symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
        contract_month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        direction:
          $ref: '#/components/schemas/TradeDirection'
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        entry_time:
          $ref: '#/components/schemas/Timestamp'
        entry_price:
          $ref: '#/components/schemas/Price'
        exit_time:
          $ref: '#/components/schemas/Timestamp'
        exit_price:
          $ref: '#/components/schemas/Price'
        duration_seconds:
          type: integer
          minimum: 0
          description: exit − entry (PO).
        pnl:
          description: The main P&L, in the basis of `pnl_basis` (net from 3.5.0).
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: 'The basis of `pnl`. From 3.5.0 always `net` (after commissions; user decision 2026-10-23,

            S21 AC-1); `gross` is kept in the enum only for compatibility with 3.4 readers.

            '
        gross_pnl:
          description: P&L before commissions (shown alongside).
          $ref: '#/components/schemas/Money'
        commission:
          description: 'Effective commission allocated to this trade (floor applied). A fill shared by several trades (a flip,
            or a FIFO partial close in individual mode) is allocated pro rata by the quantity each trade takes from it: share
            = round(fill effective commission × quantity / fill quantity, 4 decimals, half away from zero), and the trade
            allocated last from that fill gets the remainder, so the shares always sum to the fill''s effective commission.
            gross_pnl and pnl use the same quantities; pnl = gross_pnl − commission.

            ≥ 0. The same rule as adapter protocol 1.3 `trade_completed.commission` (Esquadro).

            '
          $ref: '#/components/schemas/MoneyString'
        commission_source:
          $ref: '#/components/schemas/CommissionSource'
        mae:
          description: Maximum adverse excursion in USD, ≥ 0 (Q52). Absent when not provided (manual, Q55) or when the plugin
            did not observe the whole interval (never a partial value).
          $ref: '#/components/schemas/MoneyString'
        mfe:
          description: Maximum favourable excursion in USD, ≥ 0 (as `mae`).
          $ref: '#/components/schemas/MoneyString'
        reconcile_mismatch:
          type: boolean
          description: Captured trades — true when the plugin's numbers differ from the fills the Core knows (kept as sent;
            see the audit entry).
        origin:
          $ref: '#/components/schemas/TradeOrigin'
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          maxLength: 60
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        command_id:
          $ref: '#/components/schemas/Uuid'
        master_account_id:
          description: With `master` (S19).
          $ref: '#/components/schemas/Uuid'
        master_account_name:
          type: string
          maxLength: 80
        editable:
          type: boolean
          description: True only for manual trades (Q56).
        row_version:
          type: integer
          minimum: 1
          description: Manual trades only.
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            origin:
              const: routed
        then:
          required:
          - source_id
          - source_name
          - signal_type
          - instruction_id
      - if:
          properties:
            origin:
              const: master
        then:
          required:
          - master_account_id
          - master_account_name
      - if:
          properties:
            origin:
              const: manual
        then:
          required:
          - row_version
          properties:
            editable:
              const: true
          not:
            anyOf:
            - required:
              - captured_at
            - required:
              - command_id
        else:
          required:
          - captured_at
          properties:
            editable:
              const: false
          not:
            required:
            - row_version
    TradePage:
      type: object
      additionalProperties: false
      required:
      - trades
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        next_cursor:
          type: string
          description: Absent on the last page.
    TradesSummary:
      type: object
      additionalProperties: false
      required:
      - count
      - total_pnl
      - pnl_basis
      - total_gross_pnl
      - total_commission
      - as_of
      properties:
        as_of:
          description: The instant the summary was taken (or `recorded_before` when given).
          $ref: '#/components/schemas/Timestamp'
        count:
          type: integer
          minimum: 0
        total_pnl:
          description: Net (`pnl_basis`).
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: 'The basis of `pnl`. From 3.5.0 always `net` (after commissions; user decision 2026-10-23,

            S21 AC-1); `gross` is kept in the enum only for compatibility with 3.4 readers.

            '
        total_gross_pnl:
          $ref: '#/components/schemas/Money'
        total_commission:
          $ref: '#/components/schemas/MoneyString'
        uncommissioned_count:
          type: integer
          minimum: 0
          description: Trades with `commission_source` `none` (the UI warns that their net equals gross).
    ManualTradeFields:
      type: object
      required:
      - account_id
      - instrument_id
      - direction
      - quantity
      - entry_time
      - entry_price
      - exit_time
      - exit_price
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        direction:
          $ref: '#/components/schemas/TradeDirection'
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        entry_time:
          $ref: '#/components/schemas/Timestamp'
        entry_price:
          $ref: '#/components/schemas/Price'
        exit_time:
          $ref: '#/components/schemas/Timestamp'
        exit_price:
          $ref: '#/components/schemas/Price'
        mae:
          $ref: '#/components/schemas/ExcursionInput'
        mfe:
          $ref: '#/components/schemas/ExcursionInput'
        commission:
          description: 'Optional total commission of the trade, USD ≥ 0 (Q71, decided). Sent → used as typed

            (`commission_source: manual`). Absent → computed by the Core, never by the browser, with the

            per-fill rule of ADR-0004 §7 applied to both sides of the trade: commission =

            `commission_per_contract_side` × quantity (entry side) + `commission_per_contract_side` ×

            quantity (exit side) = floor × quantity × 2 (`commission_source: configured`); with no floor →

            0 (`commission_source: none`, labelled "comissões não informadas"). The floor used is the

            EFFECTIVE floor when the trade is saved (create or update), as derived by the risk module (data

            model 15.1); a lowered floor still pending for the next trading day is not used early. The value

            is stored; a later change of the floor

            never recomputes it. The UI shows the Core''s value from `previewManualTrade` and the user may

            override it by typing a commission.

            '
          $ref: '#/components/schemas/ExcursionInput'
    ExcursionInput:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,2})?$
      description: USD, ≥ 0, at most 2 decimals (Q52).
    ManualTradeRequest:
      allOf:
      - $ref: '#/components/schemas/ManualTradeFields'
      unevaluatedProperties: false
    ManualTradeUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/ManualTradeFields'
      - type: object
        required:
        - row_version
        properties:
          row_version:
            type: integer
            minimum: 1
      unevaluatedProperties: false
    ManualTradePreview:
      type: object
      additionalProperties: false
      required:
      - duration_seconds
      - pnl
      - pnl_basis
      - gross_pnl
      - commission
      - commission_source
      properties:
        duration_seconds:
          type: integer
          minimum: 0
        pnl:
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: '`net` from 3.5.0.'
        gross_pnl:
          $ref: '#/components/schemas/Money'
        commission:
          $ref: '#/components/schemas/MoneyString'
        commission_source:
          $ref: '#/components/schemas/CommissionSource'
    TradeCapturedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - trade_id
      - account_id
      description: A trade was captured or entered (drives the "n new trades" banner); the client refetches.
      properties:
        type:
          const: trade.captured
        at:
          $ref: '#/components/schemas/Timestamp'
        trade_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        origin:
          $ref: '#/components/schemas/TradeOrigin'
