paths:
  /ingress/v1/tradingview/{token}:
    post:
      tags:
      - ingress
      operationId: ingressTradingView
      summary: Receive a TradingView alert (V1-S1)
      description: 'Processing order (ADR-0003 §7; full table in docs/architecture/contracts/s1-webhook-ingest.md §2):

        per-IP flood cap (higher cap for TradingView ranges) → authenticate token (failures charge a per-IP failure

        budget; valid tokens are never refused by it) → per-key rate limit → content type and size → parse →

        credential guard → validate against instruction schema v1 → apply source policy (ADR-0003 §6) → insert with

        UNIQUE (user_id, message_id) → respond. Routing is asynchronous after commit. Every response must

        be produced well under TradingView''s ~3 s timeout. The whole path after `/ingress/` is treated as

        a secret and never logged (ADR-0001 §5, s1 notes §4). No `Origin` check applies here.

        '
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: 'Source token `awk_<key_id>_<secret>`. Malformed, over-long or otherwise invalid values get the

          same empty 404 as unknown tokens, never a 400 (S1 AC-2).

          '
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        description: The standard instruction (contracts/instruction/v1). Maximum 16 KiB, UTF-8.
        content:
          application/json:
            schema:
              $ref: ../instruction/v1/instruction.schema.json
          text/plain:
            schema:
              type: string
              maxLength: 16384
              description: Parsed as JSON and validated exactly like application/json.
      responses:
        '200':
          description: Accepted, or duplicate (nothing re-executed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressAccepted'
              examples:
                accepted:
                  value:
                    status: accepted
                    instruction_id: 0192b3c4-0000-7000-8000-000000000006
                duplicate:
                  value:
                    status: duplicate
                    instruction_id: 0192b3c4-0000-7000-8000-000000000006
        '400':
          description: '`ingress.invalid_json`, `ingress.schema_violation` (with JSON pointer), `ingress.unsupported_version`
            (pointer `/schema_version`; a minor newer than the Core supports). A body string shaped like an All Win token
            (`aw[kd]_…`) gives `ingress.schema_violation` with an empty pointer; the body is not stored or logged.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRejected'
              examples:
                schema:
                  value:
                    status: rejected
                    error:
                      code: ingress.schema_violation
                      pointer: /quantity
        '404':
          description: 'Unknown, revoked, malformed or over-long token, and any other path or method under `/ingress`.

            Empty body; existence of user/source is never revealed. Never 400/401/405.

            '
        '413':
          description: '`ingress.payload_too_large` (> 16 KiB).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRejected'
        '415':
          description: '`ingress.unsupported_media_type` (not application/json or text/plain).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRejected'
        '422':
          description: 'Source policy or catalog: `ingress.action_not_allowed_for_source` (modify/cancel/reduce from

            TradingView), `ingress.order_type_not_allowed_for_source`, `ingress.signal_type_not_allowed_for_source`

            (`signal_type` not allowed for TradingView, e.g. `master_account`), `ingress.source_mismatch`,

            `ingress.unsupported_instrument` (symbol not enabled in the instrument catalog, S1 AC-7).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRejected'
        '429':
          description: '`ingress.rate_limited`: per-IP flood cap, per-IP token-failure budget (failures only), or per-key
            limit. Header `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRejected'
        '500':
          description: '`common.internal`. The body never contains the path, the token or the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressRejected'
  /api/v1/auth/login/challenges:
    post:
      tags:
      - auth
      operationId: requestLoginCode
      summary: Request a sign-in code on a channel (always 202; auth policy §3)
      description: 'Always answers 202 with a fresh sealed `challenge_id`, whether or not the e-mail is registered,

        active, or has the chosen channel; nothing is sent in those cases. Response and timing are identical:

        delivery runs after the response (auth policy §2.3). Send limits are keyed by the identifier HMAC and

        device class and behave the same for unknown identifiers (§4); over a limit → 429 with `Retry-After`.

        The login screen always shows the same text and never reports a delivery failure.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - channel
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                channel:
                  $ref: '#/components/schemas/CodeChannel'
      responses:
        '202':
          description: Challenge issued (a code may or may not have been sent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login/verify:
    post:
      tags:
      - auth
      operationId: verifyLoginCode
      summary: Sign in with the code of a login challenge
      description: 'On success starts a session (`__Host-aw_session`) and, when the browser has no valid device cookie of

        this user, issues `__Host-aw_device` and sends the new-device e-mail notice (auth policy §5.2–§5.3).

        Every failure (wrong, expired, used, invalidated after 5 wrong attempts, unknown or forged challenge)

        is the single 401 `auth.code_invalid`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - challenge_id
              - code
              - remember_me
              properties:
                challenge_id:
                  $ref: '#/components/schemas/ChallengeId'
                code:
                  $ref: '#/components/schemas/OneTimeCode'
                remember_me:
                  type: boolean
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionAndDeviceCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/CodeInvalid'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/challenges/resend:
    post:
      tags:
      - auth
      operationId: resendCode
      summary: Send a new code for an open challenge (60-s cooldown; auth policy §2.2)
      description: 'Replaces the challenge''s code; wrong attempts already made still count. A closed (expired, used,

        invalidated after 5 wrong attempts), unknown or forged challenge gets the same 202 and nothing is sent.

        **The response and the limits depend only on the sealed token and the counters, never on the code row**

        (auth policy §3): every resend of a valid token counts in the identifier and IP limits and starts the

        60-s cooldown, and the body is always `expires_at` = now + 10 min and `resend_after_s` = 60, whether

        or not a code was sent. Within the cooldown → 429 with `Retry-After`, identically for registered and

        unknown identifiers. A forged token counts only in the IP limits.

        A `step_up` or `channel_change` challenge is resent only for the session that created it.

        '
      security:
      - session: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - challenge_id
              properties:
                challenge_id:
                  $ref: '#/components/schemas/ChallengeId'
      responses:
        '202':
          description: Accepted (a code may or may not have been sent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/challenges/delivery:
    post:
      tags:
      - auth
      operationId: getChallengeDelivery
      summary: Delivery state of a sign-up, step-up or channel-change code (never for login)
      description: "Lets the client offer another channel when a delivery failed (auth policy §2.3, S3b AC-5).\n- `login`\
        \ challenges, closed, unknown or forged challenges, and challenges of another session always\n  answer `not_reported`.\n\
        - A send suppressed because the new value belongs to another account answers `sent`, exactly like a\n  real send (§3).\n"
      security:
      - session: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - challenge_id
              properties:
                challenge_id:
                  $ref: '#/components/schemas/ChallengeId'
      responses:
        '200':
          description: Delivery state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - delivery
                properties:
                  delivery:
                    type: string
                    enum:
                    - pending
                    - sent
                    - failed
                    - not_reported
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: End the current session (server-side)
      description: Idempotent. Accepts a session or none; answers 204 to every same-origin request. The device cookie is kept.
      security:
      - session: []
      - {}
      responses:
        '204':
          description: Session ended; session cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookieClear'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout-everywhere:
    post:
      tags:
      - auth
      operationId: signOutEverywhere
      summary: Sair de todos os dispositivos — end every session and revoke every device (no step-up)
      description: 'Ends every session of the user, including the current one (`session.ended` reason

        `signed_out_everywhere`), and revokes all devices; the next sign-in from any browser is a new device.

        Source tokens and pairings are not touched; the client then shows them with their revoke/unpair

        actions (auth policy §5.3). Audited.

        '
      responses:
        '204':
          description: Done; session and device cookies cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionAndDeviceCookiesClear'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/step-up:
    post:
      tags:
      - auth
      operationId: requestStepUp
      summary: Request a step-up code for one sensitive action (auth policy §6)
      description: "Sends a `step_up` code bound to this session, the `action` and the `target_id`. The action request then\n\
        carries `step_up: { challenge_id, code }` in its body (schema `StepUpProof`); the code authorizes that\none action\
        \ only (Q30 a: every action asks a new code).\n- `target_id` is **required** for `source_rotate`, `pairing_code_new`,\
        \ `connection_unpair`,\n  `account_opt_in_accept`, `route_enable`, `account_binding_change`, `account_sync_clear`\
        \ and\n  `trading_day_restart`, and **forbidden** for the other\n  actions; a violation → 400\n  `common.invalid_request`\
        \ with pointer `/target_id`.\n- A target that does not exist or belongs to another user → 404 `common.not_found`;\
        \ no code is sent and\n  nothing is counted against the user's send limit.\n- `admin_invitation_create` from a non-admin\
        \ → 403 `auth.forbidden`, no code sent (same precedence as\n  admin operations).\n- 422 `auth.channel_unavailable`:\
        \ the user has no confirmed value for `channel`.\n- 422 `auth.step_up_channel_not_allowed`: the policy requires another\
        \ channel for this action on this\n  device (auth policy §6.2 M3, if adopted; the client then offers e-mail).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - channel
              properties:
                action:
                  $ref: '#/components/schemas/StepUpAction'
                target_id:
                  description: Required for source_rotate, pairing_code_new, connection_unpair, account_opt_in_accept, route_enable,
                    account_binding_change, account_sync_clear, trading_day_restart; forbidden otherwise.
                  $ref: '#/components/schemas/Uuid'
                channel:
                  $ref: '#/components/schemas/CodeChannel'
      responses:
        '202':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`auth.channel_unavailable` or `auth.step_up_channel_not_allowed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/invitations/lookup:
    post:
      tags:
      - auth
      operationId: lookupInvitation
      summary: Read an invitation before signing up
      description: 'The token travels in the request body, never in a URL path or query. Invitation links use a

