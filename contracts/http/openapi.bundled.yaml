    NotificationSeverity:
      type: string
      enum:
      - info
      - success
      - warning
      - danger
      - critical
      description: 'Set by the Core from the registry. Web behaviour (S18 §3/§5): `info` / `warning` update the bell

        silently; `success` uses the success colour; `danger` raises a destructive toast; `critical` is the

        top severity of the ADRs and shows the `CriticalBanner`, which stays until the item is read

        (Q51). The plugin may map `success` → `info` and `danger` → `warning` in its UI; the

        protocol carries the five values unchanged.

        '
    NotificationCode:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      maxLength: 96
      description: A code of the registry (`contracts/notifications/v1/registry.json`); `NotificationParamsByCode` lists them
        with their params. Unknown codes are shown with the fallback "Aviso {code}".
    NotificationTarget:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      description: Structured link; the client builds the URL (Web route; plugin `welcome.app_url` + route). Never a URL in
        the payload.
      properties:
        kind:
          type: string
          enum:
          - account
          - connection
          - instruction
          - route
          - activity_entry
        id:
          $ref: '#/components/schemas/Uuid'
    Notification:
      type: object
      additionalProperties: false
      required:
      - notification_id
      - revision
      - code
      - category
      - severity
      - params
      - count
      - created_at
      - updated_at
      properties:
        notification_id:
          $ref: '#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 1
          description: Monotonic per `notification_id`; every change (new occurrence, read) bumps it. Clients upsert only
            with a higher revision.
        code:
          $ref: '#/components/schemas/NotificationCode'
        category:
          $ref: '#/components/schemas/AuditCategory'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot (Web only; the plugin shows its platform account name).
        params:
          type: object
          description: Typed per code — `NotificationParamsByCode[code]` (the same schemas as `params.schema.json`). For grouped
            items, the params of the last occurrence.
        count:
          type: integer
          minimum: 1
          description: Occurrences grouped into this item (same code + account + trading day; registry `grouping`, and `reopen_on_occurrence`
            for whether a new occurrence marks it unread). The audit keeps one entry per occurrence.
        source_event_ids:
          type: array
          maxItems: 50
          description: event_ids of the adapter→Core messages aggregated (only for notifications caused by plugin events).
          items:
            $ref: '#/components/schemas/Uuid'
        audit_entry_id:
          description: The audit entry of the last occurrence (Web link "Ver no registro").
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          description: The last occurrence (equals `created_at` while `count` is 1) or the last change.
          $ref: '#/components/schemas/Timestamp'
        read_at:
          $ref: '#/components/schemas/Timestamp'
        target:
          $ref: '#/components/schemas/NotificationTarget'
    UnreadCount:
      type: object
      additionalProperties: false
      required:
      - unread_count
      properties:
        unread_count:
          type: integer
          minimum: 0
        worst_severity:
          description: The worst severity among unread items; absent when there are none.
          $ref: '#/components/schemas/NotificationSeverity'
    NotificationPage:
      type: object
      additionalProperties: false
      required:
      - notifications
      - unread
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type: string
          description: Absent on the last page.
        unread:
          $ref: '#/components/schemas/UnreadCount'
    MarkReadResult:
      type: object
      additionalProperties: false
      required:
      - notification
      - unread
      properties:
        notification:
          $ref: '#/components/schemas/Notification'
        unread:
          $ref: '#/components/schemas/UnreadCount'
    MarkManyRequest:
      type: object
      additionalProperties: false
      properties:
        notification_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        up_to:
          $ref: '#/components/schemas/Timestamp'
        category:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AuditCategory'
        account_id:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
      oneOf:
      - required:
        - notification_ids
        not:
          anyOf:
          - required:
            - up_to
          - required:
            - category
          - required:
            - account_id
      - required:
        - up_to
        not:
          required:
          - notification_ids
    ParamsOptInSuspendedByFirm:
      type: object
      additionalProperties: false
      required:
      - kind
      - firm_id
      - firm_name
      - account_count
      - rule_version_id
      description: '`accounts.opt_in_suspended` grouped per firm and release (one notification, "{k} contas"); the audit keeps
        one entry per account.'
      properties:
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        account_count:
          type: integer
          minimum: 1
        rule_version_id:
          $ref: '#/components/schemas/Uuid'
        cause:
          type: string
          enum:
          - stance_changed
          - text_changed
          - preset_attached
    ParamsPresetNewVersion:
      type: object
      additionalProperties: false
      required:
      - firm_id
      - firm_name
      - version_number
      - account_count
      description: '`presets.new_version` — one per firm (Q-S16-5): a newer release affects `account_count` of the caller''s
        accounts.'
      properties:
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        version_number:
          type: integer
          minimum: 1
        account_count:
          type: integer
          minimum: 1
    NotificationParamsByCode:
      type: object
      additionalProperties: false
      description: 'Type map, not a payload: `params` of a notification with code `<code>` matches property `<code>`.

        Mirrors `contracts/notifications/v1/registry.json` (the check fails if they differ). Codes of S11

        (`sync.*`) and S15 (`risk.blocked`, `risk.flatten`, `risk.unblocked`, `risk.reactive_block_action`)

        are added with those contracts.

        '
      properties:
        routing.quantity_capped:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        routing.max_position_reached:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        routing.position_conflict:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        routing.risk_blocked:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        routing.out_of_sync:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        routing.expired:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        routing.no_bracket_profile:
          $ref: '#/components/schemas/DetailsRoutingDecision'
        risk.warning:
          $ref: '#/components/schemas/DetailsRiskState'
        risk.limit_reached:
          $ref: '#/components/schemas/DetailsRiskState'
        risk.target_reached:
          $ref: '#/components/schemas/DetailsRiskState'
        risk.consistency_warning:
          $ref: '#/components/schemas/DetailsRiskState'
        risk.evaluation_target_reached:
          $ref: '#/components/schemas/DetailsEvaluation'
        connection.status_changed:
          $ref: '#/components/schemas/DetailsConnectionStatus'
        accounts.opt_in_suspended:
          $ref: '#/components/schemas/ParamsOptInSuspendedByFirm'
        presets.new_version:
          $ref: '#/components/schemas/ParamsPresetNewVersion'
    NotificationCreatedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - notification
      - unread
      properties:
        type:
          const: notification.created
        at:
          $ref: '#/components/schemas/Timestamp'
        notification:
          $ref: '#/components/schemas/Notification'
        unread:
          $ref: '#/components/schemas/UnreadCount'
    NotificationUpdatedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - notification
      - unread
      description: A grouped item got a new occurrence (count, last time, params), or another change; upsert by revision.
      properties:
        type:
          const: notification.updated
        at:
          $ref: '#/components/schemas/Timestamp'
        notification:
          $ref: '#/components/schemas/Notification'
        unread:
          $ref: '#/components/schemas/UnreadCount'
    NotificationReadEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - unread
      description: Items were read on any channel (Web tab or plugin); `notification_ids` lists them (absent after a large
        `up_to` read, then refetch).
      properties:
        type:
          const: notification.read
        at:
          $ref: '#/components/schemas/Timestamp'
        notification_ids:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Uuid'
        unread:
          $ref: '#/components/schemas/UnreadCount'
    WinRate:
      type: string
      pattern: ^(100\.0|[0-9]{1,2}\.[0-9])$
      description: Percent with exactly one decimal (Q-S22-2).
    PerformanceFigures:
      type: object
      additionalProperties: false
      required:
      - trade_count
      - win_count
      - loss_count
      - breakeven_count
      - total_pnl
      - total_gross_pnl
      - total_commission
      - mae_sample_count
      - mfe_sample_count
      description: 'All P&L figures are NET (after commissions; S22 AC-3): a win is a trade with net P&L > 0, so a

        trade of +2.00 gross with 2.50 commission is a loss (Q58: P&L = 0 is not a win; the counts are

        shown). Win rate = wins ÷ all trades. MAE / MFE averages use only trades that have the value (`*_sample_count` of

        `trade_count`, Q55).

        '
      properties:
        trade_count:
          type: integer
          minimum: 0
        win_count:
          type: integer
          minimum: 0
        loss_count:
          type: integer
          minimum: 0
        breakeven_count:
          type: integer
          minimum: 0
        total_pnl:
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: '`net` from 3.5.0.'
        total_gross_pnl:
          $ref: '#/components/schemas/Money'
        total_commission:
          $ref: '#/components/schemas/MoneyString'
        uncommissioned_count:
          type: integer
          minimum: 0
          description: Trades whose commission is `none` (net = gross).
        avg_pnl:
          description: Net average per trade.
          $ref: '#/components/schemas/Money'
        win_rate:
          $ref: '#/components/schemas/WinRate'
        avg_duration_seconds:
          type: integer
          minimum: 0
        avg_mae:
          $ref: '#/components/schemas/MoneyString'
        mae_sample_count:
          type: integer
          minimum: 0
        avg_mfe:
          $ref: '#/components/schemas/MoneyString'
        mfe_sample_count:
          type: integer
          minimum: 0
      allOf:
      - if:
          properties:
            trade_count:
              const: 0
        then:
          not:
            anyOf:
            - required:
              - avg_pnl
            - required:
              - win_rate
            - required:
              - avg_duration_seconds
        else:
          required:
          - avg_pnl
          - win_rate
          - avg_duration_seconds
      - if:
          properties:
            mae_sample_count:
              const: 0
        then:
          not:
            required:
            - avg_mae
        else:
          required:
          - avg_mae
      - if:
          properties:
            mfe_sample_count:
              const: 0
        then:
          not:
            required:
            - avg_mfe
        else:
          required:
          - avg_mfe
    PerformanceGroup:
      type: object
      additionalProperties: false
      required:
      - origin
      - figures
      - bar_ratio
      description: 'One group with at least one trade. Keys by `group_by`: `source_signal` → origin + source (routed) +

        signal type; `source` → origin + source; `signal_type` → signal type (origin `manual` /

        `platform` trades form their own groups without a signal type, Q-S22-7).

        '
      properties:
        origin:
          $ref: '#/components/schemas/TradeOrigin'
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          maxLength: 60
        source_revoked:
          type: boolean
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        master_account_id:
          $ref: '#/components/schemas/Uuid'
        master_account_name:
          type: string
          maxLength: 80
        figures:
          $ref: '#/components/schemas/PerformanceFigures'
        bar_ratio:
          type: string
          pattern: ^(1\.0000|0\.[0-9]{4})$
          description: '|total_pnl| of this group ÷ the largest |total_pnl| among the groups (the bar length; its sign comes
            from `total_pnl`). `0.0000` for every group when the largest |total_pnl| is 0.'
    Performance:
      type: object
      additionalProperties: false
      required:
      - as_of
      - group_by
      - totals
      - groups
      properties:
        as_of:
          description: The instant the set was taken; pass it as `recorded_before` to the S21 list for the same trades.
          $ref: '#/components/schemas/Timestamp'
        group_by:
          type: string
          enum:
          - source_signal
          - source
          - signal_type
        totals:
          description: The whole filtered set; equals `getTradesSummary` for the same filters and `recorded_before = as_of`
            (S22 AC-2).
          $ref: '#/components/schemas/PerformanceFigures'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceGroup'
    LocalizedText:
      type: object
      additionalProperties: false
      required:
      - pt-BR
      - en
      description: Text written by the catalog publisher in both UI languages (not firm text; firm text is never translated).
      properties:
        pt-BR:
          type: string
          minLength: 1
          maxLength: 2000
        en:
          type: string
          minLength: 1
          maxLength: 2000
    RuleQuote:
      type: object
      additionalProperties: false
      required:
      - text
      - language
      - page_title
      - url
      - accessed_at
      description: A verbatim quote of the firm's official text, in the firm's language (never translated). Plain text — clients
        render it as text, never as HTML or Markdown (QA Security I2).
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
        language:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
          description: BCP 47, e.g. 'en'.
        page_title:
          type: string
          maxLength: 300
        section:
          type: string
          maxLength: 300
          description: Heading of the quoted part of the page, if any.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
        accessed_at:
          type: string
          format: date
          description: Date the page was read (YYYY-MM-DD).
    RuleVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - firm_stance
      - is_generic
      - version_number
      - published_at
      - quotes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_stance:
          $ref: '#/components/schemas/FirmStance'
        firm_platform:
          description: The firm platform this rule version applies to; absent when the firm's stance does not vary by platform,
            and for generic rules.
          $ref: '#/components/schemas/FirmPlatform'
        is_generic:
          type: boolean
          description: True for the rule used by prop accounts without a preset (no firm, stance `unknown`, no quotes; the
            UI shows the generic warning).
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        quotes:
          type: array
          description: 'Official quotes, in display order. Empty for `unknown`. For `not_confirmed` they are the

            conflicting quotes, each with its own source and date.

            '
          items:
            $ref: '#/components/schemas/RuleQuote'
        research:
          type: object
          additionalProperties: false
          required:
          - searched_on
          - sources
          description: With `unknown` (not generic) — where the publisher looked and found no rule.
          properties:
            searched_on:
              type: string
              format: date
            sources:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - page_title
                - url
                properties:
                  page_title:
                    type: string
                    maxLength: 300
                  url:
                    type: string
                    format: uri
                    maxLength: 2048
                    pattern: ^https://
        change:
          type: object
          additionalProperties: false
          required:
          - previous_rule_version_id
          - previous_firm_stance
          - cause
          description: Present when this version replaced an earlier one for the same preset selection and kind.
          properties:
            previous_rule_version_id:
              $ref: '#/components/schemas/Uuid'
            previous_firm_stance:
              $ref: '#/components/schemas/FirmStance'
            cause:
              type: string
              enum:
              - stance_changed
              - text_changed
              - not_material
              description: '`stance_changed` and `text_changed` move `chosen` accounts to `pending_review` (Q26; the

                text case is Q42: the publisher flagged it as material). `not_material` never

                suspends (typo or format fix).

                '
            reason:
              description: 'The publisher''s explanation shown to the user, present with `text_changed` (Q42 a: the publisher
                flags the change and records why); optional in the schema for compatibility.'
              $ref: '#/components/schemas/LocalizedText'
      allOf:
      - if:
          properties:
            is_generic:
              const: true
        then:
          properties:
            firm_stance:
              const: unknown
            quotes:
              maxItems: 0
          not:
            anyOf:
            - required:
              - firm_id
            - required:
              - firm_name
            - required:
              - research
            - required:
              - firm_platform
        else:
          required:
          - firm_id
          - firm_name
    OptInRules:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      properties:
        automation:
          $ref: '#/components/schemas/RuleVersion'
        copy:
          $ref: '#/components/schemas/RuleVersion'
    SourceRef:
      type: object
      additionalProperties: false
      required:
      - url
      - accessed_at
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
        accessed_at:
          type: string
          format: date
        page_title:
          type: string
          maxLength: 300
    MoneyAmount:
      type: string
      pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
      description: Non-negative money as a decimal string, exactly as published (X-3).
    MaxPositionValue:
      type: object
      additionalProperties: false
      required:
      - contracts
      properties:
        contracts:
          type: integer
          minimum: 1
          maximum: 10000
          description: MNQ (micro) contracts; the account's `max_position_qty` cannot exceed it.
        published_text:
          type: string
          maxLength: 300
          description: As published, e.g. "5 minis / 50 micros".
    DrawdownValue:
      type: object
      additionalProperties: false
      required:
      - type
      - amount
      properties:
        type:
          type: string
          enum:
          - trailing_intraday
          - trailing_eod
          - static
          - other
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        stops_trailing_at:
          type: string
          maxLength: 300
          description: When it stops trailing, as published.
        description:
          type: string
          maxLength: 500
          description: Required for `other`.
      allOf:
      - if:
          properties:
            type:
              const: other
        then:
          required:
          - description
    DailyLossValue:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - hard
          - soft_pause
          - none
        amount:
          $ref: '#/components/schemas/MoneyAmount'
      allOf:
      - if:
          properties:
            kind:
              const: none
        then:
          not:
            required:
            - amount
        else:
          required:
          - amount
    DailyProfitTargetValue:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          $ref: '#/components/schemas/MoneyAmount'
    TradingDayResetValue:
      type: object
      additionalProperties: false
      required:
      - local_time
      - time_zone
      properties:
        local_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        time_zone:
          $ref: '#/components/schemas/TimeZone'
        published_text:
          type: string
          maxLength: 100
          description: As published, e.g. "5:00 PM ET".
    ConsistencyValue:
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The firm's wording (not translated).
        threshold_pct:
          type: string
          pattern: ^[0-9]{1,3}(\.[0-9]{1,2})?$
    ProvenanceStatus:
      type: string
      enum:
      - verified
      - not_confirmed
      description: '`not_confirmed` = the firm''s official pages disagree; never prefilled (S16 AC-5/AC-6).'
    ProvenanceShape:
      description: '`verified` → `value` + `sources`; `not_confirmed` → `published_values` (≥ 2) and no `value`.'
      allOf:
      - if:
          properties:
            status:
              const: verified
        then:
          required:
          - value
          - sources
          not:
            required:
            - published_values
        else:
          required:
          - published_values
          not:
            required:
            - value
    MaxPositionRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Maximum position (MNQ contracts) as the preset publishes it.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/MaxPositionValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/MaxPositionValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    DrawdownRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Drawdown amount and type.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/DrawdownValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/DrawdownValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    DailyLossRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Daily loss limit and its kind.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/DailyLossValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/DailyLossValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    DailyProfitTargetRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Daily profit target (S13 AC-5); absent from the preset when the firm has none.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/DailyProfitTargetValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/DailyProfitTargetValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    TradingDayResetRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Trading-day reset time.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/TradingDayResetValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/TradingDayResetValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    ConsistencyRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Consistency rule; optional (an unresolved one is shown as not tracked).
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/ConsistencyValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/ConsistencyValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    CommissionValue:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          description: USD per contract and per side (a round turn costs twice), ≥ 0.
          $ref: '#/components/schemas/MoneyAmount'
    EvaluationTargetValue:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          description: Net profit to reach since the evaluation start, > 0.
          $ref: '#/components/schemas/MoneyAmount'
    CommissionRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Commission per contract and side, as the firm publishes it.
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/CommissionValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/CommissionValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    EvaluationTargetRule:
      type: object
      additionalProperties: false
      required:
      - status
      description: Evaluation profit target (Q46).
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        value:
          $ref: '#/components/schemas/EvaluationTargetValue'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        published_values:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - sources
            properties:
              value:
                $ref: '#/components/schemas/EvaluationTargetValue'
              sources:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/SourceRef'
      allOf:
      - $ref: '#/components/schemas/ProvenanceShape'
    RuleField:
      type: string
      enum:
      - max_position_qty
      - drawdown
      - daily_loss_limit
      - daily_profit_target
      - trading_day_reset
      - consistency_rule
      - commission_per_contract_side
      - evaluation_profit_target
      description: Required to save an account (S16 AC-6) — `max_position_qty`, `drawdown`, `daily_loss_limit`, `trading_day_reset`.
    PresetRules:
      type: object
      additionalProperties: false
      required:
      - max_position_qty
      - drawdown
      - daily_loss_limit
      - trading_day_reset
      properties:
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionRule'
        drawdown:
          $ref: '#/components/schemas/DrawdownRule'
        daily_loss_limit:
          $ref: '#/components/schemas/DailyLossRule'
        daily_profit_target:
          $ref: '#/components/schemas/DailyProfitTargetRule'
        trading_day_reset:
          $ref: '#/components/schemas/TradingDayResetRule'
        consistency_rule:
          $ref: '#/components/schemas/ConsistencyRule'
        commission_per_contract_side:
          description: The firm's published commission per contract and side (U20 a; prefills the account floor, editable
            on the account).
          $ref: '#/components/schemas/CommissionRule'
        evaluation_profit_target:
          description: Evaluation phase only — the profit to reach to pass (Q46; S16 AC-10). Absent for funded / live phases.
          $ref: '#/components/schemas/EvaluationTargetRule'
    PresetRuleValues:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'The account''s own value for a rule field, sent when it differs from the preset value (edited, S16

        AC-2) or resolves a not-confirmed field (chosen among the published values or typed, S16 AC-6).

        `max_position_qty` is not here: it is the account''s top-level field (S5).

        '
      properties:
        drawdown:
          $ref: '#/components/schemas/DrawdownValue'
        daily_loss_limit:
          $ref: '#/components/schemas/DailyLossValue'
        daily_profit_target:
          $ref: '#/components/schemas/DailyProfitTargetValue'
        trading_day_reset:
          $ref: '#/components/schemas/TradingDayResetValue'
        consistency_rule:
          $ref: '#/components/schemas/ConsistencyValue'
        evaluation_profit_target:
          $ref: '#/components/schemas/EvaluationTargetValue'
    StanceInfo:
      type: object
      additionalProperties: false
      required:
      - value
      - quotes
      description: VPS/server and personal-device stances (S16 AC-8); verbatim quotes, never translated.
      properties:
        value:
          type: string
          enum:
          - allowed
          - forbidden
          - conditional
          - unknown
          - not_confirmed
          - required
          - not_required
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/RuleQuote'
        research:
          type: object
          additionalProperties: false
          required:
          - searched_on
          - sources
          properties:
            searched_on:
              type: string
              format: date
            sources:
              type: array
              items:
                $ref: '#/components/schemas/SourceRef'
    FirmStances:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      - vps
      - personal_device
      description: '`automation` / `copy` are the rule versions of the opt-ins: one entry without `firm_platform` when

        the stance is the same on every platform, otherwise one entry per firm platform. `vps` ∈ allowed /

        forbidden / conditional / unknown / not_confirmed; `personal_device` ∈ required / not_required /

        unknown (Q-S16-2).

        '
      properties:
        automation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RuleVersion'
        copy:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RuleVersion'
        vps:
          allOf:
          - $ref: '#/components/schemas/StanceInfo'
          - properties:
              value:
                enum:
                - allowed
                - forbidden
                - conditional
                - unknown
                - not_confirmed
        personal_device:
          allOf:
          - $ref: '#/components/schemas/StanceInfo'
          - properties:
              value:
                enum:
                - required
                - not_required
                - unknown
    ManualOnly:
      type: object
      additionalProperties: false
      required:
      - reason
      description: 'S16 AC-7: no V1 output reaches the firm''s platforms; risk tracking only, no routing (S7 AC-7b).'
      properties:
        reason:
          $ref: '#/components/schemas/RuleQuote'
    FirmSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - name
      - plan_names
      - stances
      - not_confirmed_count
      - release
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        name:
          type: string
          maxLength: 120
        manual_only:
          $ref: '#/components/schemas/ManualOnly'
        plan_names:
          type: array
          items:
            type: string
            maxLength: 120
        stances:
          type: object
          additionalProperties: false
          required:
          - automation
          - copy
          - vps
          - personal_device
          properties:
            automation:
              $ref: '#/components/schemas/StanceSummary'
            copy:
              $ref: '#/components/schemas/StanceSummary'
            vps:
              type: string
              enum:
              - allowed
              - forbidden
              - conditional
              - unknown
              - not_confirmed
            personal_device:
              type: string
              enum:
              - required
              - not_required
              - unknown
        not_confirmed_count:
          type: integer
          minimum: 0
        release:
          $ref: '#/components/schemas/FirmReleaseRef'
    StanceSummary:
      type: string
      enum:
      - allowed
      - forbidden
      - conditional
      - unknown
      - not_confirmed
      - varies_by_platform
      description: A `FirmStance`, or `varies_by_platform` when the firm's platforms have different stances (the firm detail
        lists them).
    FirmReleaseRef:
      type: object
      additionalProperties: false
      required:
      - version_number
      - published_at
      - verified_on
      properties:
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        verified_on:
          type: string
          format: date
    FirmList:
      type: object
      additionalProperties: false
      required:
      - firms
      properties:
        firms:
          type: array
          items:
            $ref: '#/components/schemas/FirmSummary'
    PresetOption:
      type: object
      additionalProperties: false
      required:
      - preset_id
      - preset_version_id
      - size_amount
      - platform_specific
      - not_confirmed_count
      description: One size of a plan/phase in the current release.
      properties:
        preset_id:
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        size_label:
          type: string
          maxLength: 32
          description: As published, e.g. "50K".
        platform_specific:
          type: boolean
          description: True → the account must choose `firm_platform`.
        not_confirmed_count:
          type: integer
          minimum: 0
    FirmDetail:
      type: object
      additionalProperties: false
      required:
      - summary
      - stances
      - platforms
      - plans
      - excluded_plans
      properties:
        summary:
          $ref: '#/components/schemas/FirmSummary'
        stances:
          $ref: '#/components/schemas/FirmStances'
        platforms:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - label
            properties:
              code:
                $ref: '#/components/schemas/FirmPlatform'
              label:
                type: string
                maxLength: 60
                description: Product name, e.g. "Rithmic" (not translated).
        plans:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - plan_id
            - name
            - phases
            properties:
              plan_id:
                $ref: '#/components/schemas/Uuid'
              name:
                type: string
                maxLength: 120
              phases:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - phase
                  - sizes
                  properties:
                    phase:
                      type: string
                      enum:
                      - evaluation
                      - funded
                      - live
                      description: Research format phases; the UI translates them.
                    sizes:
                      type: array
                      items:
                        $ref: '#/components/schemas/PresetOption'
        excluded_plans:
          type: array
          description: Plans not offered as presets (S16 AC-9); registered manually.
          items:
            type: string
            maxLength: 120
    ReleaseChange:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - stance_changed
          - stance_text_changed
          - rule_value_changed
          - preset_added
          - preset_removed
        stance:
          type: string
          enum:
          - automation
          - copy
          - vps
          - personal_device
        from:
          type: string
          maxLength: 32
        to:
          type: string
          maxLength: 32
        material:
          type: boolean
          description: 'With `stance_text_changed` — flagged by the publisher as a material change (Q42;

            `reason` is expected but optional while Q42 is open); only material automation/copy text

            changes suspend. Always consistent with the new `RuleVersion.change.cause`: material ⇔

            `text_changed`, not material ⇔ `not_material`.

            '
        reason:
          $ref: '#/components/schemas/LocalizedText'
        field:
          $ref: '#/components/schemas/RuleField'
        preset_id:
          $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            kind:
              enum:
              - stance_changed
              - stance_text_changed
        then:
          required:
          - stance
      - if:
          properties:
            kind:
              const: stance_changed
        then:
          required:
          - from
          - to
      - if:
          properties:
            kind:
              enum:
              - preset_added
              - preset_removed
        then:
          required:
          - preset_id
      - if:
          properties:
            kind:
              const: stance_text_changed
        then:
          required:
          - material
      - if:
          properties:
            kind:
              const: rule_value_changed
        then:
          required:
          - field
          - preset_id
    FirmRelease:
      type: object
      additionalProperties: false
      required:
      - version_number
      - published_at
      - verified_on
      - changes
      - rule_versions
      - vps
      - personal_device
      properties:
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        verified_on:
          type: string
          format: date
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseChange'
        rule_versions:
          type: array
          description: The opt-in rule versions of this release (texts viewable with `getRuleVersion`).
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - kind
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              kind:
                $ref: '#/components/schemas/OptInKind'
              firm_platform:
                $ref: '#/components/schemas/FirmPlatform'
        vps:
          $ref: '#/components/schemas/StanceInfo'
        personal_device:
          $ref: '#/components/schemas/StanceInfo'
    FirmReleaseList:
      type: object
      additionalProperties: false
      required:
      - firm_id
      - releases
      properties:
        firm_id:
          $ref: '#/components/schemas/Uuid'
        releases:
          type: array
          items:
            $ref: '#/components/schemas/FirmRelease'
    PresetVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - preset_id
      - firm_id
      - firm_name
      - plan_id
      - plan_name
      - phase
      - size_amount
      - release
      - rule_sets
      - not_confirmed_count
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        preset_id:
          $ref: '#/components/schemas/Uuid'
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        plan_id:
          $ref: '#/components/schemas/Uuid'
        plan_name:
          type: string
          maxLength: 120
        phase:
          type: string
          enum:
          - evaluation
          - funded
          - live
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        size_label:
          type: string
          maxLength: 32
        manual_only:
          $ref: '#/components/schemas/ManualOnly'
        release:
          $ref: '#/components/schemas/FirmReleaseRef'
        superseded_by:
          description: Present when a newer version of this preset exists.
          $ref: '#/components/schemas/Uuid'
        rule_sets:
          type: array
          minItems: 1
          description: One entry without `firm_platform`, or one entry per firm platform when the rules differ by platform.
          items:
            type: object
            additionalProperties: false
            required:
            - rules
            properties:
              firm_platform:
                $ref: '#/components/schemas/FirmPlatform'
              rules:
                $ref: '#/components/schemas/PresetRules'
        not_confirmed_count:
          type: integer
          minimum: 0
    AccountRuleField:
      type: object
      additionalProperties: false
      required:
      - field
      - origin
      properties:
        field:
          $ref: '#/components/schemas/RuleField'
        origin:
          type: string
          enum:
          - preset
          - edited
          - chosen_from_conflict
          - unresolved
          description: '`preset` = the preset''s verified value; `edited` = the user changed it (badge `Editado`);

            `chosen_from_conflict` = the user resolved a not-confirmed value (Q-S16-3: stored with the time

            and whether one of the published values or another value was chosen); `unresolved` = an optional

            not-confirmed field left open (not tracked).

            '
        chose:
          type: string
          enum:
          - published_value
          - other_value
          description: With `chosen_from_conflict`.
        chosen_at:
          $ref: '#/components/schemas/Timestamp'
        account_value:
          description: The account's value (typed by `field`, as in `PresetRuleValues`; for `max_position_qty` a `MaxPositionValue`).
            Absent with `unresolved`.
          type: object
        preset_value:
          description: The preset version's rule for this field (typed by `field`, as in `PresetRules`).
          type: object
      allOf:
      - if:
          properties:
            origin:
              const: chosen_from_conflict
        then:
          required:
          - chose
          - chosen_at
          - account_value
        else:
          not:
            anyOf:
            - required:
              - chose
            - required:
              - chosen_at
      - if:
          properties:
            origin:
              const: unresolved
        then:
          not:
            required:
            - account_value
        else:
          required:
          - account_value
    AccountPresetState:
      type: object
      additionalProperties: false
      required:
      - account_id
      - preset_version_id
      - release
      - fields
      - row_version
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        preset_version_id:
          $ref: '#/components/schemas/Uuid'
        release:
          $ref: '#/components/schemas/FirmReleaseRef'
        firm_platform:
          $ref: '#/components/schemas/FirmPlatform'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AccountRuleField'
        newer_version:
          type: object
          additionalProperties: false
          required:
          - preset_version_id
          - release
          - suspends
          properties:
            preset_version_id:
              $ref: '#/components/schemas/Uuid'
            release:
              $ref: '#/components/schemas/FirmReleaseRef'
            suspends:
              type: boolean
              description: True when it changed the automation or copy stance or its material text, so the opt-in is already
                `pending_review` (Q-S5-3).
        row_version:
          type: integer
          minimum: 1
          description: The account's `row_version`.
    PresetDiffRow:
      type: object
      additionalProperties: false
      required:
      - field
      - edited
      - requires_choice
      - cap_conflict
      properties:
        field:
          $ref: '#/components/schemas/RuleField'
        account_value:
          type: object
          description: Typed by `field`; absent when unresolved.
        current_preset_value:
          type: object
          description: The current version's rule (typed by `field`).
        new_preset_value:
          type: object
          description: The target version's rule (typed by `field`); absent when the field was removed.
        edited:
          type: boolean
          description: The user had edited this field ("Você editou este valor").
        requires_choice:
          type: boolean
        cap_conflict:
          type: boolean
          description: '`max_position_qty` only: the new cap is below the account''s value; apply is refused until the body
            lowers it.'
    PresetDiff:
      type: object
      additionalProperties: false
      required:
      - account_id
      - from_preset_version_id
      - to_preset_version_id
      - rows
      - opt_in_changes
      - firm_platform_required
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        from_preset_version_id:
          $ref: '#/components/schemas/Uuid'
        to_preset_version_id:
          $ref: '#/components/schemas/Uuid'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PresetDiffRow'
        firm_platform_required:
          type: boolean
          description: True when the target has platform-specific rules and the account must name (or confirm) its `firm_platform`
            in the apply request.
        firm_platforms:
          type: array
          description: The target's firm platforms (with `firm_platform_required`).
          items:
            $ref: '#/components/schemas/FirmPlatform'
        opt_in_changes:
          type: object
          additionalProperties: false
          required:
          - automation
          - copy
          description: The new rule version per kind when it differs from the account's current one; then the apply request
            needs `opt_ins` for that kind if a choice is required.
          properties:
            automation:
              oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
            copy:
              oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
    ApplyPresetVersionRequest:
      type: object
      additionalProperties: false
      required:
      - target_preset_version_id
      - row_version
      properties:
        target_preset_version_id:
          $ref: '#/components/schemas/Uuid'
        row_version:
          type: integer
          minimum: 1
        firm_platform:
          description: Required when the target has platform-specific rules and the account has no platform yet, or to change
            it (`PresetDiff.firm_platform_required`).
          $ref: '#/components/schemas/FirmPlatform'
        choices:
          type: object
          additionalProperties: false
          description: For each edited field of the diff, keep the user's value or take the new preset value.
          properties:
            max_position_qty:
              $ref: '#/components/schemas/ApplyChoice'
            drawdown:
              $ref: '#/components/schemas/ApplyChoice'
            daily_loss_limit:
              $ref: '#/components/schemas/ApplyChoice'
            daily_profit_target:
              $ref: '#/components/schemas/ApplyChoice'
            trading_day_reset:
              $ref: '#/components/schemas/ApplyChoice'
            consistency_rule:
              $ref: '#/components/schemas/ApplyChoice'
            commission_per_contract_side:
              $ref: '#/components/schemas/ApplyChoice'
            evaluation_profit_target:
              $ref: '#/components/schemas/ApplyChoice'
        rule_values:
          $ref: '#/components/schemas/PresetRuleValues'
        max_position_qty:
          $ref: '#/components/schemas/MaxPositionQty'
        opt_ins:
          $ref: '#/components/schemas/OptInChoices'
        step_up:
          description: Required when an `opt_ins` choice is `accepted` and changes the stored state (action `account_opt_in_accept`,
            target = this account).
          $ref: '#/components/schemas/StepUpProof'
      description: A field appears in `choices` or in `rule_values`, never in both (400 otherwise).
      allOf:
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - drawdown
            rule_values:
              required:
              - drawdown
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - daily_loss_limit
            rule_values:
              required:
              - daily_loss_limit
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - daily_profit_target
            rule_values:
              required:
              - daily_profit_target
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - trading_day_reset
            rule_values:
              required:
              - trading_day_reset
      - not:
          required:
          - choices
          - rule_values
          properties:
            choices:
              required:
              - consistency_rule
            rule_values:
              required:
              - consistency_rule
    ApplyChoice:
      type: string
      enum:
      - keep_mine
      - use_preset
    PresetVersionAvailableEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - firm_id
      - account_ids
      description: A new release of a firm affects some of the caller's accounts (refresh the notice; S18 sends one notification
        per firm, Q-S16-5).
      properties:
        type:
          const: presets.version_available
        at:
          $ref: '#/components/schemas/Timestamp'
        firm_id:
          $ref: '#/components/schemas/Uuid'
        account_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
    DecimalString:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,10})?$
      description: Exact decimal as a string (no sign, no exponent, no separators).
    MoneyString:
      type: string
      pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
      description: Non-negative money as a decimal string (NUMERIC(18,4)).
    Instrument:
      type: object
      additionalProperties: false
      required:
      - id
      - symbol
      - name
      - exchange
      - currency
      - tick_size
      - tick_value
      - point_value
      - price_decimals
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
          description: Neutral root, e.g. 'MNQ'.
        name:
          type: string
          maxLength: 120
        exchange:
          type: string
          maxLength: 16
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        tick_size:
          $ref: '#/components/schemas/DecimalString'
        tick_value:
          description: Money per tick (tick_size × point_value, computed by the Core).
          $ref: '#/components/schemas/MoneyString'
        point_value:
          $ref: '#/components/schemas/MoneyString'
        price_decimals:
          type: integer
          minimum: 0
          maximum: 10
          description: Decimals to display prices and points with.
    InstrumentList:
      type: object
      additionalProperties: false
      required:
      - instruments
      properties:
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
    DistanceUnit:
      type: string
      enum:
      - points
      - ticks
      - usd
    DistanceValue:
      type: string
      pattern: ^[0-9]{1,8}(\.[0-9]{1,10})?$
      description: Decimal string; its allowed shape depends on the unit (see `DistanceProfile`).
    DistanceProfile:
      type: object
      additionalProperties: false
      required:
      - distance_unit
      - stop_distance
      - target_distance
      description: '`ticks` → whole numbers (`^[0-9]{1,5}$`); `usd` → at most 2 decimals (Q-S6-6); `points` → at most

        10 decimals. Each distance must be at least one tick after conversion (422 otherwise).

        '
      properties:
        distance_unit:
          $ref: '#/components/schemas/DistanceUnit'
        stop_distance:
          $ref: '#/components/schemas/DistanceValue'
        target_distance:
          $ref: '#/components/schemas/DistanceValue'
      allOf:
      - $ref: '#/components/schemas/DistanceProfileShape'
    DistanceEquivalent:
      type: object
      additionalProperties: false
      required:
      - ticks
      - points
      - usd
      - rounded
      description: What execution will use for one side. All values computed by the Core.
      properties:
        ticks:
          type: integer
          minimum: 1
          maximum: 10000
        points:
          $ref: '#/components/schemas/DecimalString'
        usd:
          $ref: '#/components/schemas/MoneyString'
        rounded:
          type: boolean
          description: True when the requested distance was not a whole number of ticks and was rounded toward the entry.
    ProfileEquivalents:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - stop
      - target
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        stop:
          $ref: '#/components/schemas/DistanceEquivalent'
        target:
          $ref: '#/components/schemas/DistanceEquivalent'
    NearestProfileSize:
      type: object
      additionalProperties: false
      required:
      - size_amount
      - candidates
      properties:
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        candidates:
          type: array
          minItems: 1
          maxItems: 2
          description: Ascending. Two entries only on an exact tie (the user chooses).
          items:
            type: object
            additionalProperties: false
            required:
            - size_amount
            - has_default
            properties:
              size_amount:
                $ref: '#/components/schemas/SizeAmount'
              has_default:
                type: boolean
                description: False → the account will start without a profile (Q43).
    DefaultProfileEntry:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - size_amount
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        profile:
          description: Absent when the user has not defined this size.
          $ref: '#/components/schemas/DistanceProfile'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      dependentRequired:
        profile:
        - updated_at
    DefaultProfileList:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - defaults
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        defaults:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DefaultProfileEntry'
    AccountProfileRequest:
      type: object
      additionalProperties: false
      required:
      - distance_unit
      - stop_distance
      - target_distance
      properties:
        distance_unit:
          $ref: '#/components/schemas/DistanceUnit'
        stop_distance:
          $ref: '#/components/schemas/DistanceValue'
        target_distance:
          $ref: '#/components/schemas/DistanceValue'
        row_version:
          type: integer
          minimum: 1
      allOf:
      - $ref: '#/components/schemas/DistanceProfileShape'
    DistanceProfileShape:
      description: The per-unit shape rules of `DistanceProfile`, reusable by request bodies that add fields.
      allOf:
      - if:
          properties:
            distance_unit:
              const: ticks
        then:
          properties:
            stop_distance:
              pattern: ^[0-9]{1,5}$
            target_distance:
              pattern: ^[0-9]{1,5}$
      - if:
          properties:
            distance_unit:
              const: usd
        then:
          properties:
            stop_distance:
              pattern: ^[0-9]{1,8}(\.[0-9]{1,2})?$
            target_distance:
              pattern: ^[0-9]{1,8}(\.[0-9]{1,2})?$
    AccountProfile:
      type: object
      additionalProperties: false
      required:
      - account_id
      - instrument_id
      - profile
      - equivalents
      - origin
      - customized
      - row_version
      - updated_at
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        profile:
          $ref: '#/components/schemas/DistanceProfile'
        equivalents:
          $ref: '#/components/schemas/ProfileEquivalents'
        origin:
          type: string
          enum:
          - size_default
          - nearest_size_default
          - set_by_user
          description: 'Where the values came from when last copied: the default of the account''s size, the default of

            the nearest standard size (real account of another size; on an exact tie the size the user

            picked, Q60), or typed by the user on an account that had no profile.

            '
        copied_from_size:
          description: With `size_default` / `nearest_size_default`.
          $ref: '#/components/schemas/SizeAmount'
        copied_at:
          $ref: '#/components/schemas/Timestamp'
        customized:
          type: boolean
          description: True after the user edited the copy (badge `Personalizado`); false right after a copy or restore; always
            false with `set_by_user` (nothing to diverge from).
        default_now:
          description: The current default of `copied_from_size` (for the "default today" popover); absent if that size has
            none.
          $ref: '#/components/schemas/DistanceProfile'
        row_version:
          type: integer
          minimum: 1
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            origin:
              enum:
              - size_default
              - nearest_size_default
        then:
          required:
          - copied_from_size
          - copied_at
        else:
          properties:
            customized:
              const: false
          not:
            anyOf:
            - required:
              - copied_from_size
            - required:
              - copied_at
            - required:
              - default_now
    AccountProfileList:
      type: object
      additionalProperties: false
      required:
      - account_id
      - profiles
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        profiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - instrument_id
            properties:
              instrument_id:
                $ref: '#/components/schemas/Uuid'
              profile:
                description: Absent when the account has no profile for the instrument (its size had no default when it was
                  created; Q43).
                $ref: '#/components/schemas/AccountProfile'
    RiskRuleKind:
      type: string
      enum:
      - daily_loss
      - drawdown
      - daily_profit_target
      - consistency
    RiskState:
      type: string
      enum:
      - normal
      - warning
      - reached
      - target_reached
      description: 'Exactly three levels plus the target (F§7.1, D18): `normal` < 80 %, `warning` ≥ 80 %, `reached` at

        the limit, `target_reached` for the daily profit target. Consistency never goes beyond `warning`.

        '
    RiskRules:
      type: object
      additionalProperties: false
      required:
      - profit_target_on_reach
      description: The account's rules; an absent rule is not set (provenance per field for prop accounts is in `AccountRiskRules.preset_fields`).
      properties:
        drawdown:
          $ref: '#/components/schemas/DrawdownValue'
        daily_loss_limit:
          $ref: '#/components/schemas/DailyLossValue'
        daily_profit_target:
          $ref: '#/components/schemas/DailyProfitTargetValue'
        profit_target_on_reach:
          type: string
          enum:
          - notify
          - flatten_and_block
          description: Default `notify` (Q3). `flatten_and_block` only with enforcement on (Q49); it falls back to `notify`
            if enforcement is turned off later (Q63).
        consistency_threshold_pct:
          type: string
          pattern: ^(100(\.0)?|[0-9]{1,2}(\.[0-9])?)$
          description: Prop with a consistency rule only; the tracked threshold, 0–100 with at most one decimal (Q-S13-7).
            Never enforced (S13 AC-6).
        trading_day_reset:
          description: Prop only (the account's copy of the preset value; editable, marked `Editado`). Real accounts use the
            CME session close.
          $ref: '#/components/schemas/TradingDayResetValue'
        evaluation_profit_target:
          description: Prop accounts in an evaluation phase (S13b; Q46) — prefilled from the preset, editable. Notify only
            when reached (Q70); it never blocks or flattens.
          $ref: '#/components/schemas/EvaluationTargetValue'
    RiskRulesRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - rules
      properties:
        version:
          type: integer
          minimum: 1
          description: The account's limits version read with the rules (ADR-0006); stale → 409.
        rules:
          $ref: '#/components/schemas/RiskRules'
        acknowledge_reached:
          type: boolean
          description: Required (true) when the new rules would already be reached today.
    AccountRiskRules:
      type: object
      additionalProperties: false
      required:
      - account_id
      - rules
      - enforcement_enabled
      - version
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        rules:
          $ref: '#/components/schemas/RiskRules'
        enforcement_enabled:
          type: boolean
          description: Read-only here (S15 control; default off).
        preset_fields:
          type: array
          description: Prop with a preset only — provenance of each field (same shape as `getAccountPreset`).
          items:
            $ref: '#/components/schemas/AccountRuleField'
        version:
          type: integer
          minimum: 1
    RiskRulesPreview:
      type: object
      additionalProperties: false
      required:
      - changes
      - would_be_reached
      properties:
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - effective
            - effective_from
            properties:
              kind:
                $ref: '#/components/schemas/RiskRuleKind'
              effective:
                type: string
                enum:
                - now
                - next_trading_day
              effective_from:
                $ref: '#/components/schemas/Timestamp'
        would_be_reached:
          type: boolean
          description: True when a change effective now makes a limit already reached; the save then needs `acknowledge_reached`.
    RiskMeter:
      type: object
      additionalProperties: false
      required:
      - kind
      - state
      - limit
      - used
      - percent
      properties:
        kind:
          $ref: '#/components/schemas/RiskRuleKind'
        state:
          $ref: '#/components/schemas/RiskState'
        limit:
          description: The limit or target in force today — money (`Money` pattern), or for `consistency` the threshold as
            a percent string.
          type: string
          pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
        used:
          description: Today's value against the limit (loss used, drawdown used, profit made — money; for `consistency` the
            largest day's share of total profit, as a percent string).
          type: string
          pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
        percent:
          type: integer
          minimum: 0
          description: used / limit × 100, truncated (F§6.2), so 80 is never shown while the state is `normal`.
        drawdown_type:
          type: string
          enum:
          - trailing_intraday
          - trailing_eod
          - static
        floor:
          description: Trailing drawdown only — the account balance at which the drawdown is breached, as it stands now (Q-S13-5).
          $ref: '#/components/schemas/Money'
      allOf:
      - if:
          properties:
            kind:
              const: drawdown
        then:
          required:
          - drawdown_type
        else:
          not:
            anyOf:
            - required:
              - drawdown_type
            - required:
              - floor
    AccountRisk:
      type: object
      additionalProperties: false
      required:
      - account_id
      - as_of
      - stale
      - state
      - trading_day
      - meters
      - unset_rules
      - untracked_rules
      - enforcement_enabled
      - limits_pending
      - pending_changes
      - pnl_basis
      - commission_source
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        as_of:
          $ref: '#/components/schemas/Timestamp'
        stale:
          type: boolean
        stale_reason:
          type: string
          enum:
          - connection_down
          - no_recent_data
        state:
          description: The worst state over all meters.
          $ref: '#/components/schemas/RiskState'
        trading_day:
          type: object
          additionalProperties: false
          required:
          - start
          - end
          - next_reset
          - source
          properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
            next_reset:
              $ref: '#/components/schemas/Timestamp'
            source:
              type: string
              enum:
              - firm
              - cme_session_close
            firm_reset:
              $ref: '#/components/schemas/TradingDayResetValue'
            playback_clock:
              description: Playback accounts only — the simulated clock the day and P&L follow (S15 AC-7).
              $ref: '#/components/schemas/Timestamp'
        meters:
          type: array
          description: One meter per rule that is set and tracked, in the order daily loss, drawdown, daily profit target,
            consistency.
          items:
            $ref: '#/components/schemas/RiskMeter'
        unset_rules:
          type: array
          description: Rules not set (UI "sem limite definido").
          items:
            $ref: '#/components/schemas/RiskRuleKind'
        untracked_rules:
          type: array
          description: Rules set but not tracked (a not-confirmed preset value left unresolved, or a drawdown of type `other`).
          items:
            $ref: '#/components/schemas/RiskRuleKind'
        blocked:
          type: object
          additionalProperties: false
          required:
          - until
          - cause
          description: Present while the account is blocked until the reset (S15); no early unlock.
          properties:
            until:
              $ref: '#/components/schemas/Timestamp'
            cause:
              type: string
              enum:
              - daily_loss
              - drawdown
              - daily_profit_target
        enforcement_enabled:
          type: boolean
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: The basis of every meter (`net` from 3.5.0; S13 AC-2 — firms measure on net).
        commission_source:
          description: How today's commissions were obtained (`none` → the UI shows "comissão não informada; os limites podem
            estar folgados demais", a notice, not a block).
          $ref: '#/components/schemas/CommissionSource'
        commissions_today:
          $ref: '#/components/schemas/MoneyString'
        evaluation:
          type: object
          additionalProperties: false
          required:
          - start
          - profit_target
          - earned_before
          - achieved
          - remaining
          - percent
          - state
          - as_of
          description: 'S13b (Q46) — present when the account has an `evaluation_profit_target`. `achieved` = net P&L

            from `start` to now (the Core''s sum of the account''s fills; manual trades never count);

            `remaining` = max(0, target − achieved); `percent` truncated. `target_reached` raises one

            notification (`risk.evaluation_target_reached`, Q70); nothing automatic happens.

            '
          properties:
            start:
              type: string
              format: date
              description: The account's `evaluation_start`.
            profit_target:
              $ref: '#/components/schemas/Money'
            earned_before:
              $ref: '#/components/schemas/Money'
            achieved:
              description: earned_before + net P&L from `start` to now.
              $ref: '#/components/schemas/Money'
            remaining:
              $ref: '#/components/schemas/MoneyString'
            percent:
              type: integer
              minimum: 0
            state:
              type: string
              enum:
              - in_progress
              - target_reached
            reached_at:
              $ref: '#/components/schemas/Timestamp'
            as_of:
              $ref: '#/components/schemas/Timestamp'
        limits_pending:
          type: boolean
          description: True while the risk module has not yet derived the account's latest limits version (ADR-0006); meters
            show the previous limits and new entries are skipped (`routing.limits_pending`).
        pending_changes:
          type: array
          description: Looser values saved today that apply from the next trading day (Q48).
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - effective_from
            properties:
              kind:
                $ref: '#/components/schemas/RiskRuleKind'
              effective_from:
                $ref: '#/components/schemas/Timestamp'
              new_limit:
                type: string
                pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
                description: The new limit (money as a decimal string; a percent for consistency). Absent when the change
                  removes the rule or changes only a kind or `profit_target_on_reach`.
              change:
                type: string
                enum:
                - limit_raised
                - rule_removed
                - profit_target_to_notify
                - daily_loss_softened
                - drawdown_type_changed
                - daily_loss_changed
                description: 'What is pending. `drawdown_type_changed` (a change of type is not comparable, so it waits

                  for the next trading day), `daily_loss_softened` and `daily_loss_changed` (a mixed change

                  that is stricter in one part and looser in another, e.g. `soft_pause` → `hard` with a

                  higher amount: treated as looser, so it waits) carry the new value in `new_drawdown` /

                  `new_daily_loss`.

                  '
              new_drawdown:
                $ref: '#/components/schemas/DrawdownValue'
              new_daily_loss:
                $ref: '#/components/schemas/DailyLossValue'
            allOf:
            - if:
                properties:
                  change:
                    const: drawdown_type_changed
                required:
                - change
              then:
                required:
                - new_drawdown
                properties:
                  kind:
                    const: drawdown
            - if:
                properties:
                  change:
                    enum:
                    - daily_loss_softened
                    - daily_loss_changed
                required:
                - change
              then:
                required:
                - new_daily_loss
                properties:
                  kind:
                    const: daily_loss
        pending_reset_change:
          type: object
          additionalProperties: false
          required:
          - effective_from
          - new_reset
          description: A saved change of the trading-day reset time (prop accounts), which always applies from the next trading
            day (ADR-0006 §3.7).
          properties:
            effective_from:
              $ref: '#/components/schemas/Timestamp'
            new_reset:
              $ref: '#/components/schemas/TradingDayResetValue'
    RiskSummaryList:
      type: object
      additionalProperties: false
      required:
      - summaries
      properties:
        summaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - has_rules
            - stale
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              has_rules:
                type: boolean
                description: False → the list shows `—`.
              stale:
                type: boolean
              state:
                $ref: '#/components/schemas/RiskState'
              worst:
                type: object
                additionalProperties: false
                required:
                - kind
                - percent
                description: The meter with the worst state (highest percent on ties); absent when all are normal.
                properties:
                  kind:
                    $ref: '#/components/schemas/RiskRuleKind'
                  percent:
                    type: integer
                    minimum: 0
              blocked_until:
                $ref: '#/components/schemas/Timestamp'
    RiskStateChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - account_id
      - state
      - stale
      description: The risk state, staleness, block or trading day of an account changed (not on every tick); sent only to
        the account's owner, like every SSE event; the client refetches `getAccountRisk` / `listRiskSummaries`.
      properties:
        type:
          const: risk.state_changed
        at:
          $ref: '#/components/schemas/Timestamp'
        account_id:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/RiskState'
        stale:
          type: boolean
        reason:
          type: string
          enum:
          - state
          - stale
          - blocked
          - unblocked
          - trading_day_reset
          - rules_changed
          - evaluation_progress
    SignalType:
      type: string
      enum:
      - trigger
      - trade_plan
      - nq_trigger
      description: Selectable signal types of a TradingView route (ADR-0003). `master_account` belongs to follower routes
        (S19) and is not accepted here.
    SignalTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/components/schemas/SignalType'
      description: At least one (S7 AC-2, Q-S7-1); an empty list gets 400 `common.invalid_request` with pointer `/signal_types`.
    RouteReasonCode:
      type: string
      enum:
      - routing.account_inactive
      - routing.source_revoked
      - routing.platform_unbound
      - routing.automation_not_accepted
      - routing.copy_not_accepted
      - routing.connection_disconnected
      - routing.out_of_sync
      - routing.risk_blocked
      - routing.no_bracket_profile
      - routing.limits_pending
      - routing.route_disabled
      description: 'Why a route does not (fully) receive now. The gate codes of ADR-0003 §4.1 (`account_inactive`,

        `automation_not_accepted`, `copy_not_accepted`, `out_of_sync`, `risk_blocked`) are also the audit

        codes of each skipped instruction; `no_bracket_profile` (S6, Q43) and

        `limits_pending` (ADR-0006: the account''s limits are not yet derived) are skip codes added by this

        contract (ADR-0003 delta pending, Esquadro). `source_revoked`, `platform_unbound`,

        `connection_disconnected` (every connection status other than `connected`: disconnected, outdated,

        awaiting pairing, unpaired) and `route_disabled` describe configuration or connection state.

        New codes may be added in a minor version; clients show a generic text for an unknown code.

        '
    RouteReason:
      type: object
      additionalProperties: false
      required:
      - code
      - blocks
      properties:
        code:
          $ref: '#/components/schemas/RouteReasonCode'
        blocks:
          type: string
          enum:
          - all_actions
          - entries_only
          description: '`entries_only` for `out_of_sync`, `risk_blocked`, `no_bracket_profile` and `limits_pending`

            (exits still go through, S7 AC-8 / P1); `all_actions` for every other code (a paused or

            disabled account receives no exit either). Fixed per code.

            '
        lifecycle_state:
          description: With `routing.account_inactive` (`paused` or `disabled`), so the text can name it.
          type: string
          enum:
          - paused
          - disabled
        opt_in_state:
          description: With `routing.automation_not_accepted` / `routing.copy_not_accepted`. `declined` = the state is `chosen`
            with choice `declined`; `pending_review` = the state is `pending_review`.
          type: string
          enum:
          - declined
          - pending_review
        instrument_ids:
          description: With `routing.no_bracket_profile` — the enabled instruments for which the account has no stop/target
            profile (profiles are per account × instrument); entries in other instruments still go through.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            code:
              enum:
              - routing.out_of_sync
              - routing.risk_blocked
              - routing.no_bracket_profile
              - routing.limits_pending
        then:
          properties:
            blocks:
              const: entries_only
        else:
          properties:
            blocks:
              const: all_actions
      - if:
          properties:
            code:
              const: routing.account_inactive
        then:
          required:
          - lifecycle_state
        else:
          not:
            required:
            - lifecycle_state
      - if:
          properties:
            code:
              enum:
              - routing.automation_not_accepted
              - routing.copy_not_accepted
        then:
          required:
          - opt_in_state
        else:
          not:
            required:
            - opt_in_state
      - if:
          properties:
            code:
              const: routing.no_bracket_profile
        then:
          required:
          - instrument_ids
        else:
          not:
            required:
            - instrument_ids
    RouteStatus:
      type: object
      additionalProperties: false
      required:
      - status
      - reasons
      - computed_at
      description: Computed by the Core from the account, source, connection, opt-in, sync and risk state; the UI renders
        it and never re-implements a gate.
      properties:
        status:
          type: string
          enum:
          - receiving
          - exits_only
          - not_receiving
          description: '`receiving` = no reason; `exits_only` = only `entries_only` reasons; `not_receiving` = at least

            one `all_actions` reason.

            '
        reasons:
          type: array
          description: Every reason that applies, most severe first (the Core's order follows the UI badge priority); empty
            with `receiving`.
          items:
            $ref: '#/components/schemas/RouteReason'
        computed_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            status:
              const: receiving
        then:
          properties:
            reasons:
              maxItems: 0
      - if:
          properties:
            status:
              const: exits_only
        then:
          properties:
            reasons:
              minItems: 1
              items:
                properties:
                  blocks:
                    const: entries_only
      - if:
          properties:
            status:
              const: not_receiving
        then:
          properties:
            reasons:
              contains:
                properties:
                  blocks:
                    const: all_actions
    Route:
      type: object
      additionalProperties: false
      required:
      - id
      - source_id
      - account_id
      - signal_types
      - is_enabled
      - effective
      - row_version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
        effective:
          $ref: '#/components/schemas/RouteStatus'
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    RouteList:
      type: object
      additionalProperties: false
      required:
      - routes
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    RouteCreateRequest:
      type: object
      additionalProperties: false
      required:
      - source_id
      - account_id
      - signal_types
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
          description: Defaults to true.
        step_up:
          description: See `createRoute` (action `route_enable`, target = the account).
          $ref: '#/components/schemas/StepUpProof'
    RouteUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - signal_types
      - is_enabled
      - row_version
      properties:
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
        row_version:
          type: integer
          minimum: 1
        step_up:
          description: See `updateRoute` (action `route_enable`, target = the account).
          $ref: '#/components/schemas/StepUpProof'
    RouteCandidate:
      type: object
      additionalProperties: false
      required:
      - account_id
      - blocking_reasons
      - status_if_routed
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        blocking_reasons:
          type: array
          description: 'Empty → selectable. Otherwise the option is shown disabled with these reasons, most severe

            first. Only `routing.automation_not_accepted` (automated source) and `routing.platform_unbound`

            (Q37) block creation; every other reason only affects `status_if_routed`.

            '
          items:
            $ref: '#/components/schemas/RouteReason'
        status_if_routed:
          description: The status a new enabled route would have now (e.g. `exits_only` for an out-of-sync account).
          $ref: '#/components/schemas/RouteStatus'
    RouteCandidates:
      type: object
      additionalProperties: false
      required:
      - source_id
      - candidates
      - manual_only
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        candidates:
          type: array
          description: Sorted by account `display_name`.
          items:
            $ref: '#/components/schemas/RouteCandidate'
        manual_only:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - reason
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              reason:
                description: The preset's own explanation, verbatim with source and date (S16 AC-7, Q-S16-6); the UI frames
                  it.
                $ref: '#/components/schemas/RuleQuote'
    RouteChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - route_id
      - source_id
      - account_id
      description: 'Sent when a route is created, changed or removed, AND whenever the effective status of a route

        changes for any cause (source revoked, account lifecycle or opt-in, binding, connection, out of

        sync, risk block, stop/target profile created or removed). One event per affected route; the

        client refetches `listRoutes` (and `listRouteCandidates` if the picker is open).

        '
      properties:
        type:
          const: route.changed
        cause:
          type: string
          enum:
          - configuration
          - status
        at:
          $ref: '#/components/schemas/Timestamp'
        route_id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
    CommissionSource:
      type: string
      enum:
      - platform
      - configured
      - mixed
      - manual
      - none
      description: 'Where the commission came from. Effective commission of a fill = max(platform-reported,

        `commission_per_contract_side` × quantity) (U20 a). `platform` = the platform''s value was used;

        `configured` = the account floor was used (platform 0 or lower); `mixed` = both, fill by fill;

        `manual` = typed in a manual trade; `none` = no commission at all (platform 0 and no floor):

        net = gross and the UI shows "comissões não informadas".

        '
    TradeDirection:
      type: string
      enum:
      - long
      - short
      description: Direction of the position (UI `Compra` = long, `Venda` = short).
    TradeOrigin:
      type: string
      enum:
      - routed
      - master
      - manual
      - platform
      description: '`routed` = created by a routed instruction (source + signal type); `master` = master replication

        (S19, V1.1); `manual` = entered by the user (S21 AC-3); `platform` = placed by the user directly in

        the platform and captured (UI "Plataforma (sem sinal)", PO).

        '
    Trade:
      type: object
      additionalProperties: false
      required:
      - trade_id
      - account_id
      - account_name
      - account_deleted
      - instrument_id
      - instrument_symbol
      - direction
      - quantity
      - entry_time
      - entry_price
      - exit_time
      - exit_price
      - duration_seconds
      - pnl
      - pnl_basis
      - gross_pnl
      - commission
      - commission_source
      - origin
      - editable
      - created_at
      description: 'One completed trade (Q57: one trade per entry with FIFO exits in individual mode;

        flat-to-flat in shared mode). Captured trades carry the numbers the plugin computed and sent

        (S21 AC-2; adapter protocol 1.3 `trade_completed`; no raw price data is stored); the Core

        reconciles them with the fills it knows and audits a difference as `trades.reconcile_mismatch`,

        never correcting silently. Manual ones carry the Core''s computation. Manual trades do not feed

        daily loss, drawdown, profit target, consistency or blocks (S13/S15), and never unblock an

        account; they feed only this list and the metrics (S21/S22) (PO rule: S13 AC-2 + S21 AC-3, PO clarification, slice-plan
        rev. 7;

        QA Security I1). Money and prices are decimal strings (X-3).

        '
      properties:
        trade_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        account_name:
          type: string
          maxLength: 80
          description: Snapshot.
        account_deleted:
          type: boolean
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        instrument_symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
        contract_month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        direction:
          $ref: '#/components/schemas/TradeDirection'
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        entry_time:
          $ref: '#/components/schemas/Timestamp'
        entry_price:
          $ref: '#/components/schemas/Price'
        exit_time:
          $ref: '#/components/schemas/Timestamp'
        exit_price:
          $ref: '#/components/schemas/Price'
        duration_seconds:
          type: integer
          minimum: 0
          description: exit − entry (PO).
        pnl:
          description: The main P&L, in the basis of `pnl_basis` (net from 3.5.0).
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: 'The basis of `pnl`. From 3.5.0 always `net` (after commissions; user decision 2026-10-23,

            S21 AC-1); `gross` is kept in the enum only for compatibility with 3.4 readers.

            '
        gross_pnl:
          description: P&L before commissions (shown alongside).
          $ref: '#/components/schemas/Money'
        commission:
          description: Total commission of the trade (all its fills), ≥ 0.
          $ref: '#/components/schemas/MoneyString'
        commission_source:
          $ref: '#/components/schemas/CommissionSource'
        mae:
          description: Maximum adverse excursion in USD, ≥ 0 (Q52). Absent when not provided (manual, Q55) or when the plugin
            did not observe the whole interval (never a partial value).
          $ref: '#/components/schemas/MoneyString'
        mfe:
          description: Maximum favourable excursion in USD, ≥ 0 (as `mae`).
          $ref: '#/components/schemas/MoneyString'
        reconcile_mismatch:
          type: boolean
          description: Captured trades — true when the plugin's numbers differ from the fills the Core knows (kept as sent;
            see the audit entry).
        origin:
          $ref: '#/components/schemas/TradeOrigin'
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          maxLength: 60
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        command_id:
          $ref: '#/components/schemas/Uuid'
        master_account_id:
          description: With `master` (S19).
          $ref: '#/components/schemas/Uuid'
        master_account_name:
          type: string
          maxLength: 80
        editable:
          type: boolean
          description: True only for manual trades (Q56).
        row_version:
          type: integer
          minimum: 1
          description: Manual trades only.
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            origin:
              const: routed
        then:
          required:
          - source_id
          - source_name
          - signal_type
          - instruction_id
      - if:
          properties:
            origin:
              const: master
        then:
          required:
          - master_account_id
          - master_account_name
      - if:
          properties:
            origin:
              const: manual
        then:
          required:
          - row_version
          properties:
            editable:
              const: true
          not:
            anyOf:
            - required:
              - captured_at
            - required:
              - command_id
        else:
          required:
          - captured_at
          properties:
            editable:
              const: false
          not:
            required:
            - row_version
    TradePage:
      type: object
      additionalProperties: false
      required:
      - trades
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        next_cursor:
          type: string
          description: Absent on the last page.
    TradesSummary:
      type: object
      additionalProperties: false
      required:
