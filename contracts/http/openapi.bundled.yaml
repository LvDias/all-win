        paired_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        pairing_code_expires_at:
          description: Present while a code is active (the code itself is never re-shown).
          $ref: '#/components/schemas/Timestamp'
        repairing_pending:
          type: boolean
          description: True while a "move to another machine" code is active and the current instance still works.
        visible_accounts:
          type: array
          items:
            $ref: '#/components/schemas/VisibleAccount'
        open_position_accounts:
          type: array
          description: Platform accounts with an open position (for the unpair confirmation).
          items:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        unpaired_at:
          $ref: '#/components/schemas/Timestamp'
        disconnect_reason:
          type: string
          enum:
          - user
          - network
          - outdated
          - unpaired
          description: Why the connection is not connected (1.3 close 4100 = user). Present when status is disconnected, outdated
            or unpaired.
    Event:
      description: SSE payloads (field `data`). `type` equals the SSE `event` name; `at` is when the event happened (server
        clock).
      oneOf:
      - $ref: modules/accounts.yaml#/components/schemas/AccountChangedEvent
      - $ref: modules/accounts.yaml#/components/schemas/AccountArchivedEvent
      - $ref: modules/routing.yaml#/components/schemas/RouteChangedEvent
      - $ref: modules/audit.yaml#/components/schemas/AuditEntryRecordedEvent
      - $ref: modules/presets.yaml#/components/schemas/PresetVersionAvailableEvent
      - $ref: modules/risk.yaml#/components/schemas/RiskStateChangedEvent
      - $ref: modules/notifications.yaml#/components/schemas/NotificationCreatedEvent
      - $ref: modules/notifications.yaml#/components/schemas/NotificationUpdatedEvent
      - $ref: modules/notifications.yaml#/components/schemas/NotificationReadEvent
      - $ref: modules/trades.yaml#/components/schemas/TradeCapturedEvent
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - status
        properties:
          type:
            const: connection.status_changed
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          status:
            type: string
            enum:
            - awaiting_pairing
            - connected
            - disconnected
            - outdated
            - unpaired
          disconnect_reason:
            type: string
            enum:
            - user
            - network
            - outdated
            - unpaired
            description: Why the connection is not connected (1.3 close 4100 = user). Present when status is disconnected,
              outdated or unpaired.
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - instance_name
        - visible_accounts
        properties:
          type:
            const: connection.paired
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          instance_name:
            type: string
          visible_accounts:
            type: array
            items:
              $ref: '#/components/schemas/VisibleAccount'
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - connection_id
        - reason
        properties:
          type:
            const: connection.pairing_code_invalidated
          at:
            $ref: '#/components/schemas/Timestamp'
          connection_id:
            $ref: '#/components/schemas/Uuid'
          reason:
            type: string
            enum:
            - superseded
      - type: object
        additionalProperties: false
        required:
        - type
        - at
        - reason
        properties:
          type:
            const: session.ended
          at:
            $ref: '#/components/schemas/Timestamp'
          reason:
            type: string
            enum:
            - logout
            - expired
            - signed_out_everywhere
            - device_revoked
            - channel_changed
    AccountName:
      type: string
      minLength: 1
      maxLength: 80
      description: Trimmed by the Core (NFC); must not be blank. Unique per user among live accounts, case-insensitive.
    AccountKind:
      type: string
      enum:
      - prop
      - real
    LifecycleState:
      type: string
      enum:
      - active
      - paused
      - disabled
    SizeAmount:
      type: string
      description: 'Account size in `currency` (decimal string, at most 2 decimals, > 0). Zero fails the pattern: 400 `common.invalid_request`.'
      pattern: ^([1-9][0-9]{0,11}(\.[0-9]{1,2})?|0\.([1-9][0-9]?|0[1-9]))$
    MaxPositionQty:
      type: integer
      minimum: 1
