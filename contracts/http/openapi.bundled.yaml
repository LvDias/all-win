    DetailsRoutingDecision:
      type: object
      additionalProperties: false
      description: "`routing.adapter_protocol_outdated` (5.3.0, ADR-0004 r5 §7.1 / U13; outcome `skipped`, with\n`protocol_version`):\
        \ the account's session is too old for the action. It covers a `reduce` on a\nsession below 1.2 (no position guard),\
        \ and every ENTRY of an account with a drawdown rule on a\nsession below 1.4. In the second case the Core sends that\
        \ session no drawdown, so without the local\nbarrier it fails closed. Exits continue, and the user is told to update\
        \ the plugin.\n`routing.position_unknown` (5.3.0, U13 A; outcome `skipped`): a `reduce` while the Core holds no\n\
        All Win identity for the position, e.g. one opened externally on a TradingView-only destination.\nIt is never sent.\n\
        `routing.instrument_unavailable` (5.2.0, Esquadro): the instrument is in the catalog but has no active\ncontract at\
        \ the decision instant. Outcome `skipped` (a configuration rule), with `instrument_symbol`.\nIt applies only at the\
        \ decision; an instrument outside the catalog stays `ingress.unsupported_instrument`.\nEvery `routing.*` decision\
        \ code. A routing decision is `routed` (sent in full), `capped` (sent with\nless than requested: a capped quantity,\
        \ or a reverse's close leg only; audited with outcome\n`partial`), `skipped`, `refused` or `expired` (AuditOutcome).\
        \ One routing decision entry per\n(instruction, account). **Close and gate 6** (ADR-0003 §4.1 r4 final, Crivo C1;\
        \ Esmeril M1):\n- a `close` against a NON-flat expected position is always a flatten, with no gates 6–9;\n- a `close`\
        \ against a FLAT expected position waits for gate 6. Out of sync gives the Q75 flatten;\n  in sync gives `routing.nothing_to_close`.\
        \ Without an answer from gate 6, the instruction stays\n  undecided and the consumer retries. As an exit it NEVER\
        \ expires. It is never sent as a flatten\n  without knowing the sync state, which would cancel manual orders on an\
        \ in-sync account (Q75-1\n  was accepted only for out-of-sync accounts).\n**Two-step reverse** (ADR-0003 §4.1 r4;\
        \ its close leg never waits for gates 6–9; a reverse against a FLAT expected position waits for gate 6, like the close):\n\
        with the expected position opposite, the close leg is committed at once. The same commit writes\n`execution.command_requested`\
        \ (kind `flatten`, step of the reverse's close leg, same\n`instruction_id`, `is_exit` true, actor system, outcome\
        \ `info`, `safe_to_display` true), so the\nautomatic flatten is visible immediately, even while the gateway or the\
        \ connection is down. The\ngateway's `execution.command_sent` follows on the real send. The opening is decided\nin\
        \ a second, idempotent step when the gates answer, or as `routing.expired` when the TTL runs out,\nso it is bounded\
        \ by the TTL. Only then is the single routing entry written, with the final outcome:\n`routed`, or close-only `partial`\
        \ with the gate code. There is no separate routing entry for the\nclose leg (5.2.0, Ferro / Lastro). Q74: for a `reverse`\n\
        the position check (ADR-0003 §4.2) runs before the entry gates. Q74 has four bars (`out_of_sync`,\n`risk_blocked`,\
        \ `limits_pending`, `no_bracket_profile`). Two more cases give the same close-only\noutcome by rules that already\
        \ existed, and they are not Q74 bars: no room, `max_position_reached`\n(ADR-0003 §4.2, open `min(Q, M)` with derived\
        \ M = 0); and the open leg expired at routing,\n`routing.expired` (T1, below). On a barred account: position opposite\
        \ → only the close leg runs, and the\nentry carries the gate code, outcome `partial` (decision `capped`), `sizing.executed_qty`\
        \ = 0\nfor the open, and `reverse_closed_qty`; flat → skipped with the gate code, no\n`reverse_closed_qty`, except\
        \ for `routing.out_of_sync` (Q75, 5.2.0): the flat position is not\ntrusted, so the close leg is sent as a flatten\
        \ and the open is never created; decision `capped`,\nthe entry carries `routing.out_of_sync`, outcome `partial`, `executed_qty`\
        \ = 0, `expected_flat`\ntrue and no `reverse_closed_qty` (the closed quantity is unknown at the decision); already\
        \ on the\nreverse side → `routing.position_conflict` (rejected and notified, never a flatten, also when out\nof sync).\
        \ Q75 also applies to a `close`: on an out-of-sync account with a flat expected position it\nis sent as a flatten\
        \ (decision `routed`, `expected_flat` true), and `routing.nothing_to_close`\nnever applies to an out-of-sync account.\
        \ A `reduce` is never turned into a flatten (Q76):\n`routing.nothing_to_reduce`, also when out of sync. The same holds\
        \ when the open leg of a reverse with an opposite\nposition expires at routing (gate `expired`, TTL; 5.1.0): the close\
        \ leg runs (no expiry; audited as\nlate if it is), and the entry carries `routing.expired`, outcome `partial`, `executed_qty`\
        \ = 0 for\nthe open and `reverse_closed_qty`; flat → outcome `expired`. Only at routing: when the routing decision\
        \ itself sees the TTL exceeded (gate 10, e.g. a late webhook). An open leg that expires later, in the gateway queue\
        \ while the connection is down, is not a routing decision: the decision stays `routed`, and ADR-0004 §5 applies (\"\
        Exception: the opening leg of a reverse\", 5.1.1): an open leg found expired before it was sent is held until the\
        \ flatten it depends on is terminal; it is then `expired`, audited as `execution.expired`, and it does NOT flag the\
        \ account out of sync only when (1) it never left the Core, (2) the flatten succeeded with a proven flat position\
        \ (`already_flat` with no later report for that account and contract, or for `filled` the latest report with `position_after`\
        \ shows 0 and no later report exists), and (3) the account has no other sync reason; it then gets `routing.reverse_close_only`\
        \ with `reason_code: routing.expired`. Any other case flags out of sync as before.\n"
      properties:
        sizing:
          $ref: '#/components/schemas/DetailsSizing'
        lifecycle_state:
          type: string
          enum:
          - paused
          - disabled
        opt_in_state:
          type: string
          enum:
          - declined
          - pending_review
        rule_version_id:
          $ref: '#/components/schemas/Uuid'
        sync_reasons:
          type: array
          items:
            type: string
            pattern: ^sync\.[a-z][a-z0-9_]*$
        position_side:
          type: string
          enum:
          - long
          - short
          - flat
        account_size:
          $ref: '#/components/schemas/SizeAmount'
        instrument_ids:
          description: With `routing.no_bracket_profile`.
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        limits_version:
          type: integer
          minimum: 1
          description: With `routing.limits_pending` — the account's limits version not yet derived (ADR-0006).
        reverse_closed_qty:
          type: integer
          minimum: 1
          maximum: 10000
          description: 'Q74: abs(position) read at the decision, i.e. the quantity the close leg of a reverse is sent to flatten
            when its open leg is skipped with this code. The executed result is in the execution entries.'
        expected_flat:
          type: boolean
          description: 'Q75 (5.2.0): true when a flatten was sent while the expected position was flat, because the account
            is out of sync (a `close`, decision `routed`, or the close leg of a reverse, `routing.out_of_sync` capped). The
            adapter cancels every working order on the contract (manual ones included) and checks the real position; the result
            is in the execution entries (`execution.cancelled` + `command.already_flat`, or fills) and is notified once (`routing.out_of_sync_flatten`,
            or `routing.reverse_close_only` for a reverse that filled). Absent otherwise.'
        ttl_ms:
          type: integer
          minimum: 1
        expiry_base:
          $ref: '#/components/schemas/Timestamp'
        instrument_symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
          description: The instruction's instrument (required with `routing.instrument_unavailable`).
        protocol_version:
          type: string
          pattern: ^1\.(0|[1-9][0-9]*)$
          description: 'With `routing.adapter_protocol_outdated`: the version the session negotiated.'
        gates_unknown:
          type: boolean
          description: '5.2.0 (Esquadro, S7 N1). True when the TTL ran out before the account gates 6–9 (out of sync,

            risk, limits, bracket profile) answered. It applies only to entries, since only entries have a

            TTL. The decision then uses only what is known: the action rule that does not depend on those

            gates (`routing.position_conflict`), or else `routing.expired`. (`routing.nothing_to_reduce`

            belongs to an exit, which is decided without gates 6–9 and never expires.) It

            never names a gate that did not answer; the S10 text says "os gates de conta não responderam a

            tempo". `routing.nothing_to_close` is never decided with `gates_unknown` (see the close rule).

            Absent otherwise.

            '
        contract_month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: '5.2.0 (Esquadro, S7 D2): the contract month the decision resolved (YYYY-MM). The instruction''s

            month wins when present; otherwise it is the rollover catalog''s active contract at the decision

            instant (P5). The resolved (symbol, month) is used for the position, the gates, the brackets and

            the commands.

            '
    DetailsCommandSent:
      description: '`execution.command_sent` (the gateway; committed before the socket write) and `execution.command_requested`
        (5.2.0, Esquadro: routing committed an EXIT command that the gateway has not sent yet, so it is visible while it waits,
        even with the gateway or the connection down. Every exit command routing commits gets one: `close`, `reduce`, `cancel`,
        protective `modify`, and the close leg of a reverse. Audit only, actor system, outcome `info`, `is_exit` true; the
        gateway''s `execution.command_sent` follows on the real send; `expires_at` absent, since exits carry none).'
      type: object
      additionalProperties: false
      required:
      - step
      - kind
      properties:
        step:
          type: string
          maxLength: 64
        kind:
          type: string
          enum:
          - place
          - modify
          - cancel
          - flatten
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        late_ms:
          type: integer
          minimum: 1
          description: '5.3.0, ADR-0004 §5 r5 ("audited as late"; T1). Present only on an exit command sent after

            `expiry_base` + the account''s command TTL. Exits are `flatten` (close, reverse close leg), a

            `place` reduce, `cancel`, and a protective `modify`. The value is `sent_at` − (`expiry_base` +

            TTL) in milliseconds. Absent when the command was sent in time. Never on an entry: a late

            entry expires and is not sent.

            '
