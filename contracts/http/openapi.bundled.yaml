            Q-S10-7).
          items:
            $ref: '#/components/schemas/AuditSignalType'
    InstructionSummary:
      type: object
      additionalProperties: false
      required:
      - instruction_id
      - message_id
      - source_id
      - source_name
      - signal_type
      - action
      - instrument_symbol
      - sent_at
      - received_at
      properties:
        instruction_id:
          $ref: '#/components/schemas/Uuid'
        message_id:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          minLength: 1
          maxLength: 60
        source_key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        action:
          type: string
          enum:
          - buy
          - sell
          - close
