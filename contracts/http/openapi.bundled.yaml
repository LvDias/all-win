        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - admin
      operationId: createInvitation
      summary: Issue an invitation bound to one e-mail (Q19; step-up); link returned once
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      requestBody:
