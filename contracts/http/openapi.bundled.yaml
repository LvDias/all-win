          format: uri
          maxLength: 2048
          pattern: ^https://
        accessed_at:
          type: string
          format: date
          description: Date the page was read (YYYY-MM-DD).
    RuleVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - firm_stance
      - is_generic
      - version_number
      - published_at
      - quotes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_stance:
          $ref: '#/components/schemas/FirmStance'
        firm_platform:
          description: The firm platform this rule version applies to; absent when the firm's stance does not vary by platform,
            and for generic rules.
          $ref: '#/components/schemas/FirmPlatform'
        is_generic:
          type: boolean
          description: True for the rule used by prop accounts without a preset (no firm, stance `unknown`, no quotes; the
            UI shows the generic warning).
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        quotes:
          type: array
          description: 'Official quotes, in display order. Empty for `unknown`. For `not_confirmed` they are the

            conflicting quotes, each with its own source and date.

            '
          items:
            $ref: '#/components/schemas/RuleQuote'
        research:
          type: object
          additionalProperties: false
          required:
          - searched_on
          - sources
          description: With `unknown` (not generic) — where the publisher looked and found no rule.
          properties:
            searched_on:
              type: string
              format: date
            sources:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - page_title
                - url
                properties:
                  page_title:
                    type: string
                    maxLength: 300
                  url:
                    type: string
                    format: uri
                    maxLength: 2048
                    pattern: ^https://
        change:
          type: object
          additionalProperties: false
          required:
          - previous_rule_version_id
          - previous_firm_stance
          - cause
          description: Present when this version replaced an earlier one for the same preset selection and kind.
          properties:
            previous_rule_version_id:
              $ref: '#/components/schemas/Uuid'
            previous_firm_stance:
              $ref: '#/components/schemas/FirmStance'
            cause:
              type: string
              enum:
              - stance_changed
              - text_changed
              - not_material
              description: '`stance_changed` and `text_changed` move `chosen` accounts to `pending_review` (Q26; the

                text case is Q42: the publisher flagged it as material). `not_material` never

                suspends (typo or format fix).

                '
            reason:
              description: 'The publisher''s explanation shown to the user, present with `text_changed` (Q42 a: the publisher
                flags the change and records why); optional in the schema for compatibility.'
              $ref: '#/components/schemas/LocalizedText'
      allOf:
      - if:
          properties:
            is_generic:
              const: true
        then:
          properties:
            firm_stance:
              const: unknown
            quotes:
              maxItems: 0
          not:
            anyOf:
            - required:
              - firm_id
            - required:
              - firm_name
            - required:
              - research
            - required:
              - firm_platform
        else:
          required:
          - firm_id
          - firm_name
    OptInRules:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      properties:
        automation:
          $ref: '#/components/schemas/RuleVersion'
        copy:
          $ref: '#/components/schemas/RuleVersion'
