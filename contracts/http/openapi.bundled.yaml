    WinRate:
      type: string
      pattern: ^(100\.0|[0-9]{1,2}\.[0-9])$
      description: Percent with exactly one decimal (Q-S22-2).
    PerformanceFigures:
      type: object
      additionalProperties: false
      required:
      - trade_count
      - win_count
      - loss_count
      - breakeven_count
      - total_pnl
      - total_gross_pnl
      - total_commission
      - mae_sample_count
      - mfe_sample_count
      description: 'All P&L figures are NET (after commissions; S22 AC-3): a win is a trade with net P&L > 0, so a

        trade of +2.00 gross with 2.50 commission is a loss (Q58: P&L = 0 is not a win; the counts are

        shown). Win rate = wins ÷ all trades. MAE / MFE averages use only trades that have the value (`*_sample_count` of

        `trade_count`, Q55).

        '
      properties:
        trade_count:
          type: integer
          minimum: 0
        win_count:
          type: integer
          minimum: 0
        loss_count:
          type: integer
          minimum: 0
        breakeven_count:
          type: integer
          minimum: 0
        total_pnl:
          $ref: '#/components/schemas/Money'
        pnl_basis:
          type: string
          enum:
          - gross
          - net
          description: '`net` from 3.5.0.'
        total_gross_pnl:
          $ref: '#/components/schemas/Money'
        total_commission:
          $ref: '#/components/schemas/MoneyString'
        uncommissioned_count:
          type: integer
          minimum: 0
          description: Trades whose commission is `none` (net = gross).
        avg_pnl:
          description: Net average per trade.
          $ref: '#/components/schemas/Money'
        win_rate:
          $ref: '#/components/schemas/WinRate'
        avg_duration_seconds:
          type: integer
          minimum: 0
        avg_mae:
          $ref: '#/components/schemas/MoneyString'
        mae_sample_count:
          type: integer
          minimum: 0
        avg_mfe:
          $ref: '#/components/schemas/MoneyString'
        mfe_sample_count:
          type: integer
          minimum: 0
      allOf:
      - if:
          properties:
            trade_count:
              const: 0
        then:
          not:
            anyOf:
            - required:
              - avg_pnl
            - required:
              - win_rate
            - required:
              - avg_duration_seconds
        else:
          required:
          - avg_pnl
          - win_rate
          - avg_duration_seconds
      - if:
          properties:
            mae_sample_count:
              const: 0
        then:
          not:
            required:
            - avg_mae
        else:
          required:
          - avg_mae
      - if:
          properties:
            mfe_sample_count:
              const: 0
        then:
          not:
            required:
            - avg_mfe
        else:
          required:
          - avg_mfe
    PerformanceGroup:
      type: object
      additionalProperties: false
      required:
      - origin
      - figures
      - bar_ratio
      description: 'One group with at least one trade. Keys by `group_by`: `source_signal` → origin + source (routed) +

        signal type; `source` → origin + source; `signal_type` → signal type (origin `manual` /

        `platform` trades form their own groups without a signal type, Q-S22-7).

        '
      properties:
        origin:
          $ref: '#/components/schemas/TradeOrigin'
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          maxLength: 60
        source_revoked:
          type: boolean
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        master_account_id:
          $ref: '#/components/schemas/Uuid'
        master_account_name:
          type: string
          maxLength: 80
        figures:
          $ref: '#/components/schemas/PerformanceFigures'
        bar_ratio:
          type: string
          pattern: ^(1\.0000|0\.[0-9]{4})$
          description: '|total_pnl| of this group ÷ the largest |total_pnl| among the groups (the bar length; its sign comes
            from `total_pnl`). `0.0000` for every group when the largest |total_pnl| is 0.'
    Performance:
      type: object
      additionalProperties: false
      required:
      - as_of
      - group_by
      - totals
      - groups
      properties:
        as_of:
          description: The instant the set was taken; pass it as `recorded_before` to the S21 list for the same trades.
          $ref: '#/components/schemas/Timestamp'
        group_by:
          type: string
          enum:
          - source_signal
          - source
          - signal_type
        totals:
          description: The whole filtered set; equals `getTradesSummary` for the same filters and `recorded_before = as_of`
            (S22 AC-2).
          $ref: '#/components/schemas/PerformanceFigures'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceGroup'
    LocalizedText:
      type: object
      additionalProperties: false
      required:
      - pt-BR
      - en
      description: Text written by the catalog publisher in both UI languages (not firm text; firm text is never translated).
      properties:
        pt-BR:
          type: string
          minLength: 1
          maxLength: 2000
        en:
          type: string
          minLength: 1
          maxLength: 2000
    RuleQuote:
      type: object
      additionalProperties: false
      required:
