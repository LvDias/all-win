    LocalizedText:
      type: object
      additionalProperties: false
      required:
      - pt-BR
      - en
      description: Text written by the catalog publisher in both UI languages (not firm text; firm text is never translated).
      properties:
        pt-BR:
          type: string
          minLength: 1
          maxLength: 2000
        en:
          type: string
          minLength: 1
          maxLength: 2000
    RuleQuote:
      type: object
      additionalProperties: false
      required:
      - text
      - language
      - page_title
      - url
      - accessed_at
      description: A verbatim quote of the firm's official text, in the firm's language (never translated).
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
        language:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
          description: BCP 47, e.g. 'en'.
        page_title:
          type: string
          maxLength: 300
        section:
          type: string
          maxLength: 300
          description: Heading of the quoted part of the page, if any.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
        accessed_at:
          type: string
          format: date
          description: Date the page was read (YYYY-MM-DD).
    RuleVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - firm_stance
      - is_generic
      - version_number
      - published_at
      - quotes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/OptInKind'
        firm_stance:
          $ref: '#/components/schemas/FirmStance'
        is_generic:
          type: boolean
          description: True for the rule used by prop accounts without a preset (no firm, stance `unknown`, no quotes; the
            UI shows the generic warning).
        firm_id:
          $ref: '#/components/schemas/Uuid'
        firm_name:
          type: string
          maxLength: 120
        version_number:
          type: integer
          minimum: 1
        published_at:
          $ref: '#/components/schemas/Timestamp'
        quotes:
          type: array
          description: 'Official quotes, in display order. Empty for `unknown`. For `not_confirmed` they are the

            conflicting quotes, each with its own source and date.

            '
          items:
            $ref: '#/components/schemas/RuleQuote'
        research:
          type: object
          additionalProperties: false
          required:
          - searched_on
          - sources
          description: With `unknown` (not generic) — where the publisher looked and found no rule.
          properties:
            searched_on:
              type: string
              format: date
            sources:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - page_title
                - url
                properties:
                  page_title:
                    type: string
                    maxLength: 300
                  url:
                    type: string
                    format: uri
                    maxLength: 2048
                    pattern: ^https://
        change:
          type: object
          additionalProperties: false
          required:
          - previous_rule_version_id
          - previous_firm_stance
          - cause
          description: Present when this version replaced an earlier one for the same preset selection and kind.
          properties:
            previous_rule_version_id:
              $ref: '#/components/schemas/Uuid'
            previous_firm_stance:
              $ref: '#/components/schemas/FirmStance'
            cause:
              type: string
              enum:
              - stance_changed
              - text_changed
              - not_material
              description: '`stance_changed` and `text_changed` move `chosen` accounts to `pending_review` (Q26; the

                text case is provisional, Q42: the publisher flagged it as material). `not_material` never

                suspends (typo or format fix).

                '
            reason:
              description: The publisher's explanation shown to the user; required for `text_changed`.
              $ref: '#/components/schemas/LocalizedText'
          allOf:
          - if:
              properties:
                cause:
                  const: text_changed
            then:
              required:
              - reason
      allOf:
      - if:
          properties:
            is_generic:
              const: true
        then:
          properties:
            firm_stance:
              const: unknown
            quotes:
              maxItems: 0
          not:
            anyOf:
            - required:
              - firm_id
            - required:
              - firm_name
            - required:
              - research
        else:
          required:
          - firm_id
          - firm_name
    OptInRules:
      type: object
      additionalProperties: false
      required:
      - automation
      - copy
      properties:
        automation:
          $ref: '#/components/schemas/RuleVersion'
        copy:
          $ref: '#/components/schemas/RuleVersion'
    DecimalString:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,10})?$
      description: Exact decimal as a string (no sign, no exponent, no separators).
    Instrument:
      type: object
      additionalProperties: false
      required:
      - id
      - symbol
      - name
      - exchange
      - currency
      - tick_size
      - tick_value
      - point_value
      - price_decimals
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        symbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
          description: Neutral root, e.g. 'MNQ'.
        name:
          type: string
          maxLength: 120
        exchange:
          type: string
          maxLength: 16
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        tick_size:
          $ref: '#/components/schemas/DecimalString'
        tick_value:
          description: Money per tick (tick_size × point_value, computed by the Core).
          $ref: '#/components/schemas/DecimalString'
        point_value:
          $ref: '#/components/schemas/DecimalString'
        price_decimals:
          type: integer
          minimum: 0
          maximum: 10
          description: Decimals to display prices and points with.
    InstrumentList:
      type: object
      additionalProperties: false
      required:
      - instruments
      properties:
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
    DistanceUnit:
      type: string
      enum:
      - points
      - ticks
      - usd
    DistanceValue:
      type: string
      pattern: ^[0-9]{1,8}(\.[0-9]{1,10})?$
      description: Decimal string; its allowed shape depends on the unit (see `DistanceProfile`).
    DistanceProfile:
      type: object
      additionalProperties: false
      required:
      - distance_unit
      - stop_distance
      - target_distance
      description: '`ticks` → whole numbers (`^[0-9]{1,5}$`); `usd` → at most 2 decimals (Q-S6-6); `points` → at most

        10 decimals. Each distance must be at least one tick after conversion (422 otherwise).

        '
      properties:
        distance_unit:
          $ref: '#/components/schemas/DistanceUnit'
        stop_distance:
          $ref: '#/components/schemas/DistanceValue'
        target_distance:
          $ref: '#/components/schemas/DistanceValue'
      allOf:
      - $ref: '#/components/schemas/DistanceProfileShape'
    DistanceEquivalent:
      type: object
      additionalProperties: false
      required:
      - ticks
      - points
      - usd
      - rounded
      description: What execution will use for one side. All values computed by the Core.
      properties:
        ticks:
          type: integer
          minimum: 1
          maximum: 10000
        points:
          $ref: '#/components/schemas/DecimalString'
        usd:
          $ref: '#/components/schemas/DecimalString'
        rounded:
          type: boolean
          description: True when the requested distance was not a whole number of ticks and was rounded toward the entry.
    ProfileEquivalents:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - stop
      - target
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        stop:
          $ref: '#/components/schemas/DistanceEquivalent'
        target:
          $ref: '#/components/schemas/DistanceEquivalent'
    NearestProfileSize:
      type: object
      additionalProperties: false
      required:
      - size_amount
      - candidates
      properties:
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        candidates:
          type: array
          minItems: 1
          maxItems: 2
          description: Ascending. Two entries only on an exact tie (the user chooses).
          items:
            type: object
            additionalProperties: false
            required:
            - size_amount
            - has_default
            properties:
              size_amount:
                $ref: '#/components/schemas/SizeAmount'
              has_default:
                type: boolean
                description: False → the account will start without a profile (Q43).
    DefaultProfileEntry:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - size_amount
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        size_amount:
          $ref: '#/components/schemas/SizeAmount'
        profile:
          description: Absent when the user has not defined this size.
          $ref: '#/components/schemas/DistanceProfile'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      dependentRequired:
        profile:
        - updated_at
    DefaultProfileList:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - defaults
      properties:
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        defaults:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DefaultProfileEntry'
    AccountProfileRequest:
      type: object
      additionalProperties: false
      required:
      - distance_unit
      - stop_distance
      - target_distance
      properties:
        distance_unit:
          $ref: '#/components/schemas/DistanceUnit'
        stop_distance:
          $ref: '#/components/schemas/DistanceValue'
        target_distance:
          $ref: '#/components/schemas/DistanceValue'
        row_version:
          type: integer
          minimum: 1
      allOf:
      - $ref: '#/components/schemas/DistanceProfileShape'
    DistanceProfileShape:
      description: The per-unit shape rules of `DistanceProfile`, reusable by request bodies that add fields.
      allOf:
      - if:
          properties:
            distance_unit:
              const: ticks
        then:
          properties:
            stop_distance:
              pattern: ^[0-9]{1,5}$
            target_distance:
              pattern: ^[0-9]{1,5}$
      - if:
          properties:
            distance_unit:
              const: usd
        then:
          properties:
            stop_distance:
              pattern: ^[0-9]{1,8}(\.[0-9]{1,2})?$
            target_distance:
              pattern: ^[0-9]{1,8}(\.[0-9]{1,2})?$
    AccountProfile:
      type: object
      additionalProperties: false
      required:
      - account_id
      - instrument_id
      - profile
      - equivalents
      - origin
      - customized
      - row_version
      - updated_at
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        instrument_id:
          $ref: '#/components/schemas/Uuid'
        profile:
          $ref: '#/components/schemas/DistanceProfile'
        equivalents:
          $ref: '#/components/schemas/ProfileEquivalents'
        origin:
          type: string
          enum:
          - size_default
          - nearest_size_default
          - set_by_user
          description: 'Where the values came from when last copied: the default of the account''s size, the default of

            the nearest standard size (real account of another size, chosen by the Core), or typed by the

            user on an account that had no profile.

            '
        copied_from_size:
          description: With `size_default` / `nearest_size_default`.
          $ref: '#/components/schemas/SizeAmount'
        copied_at:
          $ref: '#/components/schemas/Timestamp'
        customized:
          type: boolean
          description: True after the user edited the copy (badge `Personalizado`); false right after a copy or restore; always
            false with `set_by_user` (nothing to diverge from).
        default_now:
          description: The current default of `copied_from_size` (for the "default today" popover); absent if that size has
            none.
          $ref: '#/components/schemas/DistanceProfile'
        row_version:
          type: integer
          minimum: 1
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
      - if:
          properties:
            origin:
              enum:
              - size_default
              - nearest_size_default
        then:
          required:
          - copied_from_size
          - copied_at
        else:
          properties:
            customized:
              const: false
          not:
            anyOf:
            - required:
              - copied_from_size
            - required:
              - copied_at
            - required:
              - default_now
    AccountProfileList:
      type: object
      additionalProperties: false
      required:
      - account_id
      - profiles
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        profiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - instrument_id
            properties:
              instrument_id:
                $ref: '#/components/schemas/Uuid'
              profile:
                description: Absent when the account has no profile for the instrument (its size had no default when it was
                  created; Q43).
                $ref: '#/components/schemas/AccountProfile'
    SignalType:
      type: string
      enum:
      - trigger
      - trade_plan
      - nq_trigger
      description: Selectable signal types of a TradingView route (ADR-0003). `master_account` belongs to follower routes
        (S19) and is not accepted here.
    SignalTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/components/schemas/SignalType'
      description: At least one (S7 AC-2, Q-S7-1); an empty list gets 400 `common.invalid_request` with pointer `/signal_types`.
    RouteReasonCode:
      type: string
      enum:
      - routing.account_inactive
      - routing.source_revoked
      - routing.platform_unbound
      - routing.automation_not_accepted
      - routing.copy_not_accepted
      - routing.connection_disconnected
      - routing.out_of_sync
      - routing.risk_blocked
      - routing.no_bracket_profile
      - routing.route_disabled
      description: 'Why a route does not (fully) receive now. The same codes are used in the audit of each skipped

        instruction (ADR-0003 §4.1), except `routing.source_revoked`, `routing.platform_unbound`,

        `routing.connection_disconnected` and `routing.route_disabled`, which describe configuration or

        connection state (no instruction is routed, so none is skipped per account).

        New codes may be added in a minor version; clients show a generic text for an unknown code.

        '
    RouteReason:
      type: object
      additionalProperties: false
      required:
      - code
      - blocks
      properties:
        code:
          $ref: '#/components/schemas/RouteReasonCode'
        blocks:
          type: string
          enum:
          - all_actions
          - entries_only
          description: '`entries_only` for out-of-sync, risk blocks and a missing stop/target profile (exits still go

            through, S7 AC-8 / P1; `routing.no_bracket_profile` is provisional, Q43);

            `all_actions` for everything else (a paused or disabled account receives no exit either).

            '
        lifecycle_state:
          description: With `routing.account_inactive` (`paused` or `disabled`), so the text can name it.
          type: string
          enum:
          - paused
          - disabled
        opt_in_state:
          description: With `routing.automation_not_accepted` / `routing.copy_not_accepted`, so the UI can say "declined"
            or "pending".
          type: string
          enum:
          - declined
          - pending_review
      allOf:
      - if:
          properties:
            code:
              const: routing.account_inactive
        then:
          required:
          - lifecycle_state
        else:
          not:
            required:
            - lifecycle_state
      - if:
          properties:
            code:
              enum:
              - routing.automation_not_accepted
              - routing.copy_not_accepted
        then:
          required:
          - opt_in_state
        else:
          not:
            required:
            - opt_in_state
    RouteStatus:
      type: object
      additionalProperties: false
      required:
      - status
      - reasons
      - computed_at
      description: Computed by the Core from the account, source, connection, opt-in, sync and risk state; the UI renders
        it and never re-implements a gate.
      properties:
        status:
          type: string
          enum:
          - receiving
          - exits_only
          - not_receiving
          description: '`receiving` = no reason; `exits_only` = only `entries_only` reasons; `not_receiving` = at least

            one `all_actions` reason.

            '
        reasons:
          type: array
          description: Every reason that applies, most severe first (the Core's order follows the UI badge priority); empty
            with `receiving`.
          items:
            $ref: '#/components/schemas/RouteReason'
        computed_at:
          $ref: '#/components/schemas/Timestamp'
    Route:
      type: object
      additionalProperties: false
      required:
      - id
      - source_id
      - account_id
      - signal_types
      - is_enabled
      - effective
      - row_version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
        effective:
          $ref: '#/components/schemas/RouteStatus'
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    RouteList:
      type: object
      additionalProperties: false
      required:
      - routes
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    RouteCreateRequest:
      type: object
      additionalProperties: false
      required:
      - source_id
      - account_id
      - signal_types
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
          description: Defaults to true.
    RouteUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - signal_types
      - is_enabled
      - row_version
      properties:
        signal_types:
          $ref: '#/components/schemas/SignalTypes'
        is_enabled:
          type: boolean
        row_version:
          type: integer
          minimum: 1
    RouteCandidate:
      type: object
      additionalProperties: false
      required:
      - account_id
      - blocking_reasons
      - status_if_routed
      properties:
        account_id:
          $ref: '#/components/schemas/Uuid'
        blocking_reasons:
          type: array
          description: 'Empty → selectable. Otherwise the option is shown disabled with these reasons, most severe

            first. Only `routing.automation_not_accepted` (automated source) and `routing.platform_unbound`

            (provisional, Q37) block creation; every other reason only affects `status_if_routed`.

            '
          items:
            $ref: '#/components/schemas/RouteReason'
        status_if_routed:
          description: The status a new enabled route would have now (e.g. `exits_only` for an out-of-sync account).
          $ref: '#/components/schemas/RouteStatus'
    RouteCandidates:
      type: object
      additionalProperties: false
      required:
      - source_id
      - candidates
      - manual_only
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        candidates:
          type: array
          description: Sorted by account `display_name`.
          items:
            $ref: '#/components/schemas/RouteCandidate'
        manual_only:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - account_id
            - reason
            properties:
              account_id:
                $ref: '#/components/schemas/Uuid'
              reason:
                description: The preset's own explanation (S16 AC-7); the preset text wins over UI copy.
                $ref: '#/components/schemas/LocalizedText'
    RouteChangedEvent:
      type: object
      additionalProperties: false
      required:
      - type
      - at
      - route_id
      - source_id
      - account_id
      description: A route was created, changed or removed (any tab); the client refetches `listRoutes`. Status changes caused
        by account or connection state arrive as `account.changed` / `connection.status_changed`.
      properties:
        type:
          const: route.changed
        at:
          $ref: '#/components/schemas/Timestamp'
        route_id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
