        evaluation_start:
          type: string
          format: date
          description: Prop accounts in an evaluation phase (S13b).
        evaluation_earned_before:
          $ref: '#/components/schemas/MoneyAmount'
        has_open_position:
          type: boolean
          description: Last known from the platform (gateway); false when unbound. Used for the lifecycle and delete messages.
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          description: Only in the idempotent replay of a create whose account was archived since; every other read of an
            archived account is 404.
