      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                locale:
                  $ref: '#/components/schemas/Locale'
                time_zone:
                  $ref: '#/components/schemas/TimeZone'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          description: '`me.invalid_time_zone`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/security:
    get:
      tags:
      - me
      operationId: getMySecurity
      responses:
        '200':
          description: Channels, current session and any pending channel change, for the settings page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityState'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me/devices:
    get:
      tags:
      - me
      operationId: listDevices
      responses:
        '200':
          description: Browsers that signed in to this account and are not revoked.
          content:
            application/json:
              schema:
                type: array
