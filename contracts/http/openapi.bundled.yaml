        source_id:
          $ref: '#/components/schemas/Uuid'
        source_name:
          type: string
          minLength: 1
          maxLength: 60
        source_key_id:
          type: string
          pattern: ^[A-Za-z0-9]{12}$
        signal_type:
          $ref: '#/components/schemas/AuditSignalType'
        action:
          type: string
          enum:
