          $ref: '#/components/schemas/DistanceValue'
      responses:
        '200':
          description: The equivalents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEquivalents'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DistanceRejected'
        '500':
