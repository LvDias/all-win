    pointer: /responses/200/content/application~1json/schema/properties/pending_channel_change/allOf
    reason: "the Core generator (utoipa) cannot express if/then; the handler always sends hold_until with status on_hold (tested in identity-infra http handlers: on_hold_changes_always_carry_hold_until). Remove when the generator can emit allOf if/then."
