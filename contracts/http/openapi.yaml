openapi: 3.1.0
info:
  title: All Win HTTP API
  version: 5.1.1
  description: |
    Canonical, spec-first HTTP contract (ADR-0002 §4). Owner: Software Architect.
    Covers V1-S1 (TradingView webhook ingress), V1-S3 (passwordless sign-in by one-time code, invitations,
    sessions, devices, channel changes, sources, NinjaTrader connections and pairing) in this root, and in
    `modules/*.yaml` (Compasso): V1-S5 accounts and opt-ins (`accounts`), the V1-S16 prop firm catalog and
    the account's preset (`presets`), V1-S7 routing (`routing`), V1-S6 stop/target profiles (`profiles`), V1-S10
    activity (`audit`), V1-S13 risk (`risk`) and V1-S18
    notifications (`notifications`; codes in contracts/notifications/v1/registry.json) and V1-S21 trades
    (`trades`), V1-S22 performance (`performance`). 3.0.0 is the first consumable release of the modules; 2.1.0–2.5.0 were never merged or
    deployed. Security rules: auth-and-session-policy.md rev. 2.
    Version 2.0.0 is breaking (password and TOTP removed). Paths stay `/api/v1`: no version was ever deployed
    and there are no external clients, so the path major moves only for breaking changes after the first
    production deploy (ADR-0002 §4).
    The Core generates its own spec from handlers (utoipa); CI fails on any drift from this file.

    Conventions
    - Base paths: `/api/v1` (web, cookie session), `/ingress/v1` (webhooks), `/adapter/v1` (plugin HTTP;
      the WebSocket `/adapter/v1` is specified by ADR-0004 and contracts/adapter-protocol/v1).
    - Authentication: the root `security` requires a full `session` for every operation. Public
      operations declare `security: []`. There are no passwords: a session starts only from a one-time code
      (`verifyLoginCode`, `completeSignup`).
      Every session operation answers 401 `auth.unauthenticated` without a valid session.
    - JSON only (`application/json; charset=utf-8`), except the ingress which also accepts `text/plain`.
    - Decimals are strings; timestamps are RFC 3339 UTC with `Z`; ids are lowercase UUIDs.
    - Errors: `{"error": {"code": "<stable.code>", ...}}`. Clients translate codes; never rely on text.
      - Any `/api/v1` or `/adapter/v1` request that does not match its schema (malformed JSON, unknown or
        missing property, pattern/length/enum violation, malformed or missing path, query or header
        parameter) gets 400 `common.invalid_request` with `error.pointer` (JSON pointer to the first
        offending field; `/path/<name>`, `/query/<name>` or `/header/<name>` for parameters, e.g.
        `/header/Idempotency-Key`). Framework default error bodies are never sent.
      - Unexpected failures get 500 `common.internal` with no detail (no path, query, stack or SQL).
      - The ingress is the exception: its token and path-parameter violations are always the empty 404
        (S1 AC-2), and its body errors use the `ingress.*` codes.
    - CSRF: state-changing `/api/v1` requests (POST, PUT, PATCH, DELETE), public ones included, require
      `SameSite=Lax` cookies plus a strict `Origin` check (must equal the app origin); a missing or
      different `Origin` gets 403 `common.forbidden_origin`. The rule does not apply to `/ingress/v1`
      (TradingView sends no `Origin`) nor to `/adapter/v1` (the plugin is not a browser).
    - Sensitive operations are marked `x-step-up: true`, or `x-step-up: conditional` with the condition
      in `x-step-up-when`. Every such operation is POST or PUT, and its JSON body has an optional `step_up`
      property (`StepUpProof`: `challenge_id` + `code`). The client first calls `requestStepUp` for that
      action and target; one code authorizes one action (auth policy §6). Missing proof → 403
      `auth.step_up_required`; a wrong, expired, used or mismatched proof → 403 `auth.code_invalid`.
      The proof travels in the body, never in a header, so access logs cannot record it.
    - One-time codes: every verification failure is the single `auth.code_invalid` (401 when signing in or up,
      403 on an authenticated operation); code requests always answer 202 (auth policy §3).
    - Check precedence (first failure wins): 401 `auth.unauthenticated` → 403 `common.forbidden_origin`
      → 403 `auth.forbidden` (admin operations, non-admin caller) → 400 `common.invalid_request` →
      404 `common.not_found` → 403 `auth.step_up_required` / `auth.code_invalid` → operation-specific 409/422.
      A non-admin therefore never sees `auth.step_up_required` on an admin operation.
    - Secrets (session and device cookies, ingress token, invitation tokens, one-time codes, challenge
      tokens, pairing codes, device tokens) are never logged; e-mail addresses and phone numbers are masked (ADR-0001 §5, auth policy §3). One-time values are
      returned exactly once.
    - Response headers (ADR-0001 §9): every Core response (`/api`, `/ingress`, `/adapter`) carries
      `X-Content-Type-Options: nosniff` and `Cache-Control: no-store`. Responses that carry a one-time
      secret also declare `Cache-Control` explicitly. HSTS is set by Caddy; page headers (CSP etc.) by Next.js.
    - Rate-limited responses are 429 with a `Retry-After` header (seconds).
    - Audit: every automatic action and every security-relevant change is written to the affected
      user's visible audit log with its reason. Admin actions on a user are written to **that user's**
      audit log, with the acting admin's id.
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost
security:
  - session: []
tags:
  - name: ingress
  - name: auth
  - name: me
  - name: admin
  - name: sources
  - name: connections
  - name: pairing
  - name: events
  - name: accounts
  - name: presets
  - name: routing
  - name: profiles
  - name: audit
  - name: risk
  - name: notifications
  - name: trades
  - name: performance

paths:
  /ingress/v1/tradingview/{token}:
    post:
      tags: [ingress]
      operationId: ingressTradingView
      summary: Receive a TradingView alert (V1-S1)
      description: |
        Processing order (ADR-0003 §7; full table in docs/architecture/contracts/s1-webhook-ingest.md §2):
        per-IP flood cap (higher cap for TradingView ranges) → authenticate token (failures charge a per-IP failure
        budget; valid tokens are never refused by it) → per-key rate limit → content type and size → parse →
        credential guard → validate against instruction schema v1 → apply source policy (ADR-0003 §6) → insert with
        UNIQUE (user_id, message_id) → respond. Routing is asynchronous after commit. Every response must
        be produced well under TradingView's ~3 s timeout. The whole path after `/ingress/` is treated as
        a secret and never logged (ADR-0001 §5, s1 notes §4). No `Origin` check applies here.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: |
            Source token `awk_<key_id>_<secret>`. Malformed, over-long or otherwise invalid values get the
            same empty 404 as unknown tokens, never a 400 (S1 AC-2).
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        description: The standard instruction (contracts/instruction/v1). Maximum 16 KiB, UTF-8.
        content:
          application/json:
            schema:
              $ref: '../instruction/v1/instruction.schema.json'
          text/plain:
            schema:
              type: string
              maxLength: 16384
              description: Parsed as JSON and validated exactly like application/json.
      responses:
        '200':
          description: Accepted, or duplicate (nothing re-executed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressAccepted'
              examples:
                accepted:
                  value: { status: accepted, instruction_id: 0192b3c4-0000-7000-8000-000000000006 }
                duplicate:
                  value: { status: duplicate, instruction_id: 0192b3c4-0000-7000-8000-000000000006 }
        '400':
          description: '`ingress.invalid_json`, `ingress.schema_violation` (with JSON pointer), `ingress.unsupported_version` (pointer `/schema_version`; a minor newer than the Core supports). A body string shaped like an All Win token (`aw[kd]_…`) gives `ingress.schema_violation` with an empty pointer; the body is not stored or logged.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressRejected' }
              examples:
                schema:
                  value: { status: rejected, error: { code: ingress.schema_violation, pointer: /quantity } }
        '404':
          description: |
            Unknown, revoked, malformed or over-long token, and any other path or method under `/ingress`.
            Empty body; existence of user/source is never revealed. Never 400/401/405.
        '413':
          description: '`ingress.payload_too_large` (> 16 KiB).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressRejected' }
        '415':
          description: '`ingress.unsupported_media_type` (not application/json or text/plain).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressRejected' }
        '422':
          description: |
            Source policy or catalog: `ingress.action_not_allowed_for_source` (modify/cancel/reduce from
            TradingView), `ingress.order_type_not_allowed_for_source`, `ingress.signal_type_not_allowed_for_source`
            (`signal_type` not allowed for TradingView, e.g. `master_account`), `ingress.source_mismatch`,
            `ingress.unsupported_instrument` (symbol not enabled in the instrument catalog, S1 AC-7).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressRejected' }
        '429':
          description: '`ingress.rate_limited`: per-IP flood cap, per-IP token-failure budget (failures only), or per-key limit. Header `Retry-After`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressRejected' }
        '500':
          description: '`common.internal`. The body never contains the path, the token or the request.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressRejected' }

  /api/v1/auth/login/challenges:
    post:
      tags: [auth]
      operationId: requestLoginCode
      summary: Request a sign-in code on a channel (always 202; auth policy §3)
      description: |
        Always answers 202 with a fresh sealed `challenge_id`, whether or not the e-mail is registered,
        active, or has the chosen channel; nothing is sent in those cases. Response and timing are identical:
        delivery runs after the response (auth policy §2.3). Send limits are keyed by the identifier HMAC and
        device class and behave the same for unknown identifiers (§4); over a limit → 429 with `Retry-After`.
        The login screen always shows the same text and never reports a delivery failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, channel]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                channel: { $ref: '#/components/schemas/CodeChannel' }
      responses:
        '202':
          description: Challenge issued (a code may or may not have been sent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeIssued' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/login/verify:
    post:
      tags: [auth]
      operationId: verifyLoginCode
      summary: Sign in with the code of a login challenge
      description: |
        On success starts a session (`__Host-aw_session`) and, when the browser has no valid device cookie of
        this user, issues `__Host-aw_device` and sends the new-device e-mail notice (auth policy §5.2–§5.3).
        Every failure (wrong, expired, used, invalidated after 5 wrong attempts, unknown or forged challenge)
        is the single 401 `auth.code_invalid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code, remember_me]
              properties:
                challenge_id: { $ref: '#/components/schemas/ChallengeId' }
                code: { $ref: '#/components/schemas/OneTimeCode' }
                remember_me: { type: boolean }
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionAndDeviceCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/CodeInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/challenges/resend:
    post:
      tags: [auth]
      operationId: resendCode
      summary: Send a new code for an open challenge (60-s cooldown; auth policy §2.2)
      description: |
        Replaces the challenge's code; wrong attempts already made still count. A closed (expired, used,
        invalidated after 5 wrong attempts), unknown or forged challenge gets the same 202 and nothing is sent.
        **The response and the limits depend only on the sealed token and the counters, never on the code row**
        (auth policy §3): every resend of a valid token counts in the identifier and IP limits and starts the
        60-s cooldown, and the body is always `expires_at` = now + 10 min and `resend_after_s` = 60, whether
        or not a code was sent. Within the cooldown → 429 with `Retry-After`, identically for registered and
        unknown identifiers. A forged token counts only in the IP limits.
        A `step_up` or `channel_change` challenge is resent only for the session that created it.
      security: [{ session: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id: { $ref: '#/components/schemas/ChallengeId' }
      responses:
        '202':
          description: Accepted (a code may or may not have been sent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeIssued' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/challenges/delivery:
    post:
      tags: [auth]
      operationId: getChallengeDelivery
      summary: Delivery state of a sign-up, step-up or channel-change code (never for login)
      description: |
        Lets the client offer another channel when a delivery failed (auth policy §2.3, S3b AC-5).
        - `login` challenges, closed, unknown or forged challenges, and challenges of another session always
          answer `not_reported`.
        - A send suppressed because the new value belongs to another account answers `sent`, exactly like a
          real send (§3).
      security: [{ session: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id: { $ref: '#/components/schemas/ChallengeId' }
      responses:
        '200':
          description: Delivery state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [delivery]
                properties:
                  delivery: { type: string, enum: [pending, sent, failed, not_reported] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session (server-side)
      description: Idempotent. Accepts a session or none; answers 204 to every same-origin request. The device cookie is kept.
      security: [{ session: [] }, {}]
      responses:
        '204':
          description: Session ended; session cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookieClear' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/logout-everywhere:
    post:
      tags: [auth]
      operationId: signOutEverywhere
      summary: Sair de todos os dispositivos — end every session and revoke every device (no step-up)
      description: |
        Ends every session of the user, including the current one (`session.ended` reason
        `signed_out_everywhere`), and revokes all devices; the next sign-in from any browser is a new device.
        Source tokens and pairings are not touched; the client then shows them with their revoke/unpair
        actions (auth policy §5.3). Audited.
      responses:
        '204':
          description: Done; session and device cookies cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionAndDeviceCookiesClear' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/step-up:
    post:
      tags: [auth]
      operationId: requestStepUp
      summary: Request a step-up code for one sensitive action (auth policy §6)
      description: |
        Sends a `step_up` code bound to this session, the `action` and the `target_id`. The action request then
        carries `step_up: { challenge_id, code }` in its body (schema `StepUpProof`); the code authorizes that
        one action only (Q30 a: every action asks a new code).
        - `target_id` is **required** for `source_rotate`, `pairing_code_new`, `connection_unpair`,
          `account_opt_in_accept`, `route_enable` and `account_binding_change`, and **forbidden** for the other
          actions; a violation → 400
          `common.invalid_request` with pointer `/target_id`.
        - A target that does not exist or belongs to another user → 404 `common.not_found`; no code is sent and
          nothing is counted against the user's send limit.
        - `admin_invitation_create` from a non-admin → 403 `auth.forbidden`, no code sent (same precedence as
          admin operations).
        - 422 `auth.channel_unavailable`: the user has no confirmed value for `channel`.
        - 422 `auth.step_up_channel_not_allowed`: the policy requires another channel for this action on this
          device (auth policy §6.2 M3, if adopted; the client then offers e-mail).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, channel]
              properties:
                action: { $ref: '#/components/schemas/StepUpAction' }
                target_id:
                  description: Required for source_rotate, pairing_code_new, connection_unpair, account_opt_in_accept, route_enable, account_binding_change; forbidden otherwise.
                  $ref: '#/components/schemas/Uuid'
                channel: { $ref: '#/components/schemas/CodeChannel' }
      responses:
        '202':
          description: Code sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeIssued' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`auth.channel_unavailable` or `auth.step_up_channel_not_allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/invitations/lookup:
    post:
      tags: [auth]
      operationId: lookupInvitation
      summary: Read an invitation before signing up
      description: |
        The token travels in the request body, never in a URL path or query. Invitation links use a
        URL fragment (`/{locale}/invite#t=<token>`), which browsers never send to servers, so the token
        cannot reach Caddy, Next.js or Core logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenBody' }
      responses:
        '200':
          description: Valid invitation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, expires_at]
                properties:
                  email: { type: string, format: email }
                  locale: { $ref: '#/components/schemas/Locale' }
                  expires_at: { $ref: '#/components/schemas/Timestamp' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/InvitationInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/signup/challenges:
    post:
      tags: [auth]
      operationId: startSignup
      summary: Send the sign-up code to the invited e-mail (S3 AC-1/AC-2)
      description: |
        Nothing is created yet: the account exists only when the code is confirmed (`completeSignup`). An
        abandoned sign-up leaves the invitation usable until it expires. Sign-up is e-mail only (Q31 a,
        pending); WhatsApp is added later as a channel change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenBody' }
      responses:
        '202':
          description: Code sent to the invited e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeIssued' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/InvitationInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/signup/verify:
    post:
      tags: [auth]
      operationId: completeSignup
      summary: Confirm the sign-up code; create the account and sign in
      description: |
        Creates the user (e-mail confirmed), consumes the invitation, and starts the first session with its
        device cookie. The sign-up session sends no new-device notice (S3 AC-9). An invitation that closed
        after `startSignup` (expired, revoked, already used, including a concurrent confirmation) invalidates
        its code, so every failure here is 401 `auth.code_invalid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code, locale, time_zone, remember_me]
              properties:
                challenge_id: { $ref: '#/components/schemas/ChallengeId' }
                code: { $ref: '#/components/schemas/OneTimeCode' }
                locale: { $ref: '#/components/schemas/Locale' }
                time_zone: { $ref: '#/components/schemas/TimeZone' }
                remember_me: { type: boolean }
      responses:
        '201':
          description: Account created; session started.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionAndDeviceCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/CodeInvalid' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '422':
          description: '`me.invalid_time_zone`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        '200':
          description: Signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update profile preferences (locale, time zone; Q23)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
                time_zone: { $ref: '#/components/schemas/TimeZone' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '422':
          description: '`me.invalid_time_zone`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/security:
    get:
      tags: [me]
      operationId: getMySecurity
      responses:
        '200':
          description: Channels, current session and any pending channel change, for the settings page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/devices:
    get:
      tags: [me]
      operationId: listDevices
      responses:
        '200':
          description: Browsers that signed in to this account and are not revoked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/devices/{device_id}/forget:
    post:
      tags: [me]
      operationId: forgetDevice
      summary: Forget a device — revokes it and ends its sessions (no step-up)
      description: |
        Ends the sessions bound to that device (`session.ended` reason `device_revoked`). Its cookie then counts
        as none: the next sign-in from that browser is a new device (auth policy §5.2). Idempotent. Audited.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/channel-changes:
    post:
      tags: [me]
      operationId: startChannelChange
      summary: Start changing the e-mail or adding/changing WhatsApp (codes to the current and the new value; S3 AC-11)
      description: |
        Sends one code to the **current** value of that channel (for a first WhatsApp: to the e-mail) and one
        to the **new** value, under one flow (auth policy §7). After S3b, when the user has another confirmed
        channel, a third code goes to it ([Proposed] §7). The change applies only when every code is confirmed
        within 10 minutes; until then the current value stays in force.
        - If the new value belongs to another account nothing reveals it: its code is not sent, its delivery
          reads `sent`, and its verification fails with `auth.code_invalid` (§3).
        - 409 `me.channel_change_too_soon`: a change completed less than 24 h ago.
        - 409 `me.channel_change_pending`: another change is open or on hold.
        - 422 `me.channel_unchanged`: the new value equals the current one.
        - 422 `auth.channel_unavailable`: WhatsApp is not offered yet (S3b).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, new_value]
              properties:
                channel: { $ref: '#/components/schemas/CodeChannel' }
                new_value:
                  type: string
                  maxLength: 254
                  description: An e-mail address for `email`; an E.164 number (`+5511…`) for `whatsapp`.
      responses:
        '202':
          description: Codes sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelChange' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '409':
          description: '`me.channel_change_too_soon` or `me.channel_change_pending`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`me.channel_unchanged`, `auth.channel_unavailable`, or `me.invalid_channel_value` (pointer `/new_value`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/channel-changes/{change_id}/verify:
    post:
      tags: [me]
      operationId: verifyChannelChangeCode
      summary: Confirm one code of a channel change
      description: |
        When the last code is confirmed the change either completes (`completed`: the value is replaced, other
        sessions end with reason `channel_changed`, the current session is rotated, notices go to the old value
        and the other channel) or goes `on_hold` until `hold_until` (auth policy §9 hold, and §7 M2 if adopted),
        cancellable with `cancelChannelChange`.
      parameters:
        - { $ref: '#/components/parameters/ChangeId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code]
              properties:
                challenge_id: { $ref: '#/components/schemas/ChallengeId' }
                code: { $ref: '#/components/schemas/OneTimeCode' }
      responses:
        '200':
          description: Updated state of the change.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelChange' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CodeInvalidOrOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`me.channel_change_closed` (expired, cancelled or completed).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/channel-changes/{change_id}/cancel:
    post:
      tags: [me]
      operationId: cancelChannelChange
      summary: Cancelar troca — cancel an open or on-hold channel change from any session of the user
      description: |
        Explicit action; signing in does not cancel. Audited, with notices to every channel. A new change
        requested after a cancellation raises an admin alert (auth policy §9). Idempotent on a cancelled change.
      parameters:
        - { $ref: '#/components/parameters/ChangeId' }
      responses:
        '204': { description: Cancelled. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`me.channel_change_closed` (already completed or expired).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/invitations:
    get:
      tags: [admin]
      operationId: listInvitations
      responses:
        '200':
          description: All invitations (small list in V1; no pagination).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin]
      operationId: createInvitation
      summary: Issue an invitation bound to one e-mail (Q19; step-up); link returned once
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, locale]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                locale: { $ref: '#/components/schemas/Locale' }
                send_email: { type: boolean, default: true }
                step_up: { $ref: '#/components/schemas/StepUpProof' }
      responses:
        '201':
          description: Created. `invite_url` (fragment form) is returned only here.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation, invite_url, email_sent]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  invite_url: { type: string, description: 'https://<host>/<locale>/invite#t=<token>' }
                  email_sent: { type: boolean, description: False when e-mail is disabled or failed (`invites.email_send_failed` is then logged); the admin delivers the link manually. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrStepUp' }
        '409':
          description: '`invites.email_taken` (a user or an open invitation already exists for this e-mail; admin-only screen).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/invitations/{invitation_id}/revoke:
    post:
      tags: [admin]
      operationId: revokeInvitation
      parameters:
        - { $ref: '#/components/parameters/InvitationId' }
      responses:
        '204': { description: Revoked (idempotent). }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      responses:
        '200':
          description: Identity fields only; no trading data.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sources:
    get:
      tags: [sources]
      operationId: listSources
      parameters:
        - name: include_revoked
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Sources of the signed-in user. Never contains a full token.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [sources]
      operationId: createSource
      summary: Create a named source; webhook URL returned once (S3 AC-3, Q17; step-up)
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, source_type]
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
                source_type: { type: string, enum: [tradingview] }
                step_up: { $ref: '#/components/schemas/StepUpProof' }
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceWithUrl' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/StepUpFailed' }
        '409':
          description: '`sources.name_taken` (case-insensitive, among active sources).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sources/{source_id}:
    patch:
      tags: [sources]
      operationId: renameSource
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`sources.name_taken`, or `sources.revoked` (a revoked source keeps its name for history).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sources/{source_id}/rotate:
    post:
      tags: [sources]
      operationId: rotateSource
      summary: Replace the token immediately (old URL stops working at once; step-up)
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpBody' }
      responses:
        '200':
          description: New URL returned once.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceWithUrl' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/StepUpFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`sources.revoked` (a revoked source cannot be rotated).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sources/{source_id}/revoke:
    post:
      tags: [sources]
      operationId: revokeSource
      summary: Revoke the source; it stays listed as revoked (no step-up; revoking reduces risk)
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      responses:
        '204': { description: Revoked (idempotent). Subsequent webhooks with its token get 404. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      parameters:
        - name: include_unpaired
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: NinjaTrader connections of the signed-in user. Device tokens are never returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection and its first pairing code (step-up)
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
                step_up: { $ref: '#/components/schemas/StepUpProof' }
      responses:
        '201':
          description: Created, awaiting pairing.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connection, pairing]
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
                  pairing: { $ref: '#/components/schemas/PairingCode' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/StepUpFailed' }
        '409':
          description: '`connections.name_taken` (case-insensitive, among the user''s connections that are not unpaired).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/connections/{connection_id}:
    patch:
      tags: [connections]
      operationId: renameConnection
      parameters:
        - { $ref: '#/components/parameters/ConnectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`connections.name_taken`, or `connections.unpaired` (an unpaired connection is kept read-only for history).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/connections/{connection_id}/pairing-code:
    post:
      tags: [connections]
      operationId: newPairingCode
      summary: New pairing code (expired code, or "move to another machine"; step-up)
      description: |
        Invalidates any previous active code. For a paired connection this is the re-pairing flow:
        the current instance keeps working until the new code is used; then its device token is revoked
        (WebSocket close 4002). Account bindings follow the connection by `platform_account` name
        (ADR-0004 §8 "Re-pairing"); accounts not reported by the new instance become out of sync with
        reason `sync.account_not_found_after_repair`.
      x-step-up: conditional
      x-step-up-when: Core setting step_up.q35_persistence_actions is on (pending the user's Q35; default on)
      parameters:
        - { $ref: '#/components/parameters/ConnectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpBody' }
      responses:
        '201':
          description: New code.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/StepUpFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`connections.unpaired` (an unpaired connection cannot get a code; create a new one).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/connections/{connection_id}/unpair:
    post:
      tags: [connections]
      operationId: unpairConnection
      summary: Unpair (Q18) — revokes the device token; mapped accounts become out of sync; nothing is closed (step-up)
      x-step-up: true
      parameters:
        - { $ref: '#/components/parameters/ConnectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acknowledge_open_positions]
              properties:
                acknowledge_open_positions:
                  type: boolean
                  description: Must be true when any mapped account has an open position (design S3-10 checkbox).
                step_up: { $ref: '#/components/schemas/StepUpProof' }
      responses:
        '204': { description: Unpaired; WebSocket closed with 4002; audited. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/StepUpFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`connections.open_positions_not_acknowledged` (body lists nothing sensitive; the client re-reads the connection).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /adapter/v1/pairings:
    post:
      tags: [pairing]
      operationId: pairAdapter
      summary: Exchange a pairing code for a device token (called by the plugin; ADR-0004 §8)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_code, instance_id, instance_name, adapter]
              properties:
                pairing_code:
                  type: string
                  maxLength: 16
                  description: 8 Crockford Base32 characters; case, spaces and hyphens ignored; O→0, I/L→1.
                instance_id: { $ref: '#/components/schemas/Uuid' }
                instance_name: { type: string, minLength: 1, maxLength: 64 }
                adapter:
                  type: object
                  additionalProperties: false
                  required: [type, version, build]
                  properties:
                    type: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
                    version: { type: string, maxLength: 32 }
                    build: { type: string, enum: [release, development] }
      responses:
        '201':
          description: Paired. `device_token` is returned exactly once; the plugin stores it with DPAPI.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connection_id, device_token]
                properties:
                  connection_id: { $ref: '#/components/schemas/Uuid' }
                  device_token: { type: string, pattern: '^awd_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$' }
        '400':
          description: |
            `pairing.invalid_code` — one code for unknown, expired, used or superseded (plugin shows one
            message); or `common.invalid_request` with `pointer` when the body does not match the schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '426':
          description: '`pairing.adapter_version_unsupported`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`pairing.rate_limited` (per-IP and per-prefix limits, ADR-0004 §8; there is no global lock, U11). Header `Retry-After`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/events:
    get:
      tags: [events]
      operationId: eventStream
      summary: Server-Sent Events stream for the signed-in user
      description: |
        `text/event-stream`. Each event has `event: <type>` and `data: <JSON>` matching
        `#/components/schemas/Event`. Does NOT extend the idle session timeout. On session end the
        server sends `session.ended` and closes the stream. Events carry no SSE `id` and are not
        replayed in V1: after every (re)connect the client refetches the state it displays (sources,
        connections) and then applies events whose `at` is newer than what it holds.
      responses:
        '200':
          description: Stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  # V1-S5 (module accounts) and the S5 part of the S16 catalog (module presets); owner Compasso.
  /api/v1/accounts: { $ref: 'modules/accounts.yaml#/paths/~1api~1v1~1accounts' }
  /api/v1/accounts/{account_id}: { $ref: 'modules/accounts.yaml#/paths/~1api~1v1~1accounts~1{account_id}' }
  /api/v1/accounts/{account_id}/archive-impact: { $ref: 'modules/accounts.yaml#/paths/~1api~1v1~1accounts~1{account_id}~1archive-impact' }
