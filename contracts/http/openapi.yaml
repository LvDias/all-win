components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aw_session
      description: Server-side session (HttpOnly; Secure; SameSite=Lax; Path=/).

  headers:
    RetryAfter:
      description: Seconds to wait.
      schema: { type: integer, minimum: 1 }
    SessionCookie:
      description: '`__Host-aw_session=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/` (Max-Age only when remember_me).'
      schema: { type: string }
    SessionCookieClear:
      description: Expires the session cookie.
      schema: { type: string }
    SessionAndDeviceCookies:
      description: |
        `__Host-aw_session` (as SessionCookie) and, when the browser has no valid device cookie of this user,
        `__Host-aw_device=<256-bit random>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=34560000` (400 days;
        auth policy §5.2). Only an unknown or revoked value is replaced. A value that is valid for **another**
        user of the same browser is kept, and this user gets their own device row with the same value, so a
        shared browser stays a known device for each of its users.
      schema: { type: string }
    SessionAndDeviceCookiesClear:
      description: Expires the session and device cookies.
      schema: { type: string }
    NoStore:
      description: The response carries a one-time secret; no cache may store it.
      schema: { type: string, const: no-store }

  parameters:
    InvitationId: { name: invitation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    UserId: { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SourceId: { name: source_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ConnectionId: { name: connection_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AccountId: { name: account_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DeviceId: { name: device_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ChangeId: { name: change_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }

  responses:
    Unauthenticated:
      description: '`auth.unauthenticated` (no session, or expired). Web redirects to sign-in with `?reason=session_expired`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`auth.rate_limited`.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StepUpFailed:
      description: |
        `auth.step_up_required` (the body has no `step_up` proof: call `requestStepUp`, then retry with
        `step_up: { challenge_id, code }`), `auth.code_invalid` (the proof is wrong, expired, used, bound to
        another session, action or target: one code for all), or `common.forbidden_origin`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing:
              value: { error: { code: auth.step_up_required } }
            invalid:
              value: { error: { code: auth.code_invalid } }
    CodeInvalid:
      description: '`auth.code_invalid` — wrong, expired, used, invalidated after 5 wrong attempts, unknown or forged challenge (one code for all; auth policy §3).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CodeInvalidOrOrigin:
      description: '`auth.code_invalid` (as CodeInvalid) or `common.forbidden_origin`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`auth.forbidden` (not a platform admin); or `common.forbidden_origin` on state-changing requests.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenOrStepUp:
      description: |
        `auth.forbidden` (not a platform admin; checked first, so a non-admin never gets a step-up prompt),
        `auth.step_up_required`, `auth.code_invalid` (as StepUpFailed), or `common.forbidden_origin`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenOrigin:
      description: '`common.forbidden_origin` — state-changing `/api/v1` request without a matching `Origin` header.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: '`common.invalid_request` — the request does not match its schema; `error.pointer` locates the first offending field.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            body:
              value: { error: { code: common.invalid_request, pointer: /name } }
            path:
              value: { error: { code: common.invalid_request, pointer: /path/source_id } }
    InternalError:
      description: '`common.internal` — unexpected failure; the body carries no detail.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`common.not_found` — also returned for resources of another user (never 403, so existence is not revealed).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvitationInvalid:
      description: '`auth.invitation_invalid` — one code for unknown, used, expired or revoked.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Timestamp:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    Locale:
      type: string
      enum: [pt-BR, en]
    TimeZone:
      type: string
      description: IANA time zone name, validated by the Core against its tz database.
      pattern: '^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$'
      maxLength: 64
    DisplayName:
      type: string
      minLength: 1
      maxLength: 60
    TokenBody:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 128 }
    ErrorCode:
      type: string
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            pointer: { type: string, maxLength: 256, description: JSON pointer to the offending request field. }
            retry_after_s: { type: integer, minimum: 1 }
            current_rule_version_id: { $ref: '#/components/schemas/Uuid' }
    IngressAccepted:
      type: object
      additionalProperties: false
      required: [status, instruction_id]
      properties:
        status: { type: string, enum: [accepted, duplicate] }
        instruction_id: { $ref: '#/components/schemas/Uuid' }
    IngressRejected:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status: { type: string, const: rejected }
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            pointer: { type: string, maxLength: 256 }
    Me:
      type: object
      additionalProperties: false
      required: [id, email, locale, time_zone, is_platform_admin]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        locale: { $ref: '#/components/schemas/Locale' }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        is_platform_admin: { type: boolean }
    LoginResult:
      type: object
      additionalProperties: false
      required: [user, new_device]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        new_device: { type: boolean, description: True when this sign-in registered a new device (the notice e-mail was sent; never on sign-up). }
    CodeChannel:
      type: string
      enum: [email, whatsapp]
      description: '`whatsapp` is accepted by the schema from 2.0.0 and becomes usable with S3b (U17).'
    ChallengeId:
      type: string
      description: Sealed challenge token (auth policy §3); opaque to clients. Never logged.
      pattern: '^[A-Za-z0-9_-]{16,256}$'
    OneTimeCode:
      type: string
      description: |
        The code as typed. The Core normalizes it per the code format (U16; format 1: trim, drop spaces and `-`,
        uppercase, O→0, I/L→1, then exactly 8 Crockford Base32 characters). Within 32 characters, non-ASCII or
        malformed input is a wrong attempt (`auth.code_invalid`); more than 32 characters is 400
        `common.invalid_request`, which counts no attempt and reveals nothing. Never logged.
      minLength: 1
      maxLength: 32
    ChallengeIssued:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, resend_after_s]
      properties:
        challenge_id: { $ref: '#/components/schemas/ChallengeId' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        resend_after_s: { type: integer, minimum: 0, description: Seconds until `resendCode` is accepted (60 after a send). }
    StepUpAction:
      type: string
      description: |
        Actions that need a step-up code (auth policy §6.2). The user's three actions are
        `account_opt_in_accept` / `account_create_opt_in_accept`, `connection_unpair`, and the channel change
        (its own flow). **Included pending Q35:** `source_create`, `source_rotate`, `connection_create`,
        `pairing_code_new`, `admin_invitation_create` (the policy's security musts), `route_enable`,
        `account_binding_change` (QA Security M1/L1 on 2.4.0, same setting `step_up.q35_persistence_actions`,
        default on, conditional). The enum is a superset so it never has to change: whether those
        operations **require** the proof is a Core setting (`step_up.q35_persistence_actions`, default on),
        shown as `x-step-up: conditional`. The setting is server configuration only (never an admin/UI/DB
        toggle); missing or invalid means on (fail-closed). If the user rejects them, the setting goes off and
        the values stay valid but unused. Enforcement-off / max-position values are added when Q35 decides.
        - `source_create`, `source_rotate` (target = source), `connection_create`, `pairing_code_new` (target = connection),
          `connection_unpair` (target = connection), `account_opt_in_accept` (target = account; automation or copy,
          setAccountOptIn, applyPresetVersion and the S5/S7 update operations), `account_create_opt_in_accept` (no
          target; S5 create with an accepted opt-in), `admin_invitation_create`.
        - `route_enable` (target = account; createRoute/updateRoute enabling an automated-source route to an account
          whose automation was not accepted with step-up: a real account or opt-in not_required).
        - `account_binding_change` (target = account; updateAccount changing the platform binding of an account that
          receives automation: opt-in accepted or an active automated route).
      enum: [source_create, source_rotate, connection_create, pairing_code_new, connection_unpair, account_opt_in_accept, account_create_opt_in_accept, admin_invitation_create, route_enable, account_binding_change]
    StepUpProof:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      description: Step-up proof carried in the body of a step-up operation; consumed in the action's transaction.
      properties:
        challenge_id: { $ref: '#/components/schemas/ChallengeId' }
        code: { $ref: '#/components/schemas/OneTimeCode' }
    StepUpBody:
      type: object
      additionalProperties: false
      description: Body of a step-up operation that has no other input.
      properties:
        step_up: { $ref: '#/components/schemas/StepUpProof' }
    Device:
      type: object
      additionalProperties: false
      required: [id, label, first_seen_at, last_seen_at, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string, maxLength: 128, description: 'Coarse browser and OS family from the User-Agent, e.g. "Chrome on Windows".' }
        first_seen_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
        current: { type: boolean, description: True for the device of this request. }
    ChannelChange:
      type: object
      additionalProperties: false
      required: [id, channel, status, masked_new_value, codes, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        channel: { $ref: '#/components/schemas/CodeChannel' }
        status:
          type: string
          enum: [awaiting_codes, on_hold, completed, cancelled, expired]
          description: '`on_hold` = every code confirmed, the change waits until `hold_until` (auth policy §9 hold; §7 M2 if adopted) and can be cancelled.'
        masked_new_value: { type: string, maxLength: 64 }
        codes:
          type: array
          description: One entry per code of the flow.
          items:
            type: object
            additionalProperties: false
            required: [role, challenge_id, confirmed]
            properties:
              role: { type: string, enum: [current_value, new_value, other_channel] }
              challenge_id: { $ref: '#/components/schemas/ChallengeId' }
              confirmed: { type: boolean }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        hold_until: { $ref: '#/components/schemas/Timestamp' }
      allOf:
        - if: { properties: { status: { const: on_hold } } }
          then: { required: [hold_until] }
    SecurityState:
      type: object
      additionalProperties: false
      required: [email, session, channel_change_allowed_at]
      properties:
        email: { type: string, format: email }
        whatsapp:
          type: string
          description: Confirmed WhatsApp number (E.164), absent until added (S3b).
          pattern: '^\+[1-9][0-9]{7,14}$'
        channel_change_allowed_at:
          description: When a new channel change is accepted (24 h after the last one; auth policy §7). In the past when allowed now.
          $ref: '#/components/schemas/Timestamp'
        pending_channel_change: { $ref: '#/components/schemas/ChannelChange' }
        session:
          type: object
          additionalProperties: false
          required: [persistent, idle_timeout_s, absolute_timeout_s, idle_expires_at, absolute_expires_at]
          properties:
            persistent: { type: boolean }
            idle_timeout_s: { type: integer, description: '43200 (12 h) or 604800 (7 d) — Q21.' }
            absolute_timeout_s: { type: integer, description: '86400 (24 h) or 2592000 (30 d) — Q21.' }
            idle_expires_at: { $ref: '#/components/schemas/Timestamp' }
            absolute_expires_at: { $ref: '#/components/schemas/Timestamp' }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, status, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        accepted_at: { $ref: '#/components/schemas/Timestamp' }
        revoked_at: { $ref: '#/components/schemas/Timestamp' }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, status, whatsapp_verified, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        status: { type: string, enum: [active, closed] }
        whatsapp_verified: { type: boolean }
        is_platform_admin: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_sign_in_at: { $ref: '#/components/schemas/Timestamp' }
    Source:
      type: object
      additionalProperties: false
      required: [id, name, source_type, is_automated, status, key_id, masked_url, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/DisplayName' }
        source_type: { type: string, enum: [tradingview] }
        is_automated:
          type: boolean
          description: |
            Derived by the Core from `source_type` (never stored, never set by the client): true when
            instructions from this source are subject to the per-account `automation` opt-in (O1).
            `tradingview` is automated. Clients must use this flag, not their own list of types.
        status: { type: string, enum: [active, revoked] }
        key_id: { type: string, pattern: '^[A-Za-z0-9]{12}$' }
        masked_url:
          type: string
          description: "'https://<host>/ingress/v1/tradingview/awk_<key_id>_…' — never the secret."
        created_at: { $ref: '#/components/schemas/Timestamp' }
        rotated_at: { $ref: '#/components/schemas/Timestamp' }
        revoked_at: { $ref: '#/components/schemas/Timestamp' }
        last_received_at: { $ref: '#/components/schemas/Timestamp' }
    SourceWithUrl:
      type: object
      additionalProperties: false
      required: [source, webhook_url]
      properties:
        source: { $ref: '#/components/schemas/Source' }
        webhook_url:
          type: string
          description: Full URL with the secret token. Returned only by create/rotate; never logged.
          pattern: '^https://[^/]+/ingress/v1/tradingview/awk_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$'
    PairingCode:
      type: object
      additionalProperties: false
      required: [pairing_code, expires_at]
      properties:
        pairing_code:
          type: string
          description: Display form, returned once per code.
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$'
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    VisibleAccount:
      type: object
      additionalProperties: false
      required: [platform_account, kind, oco_location]
      properties:
        platform_account: { type: string, maxLength: 128 }
        kind: { type: string, enum: [simulation, playback, live, unknown] }
        oco_location: { type: string, enum: [local, server, unknown] }
        account_id:
          description: The All Win account bound to it, if any (S5).
          $ref: '#/components/schemas/Uuid'
    Connection:
      type: object
      additionalProperties: false
      required: [id, name, status, status_changed_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/DisplayName' }
        status:
          type: string
          enum: [awaiting_pairing, connected, disconnected, outdated, unpaired]
        status_changed_at:
          description: When `status` last changed (equals `created_at` until the first change).
          $ref: '#/components/schemas/Timestamp'
        adapter_type: { type: string }
        adapter_version: { type: string }
        instance_id:
          description: Plugin instance id reported at pairing (D6). Absent until paired.
          $ref: '#/components/schemas/Uuid'
        instance_name: { type: string }
        paired_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
        pairing_code_expires_at:
          description: Present while a code is active (the code itself is never re-shown).
          $ref: '#/components/schemas/Timestamp'
        repairing_pending:
          type: boolean
          description: True while a "move to another machine" code is active and the current instance still works.
        visible_accounts:
          type: array
          items: { $ref: '#/components/schemas/VisibleAccount' }
        open_position_accounts:
          type: array
          description: Platform accounts with an open position (for the unpair confirmation).
          items: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        unpaired_at: { $ref: '#/components/schemas/Timestamp' }
        disconnect_reason: { type: string, enum: [user, network, outdated, unpaired], description: 'Why the connection is not connected (1.3 close 4100 = user). Present when status is disconnected, outdated or unpaired.' }
    Event:
      description: SSE payloads (field `data`). `type` equals the SSE `event` name; `at` is when the event happened (server clock).
      oneOf:
        - $ref: 'modules/accounts.yaml#/components/schemas/AccountChangedEvent'
        - $ref: 'modules/accounts.yaml#/components/schemas/AccountArchivedEvent'
        - $ref: 'modules/routing.yaml#/components/schemas/RouteChangedEvent'
        - $ref: 'modules/audit.yaml#/components/schemas/AuditEntryRecordedEvent'
        - $ref: 'modules/presets.yaml#/components/schemas/PresetVersionAvailableEvent'
        - $ref: 'modules/risk.yaml#/components/schemas/RiskStateChangedEvent'
        - $ref: 'modules/notifications.yaml#/components/schemas/NotificationCreatedEvent'
        - $ref: 'modules/notifications.yaml#/components/schemas/NotificationUpdatedEvent'
        - $ref: 'modules/notifications.yaml#/components/schemas/NotificationReadEvent'
        - $ref: 'modules/trades.yaml#/components/schemas/TradeCapturedEvent'
        - type: object
          additionalProperties: false
          required: [type, at, connection_id, status]
          properties:
            type: { const: connection.status_changed }
            at: { $ref: '#/components/schemas/Timestamp' }
            connection_id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [awaiting_pairing, connected, disconnected, outdated, unpaired] }
            disconnect_reason: { type: string, enum: [user, network, outdated, unpaired], description: 'Why the connection is not connected (1.3 close 4100 = user). Present when status is disconnected, outdated or unpaired.' }
        - type: object
          additionalProperties: false
          required: [type, at, connection_id, instance_name, visible_accounts]
          properties:
            type: { const: connection.paired }
            at: { $ref: '#/components/schemas/Timestamp' }
            connection_id: { $ref: '#/components/schemas/Uuid' }
            instance_name: { type: string }
            visible_accounts:
              type: array
              items: { $ref: '#/components/schemas/VisibleAccount' }
        - type: object
          additionalProperties: false
          required: [type, at, connection_id, reason]
          properties:
            type: { const: connection.pairing_code_invalidated }
            at: { $ref: '#/components/schemas/Timestamp' }
            connection_id: { $ref: '#/components/schemas/Uuid' }
            reason: { type: string, enum: [superseded] }
        - type: object
          additionalProperties: false
          required: [type, at, reason]
          properties:
            type: { const: session.ended }
            at: { $ref: '#/components/schemas/Timestamp' }
            reason: { type: string, enum: [logout, expired, signed_out_everywhere, device_revoked, channel_changed] }
