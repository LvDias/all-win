# Overlay for the E2E exposure of the plugin gateway: ONE extra Caddy that publishes 8443 and proxies only /adapter/v1.
# NEVER start this by hand: infra/exposure/expose-open.sh applies and verifies the firewall first, then starts it; expose-close.sh stops it.
# Docker-published ports bypass ufw; the access control for this port is the DOCKER-USER chain set by firewall-open.sh.
services:
  caddy-adapter:
    image: caddy:2.10-alpine
    # No restart policy: a reboot or a crash never reopens the port by itself.
    restart: "no"
    # Runs as the owner of the certificate key (uid:gid exported by expose-open.sh): the key stays mode 600, no capability needed to read it.
    user: "${ALLWIN_E2E_UID:?start with expose-open.sh}:${ALLWIN_E2E_GID:?start with expose-open.sh}"
    # Refuses to start unless expose-open.sh wrote the gate marker (in /run, so a reboot removes it) after the firewall was applied and verified.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -f /gate/OPEN ] || { echo "gateway gate closed: start it with infra/exposure/expose-open.sh" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    depends_on:
      - core
    environment:
      CORE_PORT: ${CORE_PORT:-8080}
    ports:
      - "8443:8443"
    volumes:
      - ../exposure/Caddyfile.adapter:/etc/caddy/Caddyfile:ro
      - ${ALLWIN_E2E_CERT_DIR:?set ALLWIN_E2E_CERT_DIR (see infra/exposure/README.md)}:/certs:ro
      - ${ALLWIN_EXPOSE_GATE_DIR:-/run/allwin-expose}:/gate:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/data:mode=1777", "/config:mode=1777"]
    mem_limit: 256m
    pids_limit: 200
