[package]
name = "qa-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Every test target is listed below, so a file that is not committed yet is never built.
autotests = false

[lints]
workspace = true

# QA-owned black-box tests (QA [Backend]); one test target per module. A target that needs a
# slice not yet on main is gated by that slice's feature: verification merges this branch at the
# slice SHA and runs `cargo test -p qa-backend --features <slice>`.
[features]
s3 = []
s5 = []
s6 = []
s7 = []

[[test]]
name = "s3_identity"
required-features = ["s3"]

[[test]]
name = "s7_routing"
required-features = ["s7"]

[dev-dependencies]
app = { path = "../../crates/app" }
axum.workspace = true
chrono = { workspace = true, features = ["clock"] }
http-body-util.workspace = true
routing-enterprise.workspace = true
serde_json.workspace = true
shared-kernel.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v7"] }
