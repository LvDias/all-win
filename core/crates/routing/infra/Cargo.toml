[package]
name = "routing-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
access = { workspace = true, features = ["axum"] }
async-trait.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["std", "serde"] }
contracts.workspace = true
jsonschema.workspace = true
routing-application.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-kernel = { workspace = true, features = ["sqlx"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
tracing.workspace = true
utoipa.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
