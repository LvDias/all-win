[package]
name = "identity-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Identity adapters: PostgreSQL store, crypto, throttles, HTTP (V1-S3)."

[lints]
workspace = true

[dependencies]
identity-application.workspace = true
identity-enterprise.workspace = true
shared-kernel.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true, features = ["v7"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
rand.workspace = true
subtle.workspace = true
serde_json.workspace = true
serde.workspace = true
axum.workspace = true
utoipa.workspace = true
http-body-util = { workspace = true, features = ["channel"] }
contracts.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
