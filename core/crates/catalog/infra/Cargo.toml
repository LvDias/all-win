[package]
name = "catalog-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
catalog-application.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "json", "rust_decimal"] }
# S5 (rule versions): HTTP handlers.
access = { workspace = true, features = ["axum"] }
axum.workspace = true
chrono = { workspace = true, features = ["std", "serde"] }
contracts.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
jsonschema.workspace = true
async-trait.workspace = true
http-body-util.workspace = true
shared-kernel.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v7"] }
